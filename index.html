<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>TENKiTER Modas — Cadastro</title>
<style>
  :root {
    --preto: #0d0d0d;
    --laranja: #ff7a1a;
    --cinza: #f4f4f4;
    --branco: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Roboto, Arial, sans-serif;
    background: var(--cinza);
    color: var(--preto);
    padding-bottom: 60px;
  }
  header {
    background: var(--preto);
    color: var(--laranja);
    padding: 18px 16px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.2rem; letter-spacing: 1px; }
  header p { margin: 4px 0 0; font-size: 0.75rem; color: #ccc; }

  main { padding: 16px; max-width: 480px; margin: 0 auto; }

  .card {
    background: var(--branco);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  label { display: block; font-size: 0.8rem; font-weight: 600; margin: 12px 0 4px; }
  input[type=text], input[type=number], select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1rem;
    background: var(--branco);
  }
  input:focus, select:focus { outline: 2px solid var(--laranja); }

  .foto-box {
    margin-top: 8px;
    border: 2px dashed #ccc;
    border-radius: 10px;
    text-align: center;
    padding: 14px;
    position: relative;
  }
  .foto-box img { max-width: 100%; max-height: 180px; border-radius: 8px; margin-top: 8px; }
  .foto-box input[type=file] { width: 100%; }

  .preco-avista {
    margin-top: 6px;
    font-size: 0.9rem;
    color: #1a7a1a;
    font-weight: 600;
  }

  button {
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
  .btn-primario {
    background: var(--laranja);
    color: var(--preto);
    margin-top: 18px;
  }
  .btn-primario:disabled { opacity: 0.5; }

  #status { text-align: center; font-size: 0.85rem; margin-top: 8px; min-height: 18px; }

  .produto {
    display: flex;
    gap: 10px;
    background: var(--branco);
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 10px;
    align-items: center;
  }
  .produto img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: #eee; }
  .produto-info { flex: 1; min-width: 0; }
  .produto-info .nome { font-weight: 700; font-size: 0.92rem; }
  .produto-info .preco { font-size: 0.82rem; color: #333; }
  .produto-info .preco span { color: #1a7a1a; font-weight: 700; }
  .produto-info .tags { font-size: 0.72rem; color: #888; }

  .acoes { display: flex; flex-direction: column; gap: 6px; }
  .acoes button {
    padding: 6px 10px;
    font-size: 0.75rem;
    width: auto;
    white-space: nowrap;
  }
  .btn-compartilhar { background: var(--preto); color: var(--laranja); }
  .btn-excluir { background: #f0f0f0; color: #a00; }

  h2.secao { font-size: 0.95rem; margin: 22px 0 10px; color: var(--preto); }
</style>
</head>
<body>

<header>
  <h1>TENKiTER MODAS</h1>
  <p>Cadastro rápido de catálogo</p>
</header>

<main>

  <!-- ===================== CONFIGURAÇÃO (edite aqui) ===================== -->
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbworUSKY16-62GqQdFBWLa5qVq76AjnA3CFtCV-YR-HtDPlOCJOWHYK5O8u6XDFbwYcMQ/exec';
    // Troque pela URL do site catálogo assim que ele estiver publicado:
    const SITE_URL = 'https://SEU-CATALOGO-AQUI.exemplo.com/';
    const DESCONTO_AVISTA = 0.10; // 10% de desconto no pagamento à vista
  </script>

  <div class="card">
    <form id="form-produto">
      <label>Nome do produto</label>
      <input type="text" id="nome" required placeholder="Ex: Vestido floral longo">

      <label>Categoria</label>
      <select id="categoria" required></select>

      <label>Gênero</label>
      <select id="genero" required></select>

      <label>Preço (valor cheio)</label>
      <input type="number" id="preco" step="0.01" min="0" required placeholder="Ex: 22,22" inputmode="decimal">
      <div class="preco-avista" id="preco-avista"></div>

      <label>Foto</label>
      <div class="foto-box">
        <input type="file" id="foto" accept="image/*" capture="environment" required>
        <img id="preview" style="display:none">
      </div>

      <button type="submit" class="btn-primario" id="btn-salvar">Cadastrar produto</button>
      <div id="status"></div>
    </form>
  </div>

  <h2 class="secao">Produtos cadastrados</h2>
  <div id="lista-produtos"><p style="text-align:center;color:#999;">Carregando...</p></div>

</main>

<script>
  let categorias = [];
  let generos = [];
  let produtos = [];
  let fotoBase64 = null;
  let fotoMime = null;

  function formatarReal(valor) {
    return 'R$ ' + Number(valor).toFixed(2).replace('.', ',');
  }

  // ---------- Carregar categorias / gêneros ----------
  async function carregarListas() {
    const [rc, rg] = await Promise.all([
      fetch(API_URL + '?action=categorias').then(r => r.json()),
      fetch(API_URL + '?action=generos').then(r => r.json())
    ]);
    categorias = rc.categorias || [];
    generos = rg.generos || [];
    preencherSelect('categoria', categorias);
    preencherSelect('genero', generos);
  }

  function preencherSelect(idSelect, valores) {
    const select = document.getElementById(idSelect);
    select.innerHTML = '';
    valores.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = v;
      select.appendChild(opt);
    });
    const optNovo = document.createElement('option');
    optNovo.value = '__novo__';
    optNovo.textContent = '+ Adicionar novo...';
    select.appendChild(optNovo);
  }

  async function tratarSelecaoNova(idSelect, action, listaAtual) {
    const select = document.getElementById(idSelect);
    select.addEventListener('change', async () => {
      if (select.value === '__novo__') {
        const novo = prompt('Digite o novo valor:');
        if (!novo || !novo.trim()) { select.value = listaAtual[0] || ''; return; }
        const resp = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: action, nome: novo.trim() })
        }).then(r => r.json());
        if (!resp.ok) {
          alert(resp.erro || 'Não foi possível adicionar.');
          select.value = listaAtual[0] || '';
          return;
        }
        await carregarListas();
        select.value = novo.trim();
      }
    });
  }

  // ---------- Preço à vista ----------
  document.getElementById('preco').addEventListener('input', (e) => {
    const valor = parseFloat(e.target.value);
    const box = document.getElementById('preco-avista');
    if (isNaN(valor) || valor <= 0) { box.textContent = ''; return; }
    const avista = valor * (1 - DESCONTO_AVISTA);
    box.textContent = `À vista (10% off): ${formatarReal(avista)}`;
  });

  // ---------- Foto preview ----------
  document.getElementById('foto').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    fotoMime = file.type;
    const reader = new FileReader();
    reader.onload = () => {
      const resultado = reader.result;
      fotoBase64 = resultado.split(',')[1];
      const img = document.getElementById('preview');
      img.src = resultado;
      img.style.display = 'block';
    };
    reader.readAsDataURL(file);
  });

  // ---------- Cadastrar produto ----------
  document.getElementById('form-produto').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('status');
    const btn = document.getElementById('btn-salvar');
    if (!fotoBase64) { status.textContent = 'Selecione uma foto.'; return; }

    btn.disabled = true;
    status.textContent = 'Salvando...';

    const body = {
      action: 'create',
      nome: document.getElementById('nome').value.trim(),
      categoria: document.getElementById('categoria').value,
      genero: document.getElementById('genero').value,
      preco: document.getElementById('preco').value,
      fotoBase64: fotoBase64,
      fotoMime: fotoMime
    };

    try {
      const resp = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      }).then(r => r.json());

      if (resp.ok) {
        status.textContent = 'Produto cadastrado!';
        document.getElementById('form-produto').reset();
        document.getElementById('preview').style.display = 'none';
        document.getElementById('preco-avista').textContent = '';
        fotoBase64 = null;
        await carregarProdutos();
      } else {
        status.textContent = 'Erro: ' + (resp.erro || 'desconhecido');
      }
    } catch (err) {
      status.textContent = 'Erro de conexão. Tente novamente.';
    } finally {
      btn.disabled = false;
      setTimeout(() => status.textContent = '', 3000);
    }
  });

  // ---------- Listar produtos ----------
  async function carregarProdutos() {
    const resp = await fetch(API_URL + '?action=list').then(r => r.json());
    produtos = (resp.produtos || []).reverse();
    renderizarProdutos();
  }

  function renderizarProdutos() {
    const container = document.getElementById('lista-produtos');
    if (!produtos.length) {
      container.innerHTML = '<p style="text-align:center;color:#999;">Nenhum produto cadastrado ainda.</p>';
      return;
    }
    container.innerHTML = '';
    produtos.forEach(p => {
      const avista = Number(p.Preco) * (1 - DESCONTO_AVISTA);
      const div = document.createElement('div');
      div.className = 'produto';
      div.innerHTML = `
        <img src="${p.Foto_URL}" alt="">
        <div class="produto-info">
          <div class="nome">${p.Nome}</div>
          <div class="preco">${formatarReal(p.Preco)} · à vista <span>${formatarReal(avista)}</span></div>
          <div class="tags">${p.Categoria} · ${p.Genero}</div>
        </div>
        <div class="acoes">
          <button class="btn-compartilhar" data-id="${p.ID}">📤 Stories</button>
          <button class="btn-excluir" data-id="${p.ID}">🗑 Excluir</button>
        </div>
      `;
      container.appendChild(div);
    });

    container.querySelectorAll('.btn-excluir').forEach(btn => {
      btn.addEventListener('click', () => excluirProduto(btn.dataset.id));
    });
    container.querySelectorAll('.btn-compartilhar').forEach(btn => {
      btn.addEventListener('click', () => compartilharStories(btn.dataset.id));
    });
  }

  // ---------- Excluir ----------
  async function excluirProduto(id) {
    if (!confirm('Excluir este produto do catálogo?')) return;
    await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'delete', id: id })
    });
    await carregarProdutos();
  }

  // ---------- Compartilhar no Stories ----------
  async function compartilharStories(id) {
    const produto = produtos.find(p => String(p.ID) === String(id));
    if (!produto) return;
    const link = SITE_URL + '?id=' + produto.ID;

    try {
      await navigator.clipboard.writeText(link);
    } catch (e) { /* alguns navegadores exigem interação direta; segue mesmo assim */ }

    let arquivoImagem = null;
    try {
      const blob = await fetch(produto.Foto_URL).then(r => r.blob());
      arquivoImagem = new File([blob], 'produto.jpg', { type: blob.type || 'image/jpeg' });
    } catch (e) {
      arquivoImagem = null;
    }

    const textoCompartilhar = `${produto.Nome} — ${formatarReal(produto.Preco)}\n${link}`;

    if (navigator.share) {
      try {
        if (arquivoImagem && navigator.canShare && navigator.canShare({ files: [arquivoImagem] })) {
          await navigator.share({ files: [arquivoImagem], text: textoCompartilhar });
        } else {
          await navigator.share({ text: textoCompartilhar, url: link });
        }
        return;
      } catch (e) { /* usuário cancelou ou falhou — cai no aviso abaixo */ }
    }

    alert('Link copiado! Abra a foto do produto, salve/segure para compartilhar, e cole o link no Stories.');
  }

  // ---------- Início ----------
  (async function iniciar() {
    await carregarListas();
    tratarSelecaoNova('categoria', 'addCategoria', categorias);
    tratarSelecaoNova('genero', 'addGenero', generos);
    await carregarProdutos();
  })();
</script>

</body>
</html>
