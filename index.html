<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>TENKiTER Modas — Cadastro</title>
<style>
  :root {
    --preto: #0d0d0d;
    --laranja: #ff7a1a;
    --cinza: #f4f4f4;
    --branco: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Roboto, Arial, sans-serif;
    background: var(--cinza);
    color: var(--preto);
    padding-bottom: 60px;
  }
  header {
    background: var(--preto);
    color: var(--laranja);
    padding: 18px 16px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.2rem; letter-spacing: 1px; }
  header p { margin: 4px 0 0; font-size: 0.75rem; color: #ccc; }

  main { padding: 16px; max-width: 480px; margin: 0 auto; }

  .card {
    background: var(--branco);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  label { display: block; font-size: 0.8rem; font-weight: 600; margin: 12px 0 4px; }
  input[type=text], input[type=number], textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1rem;
    background: var(--branco);
    font-family: inherit;
  }
  textarea { resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--laranja); }

  /* ---- Chips (múltipla escolha) ---- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .chip {
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid #ddd;
    background: var(--branco);
    font-size: 0.85rem;
    cursor: pointer;
  }
  .chip.selecionado { background: var(--laranja); color: var(--preto); border-color: var(--laranja); font-weight: 700; }
  .chip.add { background: #f0f0f0; color: #666; border-style: dashed; }

  .foto-box {
    margin-top: 8px;
    border: 2px dashed #ccc;
    border-radius: 10px;
    text-align: center;
    padding: 14px;
  }
  .foto-box input[type=file] { width: 100%; }
  #preview-final { max-width: 160px; max-height: 160px; border-radius: 8px; margin-top: 10px; display: none; }
  .link-trocar { display: none; font-size: 0.8rem; color: #666; text-decoration: underline; margin-top: 6px; background:none; border:none; padding:0; width:auto; }

  /* ---- Ajuste/corte de foto ---- */
  #crop-section { display: none; margin-top: 12px; }
  .crop-container {
    width: 100%;
    max-width: 280px;
    aspect-ratio: 1 / 1;
    margin: 0 auto;
    overflow: hidden;
    position: relative;
    background: #111;
    border-radius: 10px;
    touch-action: none;
  }
  .crop-container img {
    position: absolute;
    top: 50%;
    left: 50%;
    max-width: none;
    transform-origin: center center;
    user-select: none;
    -webkit-user-drag: none;
  }
  .crop-hint { font-size: 0.72rem; color: #888; text-align: center; margin-top: 6px; }
  .zoom-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .zoom-row input[type=range] { flex: 1; }
  .btn-confirmar-corte { background: var(--laranja); color: var(--preto); margin-top: 10px; }
  .btn-outra-foto { background: #eee; color: #333; margin-top: 6px; font-size: 0.85rem; }

  .preco-avista {
    margin-top: 6px;
    font-size: 0.9rem;
    color: #1a7a1a;
    font-weight: 600;
  }

  button {
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
  .btn-primario {
    background: var(--laranja);
    color: var(--preto);
    margin-top: 18px;
  }
  .btn-primario:disabled { opacity: 0.5; }

  #status { text-align: center; font-size: 0.85rem; margin-top: 8px; min-height: 18px; }

  #fila-envio { margin-top: 10px; }
  .fila-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: #fff7ef;
    border: 1px solid #ffd8ad;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.8rem;
    margin-bottom: 6px;
  }
  .fila-item.erro { background: #fdeaea; border-color: #f3b3b3; }
  .fila-item .btn-retry {
    width: auto;
    padding: 5px 10px;
    font-size: 0.72rem;
    background: var(--preto);
    color: var(--laranja);
  }

  .produto {
    display: flex;
    gap: 10px;
    background: var(--branco);
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 10px;
    align-items: flex-start;
  }
  .produto img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: #eee; }
  .produto-info { flex: 1; min-width: 0; }
  .produto-info .nome { font-weight: 700; font-size: 0.92rem; }
  .produto-info .preco { font-size: 0.82rem; color: #333; }
  .produto-info .preco span { color: #1a7a1a; font-weight: 700; }
  .produto-info .tags { font-size: 0.72rem; color: #888; }
  .produto-info .desc { font-size: 0.75rem; color: #555; margin-top: 3px; }

  .acoes { display: flex; flex-direction: column; gap: 6px; }
  .acoes button {
    padding: 6px 10px;
    font-size: 0.75rem;
    width: auto;
    white-space: nowrap;
  }
  .btn-compartilhar { background: var(--preto); color: var(--laranja); }
  .btn-excluir { background: #f0f0f0; color: #a00; }

  h2.secao { font-size: 0.95rem; margin: 22px 0 10px; color: var(--preto); }
</style>
</head>
<body>

<header>
  <h1>TENKiTER MODAS</h1>
  <p>Cadastro rápido de catálogo</p>
</header>

<main>

  <!-- ===================== CONFIGURAÇÃO (edite aqui) ===================== -->
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyWnKwT5-HB6rv-loxGUtumpWPlJsRZNYp06v5RC3wtiJDUaV9zCMJVRwOEScxwMase_Q/exec';
    const SITE_URL = 'https://pablofonteneleadv.github.io/tenkiter-catalogo/';
    const DESCONTO_AVISTA = 0.10; // 10% de desconto no pagamento à vista
    const SAIDA_TAMANHO = 1080;   // resolução final da foto (px, quadrada) — boa qualidade para o Instagram
    const SAIDA_QUALIDADE = 0.9;  // qualidade JPEG (0 a 1) — alta qualidade para postar no Stories
  </script>

  <div class="card">
    <form id="form-produto">
      <label>Nome do produto</label>
      <input type="text" id="nome" required placeholder="Ex: Vestido floral longo">

      <label>Categoria (pode marcar mais de uma — ex: conjunto = Blusas + Shorts)</label>
      <div class="chips" id="chips-categoria"></div>

      <label>Gênero (pode marcar mais de um)</label>
      <div class="chips" id="chips-genero"></div>

      <label>Preço (valor cheio)</label>
      <input type="number" id="preco" step="0.01" min="0" required placeholder="Ex: 22,22" inputmode="decimal">
      <div class="preco-avista" id="preco-avista"></div>

      <label>Descrição (opcional)</label>
      <textarea id="descricao" rows="2" placeholder="Tecido, tamanhos disponíveis, detalhes..."></textarea>

      <label>Foto</label>
      <div class="foto-box">
        <input type="file" id="foto" accept="image/*">

        <div id="crop-section">
          <div class="crop-container" id="crop-container">
            <img id="crop-img" alt="">
          </div>
          <div class="crop-hint">Arraste para posicionar</div>
          <div class="zoom-row">
            <span style="font-size:1rem;">🔍</span>
            <input type="range" id="zoom-slider" min="1" max="3" step="0.01" value="1">
          </div>
          <button type="button" class="btn-confirmar-corte" id="btn-confirmar-corte">Usar esta foto</button>
          <button type="button" class="btn-outra-foto" id="btn-outra-foto">Escolher outra foto</button>
        </div>

        <img id="preview-final">
        <br>
        <button type="button" class="link-trocar" id="link-trocar">Trocar foto</button>
      </div>

      <button type="submit" class="btn-primario" id="btn-salvar">Cadastrar produto</button>
      <div id="status"></div>
      <div id="fila-envio"></div>
    </form>
  </div>

  <h2 class="secao">Produtos cadastrados</h2>
  <div id="lista-produtos"><p style="text-align:center;color:#999;">Carregando...</p></div>

</main>

<canvas id="canvas-oculto" style="display:none;"></canvas>

<script>
  let categorias = [];
  let generos = [];
  let produtos = [];
  let fotoBase64 = null;
  let fotoMime = 'image/jpeg';
  let selecionadasCategorias = new Set();
  let selecionadosGeneros = new Set();

  function formatarReal(valor) {
    return 'R$ ' + Number(valor).toFixed(2).replace('.', ',');
  }

  // ---------- Carregar categorias / gêneros ----------
  async function carregarListas() {
    const [rc, rg] = await Promise.all([
      fetch(API_URL + '?action=categorias').then(r => r.json()),
      fetch(API_URL + '?action=generos').then(r => r.json())
    ]);
    categorias = rc.categorias || [];
    generos = rg.generos || [];
    renderizarChips('chips-categoria', categorias, selecionadasCategorias, () => adicionarNovoValor('addCategoria', categorias, selecionadasCategorias, 'chips-categoria'));
    renderizarChips('chips-genero', generos, selecionadosGeneros, () => adicionarNovoValor('addGenero', generos, selecionadosGeneros, 'chips-genero'));
  }

  function renderizarChips(idContainer, valores, conjuntoSelecionado, aoAdicionarNovo) {
    const container = document.getElementById(idContainer);
    container.innerHTML = '';
    valores.forEach(v => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (conjuntoSelecionado.has(v) ? ' selecionado' : '');
      chip.textContent = v;
      chip.addEventListener('click', () => {
        if (conjuntoSelecionado.has(v)) conjuntoSelecionado.delete(v);
        else conjuntoSelecionado.add(v);
        chip.classList.toggle('selecionado');
      });
      container.appendChild(chip);
    });
    const chipAdd = document.createElement('button');
    chipAdd.type = 'button';
    chipAdd.className = 'chip add';
    chipAdd.textContent = '+ Novo';
    chipAdd.addEventListener('click', aoAdicionarNovo);
    container.appendChild(chipAdd);
  }

  async function adicionarNovoValor(action, listaAtual, conjuntoSelecionado, idContainer) {
    const novo = prompt('Digite o novo valor:');
    if (!novo || !novo.trim()) return;
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, nome: novo.trim() })
    }).then(r => r.json());
    if (!resp.ok) { alert(resp.erro || 'Não foi possível adicionar.'); return; }
    await carregarListas();
    conjuntoSelecionado.add(novo.trim());
    renderizarChips(idContainer, action === 'addCategoria' ? categorias : generos, conjuntoSelecionado,
      () => adicionarNovoValor(action, action === 'addCategoria' ? categorias : generos, conjuntoSelecionado, idContainer));
  }

  // ---------- Preço à vista ----------
  document.getElementById('preco').addEventListener('input', (e) => {
    const valor = parseFloat(e.target.value);
    const box = document.getElementById('preco-avista');
    if (isNaN(valor) || valor <= 0) { box.textContent = ''; return; }
    const avista = valor * (1 - DESCONTO_AVISTA);
    box.textContent = `À vista (10% off): ${formatarReal(avista)}`;
  });

  // ===================== FOTO: seleção, corte e compressão =====================
  const cropSection = document.getElementById('crop-section');
  const cropContainer = document.getElementById('crop-container');
  const cropImg = document.getElementById('crop-img');
  const zoomSlider = document.getElementById('zoom-slider');
  const previewFinal = document.getElementById('preview-final');
  const linkTrocar = document.getElementById('link-trocar');
  const inputFoto = document.getElementById('foto');

  let crop = { img: null, naturalW: 0, naturalH: 0, baseScale: 1, zoom: 1, offsetX: 0, offsetY: 0 };
  let arrastando = false, ultimoX = 0, ultimoY = 0;

  inputFoto.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const leitor = new FileReader();
    leitor.onload = () => {
      const imagem = new Image();
      imagem.onload = () => iniciarCorte(imagem);
      imagem.src = leitor.result;
    };
    leitor.readAsDataURL(file);
  });

  function iniciarCorte(imagem) {
    crop.img = imagem;
    crop.naturalW = imagem.naturalWidth;
    crop.naturalH = imagem.naturalHeight;
    const tamanhoContainer = cropContainer.clientWidth || 280;
    crop.baseScale = Math.max(tamanhoContainer / crop.naturalW, tamanhoContainer / crop.naturalH);
    crop.zoom = 1;
    crop.offsetX = 0;
    crop.offsetY = 0;
    zoomSlider.value = 1;

    cropImg.src = imagem.src;
    cropImg.style.width = crop.naturalW + 'px';
    cropImg.style.height = crop.naturalH + 'px';

    cropSection.style.display = 'block';
    previewFinal.style.display = 'none';
    linkTrocar.style.display = 'none';
    renderizarCorte();
  }

  function renderizarCorte() {
    const escalaTotal = crop.baseScale * crop.zoom;
    cropImg.style.transform =
      `translate(-50%, -50%) translate(${crop.offsetX}px, ${crop.offsetY}px) scale(${escalaTotal})`;
  }

  cropContainer.addEventListener('touchstart', (e) => {
    arrastando = true;
    ultimoX = e.touches[0].clientX;
    ultimoY = e.touches[0].clientY;
  }, { passive: true });

  cropContainer.addEventListener('touchmove', (e) => {
    if (!arrastando) return;
    const x = e.touches[0].clientX, y = e.touches[0].clientY;
    crop.offsetX += (x - ultimoX);
    crop.offsetY += (y - ultimoY);
    ultimoX = x; ultimoY = y;
    renderizarCorte();
    e.preventDefault();
  }, { passive: false });

  cropContainer.addEventListener('touchend', () => { arrastando = false; });

  cropContainer.addEventListener('mousedown', (e) => {
    arrastando = true; ultimoX = e.clientX; ultimoY = e.clientY;
  });
  window.addEventListener('mousemove', (e) => {
    if (!arrastando || !crop.img) return;
    crop.offsetX += (e.clientX - ultimoX);
    crop.offsetY += (e.clientY - ultimoY);
    ultimoX = e.clientX; ultimoY = e.clientY;
    renderizarCorte();
  });
  window.addEventListener('mouseup', () => { arrastando = false; });

  zoomSlider.addEventListener('input', () => {
    crop.zoom = parseFloat(zoomSlider.value);
    renderizarCorte();
  });

  document.getElementById('btn-outra-foto').addEventListener('click', () => {
    inputFoto.value = '';
    inputFoto.click();
  });

  document.getElementById('btn-confirmar-corte').addEventListener('click', () => {
    const tamanhoContainer = cropContainer.clientWidth || 280;
    const escalaTotal = crop.baseScale * crop.zoom;
    const escalaSaida = SAIDA_TAMANHO / tamanhoContainer;

    const canvas = document.getElementById('canvas-oculto');
    canvas.width = SAIDA_TAMANHO;
    canvas.height = SAIDA_TAMANHO;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, SAIDA_TAMANHO, SAIDA_TAMANHO);
    ctx.save();
    ctx.translate(SAIDA_TAMANHO / 2, SAIDA_TAMANHO / 2);
    ctx.scale(escalaSaida, escalaSaida);
    ctx.translate(crop.offsetX, crop.offsetY);
    ctx.drawImage(
      crop.img,
      -(crop.naturalW * escalaTotal) / 2,
      -(crop.naturalH * escalaTotal) / 2,
      crop.naturalW * escalaTotal,
      crop.naturalH * escalaTotal
    );
    ctx.restore();

    const dataUrl = canvas.toDataURL('image/jpeg', SAIDA_QUALIDADE);
    fotoBase64 = dataUrl.split(',')[1];
    fotoMime = 'image/jpeg';

    previewFinal.src = dataUrl;
    previewFinal.style.display = 'inline-block';
    linkTrocar.style.display = 'inline-block';
    cropSection.style.display = 'none';
  });

  linkTrocar.addEventListener('click', () => {
    inputFoto.value = '';
    inputFoto.click();
  });

  // ---------- Fila de envio em segundo plano ----------
  let filaEnvio = [];

  function renderizarFila() {
    const el = document.getElementById('fila-envio');
    if (!filaEnvio.length) { el.innerHTML = ''; return; }
    el.innerHTML = filaEnvio.map(item => `
      <div class="fila-item ${item.status === 'erro' ? 'erro' : ''}">
        <span>${item.status === 'erro' ? '⚠️ Falhou: ' : '⏳ Enviando: '}${item.nome}</span>
        ${item.status === 'erro' ? `<button type="button" class="btn-retry" data-tempid="${item.tempId}">Tentar de novo</button>` : ''}
      </div>
    `).join('');
    el.querySelectorAll('.btn-retry').forEach(btn => {
      btn.addEventListener('click', () => tentarNovamente(btn.dataset.tempid));
    });
  }

  function enviarEmSegundoPlano(dados) {
    const tempId = 'tmp' + Date.now() + Math.random().toString(36).slice(2);
    filaEnvio.push({ tempId, nome: dados.nome, status: 'enviando', dados });
    renderizarFila();
    executarEnvio(tempId);
  }

  function tentarNovamente(tempId) {
    const item = filaEnvio.find(i => i.tempId === tempId);
    if (!item) return;
    item.status = 'enviando';
    renderizarFila();
    executarEnvio(tempId);
  }

  function executarEnvio(tempId) {
    const item = filaEnvio.find(i => i.tempId === tempId);
    if (!item) return;
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(item.dados)
    })
      .then(r => r.json())
      .then(async (resp) => {
        filaEnvio = filaEnvio.filter(i => i.tempId !== tempId);
        renderizarFila();
        if (resp.ok) {
          await carregarProdutos();
        } else {
          alert('Erro ao cadastrar "' + item.dados.nome + '": ' + (resp.erro || 'desconhecido'));
        }
      })
      .catch(() => {
        const atual = filaEnvio.find(i => i.tempId === tempId);
        if (atual) { atual.status = 'erro'; renderizarFila(); }
      });
  }

  // ---------- Cadastrar produto (libera o formulário na hora, envia em segundo plano) ----------
  document.getElementById('form-produto').addEventListener('submit', (e) => {
    e.preventDefault();
    const status = document.getElementById('status');

    if (!fotoBase64) { status.textContent = 'Selecione e ajuste uma foto.'; return; }
    if (selecionadasCategorias.size === 0) { status.textContent = 'Escolha ao menos uma categoria.'; return; }
    if (selecionadosGeneros.size === 0) { status.textContent = 'Escolha ao menos um gênero.'; return; }

    const dados = {
      action: 'create',
      nome: document.getElementById('nome').value.trim(),
      categoria: Array.from(selecionadasCategorias).join(', '),
      genero: Array.from(selecionadosGeneros).join(', '),
      preco: document.getElementById('preco').value,
      descricao: document.getElementById('descricao').value.trim(),
      fotoBase64: fotoBase64,
      fotoMime: fotoMime
    };

    // Libera o formulário imediatamente para o próximo cadastro
    document.getElementById('form-produto').reset();
    previewFinal.style.display = 'none';
    linkTrocar.style.display = 'none';
    document.getElementById('preco-avista').textContent = '';
    fotoBase64 = null;
    selecionadasCategorias = new Set();
    selecionadosGeneros = new Set();
    renderizarChips('chips-categoria', categorias, selecionadasCategorias, () => adicionarNovoValor('addCategoria', categorias, selecionadasCategorias, 'chips-categoria'));
    renderizarChips('chips-genero', generos, selecionadosGeneros, () => adicionarNovoValor('addGenero', generos, selecionadosGeneros, 'chips-genero'));

    status.textContent = 'Produto adicionado — enviando em segundo plano.';
    setTimeout(() => status.textContent = '', 2500);

    enviarEmSegundoPlano(dados);
  });

  // ---------- Listar produtos ----------
  async function carregarProdutos() {
    const resp = await fetch(API_URL + '?action=list').then(r => r.json());
    produtos = (resp.produtos || []).reverse();
    renderizarProdutos();
  }

  function renderizarProdutos() {
    const container = document.getElementById('lista-produtos');
    if (!produtos.length) {
      container.innerHTML = '<p style="text-align:center;color:#999;">Nenhum produto cadastrado ainda.</p>';
      return;
    }
    container.innerHTML = '';
    produtos.forEach(p => {
      const avista = Number(p.Preco) * (1 - DESCONTO_AVISTA);
      const div = document.createElement('div');
      div.className = 'produto';
      div.innerHTML = `
        <img src="${p.Foto_URL}" alt="" loading="lazy">
        <div class="produto-info">
          <div class="nome">${p.Nome}</div>
          <div class="preco">${formatarReal(p.Preco)} · à vista <span>${formatarReal(avista)}</span></div>
          <div class="tags">${p.Categoria} · ${p.Genero}</div>
          ${p.Descricao ? `<div class="desc">${p.Descricao}</div>` : ''}
        </div>
        <div class="acoes">
          <button class="btn-compartilhar" data-id="${p.ID}">📤 Stories</button>
          <button class="btn-excluir" data-id="${p.ID}">🗑 Excluir</button>
        </div>
      `;
      container.appendChild(div);
    });

    container.querySelectorAll('.btn-excluir').forEach(btn => {
      btn.addEventListener('click', () => excluirProduto(btn.dataset.id));
    });
    container.querySelectorAll('.btn-compartilhar').forEach(btn => {
      btn.addEventListener('click', () => compartilharStories(btn.dataset.id));
    });
  }

  // ---------- Excluir ----------
  async function excluirProduto(id) {
    if (!confirm('Excluir este produto do catálogo?')) return;
    await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'delete', id: id })
    });
    await carregarProdutos();
  }

  // ---------- Compartilhar no Stories ----------
  async function compartilharStories(id) {
    const produto = produtos.find(p => String(p.ID) === String(id));
    if (!produto) return;
    const link = SITE_URL + '?id=' + produto.ID;
    const textoCompartilhar = `${produto.Nome} — ${formatarReal(produto.Preco)}\n${link}`;

    try {
      await navigator.clipboard.writeText(link);
    } catch (e) { /* alguns navegadores exigem interação direta; segue mesmo assim */ }

    let arquivoImagem = null;
    try {
      const blob = await fetch(produto.Foto_URL).then(r => r.blob());
      arquivoImagem = new File([blob], 'produto.jpg', { type: blob.type || 'image/jpeg' });
    } catch (e) {
      arquivoImagem = null;
    }

    if (navigator.share) {
      try {
        // Importante: manda o link só dentro de "text" — nunca junto com "url" também,
        // senão alguns apps (Instagram) colam o link duas vezes.
        if (arquivoImagem && navigator.canShare && navigator.canShare({ files: [arquivoImagem] })) {
          await navigator.share({ files: [arquivoImagem], text: textoCompartilhar });
        } else {
          await navigator.share({ text: textoCompartilhar });
        }
        return;
      } catch (e) { /* usuário cancelou ou falhou — cai no aviso abaixo */ }
    }

    alert('Link copiado! Abra a foto do produto, salve/segure para compartilhar, e cole o link no Stories.');
  }

  // ---------- Início ----------
  (async function iniciar() {
    await carregarListas();
    await carregarProdutos();
  })();
</script>
