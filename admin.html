<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0d">
<title>TENKiTER Modas — Painel do Atendente</title>
<style>
  :root { --preto: #0d0d0d; --laranja: #ff7a1a; --cinza: #f4f4f4; --branco: #ffffff; --verde: #198754; --vermelho: #c62828; --amarelo: #b8860b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Roboto, Arial, sans-serif; background: var(--cinza); color: var(--preto); padding-bottom: 60px; }
  header { background: var(--preto); color: var(--laranja); padding: 18px 16px; text-align: center; }
  header h1 { margin: 0; font-size: 1.2rem; letter-spacing: 1px; font-weight: 800; }
  header p { margin: 4px 0 0; font-size: 0.75rem; color: #ccc; }
  main { padding: 16px; max-width: 520px; margin: 0 auto; }

  .usuario-bar { background: var(--branco); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06); font-size: 0.85rem; }
  .usuario-bar strong { color: var(--laranja); }
  .btn-trocar-user { background: #f0f0f0; border: none; padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; }

  .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .dashboard-card { background: var(--branco); border-radius: 12px; padding: 10px 6px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .dashboard-card span { display: block; font-size: 0.64rem; color: #888; }
  .dashboard-card strong { display: block; font-size: 1.2rem; margin-top: 2px; }
  .dashboard-card.esgotados strong { color: var(--vermelho); }
  .dashboard-card.disponiveis strong { color: var(--verde); }

  .card { background: var(--branco); border-radius: 14px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

  label { display: block; font-size: 0.8rem; font-weight: 600; margin: 12px 0 4px; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; background: var(--branco); font-family: inherit;
  }
  textarea { resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--laranja); }
  .form-linha { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .chip { padding: 8px 14px; border-radius: 20px; border: 1px solid #ddd; background: var(--branco); font-size: 0.82rem; cursor: pointer; }
  .chip.selecionado { background: var(--laranja); color: var(--preto); border-color: var(--laranja); font-weight: 700; }
  .chip.add { background: #f0f0f0; color: #666; border-style: dashed; }

  details.selecao-expansivel { margin-top: 12px; border: 1px solid #ddd; border-radius: 10px; padding: 10px 12px; background: #fff; }
  details.selecao-expansivel summary { cursor: pointer; font-weight: 600; font-size: 0.85rem; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  details.selecao-expansivel summary::-webkit-details-marker { display: none; }
  details.selecao-expansivel summary::after { content: '▾'; font-size: 0.7rem; color: #888; margin-left: 8px; }
  details.selecao-expansivel[open] summary::after { content: '▴'; }
  details.selecao-expansivel .resumo { font-weight: 400; color: #888; font-size: 0.78rem; margin-left: 6px; flex: 1; }
  details.selecao-expansivel .chips { margin-top: 10px; }

  details.extra { margin-top: 16px; border: 1px dashed #ccc; border-radius: 10px; padding: 10px 12px; }
  details.extra summary { cursor: pointer; font-weight: 700; font-size: 0.82rem; color: #666; list-style: none; }
  details.extra summary::-webkit-details-marker { display: none; }

  .checkbox-linha { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .checkbox-linha input { width: auto; }
  .checkbox-linha label { margin: 0; font-weight: 600; font-size: 0.85rem; }

  .foto-box { margin-top: 8px; border: 2px dashed #ccc; border-radius: 10px; text-align: center; padding: 14px; }
  #preview-final { max-width: 140px; max-height: 175px; border-radius: 8px; margin-top: 10px; display: none; }

  #crop-section { display: none; margin-top: 12px; }
  .crop-container { width: 100%; max-width: 260px; aspect-ratio: 4 / 5; margin: 0 auto; overflow: hidden; position: relative; background: #111; border-radius: 10px; touch-action: none; }
  .crop-container img { position: absolute; top: 50%; left: 50%; max-width: none; transform-origin: center center; }

  button { border: none; border-radius: 10px; padding: 13px; font-size: 0.95rem; font-weight: 700; cursor: pointer; width: 100%; }
  .btn-primario { background: var(--laranja); color: var(--preto); margin-top: 18px; }

  /* Bar de ações em lote */
  .bulk-bar { background: var(--preto); color: #fff; padding: 12px; border-radius: 12px; margin-bottom: 12px; display: none; }
  .bulk-bar.ativa { display: block; }
  .bulk-bar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.85rem; }
  .bulk-bar-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .bulk-bar-actions button { width: auto; font-size: 0.72rem; padding: 6px 10px; background: #333; color: #fff; }

  .produto { display: flex; gap: 10px; background: var(--branco); border-radius: 12px; padding: 10px; margin-bottom: 10px; align-items: flex-start; position: relative; }
  .produto-chk { margin-top: 25px; }
  .produto img { width: 56px; height: 70px; object-fit: cover; border-radius: 8px; background: #eee; }
  .produto-info { flex: 1; min-width: 0; }
  .produto-info .codigo { font-size: 0.68rem; color: var(--laranja); font-weight: 800; }
  .produto-info .nome { font-weight: 700; font-size: 0.92rem; }
  .produto-info .preco { font-size: 0.82rem; color: #333; }
  .produto-info .preco span { color: #1a7a1a; font-weight: 700; }

  .acoes { display: flex; flex-direction: column; gap: 6px; }
  .acoes button { padding: 6px 10px; font-size: 0.7rem; width: auto; }

  #overlay-compartilhar { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 60; align-items: flex-end; justify-content: center; }
  #overlay-compartilhar.aberto { display: flex; }
  .painel-compartilhar { background: var(--branco); width: 100%; max-width: 480px; border-radius: 18px 18px 0 0; padding: 16px; }
</style>
</head>
<body>

<header>
  <h1>TENKiTER MODAS</h1>
  <p>Gestão & Atendimento do Catálogo</p>
</header>

<main>

  <div class="usuario-bar">
    <div>Atendente: <strong id="lbl-funcionario">Anônimo</strong></div>
    <button type="button" class="btn-trocar-user" id="btn-trocar-user">Identificar-se</button>
  </div>

  <div class="dashboard">
    <div class="dashboard-card"><span>Total Ativos</span><strong id="dash-total">0</strong></div>
    <div class="dashboard-card disponiveis"><span>Disponíveis</span><strong id="dash-disponiveis">0</strong></div>
    <div class="dashboard-card esgotados"><span>Esgotados</span><strong id="dash-esgotados">0</strong></div>
  </div>

  <div class="card">
    <h2 style="font-size:1rem;margin-top:0;" id="titulo-form">Novo Produto</h2>

    <form id="form-produto">
      <input type="hidden" id="produto-id">

      <label>Nome do produto</label>
      <input type="text" id="nome" required placeholder="Ex: Vestido Floral Midi">

      <details class="selecao-expansivel" id="details-categoria">
        <summary>Categoria <span class="resumo" id="resumo-categoria">(nenhuma selecionada)</span></summary>
        <div class="chips" id="chips-categoria"></div>
      </details>

      <details class="selecao-expansivel" id="details-genero">
        <summary>Gênero <span class="resumo" id="resumo-genero">(nenhum selecionado)</span></summary>
        <div class="chips" id="chips-genero"></div>
      </details>

      <div class="form-linha">
        <div>
          <label>Preço Cheio (R$)</label>
          <input type="number" id="preco" step="0.01" min="0" required placeholder="Ex: 89.90" inputmode="decimal">
        </div>
        <div>
          <label>Estoque (qtd)</label>
          <input type="number" id="estoque" step="1" min="0" placeholder="Ex: 5">
        </div>
      </div>

      <details class="extra">
        <summary>Detalhes (Tamanhos, Cores, Fotos Galeria)</summary>

        <div class="form-linha">
          <div>
            <label>Tamanhos</label>
            <input type="text" id="tamanhos" placeholder="P, M, G, GG">
          </div>
          <div>
            <label>Cores</label>
            <input type="text" id="cores" placeholder="Preto, Off-white">
          </div>
        </div>

        <label>Descrição detalhada</label>
        <textarea id="descricao" rows="2" placeholder="Tecido viscose, caimento leve..."></textarea>

        <div class="checkbox-linha">
          <input type="checkbox" id="novidade">
          <label for="novidade">Destacar como Novidade</label>
        </div>
      </details>

      <label>Foto Principal</label>
      <div class="foto-box">
        <input type="file" id="foto" accept="image/*">
        <div id="crop-section">
          <div class="crop-container" id="crop-container"><img id="crop-img" alt=""></div>
          <div style="margin-top:8px;"><input type="range" id="zoom-slider" min="1" max="3" step="0.01" value="1"></div>
          <button type="button" id="btn-confirmar-corte" style="margin-top:8px;background:var(--laranja);">Ajustar & Salvar Foto</button>
        </div>
        <img id="preview-final">
      </div>

      <button type="submit" class="btn-primario" id="btn-salvar">Cadastrar Peça</button>
      <div id="status" style="text-align:center;font-size:0.85rem;margin-top:8px;"></div>
    </form>
  </div>

  <!-- Ações em Lote -->
  <div class="bulk-bar" id="bulk-bar">
    <div class="bulk-bar-header">
      <span id="bulk-count">0 selecionados</span>
      <button type="button" style="width:auto;padding:2px 8px;" id="btn-cancelar-bulk">Desmarcar todos</button>
    </div>
    <div class="bulk-bar-actions">
      <button type="button" id="btn-bulk-preco">% Alterar Preços</button>
      <button type="button" id="btn-bulk-novidade">Marcar Novidades</button>
      <button type="button" id="btn-bulk-arquivar">🗃️ Arquivar em Massa</button>
    </div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;">
    <h2 style="font-size:0.95rem;margin:0;">Estoque & Atendimento</h2>
    <button type="button" id="btn-select-all" style="width:auto;padding:4px 8px;font-size:0.75rem;">Selecionar todos</button>
  </div>

  <div style="margin-bottom:12px;"><input type="text" id="busca-admin" placeholder="🔎 Filtrar catálogo rápido..."></div>
  <div id="lista-produtos"><p style="text-align:center;color:#999;">Carregando peças...</p></div>

</main>

<canvas id="canvas-oculto" style="display:none;"></canvas>

<div id="overlay-compartilhar"><div class="painel-compartilhar" id="painel-compartilhar-conteudo"></div></div>

<script src="common.js"></script>
<script>
  let adminPin = sessionStorage.getItem('tenkiter_admin_pin') || '';
  let funcionarioNome = localStorage.getItem('tenkiter_funcionario') || '';

  function identificarFuncionario() {
    const nome = prompt('Digite seu nome/identificação (ex: Carla, Pablo):', funcionarioNome);
    if (nome) {
      funcionarioNome = nome;
      localStorage.setItem('tenkiter_funcionario', nome);
      document.getElementById('lbl-funcionario').textContent = nome;
    }
  }

  function pedirPin() {
    const novoPin = prompt('Digite o PIN de acesso:');
    if (novoPin) {
      adminPin = novoPin;
      sessionStorage.setItem('tenkiter_admin_pin', novoPin);
    }
  }

  if (!funcionarioNome) identificarFuncionario();
  else document.getElementById('lbl-funcionario').textContent = funcionarioNome;
  if (!adminPin) pedirPin();

  document.getElementById('btn-trocar-user').addEventListener('click', identificarFuncionario);

  let categorias = [], generos = [], produtos = [];
  let selecionadasCategorias = new Set(), selecionadosGeneros = new Set();
  let selecionadosBulk = new Set();
  let fotoBase64 = null, fotoStoriesBase64 = null;

  async function carregarListas() {
    const [rc, rg] = await Promise.all([
      fetch(API_URL + '?action=categorias').then(r => r.json()),
      fetch(API_URL + '?action=generos').then(r => r.json())
    ]);
    categorias = rc.categorias || [];
    generos = rg.generos || [];
    renderizarChips('chips-categoria', categorias, selecionadasCategorias);
    renderizarChips('chips-genero', generos, selecionadosGeneros);
  }

  function renderizarChips(idContainer, valores, conjunto) {
    const container = document.getElementById(idContainer);
    container.innerHTML = '';
    valores.forEach(v => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (conjunto.has(v) ? ' selecionado' : '');
      chip.textContent = v;
      chip.addEventListener('click', () => {
        if (conjunto.has(v)) conjunto.delete(v); else conjunto.add(v);
        chip.classList.toggle('selecionado');
      });
      container.appendChild(chip);
    });
  }

  // Crop & Foto Processing
  const inputFoto = document.getElementById('foto');
  const cropSection = document.getElementById('crop-section');
  const cropContainer = document.getElementById('crop-container');
  const cropImg = document.getElementById('crop-img');
  const zoomSlider = document.getElementById('zoom-slider');
  const previewFinal = document.getElementById('preview-final');

  let crop = { img: null, naturalW: 0, naturalH: 0, baseScale: 1, zoom: 1, offsetX: 0, offsetY: 0 };

  inputFoto.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const leitor = new FileReader();
    leitor.onload = () => {
      const img = new Image();
      img.onload = () => {
        crop.img = img; crop.naturalW = img.naturalWidth; crop.naturalH = img.naturalHeight;
        crop.baseScale = Math.max(260 / crop.naturalW, 325 / crop.naturalH);
        cropImg.src = img.src;
        cropSection.style.display = 'block';
      };
      img.src = leitor.result;
    };
    leitor.readAsDataURL(file);
  });

  document.getElementById('btn-confirmar-corte').addEventListener('click', () => {
    const canvas = document.getElementById('canvas-oculto');
    canvas.width = 900; canvas.height = 1125;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(crop.img, 0, 0, 900, 1125);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
    fotoBase64 = dataUrl.split(',')[1];
    previewFinal.src = dataUrl;
    previewFinal.style.display = 'block';
    cropSection.style.display = 'none';
  });

  // Salvar Produto
  document.getElementById('form-produto').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('status');
    status.textContent = 'Enviando produto...';

    const dados = {
      action: 'create',
      pin: adminPin,
      funcionario: funcionarioNome,
      nome: document.getElementById('nome').value.trim(),
      categoria: Array.from(selecionadasCategorias).join(', '),
      genero: Array.from(selecionadosGeneros).join(', '),
      preco: document.getElementById('preco').value,
      estoque: document.getElementById('estoque').value,
      tamanhos: document.getElementById('tamanhos').value.trim(),
      cores: document.getElementById('cores').value.trim(),
      descricao: document.getElementById('descricao').value.trim(),
      novidade: document.getElementById('novidade').checked,
      fotoBase64: fotoBase64
    };

    const resp = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(dados)
    }).then(r => r.json());

    if (resp.ok) {
      status.textContent = '✅ Cadastrado com sucesso!';
      document.getElementById('form-produto').reset();
      previewFinal.style.display = 'none';
      await carregarProdutos();
    } else {
      status.textContent = '❌ Erro: ' + (resp.erro || 'Falha ao salvar');
    }
  });

  async function carregarProdutos() {
    const resp = await fetch(API_URL + '?action=list').then(r => r.json());
    produtos = (resp.produtos || []).reverse();
    renderizarProdutos();
  }

  function renderizarProdutos() {
    const busca = document.getElementById('busca-admin').value.trim().toLowerCase();
    const lista = produtos.filter(p => !busca || String(p.Nome).toLowerCase().includes(busca) || String(p.Codigo||'').toLowerCase().includes(busca));
    const container = document.getElementById('lista-produtos');

    document.getElementById('dash-total').textContent = produtos.length;
    document.getElementById('dash-disponiveis').textContent = produtos.filter(p => !estaEsgotado(p)).length;
    document.getElementById('dash-esgotados').textContent = produtos.filter(p => estaEsgotado(p)).length;

    if (!lista.length) { container.innerHTML = '<p style="text-align:center;color:#999;">Nenhuma peça cadastrada.</p>'; return; }

    container.innerHTML = lista.map(p => `
      <div class="produto">
        <input type="checkbox" class="produto-chk" data-id="${p.ID}" ${selecionadosBulk.has(p.ID) ? 'checked' : ''}>
        <img src="${p.Foto_URL}" alt="">
        <div class="produto-info">
          <div class="codigo">${p.Codigo || ''}</div>
          <div class="nome">${p.Nome}</div>
          <div class="preco">${formatarReal(p.Preco)} · à vista <span>${formatarReal(p.Preco * (1 - DESCONTO_AVISTA))}</span></div>
        </div>
        <div class="acoes">
          <button type="button" style="background:#eee;" onclick="copiarLink('${p.ID}')">🔗 Link</button>
        </div>
      </div>
    `).join('');

    container.querySelectorAll('.produto-chk').forEach(chk => {
      chk.addEventListener('change', (e) => {
        if (e.target.checked) selecionadosBulk.add(e.target.dataset.id);
        else selecionadosBulk.delete(e.target.dataset.id);
        atualizarBarraBulk();
      });
    });
  }

  function atualizarBarraBulk() {
    const bar = document.getElementById('bulk-bar');
    const cnt = document.getElementById('bulk-count');
    if (selecionadosBulk.size > 0) {
      bar.classList.add('ativa');
      cnt.textContent = selecionadosBulk.size + ' selecionados';
    } else {
      bar.classList.remove('ativa');
    }
  }

  document.getElementById('btn-cancelar-bulk').addEventListener('click', () => {
    selecionadosBulk.clear();
    atualizarBarraBulk();
    renderizarProdutos();
  });

  document.getElementById('btn-bulk-preco').addEventListener('click', async () => {
    const pct = prompt('Digite a porcentagem de reajuste (ex: 10 para +10%, -15 para 15% de desconto):');
    if (!pct) return;
    await executarAcaoEmLote('ajustarPrecoPorcento', pct);
  });

  document.getElementById('btn-bulk-novidade').addEventListener('click', async () => {
    await executarAcaoEmLote('marcarNovidade', true);
  });

  document.getElementById('btn-bulk-arquivar').addEventListener('click', async () => {
    if (confirm('Arquivar os produtos selecionados?')) {
      await executarAcaoEmLote('arquivar', true);
    }
  });

  async function executarAcaoEmLote(tipoAcao, valor) {
    const resp = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'bulkUpdate',
        pin: adminPin,
        funcionario: funcionarioNome,
        ids: Array.from(selecionadosBulk),
        tipoAcao: tipoAcao,
        valor: valor
      })
    }).then(r => r.json());

    if (resp.ok) {
      alert('Ação realizada em ' + resp.afetados + ' produtos!');
      selecionadosBulk.clear();
      atualizarBarraBulk();
      await carregarProdutos();
    } else {
      alert('Erro ao executar ação em lote.');
    }
  }

  function copiarLink(id) {
    const link = API_URL + '?action=share&id=' + id;
    navigator.clipboard.writeText(link);
    alert('Link copiado!');
  }

  (async function iniciar() {
    await carregarListas();
    await carregarProdutos();
  })();
</script>
</body>
</html>
