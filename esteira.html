<title>Esteira — TENKiTER Modas</title>
<style>
  /* v7.41.0 — Esteira de Produtos (7.42.0 preparação; 7.43.0 pedidos): celular primeiro, mesma identidade do painel (preto, laranja, areia) */
  :root { --preto:#0d0d0d; --areia:#F5F1E8; --branco:#fff; --linha:#e5dfd3; --suave:#5c5650; --verde:#198754; --verde-fundo:#e6f4ec; --alerta:#8a4b00; --alerta-fundo:#fdf0dc; --vermelho:#c62828; --vermelho-fundo:#fdecea; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; }
  body { font-family:"Inter",-apple-system,Roboto,Arial,sans-serif; background:var(--areia); color:var(--preto); line-height:1.45; padding-bottom:calc(32px + env(safe-area-inset-bottom,0px)); }
  header { position:sticky; top:0; z-index:var(--z-sticky,20); background:var(--preto); color:#fff; padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px)); border-bottom:2px solid var(--laranja); }
  .cab { display:flex; align-items:center; gap:10px; min-height:44px; }
  .cab-voltar { display:inline-flex; align-items:center; min-height:44px; min-width:44px; color:#e6e0d5; text-decoration:none; font-weight:600; font-size:.95rem; }
  .cab h1 { font-family:"Poppins",sans-serif; font-size:1.25rem; margin:0; color:var(--laranja); flex:1; }
  .cab .quem { font-size:.85rem; color:#d9d2c5; }
  /* faixa clara sob o título: as abas seguem o padrão único (.tk-abas em janelas.css) */
  nav.abas { margin:8px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px))); padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px)); background:var(--areia); }
  nav.abas.tk-abas.curto { gap:2px; } nav.abas.tk-abas.curto > button { padding:0 5px; min-width:44px; font-size:.86rem; }   /* v7.43.0: abas do Admin no celular (7.51.0: 6 abas com Fotos) */
  nav.abas.curto .aba-num { min-width:8px; width:8px; height:8px; padding:0; margin-left:3px; font-size:0; vertical-align:top; }   /* no celular, só um ponto (o número vai no nome acessível) */
  main { max-width:760px; margin:0 auto; padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px)); display:grid; gap:14px; }
  #esteira-processos-abrir{min-height:44px;padding:6px 10px;background:transparent;color:#fff;border:1px solid #555;border-radius:8px;font:600 .8rem Inter,sans-serif;white-space:nowrap} #esteira-processos-abrir.com-aviso{border-color:var(--laranja);color:#ffd5a0}
  #esteira-processos{max-width:728px;margin:12px auto 0;padding:12px 16px;background:var(--branco);border:1px solid var(--linha);border-radius:12px} #esteira-processos>div{display:flex;align-items:center;justify-content:space-between} #esteira-processos button{min-height:44px;min-width:44px;padding:8px 12px;border:1px solid var(--linha);border-radius:8px;background:var(--areia);color:var(--preto)} #esteira-processos>p,#esteira-processos li p{font-size:.85rem;color:var(--suave);margin:6px 0} #esteira-processos ul{max-height:42dvh;overflow:auto;list-style:none;padding:0;margin:0} #esteira-processos li{padding:10px 0;border-top:1px solid var(--linha)}
  .esteira-vista { display:grid; gap:14px; min-width:0; }
  .card { background:var(--branco); border:1px solid var(--linha); border-radius:14px; padding:14px; display:grid; gap:10px; min-width:0; }
  .card h2, .card h3 { margin:0; font-size:1.05rem; }
  .muted { color:var(--suave); font-size:.88rem; }
  .barra { height:9px; background:var(--linha); border-radius:99px; overflow:hidden; }
  .barra i { display:block; height:100%; background:var(--laranja); border-radius:99px; transition:width .3s; }
  .progresso { display:flex; align-items:baseline; gap:10px; }
  .progresso b { font-size:1.6rem; font-variant-numeric:tabular-nums; }
  .grupo-tit { font-size:.75rem; letter-spacing:.07em; text-transform:uppercase; font-weight:700; color:var(--suave); margin:6px 2px -4px; }
  .peca { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--branco); border:1px solid var(--linha); border-radius:12px; padding:10px; min-height:72px; cursor:pointer; font:inherit; color:inherit; }
  .peca:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid var(--laranja); outline-offset:2px; }
  .peca img, .peca .semfoto { width:52px; height:64px; border-radius:8px; object-fit:cover; flex:none; background:var(--linha); }
  .peca .t { flex:1; min-width:0; }
  .peca .t b { display:block; overflow-wrap:anywhere; }
  .peca.feita { opacity:.62; }
  /* v7.44.0/v7.47.0: família (mesmo produto, estampa ou tamanho diferente) — um cartão com as peças dentro; cada peça continua sendo conferida sozinha */
  .fam { background:var(--branco); border:1px solid var(--linha); border-left:4px solid var(--laranja); border-radius:12px; padding:10px; display:grid; gap:8px; }
  .fam.feita { border-left-color:var(--verde); }
  .fam-cab { display:flex; align-items:center; gap:12px; }
  .fam-cab img, .fam-cab .semfoto { width:52px; height:64px; border-radius:8px; object-fit:cover; flex:none; background:var(--linha); }
  .fam-cab .t { flex:1; min-width:0; } .fam-cab .t b { display:block; overflow-wrap:anywhere; }
  .fam .peca.tam { min-height:56px; padding:8px 10px; background:var(--areia); border-color:transparent; }
  .fam .peca.tam .rot { min-width:44px; text-align:center; font-weight:800; font-size:1.05rem; }
  .fam .peca.tam .vfoto { display:grid; justify-items:center; gap:2px; flex:none; } .fam .peca.tam .vfoto img, .fam .peca.tam .vfoto .semfoto { width:40px; height:50px; border-radius:6px; object-fit:cover; background:var(--linha); } .fam .peca.tam .vfoto .rot { min-width:0; font-size:.85rem; }
  .chip { display:inline-flex; align-items:center; border-radius:999px; padding:3px 10px; font-size:.78rem; font-weight:600; white-space:nowrap; border:1px solid var(--linha); background:var(--areia); }
  .chip.ok { background:var(--verde-fundo); color:var(--verde); border-color:transparent; }
  .chip.al { background:var(--alerta-fundo); color:var(--alerta); border-color:transparent; }
  .chip.er { background:var(--vermelho-fundo); color:var(--vermelho); border-color:transparent; }
  .funcao { border-left:4px solid var(--laranja); }
  .funcao p { margin:0; white-space:pre-wrap; }
  button.bt, a.bt { min-height:48px; border-radius:999px; border:1px solid var(--linha); background:var(--areia); color:var(--preto); font:700 .95rem "Inter",sans-serif; padding:0 18px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
  button.bt.prim { background:var(--preto); color:#fff; border-color:var(--preto); }
  button.bt.laranja, a.bt.laranja { background:var(--laranja); color:var(--preto); border-color:var(--laranja); }
  button.bt[aria-pressed="true"] { background:var(--preto); color:#fff; border-color:var(--preto); }
  button.bt:disabled { opacity:.55; cursor:default; }
  .dois { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  label.campo, div.campo { display:grid; gap:4px; font-size:.88rem; font-weight:600; }
  input[type=text], input[type=search], input[type=tel], input[type=number], input[type=password], input[type=date], select, textarea { min-height:46px; border:1px solid #cfc6b6; border-radius:10px; padding:8px 12px; font:inherit; background:#fff; color:var(--preto); width:100%; }
  textarea { min-height:90px; resize:vertical; }
  .erro { color:var(--vermelho); font-size:.9rem; }
  .ok { color:var(--verde); font-size:.9rem; }
  .vazio { text-align:center; padding:24px 12px; color:var(--suave); }
  /* folha de conferência */
  .fundo { position:fixed; inset:0; z-index:var(--z-folha,100); background:rgba(13,13,13,.45); display:flex; align-items:flex-end; justify-content:center; }
  .folha { background:var(--areia); width:100%; max-width:560px; max-height:92dvh; border-radius:18px 18px 0 0; display:flex; flex-direction:column; }
  .folha .topo { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--linha); }
  .folha .topo b { flex:1; font-size:1rem; overflow-wrap:anywhere; }
  .folha .corpo { overflow:auto; padding:14px; display:grid; gap:12px; }
  .folha .pe { padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--linha); background:var(--branco); border-radius:0; }
  .folha .pe button { width:100%; }
  .folha h3, .folha p { margin:0; }
  .datas { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; font-size:.78rem; }
  .datas div { background:var(--branco); border:1px solid var(--linha); border-radius:10px; padding:6px 8px; }
  .datas b { display:block; font-size:.9rem; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips button { min-height:44px; min-width:52px; border-radius:999px; border:1px solid #cfc6b6; background:#fff; font:600 .92rem "Inter",sans-serif; padding:0 14px; cursor:pointer; }
  .chips button[aria-pressed="false"] { background:var(--areia); color:#8a8178; text-decoration:line-through; }
  .aviso { border-radius:10px; padding:10px 12px; font-size:.9rem; }
  .aviso.al { background:var(--alerta-fundo); color:var(--alerta); }
  .foto-grande { width:96px; height:120px; border-radius:10px; object-fit:cover; background:var(--linha); flex:none; }
  /* configurações */
  .linha-eq { display:grid; gap:8px; border-top:1px solid var(--linha); padding-top:10px; }
  .linha-eq:first-of-type { border-top:0; padding-top:0; }
  .marcas { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:.9rem; }
  .marcas label { display:inline-flex; align-items:center; gap:6px; min-height:44px; }
  .marcas input { width:22px; height:22px; }
  .tabela { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:520px; font-size:.88rem; }
  th, td { border-bottom:1px solid var(--linha); padding:6px; text-align:left; }
  td select { min-height:40px; padding:4px 6px; }
  .num { font-variant-numeric:tabular-nums; }
  .pesos { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; align-items:end; }
  /* v7.42.0 — preparação: lista de tarefas por peça */
  .prep-topo { display:flex; gap:12px; align-items:center; }

  .prep-topo .t { flex:1; min-width:0; }

  .tarefa .tt p { margin:0; white-space:pre-wrap; }

  .marca { width:26px; height:26px; margin-top:1px; border-radius:50%; border:2px solid #cfc6b6; flex:none; display:inline-flex; align-items:center; justify-content:center; font-size:.85rem; font-weight:700; background:#fff; }
  .marca.ok { background:var(--verde); border-color:var(--verde); color:#fff; }

  .nova-t { display:grid; gap:8px; background:var(--areia); border-radius:12px; padding:10px; }

  .minis { display:flex; flex-wrap:wrap; gap:10px; }

  .prep-topo .t > b, .prep-topo .t > small { display:block; overflow-wrap:anywhere; }
  main[data-tela=pedidos] .card p { margin:0; }

  .pessoa { display:grid; gap:8px; border-top:1px solid var(--linha); padding-top:12px; }
  .pessoa:first-of-type, h2 + .pessoa, p + .pessoa { border-top:0; padding-top:0; }
  .pessoa-cab { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  .item-g img, .item-g .semfoto { width:44px; height:55px; border-radius:6px; object-fit:cover; flex:none; background:var(--linha); }

  .peca-linha > .peca { border:0; background:transparent; flex:1; min-width:0; }

  .foto-bt { position:relative; flex:none; border:0; background:none; padding:0; margin:0; border-radius:8px; cursor:zoom-in; line-height:0; min-width:44px; min-height:44px; color:inherit; }

  .foto-bt::after { content:"⤢"; position:absolute; right:3px; bottom:3px; width:20px; height:20px; border-radius:50%; background:rgba(13,13,13,.72); color:#fff; font-size:.75rem; line-height:20px; text-align:center; }
  .foto-bt .qtd-fotos { position:absolute; left:3px; top:3px; background:rgba(13,13,13,.72); color:#fff; font-size:.68rem; font-weight:700; border-radius:6px; padding:2px 5px; line-height:1.2; }
  .foto-bt.grande img, .foto-bt.grande .semfoto { width:96px; height:120px; border-radius:10px; }
  .foto-bt.media img, .foto-bt.media .semfoto { width:56px; height:70px; }

  .ficha { display:grid; gap:10px; min-width:0; }

  .ficha-curta .t b { overflow-wrap:anywhere; }
  .ficha-acoes { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }

  .escolha > .rot { font-size:.88rem; font-weight:600; }
  .escolha .abrir { justify-content:space-between; text-align:left; min-height:46px; border-radius:10px; background:#fff; border:1px solid #cfc6b6; font-weight:500; padding:8px 12px; }
  .escolha .abrir span { overflow-wrap:anywhere; }

  function reduzirFoto(file) {                       // igual ao painel: lado maior até 1200 px, JPG 85% (cabe nos 2,5 MB do servidor de fotos)
    return new Promise((ok, falhou) => {
      const u = URL.createObjectURL(file), img = new Image();
      img.onerror = () => { URL.revokeObjectURL(u); falhou(new Error('Não consegui abrir esta foto. Use uma foto JPG ou PNG.')); };
      img.onload = () => {
        const esc = Math.min(1, 1200 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * esc)); c.height = Math.max(1, Math.round(img.height * esc));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
        c.toBlob((b) => (b ? ok(b) : falhou(new Error('Não consegui preparar a foto. Tente outra.'))), 'image/jpeg', 0.85);
      };
      img.src = u;
    });
  }

    let r; try { r = await fetch(MIDIA_URL + '/u', { method: 'POST', headers: { 'X-TK-Whats': s.whatsapp, 'X-TK-Sessao': s.sessao }, body: blob }); } catch (e) { throw new Error('Sem conexão. A foto não foi enviada; tente de novo.'); }
    const j = await r.json().catch(() => null);
    if (r.status === 401 || r.status === 403) throw new Error('Seu acesso não permite enviar fotos. Produto ao Admin total a permissão de cadastrar produtos, ou fotografe pelo painel.');
    if (!r.ok || !j || !j.ok || !j.url) throw new Error(legivel(j && j.erro, 'O servidor de fotos não aceitou a foto. Tente de novo.'));
    if (window.TKMiniFoto) window.TKMiniFoto.enviar(blob, j.url);   // cópia de 480 px ao lado da foto (vitrine mais leve)
    return j.url;
  }

  }
  async function aplicarItem(ped, x, aviso, processo) {
    const chamar=(rota,dados)=>processo?processo.worker('item-'+x.id+'-'+(dados.fase||rota.split('/').pop()),rota,dados):srv(rota,dados);
    const nome = '“' + x.nome + '”';
    if (x.tipo === 'reposicao') {
      aviso('Lendo o estoque atual…'); CATALOGO = null;
      const p = (await catalogoCompleto()).get(String(x.produto));
      if (!p) throw new Error(nome + ' não está mais no catálogo (pode ter sido excluído). Nada foi somado.');
      const atual = Number(p.Estoque) || 0;
      const inicio=processo?await processo.etapa('estoque-inicial-'+x.id,async()=>({antes:atual})): {antes:atual};
      const ini = await chamar('/esteira/pedidos/aplicado', { id: ped.id, item: x.id, fase: 'inicio', antes: inicio.antes, refazer: x.refazer === true });
      if (!ini.ok) throw new Error(ini.erro || 'Não consegui começar. Nada foi somado; tente de novo.');
      if (ini.jaAplicado) return;
      const antes = ini.aplic.antes, depois = ini.aplic.depois;
      if (atual !== depois) {
        if (atual !== antes) { const e = new Error('O estoque de ' + nome + ' mudou desde a tentativa anterior (era ' + antes + ', agora ' + atual + '). Confira na Gestão se a soma já entrou. Se não entrou, toque em “Somar ' + x.qtd_aceita + ' ao estoque atual”.'); e.refazer = true; throw e; }
        aviso('Somando ' + x.qtd_aceita + ' ao estoque (' + antes + ' → ' + depois + ')…');
        processo?.assert();const y = await apiPost(pacoteUpdate(p, { estoque: String(depois) }));
        if (!y || !y.ok) throw new Error(legivel(y && y.erro, 'O catálogo não aceitou somar o estoque de ' + nome + '. Nada mudou; tente de novo.'));
        p.Estoque = String(depois);
      }
      const fim = await chamar('/esteira/pedidos/aplicado', { id: ped.id, item: x.id });
      if (!fim.ok) throw new Error('O estoque de ' + nome + ' já está em ' + depois + ', mas não consegui registrar aqui. Toque em “Tentar de novo”: não soma duas vezes.');
      await chamar('/esteira/toque', { ids: [String(p.ID)] });
      return;
    }
    let novoId = x.produto_criado, codigo = '';
    if (!novoId) {
      aviso('Criando ' + nome + ' no catálogo…');
      const r = await apiPost(pacoteNovo(ped, x));
      if (!r || !r.ok || !r.id) throw new Error(legivel(r && r.erro, 'O catálogo não aceitou criar ' + nome + '. Tente de novo.'));
      novoId = String(r.id); codigo = String(r.codigo || '');
      const c = await chamar('/esteira/pedidos/aplicado', { id: ped.id, item: x.id, fase: 'criado', produtoCriado: novoId, codigo });
      if (!c.ok) throw new Error(nome + ' foi criado no catálogo (ID ' + novoId + '), mas não consegui registrar aqui. Toque em “Tentar de novo”: o catálogo reconhece este pedido e não cria outro.');
      novoId = String(c.produtoCriado || novoId); x.produto_criado = novoId;
    }
    aviso('Tirando do site (arquivando)…');
    const a = await apiPost(Object.assign(autenticacao(), { action: 'bulkUpdate', ids: [novoId], tipoAcao: 'arquivar', valor: true }));

    await c.progresso('Registrando o aceite…');return c.worker('aceitar','/esteira/aceitar',{id:d.id});
  }
  async function subirArquivos(d,c){const urls=[];for(let i=0;i<d.fotos.length;i++){await c.progresso('Enviando foto '+(i+1)+' de '+d.fotos.length+'…');const u=await c.etapa('foto-'+i,async()=>{c.assert();const blob=await reduzirFoto(d.fotos[i].arquivo||d.fotos[i]);c.assert();return enviarFoto(blob)});urls.push(u)}return urls;}
  async function executarFotos(d,c){const urls=await subirArquivos(d,c);await c.progresso('Salvando as fotos no produto…');const r=await c.etapa('produto',()=>colocarNoProduto(d.produto,urls,'',c));if(d.tarefas?.length)await c.worker('concluir','/esteira/fotos/concluir',{ids:d.tarefas,fotos:urls.length});return{ok:true,fotos:urls.length,produto:d.produto};}
  async function executarCaixa(d,c){const urls=await subirArquivos(d,c);await c.progresso('Registrando as fotos na caixa…');return c.worker('caixa','/esteira/caixa/enviar',{lote:c.job.id,descricaoLote:d.descricaoLote||'',produto:d.produto||'',produtoNome:d.produtoNome||'',itens:urls.map((url,i)=>({op:c.job.id+'-'+i,url,descricao:d.fotos[i].descricao||'',hash:d.fotos[i].hash||''}))});}
  async function executarColocar(d,c){await c.progresso('Salvando as fotos no produto…');await c.etapa('produto',()=>colocarNoProduto(d.produto,d.urls,d.capa||'',c));await c.progresso('Atualizando a caixa…');return c.worker('caixa','/esteira/caixa/usar',{ids:d.ids,uso:'produto',produto:d.produto,produtoNome:d.produtoNome});}
  async function executarPedido(d,c){await c.progresso('Salvando o pedido…');const pacote=await resolverFotos(d.pacote,c);const r=await c.worker('salvar','/esteira/pedidos/salvar',pacote);if(d.enviar){await c.progresso('Marcando o pedido como enviado…');await c.worker('enviar','/esteira/pedidos/enviar',{id:r.pedido.id})}return r;}
  async function executarAplicacao(d,c){const r=await srvRede('/esteira/pedidos/abrir?id='+encodeURIComponent(d.id));resultadoOk(r,'Não consegui abrir o pedido.');const falhas=[];for(const id of d.itens){const x=r.pedido.itens.find(x=>String(x.id)===String(id));if(!x||x.aplicado_em)continue;x.refazer=d.refazer===true;try{await aplicarItem(r.pedido,x,m=>{void c.progresso(m)},c);await c.progresso('Item '+x.nome+' concluído.')}catch(e){if(e.conta||e.login)throw e;falhas.push({item:x.id,erro:e.message,refazer:!!e.refazer,incerto:!!e.incerto});}}if(falhas.length){const e=Object.assign(Error(falhas[0].erro),falhas[0]);e.falhas=falhas;throw e;}return{ok:true,pedido:d.id};}

  let guardandoProcessos=0;
  async function guardarProcesso(tipo,dados,titulo,chave){guardandoProcessos++;document.documentElement.dataset.esteiraGuardando='1';try{return await processos.adicionar(tipo,dados,titulo,chave)}finally{guardandoProcessos--;if(!guardandoProcessos)delete document.documentElement.dataset.esteiraGuardando;}}
  function refrescarDepois(){fluidez.invalidar();CATALOGO=null;HOJE=null;const origem=versaoTela,toques=interacao;setTimeout(()=>{if(ABA!=='fotos'&&origem===versaoTela&&toques===interacao&&fluidez.visivel()&&!['editor','contagem','aprovacao','aplicacao'].includes(app.dataset.tela)&&!document.querySelector('.fundo')&&!document.activeElement?.matches('input,textarea,select'))void abrirAba();},1700)}

  /* ---------- início ---------- */
  async function iniciar() {
    if (!getSessao()) return telaLogin('');
    performance.clearMarks('esteira:hoje:util');
    medirTela('abertura', 'hoje');
    await telaHoje();
  }
  function sessaoMudou() {
    const s = getSessao();
    if (sessaoAtual && s && s.whatsapp === sessaoAtual.whatsapp && s.sessao === sessaoAtual.sessao) return;
    sessaoAtual = s;
    document.querySelectorAll('.fundo').forEach(f => f.esteiraFechar?.());
    fotosLocais.forEach((_, url) => URL.revokeObjectURL(url));
    fotosLocais.clear();
    usuario = null; HOJE = null; EU = null; ABA = 'hoje'; CAIXA_VER = 'novas'; AVISO_FOTOS = '';
    $('abas').hidden = true; $('quem').textContent = '';
    fluidez.limpar();
    void iniciar();
  }
  function revalidarAba(expirar = false) {
    if (expirar && !document.hidden) fluidez.expirar();
    if (ABA === 'fotos' || document.hidden || !fluidez.visivel() || document.querySelector('.fundo') ||
        [...document.querySelectorAll('.overlay')].some(e => e.getClientRects().length)) return;
    void abrirAba();
  }
  setInterval(revalidarAba, 30000);
  window.addEventListener('online', () => revalidarAba(true));
  document.addEventListener('visibilitychange', () => revalidarAba(true));
  TKSessao.aoMudar(sessaoMudou);
  let larguraAbas = window.innerWidth; window.addEventListener('resize', () => { if ((window.innerWidth > 560) !== (larguraAbas > 560) && EU) desenharAbas(); larguraAbas = window.innerWidth; });
  sessaoMudou();
})();
</script>
