<title>Esteira — TENKiTER Modas</title>
<style>
  /* v7.41.0 — Esteira de Produtos (7.42.0 preparação; 7.43.0 pedidos): celular primeiro, mesma identidade do painel (preto, laranja, areia) */
  :root { --preto:#0d0d0d; --laranja:#E67E22; --laranja-txt:#A85200; --areia:#F5F1E8; --branco:#fff; --linha:#e5dfd3; --suave:#5c5650; --verde:#198754; --verde-fundo:#e6f4ec; --alerta:#8a4b00; --alerta-fundo:#fdf0dc; --vermelho:#c62828; --vermelho-fundo:#fdecea; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; }
  body { font-family:"Inter",-apple-system,Roboto,Arial,sans-serif; background:var(--areia); color:var(--preto); line-height:1.45; padding-bottom:calc(32px + env(safe-area-inset-bottom,0px)); }
  header { position:sticky; top:0; z-index:20; background:var(--preto); color:#fff; padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px)); border-bottom:2px solid var(--laranja); }
  .cab { display:flex; align-items:center; gap:10px; min-height:44px; }
  .cab h1 { font-family:"Poppins",sans-serif; font-size:1.25rem; margin:0; color:var(--laranja); flex:1; }
  .cab .quem { font-size:.85rem; color:#d9d2c5; }
  nav.abas { display:flex; gap:4px; overflow-x:auto; padding:8px 0 0; }
  nav.abas button { flex:none; min-height:44px; padding:0 11px; border:0; border-radius:10px 10px 0 0; background:transparent; color:#d9d2c5; font:600 .95rem "Inter",sans-serif; cursor:pointer; }
  nav.abas button[aria-selected="true"] { background:var(--areia); color:var(--preto); }
  nav.abas.curto { gap:2px; } nav.abas.curto button { padding:0 7px; }   /* v7.43.0: 5 abas no celular do Admin */
  main { max-width:760px; margin:0 auto; padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px)); display:grid; gap:14px; }
  .card { background:var(--branco); border:1px solid var(--linha); border-radius:14px; padding:14px; display:grid; gap:10px; min-width:0; }
  .card h2, .card h3 { margin:0; font-size:1.05rem; }
  .muted { color:var(--suave); font-size:.88rem; }
  .barra { height:9px; background:var(--linha); border-radius:99px; overflow:hidden; }
  .barra i { display:block; height:100%; background:var(--laranja); border-radius:99px; transition:width .3s; }
  .progresso { display:flex; align-items:baseline; gap:10px; }
  .progresso b { font-size:1.6rem; font-variant-numeric:tabular-nums; }
  .grupo-tit { font-size:.75rem; letter-spacing:.07em; text-transform:uppercase; font-weight:700; color:var(--suave); margin:6px 2px -4px; }
  .peca { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--branco); border:1px solid var(--linha); border-radius:12px; padding:10px; min-height:72px; cursor:pointer; font:inherit; color:inherit; }
  .peca:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid var(--laranja); outline-offset:2px; }
  .peca img, .peca .semfoto { width:52px; height:64px; border-radius:8px; object-fit:cover; flex:none; background:var(--linha); }
  .peca .t { flex:1; min-width:0; }
  .peca .t b { display:block; overflow-wrap:anywhere; }
  .peca.feita { opacity:.62; }
  /* v7.44.0: família de tamanhos — um cartão com os tamanhos dentro; cada tamanho continua sendo conferido sozinho */
  .fam { background:var(--branco); border:1px solid var(--linha); border-left:4px solid var(--laranja); border-radius:12px; padding:10px; display:grid; gap:8px; }
  .fam.feita { border-left-color:var(--verde); }
  .fam-cab { display:flex; align-items:center; gap:12px; }
  .fam-cab img, .fam-cab .semfoto { width:52px; height:64px; border-radius:8px; object-fit:cover; flex:none; background:var(--linha); }
  .fam-cab .t { flex:1; min-width:0; } .fam-cab .t b { display:block; overflow-wrap:anywhere; }
  .fam .peca.tam { min-height:56px; padding:8px 10px; background:var(--areia); border-color:transparent; }
  .fam .peca.tam .rot { min-width:44px; text-align:center; font-weight:800; font-size:1.05rem; }
  .chip { display:inline-flex; align-items:center; border-radius:999px; padding:3px 10px; font-size:.78rem; font-weight:600; white-space:nowrap; border:1px solid var(--linha); background:var(--areia); }
  .chip.ok { background:var(--verde-fundo); color:var(--verde); border-color:transparent; }
  .chip.al { background:var(--alerta-fundo); color:var(--alerta); border-color:transparent; }
  .chip.er { background:var(--vermelho-fundo); color:var(--vermelho); border-color:transparent; }
  .funcao { border-left:4px solid var(--laranja); }
  .funcao p { margin:0; white-space:pre-wrap; }
  button.bt, a.bt { min-height:48px; border-radius:999px; border:1px solid var(--linha); background:var(--areia); color:var(--preto); font:700 .95rem "Inter",sans-serif; padding:0 18px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
  button.bt.prim { background:var(--preto); color:#fff; border-color:var(--preto); }
  button.bt.laranja { background:var(--laranja); color:var(--preto); border-color:var(--laranja); }
  button.bt[aria-pressed="true"] { background:var(--preto); color:#fff; border-color:var(--preto); }
  button.bt:disabled { opacity:.55; cursor:default; }
  .dois { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  label.campo { display:grid; gap:4px; font-size:.88rem; font-weight:600; }
  input[type=text], input[type=tel], input[type=number], input[type=password], input[type=date], select, textarea { min-height:46px; border:1px solid #cfc6b6; border-radius:10px; padding:8px 12px; font:inherit; background:#fff; color:var(--preto); width:100%; }
  textarea { min-height:90px; resize:vertical; }
  .erro { color:var(--vermelho); font-size:.9rem; }
  .ok { color:var(--verde); font-size:.9rem; }
  .vazio { text-align:center; padding:24px 12px; color:var(--suave); }
  /* folha de conferência */
  .fundo { position:fixed; inset:0; z-index:50; background:rgba(13,13,13,.45); display:flex; align-items:flex-end; justify-content:center; }
  .folha { background:var(--areia); width:100%; max-width:560px; max-height:92dvh; border-radius:18px 18px 0 0; display:flex; flex-direction:column; }
  .folha .topo { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--linha); }
  .folha .topo b { flex:1; font-size:1rem; overflow-wrap:anywhere; }
  .folha .corpo { overflow:auto; padding:14px; display:grid; gap:12px; }
  .folha .pe { padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--linha); background:var(--branco); border-radius:0; }
  .folha .pe button { width:100%; }
  .folha h3, .folha p { margin:0; }
  .fechar { min-width:44px; min-height:44px; border:0; border-radius:50%; background:var(--branco); font-size:1.2rem; cursor:pointer; }
  .datas { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; font-size:.78rem; }
  .datas div { background:var(--branco); border:1px solid var(--linha); border-radius:10px; padding:6px 8px; }
  .datas b { display:block; font-size:.9rem; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips button { min-height:44px; min-width:52px; border-radius:999px; border:1px solid #cfc6b6; background:#fff; font:600 .92rem "Inter",sans-serif; padding:0 14px; cursor:pointer; }
  .chips button[aria-pressed="false"] { background:var(--areia); color:#8a8178; text-decoration:line-through; }
  .aviso { border-radius:10px; padding:10px 12px; font-size:.9rem; }
  .aviso.al { background:var(--alerta-fundo); color:var(--alerta); }
  .foto-grande { width:96px; height:120px; border-radius:10px; object-fit:cover; background:var(--linha); flex:none; }
  /* configurações */
  .linha-eq { display:grid; gap:8px; border-top:1px solid var(--linha); padding-top:10px; }
  .linha-eq:first-of-type { border-top:0; padding-top:0; }
  .marcas { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:.9rem; }
  .marcas label { display:inline-flex; align-items:center; gap:6px; min-height:44px; }
  .marcas input { width:22px; height:22px; }
  .tabela { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:520px; font-size:.88rem; }
  th, td { border-bottom:1px solid var(--linha); padding:6px; text-align:left; }
  td select { min-height:40px; padding:4px 6px; }
  .num { font-variant-numeric:tabular-nums; }
  .pesos { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; align-items:end; }
  /* v7.42.0 — preparação: lista de tarefas por peça */
  .prep-topo { display:flex; gap:12px; align-items:center; }
  .prep-topo img, .prep-topo .semfoto { width:56px; height:70px; border-radius:8px; object-fit:cover; flex:none; background:var(--linha); }
  .prep-topo .t { flex:1; min-width:0; }
  .prep-topo h3 { overflow-wrap:anywhere; }
  .tarefa { display:grid; gap:8px; border-top:1px solid var(--linha); padding-top:10px; }
  .tarefa .cab-t { display:flex; gap:10px; align-items:flex-start; }
  .tarefa .tt { flex:1; min-width:0; display:grid; gap:2px; }
  .tarefa .tt b { overflow-wrap:anywhere; }
  .tarefa .tt p { margin:0; white-space:pre-wrap; }
  .tarefa.feita .tt b { color:var(--suave); }
  .marca { width:26px; height:26px; margin-top:1px; border-radius:50%; border:2px solid #cfc6b6; flex:none; display:inline-flex; align-items:center; justify-content:center; font-size:.85rem; font-weight:700; background:#fff; }
  .marca.ok { background:var(--verde); border-color:var(--verde); color:#fff; }
  .acoes-t { display:flex; flex-wrap:wrap; gap:8px; }
  .acoes-t .bt { flex:1 1 140px; }
  .acoes-t .bt.discreto { flex:none; min-height:44px; background:transparent; border-color:transparent; text-decoration:underline; padding:0 8px; font-weight:600; color:var(--suave); }
  p[role=status]:empty { display:none; }
  .busca-res { display:grid; gap:8px; }
  .nova-t { display:grid; gap:8px; background:var(--areia); border-radius:12px; padding:10px; }
  /* v7.43.0 — pedidos ao fornecedor, chegada com contagem cega e aprovação */
  .bt.discreto { min-height:44px; background:transparent; border-color:transparent; text-decoration:underline; padding:0 8px; font-weight:600; color:var(--suave); }
  .bt.voltar { justify-self:start; padding-left:2px; }
  .aviso.ok { background:var(--verde-fundo); color:var(--verde); }
  p.aviso { margin:0; }
  .itens-ped { display:grid; gap:14px; }
  .item-ped { display:grid; gap:8px; border-top:1px solid var(--linha); padding-top:12px; }
  .item-ped:first-child { border-top:0; padding-top:0; }
  .prep-topo .bt.discreto { flex:none; }
  .minis { display:flex; flex-wrap:wrap; gap:10px; }
  .mini { position:relative; }
  .mini-img { width:56px; height:70px; border-radius:8px; object-fit:cover; background:var(--linha); display:block; }
  .mini .tirar { position:absolute; top:-12px; right:-14px; width:44px; height:44px; border:0; background:none; padding:0; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .mini .tirar span { width:24px; height:24px; border-radius:50%; background:var(--preto); color:#fff; font-size:1rem; line-height:24px; text-align:center; }
  .campo-fotos { display:grid; gap:8px; justify-items:start; }
  .bt.decisao { padding:0 10px; }
  .aviso-ped .bt { justify-self:start; }
  .prep-topo .t > b, .prep-topo .t > small { display:block; overflow-wrap:anywhere; }
  main[data-tela=pedidos] .card p { margin:0; }
  /* v7.45.0 — painel completo: listas por pessoa, mercadoria, peças paradas e sugestões */
  .pessoa { display:grid; gap:8px; border-top:1px solid var(--linha); padding-top:12px; }
  .pessoa:first-of-type, h2 + .pessoa, p + .pessoa { border-top:0; padding-top:0; }
  .pessoa-cab { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pessoa-cab > b:first-child { flex:1; min-width:0; overflow-wrap:anywhere; }
  .pessoa .ver-lista { justify-self:start; }
  .item-g { display:grid; gap:8px; border-top:1px solid var(--linha); padding-top:10px; }
  .item-g .linha { display:flex; gap:10px; align-items:center; }
  .item-g .t { flex:1; min-width:0; } .item-g .t b { display:block; overflow-wrap:anywhere; } .item-g .t small { display:block; }
  .item-g img, .item-g .semfoto { width:44px; height:55px; border-radius:6px; object-fit:cover; flex:none; background:var(--linha); }
  .item-g.feita .t b { color:var(--suave); }
  .item-g p { margin:0; }
  .acoes-lista { display:flex; flex-wrap:wrap; gap:8px; }
  .acoes-lista select { flex:1 1 150px; width:auto; min-height:48px; }
  .acoes-lista .bt { flex:0 0 auto; }
  .contagens { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .contagens div { background:var(--areia); border-radius:10px; padding:8px 6px; text-align:center; display:grid; }
  .contagens b { font-size:1.4rem; }
  #painel-mercadoria h3, #painel-paradas h3 { margin-top:6px; }
  @media (min-width:700px) { .fundo { align-items:center; } .folha { border-radius:18px; } .acoes-t { justify-content:flex-end; } .acoes-t .bt:not(.discreto) { flex:0 0 200px; } .tarefa .acoes-t:has(.discreto) { justify-content:flex-start; } }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>

<body>
<header>
  <div class="cab"><h1>Esteira</h1><span class="quem" id="quem"></span></div>
  <nav class="abas" id="abas" role="tablist" aria-label="Áreas da Esteira" hidden></nav>
</header>
<main id="app" aria-live="polite"><div class="card">Carregando…</div></main>

<script src="common.js?v=7.45.0"></script>
<script src="conta.js"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const app = $('app');
  let EU = null, ABA = 'hoje', HOJE = null, CATALOGO = null, usuario = null;

  async function srv(rota, corpo) {
    const s = getSessao(); if (!s) return { ok: false, erro: 'Entre na sua conta para continuar.', exigeLogin: true };
    try {
      const r = await fetch(INSTAGRAM_URL + rota, { method: corpo ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', 'X-TK-Whats': s.whatsapp, 'X-TK-Sessao': s.sessao }, body: corpo ? JSON.stringify(corpo) : undefined });
      const j = await r.json().catch(() => ({ ok: false, erro: 'O servidor respondeu de um jeito inesperado. Tente de novo.' }));
      if (r.status === 401) j.exigeLogin = true;
      return j;
    } catch (e) { return { ok: false, erro: 'Sem conexão. Verifique a internet e tente de novo.', semRede: true }; }
  }
  const dataBR = (iso) => { const t = Date.parse(iso || ''); if (!Number.isFinite(t)) return '—'; const d = new Date(t); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getFullYear()).slice(2); };
  const haDias = (iso) => { const t = Date.parse(iso || ''); if (!Number.isFinite(t)) return null; return Math.floor((Date.now() - t) / 864e5); };
  const lista = (v) => String(v || '').split(',').map((x) => x.trim()).filter(Boolean);
  const legivel = (t, padrao) => { const x = String(t || '').trim(); return !x || /^[[{<]/.test(x) ? padrao : x; };   // nunca mostra JSON cru
  const semAcento = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const ehInativo = (x) => !!x.Status && String(x.Status).trim().toLowerCase() !== 'ativo';   // mesmo critério do painel (arquivada)
  const autenticacao = () => { const s = getSessao() || {}; return { pin: s.sessao, sessao: s.sessao, whatsapp: s.whatsapp, funcionario: (EU && EU.nome) || '' }; };
  function foto(url, cls) { if (!url) return el('div', cls || 'semfoto'); const i = el('img', cls); i.alt = ''; i.loading = 'lazy'; i.decoding = 'async'; i.src = typeof fotoMini === 'function' ? fotoMini(url, 160) : url; i.onerror = () => { i.replaceWith(el('div', cls || 'semfoto')); }; return i; }

  /* ---------- login ---------- */
  function telaLogin(msg) {
    $('abas').hidden = true; $('quem').textContent = '';
    app.replaceChildren();
    const c = el('div', 'card'); c.append(el('h2', '', 'Entrar'), el('p', 'muted', 'Use o mesmo e-mail, WhatsApp ou CPF e a mesma senha do painel e do Mensageiro.'));
    const w = el('input'); w.type = 'text'; w.id = 'login-w'; w.placeholder = 'E-mail, WhatsApp ou CPF'; w.autocomplete = 'username'; w.setAttribute('autocapitalize', 'none');
    const s = el('input'); s.type = 'password'; s.id = 'login-s'; s.placeholder = 'Senha'; s.autocomplete = 'current-password';
    const er = el('p', 'erro', msg || ''); er.hidden = !msg;
    const go = el('button', 'bt prim', 'Entrar'); go.type = 'button';
    const esq = el('button', 'bt', 'Esqueci a senha'); esq.type = 'button';
    go.onclick = async () => { go.disabled = true; const r = await entrarComSenha(w.value, s.value); go.disabled = false; if (!r || !r.ok) { er.textContent = (r && r.erro) || 'Não foi possível entrar.'; er.hidden = false; return; } iniciar(); };
    s.onkeydown = (e) => { if (e.key === 'Enter') go.click(); };
    esq.onclick = () => { if (window.TKConta) TKConta.abrirRecuperar({ identificador: w.value, chamar: (d) => apiPost(d), aoEntrar: (r) => { salvarSessao(r.usuario.whatsapp, r.sessao); iniciar(); } }); };
    c.append(w, s, er, go, esq); app.append(c); w.focus();
  }
  function falha(msg, tentar) {
    app.replaceChildren(); const c = el('div', 'card'); c.append(el('h2', '', 'Não foi possível abrir'), el('p', '', msg || 'Tente de novo.'));
    const b = el('button', 'bt prim', 'Tentar de novo'); b.type = 'button'; b.onclick = tentar || iniciar; c.append(b); app.append(c);
  }

  /* ---------- abas ---------- */
  function desenharAbas() {
    const nav = $('abas'); nav.replaceChildren();
    const abas = [['hoje', 'Hoje', 'Hoje'], ['prep', 'Preparação', 'Preparo'], ['pedidos', 'Pedidos', 'Pedidos']].concat(EU && EU.admin ? [['painel', 'Painel', 'Painel'], ['config', 'Configurações', 'Ajustes']] : []);
    nav.hidden = abas.length < 2;
    const curto = abas.length > 4 && window.matchMedia('(max-width: 560px)').matches;   // v7.43.0: 5 abas cabem em 390 px sem rolar
    nav.classList.toggle('curto', curto);
    abas.forEach(([id, rot, rc]) => { const b = el('button', '', curto ? rc : rot); b.type = 'button'; b.dataset.aba = id; if (curto && rc !== rot) b.setAttribute('aria-label', rot); b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(ABA === id)); b.onclick = () => { ABA = id; desenharAbas(); abrirAba(); }; nav.append(b); });
  }
  function abrirAba() { app.dataset.tela = ABA; if (ABA === 'prep') return telaPrep(); if (ABA === 'pedidos') return telaPedidos(); if (ABA === 'painel') return telaPainel(); if (ABA === 'config') return telaConfig(); return telaHoje(); }

  /* ---------- Hoje ---------- */
  async function telaHoje(recarregar) {
    if (!HOJE || recarregar !== false) { app.replaceChildren(el('div', 'card', 'Montando a sua lista de hoje…')); const r = await srv('/esteira/hoje'); if (r.exigeLogin) return telaLogin(''); if (!r.ok) return falha(r.erro, () => telaHoje()); HOJE = r; EU = r.eu; $('quem').textContent = EU.nome || ''; desenharAbas(); }
    app.replaceChildren();
    const r = HOJE;
    const pd = r.pedidos || {}, irPedidos = () => { ABA = 'pedidos'; desenharAbas(); telaPedidos(); };   // v7.43.0: pendências de pedido
    const avisoPed = (tit, txt, rot) => { const c = el('div', 'card funcao aviso-ped'); c.append(el('h3', '', tit), el('p', 'muted', txt), bt(rot, 'prim', irPedidos)); app.append(c); };
    if (EU.admin) {

  /* ---------- v7.42.0: fotos da tarefa (mesmo caminho do painel: Worker tenkiter-midia /u com a sessão) ---------- */
  function reduzirFoto(file) {                       // igual ao painel: lado maior até 1200 px, JPG 85% (cabe nos 2,5 MB do servidor de fotos)
    return new Promise((ok, falhou) => {
      const u = URL.createObjectURL(file), img = new Image();
      img.onerror = () => { URL.revokeObjectURL(u); falhou(new Error('Não consegui abrir esta foto. Use uma foto JPG ou PNG.')); };
      img.onload = () => {
        const esc = Math.min(1, 1200 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * esc)); c.height = Math.max(1, Math.round(img.height * esc));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
        c.toBlob((b) => (b ? ok(b) : falhou(new Error('Não consegui preparar a foto. Tente outra.'))), 'image/jpeg', 0.85);
      };
      img.src = u;
    });
  }
  async function enviarFoto(blob) {
    const s = getSessao();
    if (!s || !/^tk[123]\./.test(String(s.sessao))) throw new Error('Para enviar fotos, saia e entre de novo com a sua senha.');
    let r; try { r = await fetch(MIDIA_URL + '/u', { method: 'POST', headers: { 'X-TK-Whats': s.whatsapp, 'X-TK-Sessao': s.sessao }, body: blob }); } catch (e) { throw new Error('Sem conexão. A foto não foi enviada; tente de novo.'); }
    const j = await r.json().catch(() => null);
    if (r.status === 401 || r.status === 403) throw new Error('Seu acesso não permite enviar fotos. Peça ao administrador a permissão de cadastrar peças, ou fotografe pelo painel.');
    if (!r.ok || !j || !j.ok || !j.url) throw new Error(legivel(j && j.erro, 'O servidor de fotos não aceitou a foto. Tente de novo.'));
    return j.url;
  }
  /** Sobe as fotos e acrescenta à galeria da peça (sem foto ainda: a primeira vira a capa), pelo mesmo pacote completo do update. */
  async function adicionarFotos(produtoId, arquivos, aviso) {
    CATALOGO = null;                                 // lê de novo: não pode apagar foto que outra pessoa pôs há pouco
    const x = (await catalogoCompleto()).get(String(produtoId));
    if (!x) throw new Error('Esta peça não está no catálogo. Avise o administrador.');
    const novas = [];
    for (let k = 0; k < arquivos.length; k++) { aviso('Enviando foto ' + (k + 1) + ' de ' + arquivos.length + '…'); novas.push(await enviarFoto(await reduzirFoto(arquivos[k]))); }

    const galeria = lista(x.Fotos_Galeria).concat(resto).join(',');

    if (!r || !r.ok) throw new Error(legivel(r && r.erro, 'As fotos subiram, mas o catálogo não aceitou a mudança. Tente de novo.'));

    const d = { action: 'create', nome: x.nome, categoria: x.categoria, genero: x.genero, preco: temPreco ? preco.toFixed(2) : '', estoque: String(x.qtd_aceita), tamanhos: x.tamanhos || '', cores: x.cores || '', descricao: '', novidade: false, fotoUrlExistente: (x.fotos || [])[0] || '', fotosGaleriaExistentes: (x.fotos || []).slice(1).join(','), opId: 'est' + ped.id + 'x' + x.id };

  async function aplicarItem(ped, x, aviso) {
    const nome = '“' + x.nome + '”';
    if (x.tipo === 'reposicao') {
      aviso('Lendo o estoque atual…'); CATALOGO = null;
      const p = (await catalogoCompleto()).get(String(x.produto));
      if (!p) throw new Error(nome + ' não está mais no catálogo (pode ter sido excluída). Nada foi somado.');
      const atual = Number(p.Estoque) || 0;
      const ini = await srv('/esteira/pedidos/aplicado', { id: ped.id, item: x.id, fase: 'inicio', antes: atual, refazer: x.refazer === true });
      if (!ini.ok) throw new Error(ini.erro || 'Não consegui começar. Nada foi somado; tente de novo.');
      if (ini.jaAplicado) return;
      const antes = ini.aplic.antes, depois = ini.aplic.depois;
      if (atual !== depois) {
        if (atual !== antes) { const e = new Error('O estoque de ' + nome + ' mudou desde a tentativa anterior (era ' + antes + ', agora ' + atual + '). Confira na Gestão se a soma já entrou. Se não entrou, toque em “Somar ' + x.qtd_aceita + ' ao estoque atual”.'); e.refazer = true; throw e; }
        aviso('Somando ' + x.qtd_aceita + ' ao estoque (' + antes + ' → ' + depois + ')…');
        const y = await apiPost(pacoteUpdate(p, { estoque: String(depois) }));
        if (!y || !y.ok) throw new Error(legivel(y && y.erro, 'O catálogo não aceitou somar o estoque de ' + nome + '. Nada mudou; tente de novo.'));
        p.Estoque = String(depois);
      }
      const fim = await srv('/esteira/pedidos/aplicado', { id: ped.id, item: x.id });
      if (!fim.ok) throw new Error('O estoque de ' + nome + ' já está em ' + depois + ', mas não consegui registrar aqui. Toque em “Tentar de novo”: não soma duas vezes.');
      srv('/esteira/toque', { ids: [String(p.ID)] });
      return;
    }
    let novoId = x.produto_criado, codigo = '';
    if (!novoId) {
      aviso('Criando ' + nome + ' no catálogo…');
      const r = await apiPost(pacoteNovo(ped, x));
      if (!r || !r.ok || !r.id) throw new Error(legivel(r && r.erro, 'O catálogo não aceitou criar ' + nome + '. Tente de novo.'));
      novoId = String(r.id); codigo = String(r.codigo || '');
      const c = await srv('/esteira/pedidos/aplicado', { id: ped.id, item: x.id, fase: 'criado', produtoCriado: novoId, codigo });
      if (!c.ok) throw new Error(nome + ' foi criado no catálogo (ID ' + novoId + '), mas não consegui registrar aqui. Toque em “Tentar de novo”: o catálogo reconhece este pedido e não cria outro.');
      novoId = String(c.produtoCriado || novoId); x.produto_criado = novoId;
    }
    aviso('Tirando do site (arquivando)…');
    const a = await apiPost(Object.assign(autenticacao(), { action: 'bulkUpdate', ids: [novoId], tipoAcao: 'arquivar', valor: true }));
    if (!a || !a.ok) throw new Error('Atenção: ' + nome + ' foi criado (ID ' + novoId + ') e pode estar aparecendo no site: o catálogo não aceitou arquivar (' + legivel(a && a.erro, 'sem resposta') + '). Toque em “Tentar de novo” ou arquive em Gestão.');
    aviso('Colocando em Preparação…');
    const z = await srv('/esteira/preparar', { id: novoId, nome: x.nome, codigo, foto: (x.fotos || [])[0] || '' });
    if (!z.ok) throw new Error(nome + ' foi criado e está fora do site, mas não entrou em Preparação: ' + (z.erro || 'tente de novo') + '.');
    const fim = await srv('/esteira/pedidos/aplicado', { id: ped.id, item: x.id });
    if (!fim.ok) throw new Error(nome + ' já está no catálogo e em Preparação, mas não consegui registrar aqui. Toque em “Tentar de novo”.');
    CATALOGO = null;
  }

      const opc = cats.slice(); if (fixas[e.whats] && !opc.includes(fixas[e.whats])) opc.push(fixas[e.whats]);
      opc.forEach((c) => { const o = el('option', '', c); o.value = c; if (fixas[e.whats] === c) o.selected = true; sx.append(o); });
      sx.onchange = () => { if (sx.value) fixas[e.whats] = sx.value; else delete fixas[e.whats]; };
      lb.append(sx); boxFx.append(lb);
    });
    if (!boxFx.childNodes.length) boxFx.append(el('p', 'muted', 'Ninguém está marcado para conferir peças.'));
    const deg = r.config.reativacao || [30, 60, 90], boxD = el('div', 'pesos');
    const [lD1, iD1] = num('Foto nova depois de (dias sem venda)', 'cfg-reat-1', deg[0], 1, 365), [lD2, iD2] = num('Vídeo curto e Postagens depois de (dias)', 'cfg-reat-2', deg[1], 1, 365), [lD3, iD3] = num('Promoção ou combinação depois de (dias)', 'cfg-reat-3', deg[2], 1, 365);
    const [lHr, iHr] = num('Retrato diário do estoque às (hora, Fortaleza)', 'cfg-retrato-hora', r.config.retratoHora == null ? 6 : r.config.retratoHora, 0, 23);
    boxD.append(lD1, lD2, lD3, lHr);
    const bFoco = el('button', 'bt prim', 'Salvar foco e reativação'); bFoco.type = 'button';
    bFoco.onclick = async () => { const y = await srv('/esteira/config', { config: { focoCategoria: cbF.checked, categoriasFixas: fixas, reativacao: [Number(iD1.value), Number(iD2.value), Number(iD3.value)], retratoHora: Number(iHr.value) } }); if (!y.ok) return aviso(cFoco, y.erro || 'Não consegui salvar.'); aviso(cFoco, 'Salvo. O foco vale para as próximas listas; os degraus valem no próximo retrato.', true); };
    cFoco.append(el('h3', '', 'Categoria fixa por pessoa'), boxFx, el('h3', '', 'Reativação de peças paradas'), el('p', 'muted', 'Sem venda = o estoque não caiu no retrato diário. O sistema cria as tarefas para Fotos e mostra as sugestões no Painel; nunca muda preço.'), boxD, bFoco);
    app.append(cEq, cHoje, cPad, cReg, cMod, cFoco);
  }

  /* ---------- início ---------- */
  async function iniciar() {
    if (!getSessao()) return telaLogin('');
    usuario = null; HOJE = null;
    await telaHoje();
  }
  window.addEventListener('pageshow', () => {});
  let larguraAbas = window.innerWidth; window.addEventListener('resize', () => { if ((window.innerWidth > 560) !== (larguraAbas > 560) && EU) desenharAbas(); larguraAbas = window.innerWidth; });
  iniciar();
})();
