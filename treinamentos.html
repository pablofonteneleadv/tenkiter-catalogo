function openManual(level){
  state.view = 'manual'; state.manual = level;
  render();
  empurrarHistorico('manual', level);
  setTimeout(function(){
    var first = document.querySelector('.chapter');
    if (first) first.scrollIntoView({block:'start'});
  }, 0);
}

function renderManual(level){
  var content = DATA.manuals[level];

  var navHtml = '';
  content.parts.forEach(function(part, pi){
    navHtml += '<div class="nav-part">' + esc(part.title) + '</div>';
    part.chapters.forEach(function(ch, ci){
      var st = chapterStatus(level, pi, ci, ch);
      navHtml += '<a class="nav-chapter' + (st.done?' done':'') + (st.stale?' stale':'') + '" href="#ch-' + st.chId + '" data-ch="' + st.chId + '"><span class="dot"></span>' + esc(ch.title) + (st.stale ? ' ⚠️' : '') + '</a>';
    });
  });

  var bodyHtml = '<div class="manual-title">' + esc(DATA.titles[level]) + '</div>' +
    '<p class="manual-sub">' + esc(DATA.blurbs[level]) + '</p>' +
    '<p class="sync-status" id="sync-status" role="status" hidden></p>';

  /* v3.17: lição com "Checagem:" não tem caixinha de "li" -- conclui quando a pessoa ACERTA tudo, e a lição seguinte só abre depois.
     Manual sem nenhuma checagem (os 3 antigos) segue exatamente como era: caixinha "Confirmo que li" e tudo aberto. */
  var plano = [];
  content.parts.forEach(function(part, pi){
    part.chapters.forEach(function(ch, ci){
      var st = chapterStatus(level, pi, ci, ch);
      var capKey = level + '|' + (ch.id || st.chId) + '|' + (ch.hash || '');
      var temChk = !!(window.TMV && TMV.temChecagem(ch.blocks));
      plano.push({ pi: pi, ci: ci, ch: ch, st: st, capKey: capKey, temChk: temChk,
        concl: st.done || (temChk && TMV.todasRespondidas(ch.blocks, capKey)) });
    });
  });
  var temPortao = plano.some(function(it){ return it.temChk; });
  var idxPlano = 0;
  content.parts.forEach(function(part, pi){
    bodyHtml += '<h2 class="part-heading">' + esc(part.title) + '</h2>';
    part.chapters.forEach(function(ch, ci){
      var it = plano[idxPlano++], st = it.st, capKey = it.capKey;
      var prox = plano[idxPlano] ? plano[idxPlano].st.chId : '';
      var rodape;
      if (it.temChk){
        rodape = '<div class="cap-status' + (it.concl ? ' ok' : '') + '" data-prox="' + esc(prox) + '" role="status">' +
          '<span class="cap-status-txt">' + (it.concl ? '✓ Lição concluída' : '👆 Responda a checagem rápida acima para concluir esta lição' + (prox ? ' e abrir a próxima' : '')) + '</span>' +
          (prox ? '<button type="button" class="cap-prox"' + (it.concl ? '' : ' hidden') + '>Próxima lição →</button>' : '') +
        '</div>';
      } else {
        rodape = '<label class="read-toggle-big' + (st.done?' done':'') + '">' +
          '<input type="checkbox" data-ch="' + st.chId + '" ' + (st.done?'checked':'') + '>' +
          '<span>' + (st.done ? '✓ Você confirmou que leu este capítulo' : 'Confirmo que li este capítulo') + '</span>' +
        '</label>';
      }
      var corpo = (st.stale ? '<div class="chapter-stale-alert">⚠️ Esse capítulo foi atualizado depois que você leu. ' + (it.temChk ? 'Leia de novo e responda a checagem para concluir.' : 'Dá uma olhada de novo e confirme a leitura.') + '</div>' : '') +
        renderBlocks(ch.blocks, capKey) + rodape;
      bodyHtml += '<div class="chapter' + (it.concl ? ' cap-ok' : '') + '" id="ch-' + st.chId + '" data-manual="' + esc(level) + '" data-capid="' + esc(ch.id || '') + '" data-caphash="' + esc(ch.hash || '') + '"' + (it.temChk ? ' data-chk="1"' : '') + '>' +
        '<div class="chapter-head"><h3>' + esc(ch.title) + '</h3></div>' +
        (temPortao ? '<div class="cap-trava" role="status"></div><div class="cap-corpo">' + corpo + '</div>' : corpo) +
      '</div>';
    });
  });

  if (content.glossary){
    bodyHtml += '<h2 class="part-heading">Glossário TENKiTER</h2><div class="table-wrap"><table>' +
      '<tr><th>Termo</th><th>Significado</th></tr>' +
      content.glossary.slice(1).map(function(row){ return '<tr><td>'+esc(row[0])+'</td><td>'+esc(row[1])+'</td></tr>'; }).join('') +
    '</table></div>';
  }

  if (DATA.quizzes[level] && temPerm('avaliacoes')){
    var prog = manualProgress(level);
    var liberado = prog.total > 0 && prog.done >= prog.total;
    bodyHtml += '<div class="quiz-cta' + (liberado ? '' : ' quiz-cta-locked') + '" id="quiz-cta">' +
      '<button type="button" class="btn btn-primary btn-lg" id="btn-ir-avaliacao"' + (liberado ? '' : ' disabled') + '>Fazer avaliação →</button>' +
      '<p class="quiz-cta-msg" id="quiz-cta-msg" style="display:' + (liberado ? 'none' : 'block') + '">⚠️ A avaliação libera só depois de confirmar a leitura de todos os capítulos deste manual.</p>' +
    '</div>';
  }

  if (window.TMV) bodyHtml += TMV.painelSlot(level);
  return '<button type="button" class="btn-toc-toggle" id="btn-toc-toggle">☰ Índice do manual</button>' +
    '<div class="sidebar" id="manual-sidebar">' + navHtml + '</div><div class="main">' + bodyHtml + '</div>';
}

function updateQuizCta(level){
  var cta = document.getElementById('quiz-cta');
  if (!cta) return;
  var prog = manualProgress(level);
  var liberado = prog.total > 0 && prog.done >= prog.total;
  cta.classList.toggle('quiz-cta-locked', !liberado);
  var btn = document.getElementById('btn-ir-avaliacao');
  if (btn) btn.disabled = !liberado;
  var msg = document.getElementById('quiz-cta-msg');
  if (msg) msg.style.display = liberado ? 'none' : 'block';
}

/** Marca (ou desmarca) um capítulo como lido: guarda no aparelho, atualiza índice/etiquetas/painel e avisa o servidor.
    Usado pela caixinha "Confirmo que li" e, nas lições com checagem, quando a pessoa acerta a última pergunta. */
function aplicarLeitura_(level, chapterEl, lido){
  if (!chapterEl) return;
  var chId = (chapterEl.id || '').replace(/^ch-/, '');
  var capId = chapterEl.getAttribute('data-capid') || '';
  var capHash = chapterEl.getAttribute('data-caphash') || '';
  if (capId && capHash){
    setStableChapterRead(capId, capHash, lido); // fonte da verdade: por id estável do capítulo
  } else {
    setChapterRead(chId, lido); // sem id/hash (não devia mais acontecer): só fallback por posição
  }
  var link = document.querySelector('.nav-chapter[data-ch="'+chId+'"]');
  if (link) link.classList.toggle('done', lido);
  chapterEl.classList.toggle('cap-ok', lido);
  var label = chapterEl.querySelector('.read-toggle-big');
  if (label){
    label.classList.toggle('done', lido);
    var cb = label.querySelector('input'); if (cb) cb.checked = lido;
    label.querySelector('span').textContent = lido ? '✓ Você confirmou que leu este capítulo' : 'Confirmo que li este capítulo';
  }
  var status = chapterEl.querySelector('.cap-status');
  if (status){
    status.classList.toggle('ok', lido);
    var prox = status.getAttribute('data-prox');
    status.querySelector('.cap-status-txt').textContent = lido ? '✓ Lição concluída' : '👆 Responda a checagem rápida acima para concluir esta lição' + (prox ? ' e abrir a próxima' : '');
    var bt = status.querySelector('.cap-prox'); if (bt) bt.hidden = !lido;
  }
  if (lido && link){
    link.classList.remove('stale');
    chapterEl.classList.remove('is-stale');
    var alerta = chapterEl.querySelector('.chapter-stale-alert');
    if (alerta) alerta.remove();
  }
  atualizarTravas_();
  updateQuizCta(level);
  // Sincroniza com o servidor só pra admin acompanhar à distância; nunca bloqueia nem
  // atrasa a experiência de quem está lendo -- se falhar, fica só no localStorage mesmo.
  if (capId && capHash){
    mostrarSync('salvando');
    submitResult({ action:'manual_marcar_lido', whatsapp: state.user.whatsapp, sessao: state.user.password,
      manualId: level, capId: capId, hash: capHash, lido: lido }).then(function(r){ mostrarSync(r && r.ok ? 'ok' : 'erro'); }).catch(function(){ mostrarSync('erro'); });
  }
}

/** Lição com checagem barra as seguintes: a lição só abre depois que a anterior (com checagem) foi concluída.
    Quem já concluiu uma lição não perde o acesso a ela; a gestão pode abrir mesmo assim (botão no aviso). */
function atualizarTravas_(){
  var caps = document.querySelectorAll('.chapter[data-manual]');
  if (!caps.length || !document.querySelector('.chapter .cap-corpo')) return;
  var gestao = temPerm('gerir_manuais');
  var bloqueador = null;
  caps.forEach(function(cap){
    var ok = cap.classList.contains('cap-ok');
    var travar = !!(bloqueador && !ok && cap.getAttribute('data-livre') !== '1');
    cap.classList.toggle('cap-travado', travar);
    var chId = (cap.id || '').replace(/^ch-/, '');
    var link = document.querySelector('.nav-chapter[data-ch="'+chId+'"]');
    if (link) link.classList.toggle('travado', travar);
    var faixa = cap.querySelector('.cap-trava');
    if (faixa){
      if (travar){
        var tit = bloqueador.querySelector('h3'); tit = tit ? tit.textContent : 'a lição anterior';
        faixa.innerHTML = '🔒 Esta lição abre quando você acertar a checagem rápida de <strong>' + esc(tit) + '</strong>.' +
          '<button type="button" data-ir="' + esc((bloqueador.id || '').replace(/^ch-/, '')) + '">Ir para essa lição</button>' +
          (gestao ? '<button type="button" data-livre="1">Abrir mesmo assim (só gestão)</button>' : '');
      } else if (faixa.innerHTML){ faixa.innerHTML = ''; }
    }
    if (cap.getAttribute('data-chk') === '1' && !ok && !bloqueador) bloqueador = cap;
  });
}

function wireManual(level){
  sincronizarProgressoLote(level);
  if (window.TMV){
    TMV.ligar(document, function(box){ // acertou uma checagem: se a lição toda foi respondida, ela está concluída
      var cap = box.closest('.chapter'); if (!cap) return;
      var ainda = cap.querySelectorAll('.tmv-chk .tmv-op.certa').length < cap.querySelectorAll('.tmv-chk').length;
      if (!ainda && !cap.classList.contains('cap-ok')) aplicarLeitura_(level, cap, true);
    });
    TMV.montarPainel(level);
  } // reenvia pro servidor qualquer leitura já confirmada localmente que ainda não tenha chegado lá
  document.querySelectorAll('.chapter[data-chk="1"]').forEach(function(cap){ // respondeu tudo antes (neste aparelho) mas a leitura não ficou registrada
    if (cap.classList.contains('cap-ok')) return;
    var n = cap.querySelectorAll('.tmv-chk').length;
    if (n && cap.querySelectorAll('.tmv-chk .tmv-op.certa').length === n) aplicarLeitura_(level, cap, true);
  });
  document.querySelectorAll('.chapter').forEach(function(cap){
    cap.addEventListener('click', function(ev){
      var t = ev.target.closest ? ev.target.closest('button') : null; if (!t) return;
      if (t.classList.contains('cap-prox')){
        var alvo = document.getElementById('ch-' + cap.querySelector('.cap-status').getAttribute('data-prox'));
        if (alvo) alvo.scrollIntoView({ block: 'start', behavior: 'smooth' });
      } else if (t.hasAttribute('data-ir')){
        var ir = document.getElementById('ch-' + t.getAttribute('data-ir'));
        if (ir) ir.scrollIntoView({ block: 'start', behavior: 'smooth' });
      } else if (t.getAttribute('data-livre') === '1'){
        cap.setAttribute('data-livre', '1'); atualizarTravas_();
      }
    });
  });
  atualizarTravas_();
  document.querySelectorAll('.read-toggle-big input').forEach(function(cb){
    cb.addEventListener('change', function(){
      aplicarLeitura_(level, cb.closest('.chapter'), cb.checked);
    });
  });
  var sidebar = document.getElementById('manual-sidebar');
  var tocBtn = document.getElementById('btn-toc-toggle');
  if (tocBtn && sidebar){
    tocBtn.addEventListener('click', function(){
      sidebar.classList.toggle('aberto');
    });
  }
  document.querySelectorAll('.nav-chapter').forEach(function(a){
    a.addEventListener('click', function(e){
      e.preventDefault();
      var target = document.getElementById('ch-' + a.getAttribute('data-ch'));
      if (target) target.scrollIntoView({block:'start', behavior:'smooth'});
      if (sidebar && window.innerWidth <= 860) sidebar.classList.remove('aberto');
    });
  });
  var btnAval = document.getElementById('btn-ir-avaliacao');
  if (btnAval) btnAval.addEventListener('click', function(){
    if (btnAval.disabled) return;
    openQuiz(level);
  });
}

/* ---------------- quiz view ---------------- */
/* v3.6 (backend RH 3.6): a CONTAGEM e o LIMITE de avaliações vêm do servidor (planilha) -- é a única fonte de verdade.
   Antes o contador morava no aparelho e podia discordar da planilha (tela "4 de 3" com 3 na planilha).
   Com backend antigo (sem `avaliacoes_contagem`) cai no contador do aparelho, como era. */
var MAX_TENTATIVAS_AVALIACAO = 3;
function tentativasKey(whatsapp, level){ return 'tm_tent_' + whatsapp + '_' + level; }
function maxTentativas(level){
  var t = state.quizTent;
  if (t && t.ok && t.maxPorManual && Number(t.maxPorManual[level])) return Number(t.maxPorManual[level]);
  var q = DATA.quizzes[level];
  return (q && Number(q.max)) || MAX_TENTATIVAS_AVALIACAO;
}
/** número de avaliações já feitas neste manual; null = ainda não deu para confirmar com o servidor */
function tentativasFeitas(level){
  var t = state.quizTent;
  if (t && t.ok){
    if (t.porId && t.porId[level] != null) return Number(t.porId[level]) || 0;
    return Number((t.contagem || {})[DATA.titles[level]]) || 0;
  }
  if (t && t.legado){ // backend antigo: só existe o contador do aparelho
    var n = Number(ls_get(tentativasKey(state.user.whatsapp, level), 0)) || 0;
    var last = ls_get(quizKey(state.user.whatsapp, level), null);
    return Math.max(n, last ? 1 : 0);
  }
  return null;
}
async function carregarTentativas(level){
  state.quizTent = null;
  var resp = await submitResult({ action: 'avaliacoes_contagem', whatsapp: state.user.whatsapp, sessao: state.user.password, senha: state.user.password });
  if (resp && resp.ok) state.quizTent = { ok: true, porId: resp.porId || {}, contagem: resp.contagem || {}, maxPorManual: resp.maxPorManual || {}, max: resp.max };
  else if (resp && /desconhecida/i.test(String(resp.erro || ''))) state.quizTent = { ok: false, legado: true };
  else state.quizTent = { ok: false, falhou: true };
  if (resp && resp.ok && resp.max) MAX_TENTATIVAS_AVALIACAO = Number(resp.max) || MAX_TENTATIVAS_AVALIACAO;
  if (state.view === 'quiz' && state.quizGate) render();
}
function novoIdTentativa_(){
  return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
function openQuiz(level){
  state.view = 'quiz'; state.manual = level; state.quizGate = true; state.quizTent = null; state.quizPicks = {};
  carregarTentativas(level);
  state.quizAttempt = buildQuizAttempt(level);
  render();
  empurrarHistorico('quiz', level);
  window.scrollTo(0,0);
}

function renderQuizGate(level){
  if (!state.quizTent){
    return '<div class="main" style="max-width:700px; margin:0 auto;"><button class="btn btn-ghost" id="back-to-manual">← Voltar ao manual</button>' +
      '<h1 class="manual-title" style="margin-top:16px">Antes de começar a avaliação</h1><p class="muted-note">Verificando suas avaliações…</p></div>';
  }
  var feitas = tentativasFeitas(level);
  if (feitas === null){
    return '<div class="main" style="max-width:700px; margin:0 auto;"><button class="btn btn-ghost" id="back-to-manual">← Voltar ao manual</button>' +
      '<h1 class="manual-title" style="margin-top:16px">Antes de começar a avaliação</h1>' +
      '<p class="muted-note">Não consegui confirmar quantas avaliações você já fez (sem conexão ou o servidor demorou). Para sua nota não se perder, a avaliação só começa com a conexão funcionando.</p>' +
      '<button type="button" class="btn btn-primary" id="gate-retry">Tentar de novo</button></div>';
  }
  var max = maxTentativas(level);
  var restam = Math.max(0, max - feitas);
  var last = ls_get(quizKey(state.user.whatsapp, level), null);
  var total = state.quizAttempt ? state.quizAttempt.questions.length : DATA.quizzes[level].questions.length;
  return '<div class="main" style="max-width:700px; margin:0 auto;">' +
    '<button class="btn btn-ghost" id="back-to-manual">← Voltar ao manual</button>' +
    '<h1 class="manual-title" style="margin-top:16px">Antes de começar a avaliação</h1>' +
    '<div class="quiz-gate" style="background:var(--accent-soft);border:2px solid var(--accent-2);border-radius:14px;padding:16px;margin:14px 0">' +
      '<p style="margin:0 0 6px"><b>Avaliações já feitas:</b> ' + Math.min(feitas, max) + ' de ' + max + '</p>' +
      '<p style="margin:0 0 6px"><b>Ainda restam:</b> ' + restam + '</p>' +
      '<p style="margin:0 0 6px"><b>Perguntas nesta avaliação:</b> ' + total + '</p>' +
      (last ? '<p style="margin:0">Sua última nota: ' + last.score + '/' + last.total + ' (' + last.date + ')</p>' : '') +
    '</div>' +
    '<p>Cada avaliação que você faz <b>fica salva</b> e mostra o seu <b>bom-senso</b> nas escolhas. Por isso, só comece quando puder <b>se concentrar</b>, sem estar atendendo cliente nem correndo.</p>' +
    (restam > 0
      ? '<label class="read-toggle-big"><input type="checkbox" id="gate-ok"><span>Confirmo que li o manual com atenção e que estou num momento tranquilo para fazer a avaliação</span></label>' +
        '<button type="button" class="btn btn-primary btn-lg" id="gate-start" disabled style="margin-top:12px">Começar avaliação →</button>'
      : '<p class="muted-note"><b>Você já usou as ' + max + ' avaliações.</b> Fale com a Karla ou com o Pablo para liberar uma nova.</p>') +
  '</div>';
}

function renderQuizIntro(level){
  if (!state.quizAttempt) state.quizAttempt = buildQuizAttempt(level);
  if (state.quizGate) return renderQuizGate(level);
  var quiz = state.quizAttempt;
  var pass = quizPassFor(level);
  var last = ls_get(quizKey(state.user.whatsapp, level), null);
  var picks = state.quizPicks || {};
  return '<div class="main" style="max-width:700px; margin:0 auto;">' +
    '<button class="btn btn-ghost" id="back-to-manual">← Voltar ao manual</button>' +
    '<h1 class="manual-title" style="margin-top:16px">' + esc(quiz.title) + '</h1>' +
    '<p class="manual-sub">' + quiz.questions.length + ' perguntas de múltipla escolha. Nota de aprovação: ' + Math.round(pass*100) + '%. Responda todas e toque em <b>Corrigir</b> no final.</p>' +
    (last ? '<p class="muted-note">Sua última tentativa: ' + last.score + '/' + last.total + ' (' + last.date + ')</p>' : '') +
    '<form id="quiz-form" novalidate>' +
      quiz.questions.map(function(q, qi){
        return '<div class="quiz-q" data-qi="' + qi + '">' +
          '<div class="qn">Pergunta ' + (qi+1) + (q.critica ? ' · <b>regra de ouro</b>' : '') + '</div>' +
          '<div class="qtext">' + esc(q.q) + '</div>' +
          q.options.map(function(opt, oi){
            return '<label class="opt"><input type="radio" name="q' + qi + '" value="' + oi + '"' + (picks[qi] === oi ? ' checked' : '') + '>' + esc(opt) + '</label>';
          }).join('') +
        '</div>';
      }).join('') +
      '<div id="quiz-aviso" class="quiz-aviso" role="alert" hidden></div>' +
      '<button type="submit" class="btn btn-primary" id="quiz-corrigir" style="margin-top:10px;">Corrigir</button>' +
    '</form>' +
    '<div id="quiz-result"></div>' +
  '</div>';
}

function wireQuizIntro(level){
  document.getElementById('back-to-manual').addEventListener('click', function(){ state.quizAttempt = null; state.quizGate = false; openManual(level); });
  if (state.quizGate){
    var rt = document.getElementById('gate-retry');
    if (rt){ rt.addEventListener('click', function(){ state.quizTent = null; render(); carregarTentativas(level); }); return; }
    if (!state.quizTent) return;
    var ok = document.getElementById('gate-ok'), go = document.getElementById('gate-start');
    if (ok && go){
      ok.addEventListener('change', function(){ go.disabled = !ok.checked; });
      go.addEventListener('click', function(){
        var f = tentativasFeitas(level);
        if (go.disabled || f === null || f >= maxTentativas(level)) return;
        state.quizGate = false; state.quizPicks = {}; render(); window.scrollTo(0,0);
      });
    }
    return;
  }
  var form = document.getElementById('quiz-form');
  // guarda cada resposta assim que é marcada: se a tela for redesenhada, nada se perde
  form.addEventListener('change', function(ev){
    var t = ev.target; if (!t || t.type !== 'radio') return;
    var qi = parseInt(String(t.name).slice(1), 10);
    state.quizPicks = state.quizPicks || {}; state.quizPicks[qi] = parseInt(t.value, 10);
    var q = form.querySelector('.quiz-q[data-qi="' + qi + '"]'); if (q) q.classList.remove('quiz-faltou');
    var av = document.getElementById('quiz-aviso'); if (av && !form.querySelector('.quiz-faltou')) av.hidden = true;
  });
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var quiz = state.quizAttempt; if (!quiz) return;
    var faltam = [];
    quiz.questions.forEach(function(q, qi){
      var qEl = form.querySelector('.quiz-q[data-qi="' + qi + '"]');
      var marcado = qEl && qEl.querySelector('input[name="q' + qi + '"]:checked');
      if (!marcado){ faltam.push(qi); if (qEl) qEl.classList.add('quiz-faltou'); }
    });
    if (faltam.length){
      // NÃO corrige e NÃO gasta avaliação: avisa e leva a pessoa até a primeira pergunta sem resposta
      var av = document.getElementById('quiz-aviso');
      if (av){ av.hidden = false; av.textContent = (faltam.length === 1 ? 'Falta responder 1 pergunta' : 'Faltam responder ' + faltam.length + ' perguntas') + ' (marcadas em laranja). Sua avaliação ainda não foi corrigida nem contada.'; }
      var primeira = form.querySelector('.quiz-q[data-qi="' + faltam[0] + '"]');
      if (primeira && primeira.scrollIntoView) primeira.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    var btn = document.getElementById('quiz-corrigir'); if (btn) btn.disabled = true; // toque duplo não corrige duas vezes
    gradeQuiz(level);
  });
}

function gradeQuiz(level){
  var quiz = state.quizAttempt || buildQuizAttempt(level);
  var score = 0;
  var erros = [];
  var criticasErradas = 0;
  quiz.questions.forEach(function(q, qi){
    var qEl = document.querySelector('.quiz-q[data-qi="'+qi+'"]');
    var picked = qEl.querySelector('input[name="q'+qi+'"]:checked');
    var pickedVal = picked ? parseInt(picked.value,10) : -1;
    qEl.classList.add('graded');
    qEl.querySelectorAll('.opt').forEach(function(optEl, oi){
      optEl.querySelectorAll('input').forEach(function(inp){ inp.disabled = true; });
      if (oi === q.correct) optEl.classList.add('correct-answer');
      else if (oi === pickedVal) optEl.classList.add('wrong-answer');
    });
    if (pickedVal === q.correct){ score++; }
    else { if (q.critica) criticasErradas++; erros.push({ pergunta: q.q, resposta: pickedVal >= 0 ? q.options[pickedVal] : '(em branco)', correta: q.options[q.correct] }); }
    var ex = document.createElement('div');
    ex.className = 'explain';
    ex.textContent = q.explain;
    qEl.appendChild(ex);
  });
  var total = quiz.questions.length;
  var pct = score/total;
  var passed = pct >= quizPassFor(level) && criticasErradas === 0; // pergunta da regra de ouro errada = não passa, mesmo com nota alta
  var date = new Date().toLocaleDateString('pt-BR');
  var tentId = quiz.id || novoIdTentativa_();
  state.quizAttempt = null; state.quizPicks = {};
  ls_set(quizKey(state.user.whatsapp, level), { score: score, total: total, date: date });
  if (state.quizTent && state.quizTent.legado) ls_set(tentativasKey(state.user.whatsapp, level), (tentativasFeitas(level) || 0) + 1);
  state.pendingSubmit = submitResult({ action:'resultado', nome: state.user.name, whatsapp: state.user.whatsapp, senha: state.user.password, nivel: state.user.level, manual: DATA.titles[level], manualId: String(level), tentativaId: tentId, nota: score, total: total, data: date, errosDetalhados: JSON.stringify(erros), criticasErradas: criticasErradas });
  state.pendingSubmit.then(function(r){
    if (!r) return;
    if (r.ok === false && r.erro) toast(r.erro);
    var infoEl = document.getElementById('quiz-tent-info');
    if (r.ok && r.tentativa != null){
      if (state.quizTent && state.quizTent.ok){ state.quizTent.porId = state.quizTent.porId || {}; state.quizTent.porId[level] = r.tentativa; }
      if (infoEl) infoEl.textContent = 'Esta foi a avaliação ' + Math.min(r.tentativa, r.max || r.tentativa) + ' de ' + (r.max || maxTentativas(level)) + '.';
      if (r.tentativa >= (r.max || maxTentativas(level))){ var rq = document.getElementById('retry-quiz'), sv = document.getElementById('qr-sem-vaga'); if (rq) rq.style.display = 'none'; if (sv) sv.style.display = 'block'; }
    } else if (r.ok === false && r.limite && infoEl){
      infoEl.textContent = 'Atenção: o limite de avaliações já tinha sido atingido, então esta NÃO foi contada nem salva.';
    } else if (r.ok === false && infoEl){
      infoEl.textContent = 'Não consegui salvar esta avaliação agora. Avise a gestão e mostre esta tela.';
    }
  });

  var waText = encodeURIComponent(state.user.name + ' concluiu a avaliação do ' + DATA.titles[level] + ': ' + score + '/' + total + ' (' + Math.round(pct*100) + '%) em ' + date + '.');
  var waHtml = '';
  if (PABLO_WHATSAPP){
    waHtml = '<a class="btn btn-primary" target="_blank" href="https://wa.me/' + PABLO_WHATSAPP + '?text=' + waText + '">Enviar resultado no WhatsApp</a>';
  }

  var nErros = erros.length;
  var msgNota = (criticasErradas > 0)
    ? '<p class="qr-nota"><b>Você errou ' + (criticasErradas === 1 ? 'uma pergunta' : criticasErradas + ' perguntas') + ' da regra de ouro</b> (marcadas na prova). Elas são a base do nosso atendimento: leia a explicação, releia a lição e refaça.</p>'
    : passed
    ? '<p class="qr-nota">' + (nErros ? 'Você errou ' + nErros + (nErros === 1 ? ' pergunta' : ' perguntas') + '. Veja a explicação de cada uma logo acima.' : 'Você acertou tudo. Parabéns pela atenção!') + '</p>'
    : '<p class="qr-nota">Você errou ' + nErros + (nErros === 1 ? ' pergunta' : ' perguntas') + '. Sem problema: veja a explicação de cada uma logo acima e releia o manual antes de tentar de novo.</p>';
  document.getElementById('quiz-result').innerHTML =
    '<div class="quiz-result">' +
      '<div class="score">' + score + '/' + total + '</div>' +
      '<div class="verdict" style="color:' + (passed ? 'var(--good-text)' : 'var(--danger)') + '">' + (passed ? 'Aprovado(a)!' : 'Ainda não foi dessa vez') + '</div>' +
      '<p class="muted-note" id="quiz-tent-info" role="status"></p>' +
      msgNota +
      '<div class="qr-importante">' +
        '<strong>O mais importante não é a nota.</strong>' +
        '<p>A prova só confere se você entendeu. O que faz diferença é <b>ler o manual várias vezes</b> e <b>fazer na loja, no dia a dia, o que você acertou aqui</b>. De nada adianta tirar 10 e, na hora de atender, fazer diferente.</p>' +
      '</div>' +
      '<div class="qr-passos">' +
        '<p class="qr-titulo">O que fazer agora</p>' +
        '<button type="button" class="btn btn-primary qr-grande" id="qr-reler">📖 Reler o manual</button>' +

        '<button type="button" class="btn qr-grande" id="retry-quiz">📝 Fazer outra avaliação</button>' +

/* ---- Aba 2: Raio-X de Desempenho ---- */
function desempEstado(){
  if (!state.desemp) state.desemp = { busca: '', ordem: 'nome', manual: '', agrupar: true, abertos: {} };
  return state.desemp;
}
function dsTxt(s){ return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function dsErros(r){
  var lista = [];
  try{ lista = JSON.parse(r.errosDetalhados || '[]'); }catch(e){}
  return Array.isArray(lista) ? lista.filter(function(x){ return x && x.pergunta; }) : [];
}
function dsDataFmt(r){
  var d = r.dataHora ? new Date(r.dataHora) : null;
  return d && !isNaN(d) ? d.toLocaleString('pt-BR') : '—';
}
function dsTempo(r){ var d = r.dataHora ? new Date(r.dataHora) : null; return d && !isNaN(d) ? d.getTime() : 0; }
function dsChave(r){ var w = normWhats(r.whatsapp); return w || ('nome:' + dsTxt(r.nome)); }
function dsTentativaHtml(r, comNome){
  var pct = Number(r.percentual) || 0, passou = pct >= 70, erros = dsErros(r);
  var errosHtml = '';
  if (erros.length){
    errosHtml = '<details class="ds-erros"><summary>Ver ' + erros.length + ' erro' + (erros.length > 1 ? 's' : '') + '</summary>' +
      erros.map(function(e){
        return '<div class="ds-erro"><div class="ds-q">' + esc(e.pergunta) + '</div>' +
          '<div class="ds-resp">Respondeu: <strong>' + esc(e.resposta || '(em branco)') + '</strong></div>' +
          (e.correta ? '<div class="ds-certa">Certa: ' + esc(e.correta) + '</div>' : '') + '</div>';
      }).join('') + '</details>';
  } else if (Number(r.nota) === Number(r.total) && Number(r.total) > 0){
    errosHtml = '<div class="ds-ok">Gabaritou 🎯</div>';
  }
  var lixeira = (r.dataHora && temPerm('gerir_acessos'))
    ? '<button type="button" class="ds-del" title="Excluir esta avaliação" aria-label="Excluir esta avaliação" data-linha="' + esc(r.linha) + '" data-dh="' + esc(r.dataHora) + '" data-whats="' + esc(normWhats(r.whatsapp)) + '" data-nome="' + esc(r.nome || '') + '">✕</button>' : '';
  return '<div class="ds-tent">' + lixeira +
    '<div class="ds-tent-top">' +
      (comNome ? '<div class="ds-nome"><strong>' + esc(r.nome || '(sem nome)') + '</strong> <span class="ds-whats">' + esc(normWhats(r.whatsapp)) + '</span></div>' : '') +
      '<div class="ds-meta"><span>' + esc(dsDataFmt(r)) + '</span> · <span>' + esc(r.manual || '') + '</span></div>' +
      '<div class="ds-nota"><strong>' + esc(r.nota) + '/' + esc(r.total) + '</strong> · ' + pct + '% <span class="' + (passou ? 'badge-aprovado' : 'badge-reprovado') + '">' + (passou ? 'Aprovado' : 'Reprovado') + '</span></div>' +
    '</div>' + errosHtml + '</div>';
}
function dsFiltrados(){
  var e = desempEstado(), q = dsTxt(e.busca), d = String(e.busca || '').replace(/\D/g, '');
  var lista = state.adminData.resultados.filter(function(r){
    if (e.manual && String(r.manual || '') !== e.manual) return false;
    if (!q) return true;
    return dsTxt(r.nome).indexOf(q) !== -1 || (d && normWhats(r.whatsapp).indexOf(d) !== -1);
  });
  return lista;
}
function dsListaHtml(){
  var e = desempEstado(), lista = dsFiltrados();
  if (!lista.length) return '<p class="sub">Nenhuma avaliação encontrada.</p>';
  function porData(a, b){ return dsTempo(b) - dsTempo(a); }
  if (!e.agrupar){
    var flat = lista.slice();
    if (e.ordem === 'nome') flat.sort(function(a, b){ return dsTxt(a.nome).localeCompare(dsTxt(b.nome)) || porData(a, b); });
    else if (e.ordem === 'maior') flat.sort(function(a, b){ return (Number(b.percentual) || 0) - (Number(a.percentual) || 0); });
    else if (e.ordem === 'menor') flat.sort(function(a, b){ return (Number(a.percentual) || 0) - (Number(b.percentual) || 0); });
    else flat.sort(porData);
    return flat.map(function(r){ return dsTentativaHtml(r, true); }).join('');
  }
  var grupos = {}, ordemChaves = [];
  lista.forEach(function(r){
    var k = dsChave(r);
    if (!grupos[k]) { grupos[k] = { chave: k, nome: r.nome || '(sem nome)', whatsapp: normWhats(r.whatsapp), tentativas: [] }; ordemChaves.push(k); }
    grupos[k].tentativas.push(r);
    if (r.nome) grupos[k].nome = r.nome;
  });
  var gs = ordemChaves.map(function(k){
    var g = grupos[k]; g.tentativas.sort(porData);
    g.ultima = g.tentativas[0];
    g.melhor = g.tentativas.reduce(function(m, t){ return Math.max(m, Number(t.percentual) || 0); }, 0);
    g.erros = g.tentativas.reduce(function(m, t){ return m + dsErros(t).length; }, 0);
    return g;
  });
  if (e.ordem === 'nome') gs.sort(function(a, b){ return dsTxt(a.nome).localeCompare(dsTxt(b.nome)); });
  else if (e.ordem === 'maior') gs.sort(function(a, b){ return b.melhor - a.melhor; });
  else if (e.ordem === 'menor') gs.sort(function(a, b){ return a.melhor - b.melhor; });
  else gs.sort(function(a, b){ return dsTempo(b.ultima) - dsTempo(a.ultima); });
  return gs.map(function(g){
    var aberto = !!e.abertos[g.chave];
    return '<details class="ds-grupo" data-chave="' + esc(g.chave) + '"' + (aberto ? ' open' : '') + '>' +
      '<summary><span class="ds-nome"><strong>' + esc(g.nome) + '</strong> <span class="ds-whats">' + esc(g.whatsapp) + '</span></span>' +
      '<span class="ds-resumo">' + g.tentativas.length + ' prova' + (g.tentativas.length > 1 ? 's' : '') + ' · melhor ' + g.melhor + '%' + (g.erros ? ' · ' + g.erros + ' erro' + (g.erros > 1 ? 's' : '') : '') + '</span></summary>' +
      g.tentativas.map(function(t){ return dsTentativaHtml(t, false); }).join('') +
      (temPerm('gerir_acessos') && g.whatsapp ? '<button type="button" class="btn ds-zerar" data-whats="' + esc(g.whatsapp) + '" data-nome="' + esc(g.nome) + '">♻️ Zerar leitura / avaliações desta pessoa…</button>' : '') +
    '</details>';
  }).join('');
}
function renderTabDesempenho(){
  var e = desempEstado();
  var resultados = state.adminData.resultados;
  var manuais = []; resultados.forEach(function(r){ var m = String(r.manual || ''); if (m && manuais.indexOf(m) === -1) manuais.push(m); });

      '<select id="ds-ordem" class="admin-sel" aria-label="Ordenar">' +
        '<option value="nome"' + (e.ordem === 'nome' ? ' selected' : '') + '>Ordem: nome (A–Z)</option>' +
        '<option value="recente"' + (e.ordem === 'recente' ? ' selected' : '') + '>Ordem: mais recentes</option>' +
        '<option value="maior"' + (e.ordem === 'maior' ? ' selected' : '') + '>Ordem: maior nota</option>' +
        '<option value="menor"' + (e.ordem === 'menor' ? ' selected' : '') + '>Ordem: menor nota</option>' +
      '</select>' +
      '<select id="ds-manual" class="admin-sel" aria-label="Manual"><option value="">Todos os manuais</option>' +
        manuais.map(function(m){ return '<option value="' + esc(m) + '"' + (e.manual === m ? ' selected' : '') + '>' + esc(m) + '</option>'; }).join('') + '</select>' +
      '<label class="ac-check"><input type="checkbox" id="ds-agrupar"' + (e.agrupar ? ' checked' : '') + '> Agrupar por pessoa</label>' +
    '</div>' +
    '<div id="ds-lista">' + dsListaHtml() + '</div>' +
    '<div class="admin-gaps"><h2>📊 Análise de gaps de conhecimento</h2>' +
      '<p class="sub">Perguntas em que a equipe mais erra -- use como pauta de reforço presencial.</p>' +
      gapsHtml +
    '</div>' +
  '</div>';
}

    par('Relaxa: errar faz parte de aprender.', [P('Relaxa: errar faz parte de aprender.')]) +

    par('Dica: pergunte o tamanho antes de buscar a peça.', [P('Dica: pergunte o tamanho antes de buscar a peça.')]) +

function wireTabConteudo(){

  if (servidorProtegido && conteudoEstado !== 'ok' && !state._buscandoConteudo){
    state._buscandoConteudo = true;

  }
  var importar = document.getElementById('btn-importar-manual');
  if (importar) importar.addEventListener('click', async function(){
    var campo = document.getElementById('manual-doc-existente');
    var docUrl = campo && campo.value.trim();
    if (!/^https:\/\/docs\.google\.com\/document\/d\/[A-Za-z0-9_-]+(?:\/|$)/.test(docUrl || '')) { toast('Cole o link completo de um Google Doc.'); if (campo) campo.focus(); return; }
    importar.disabled = true; importar.textContent = 'Importando…';
    var resp;

    catch (e) { resp = null; }

    if (!resp || !resp.ok) { toast((resp && resp.erro) || 'Não consegui importar este Doc agora.'); return; }
    await recarregarManuais_(); render();
    toast('Manual importado para revisão da gestão. Confira antes de liberar à equipe.');
  });
  if (window.TMV){ var gf = document.getElementById('guia-formatar'); if (gf) TMV.ligar(gf); }
  document.querySelectorAll('details.manual-card').forEach(function(d){
    d.addEventListener('toggle', function(){ state.cardsAbertos = state.cardsAbertos || {}; state.cardsAbertos[d.getAttribute('data-manual-id')] = d.open; });
  });
  var salvarOrdem_ = async function(){
    var ids = Array.prototype.map.call(document.querySelectorAll('#mc-lista details.manual-card'), function(c){ return c.getAttribute('data-manual-id'); });
    var antes = (state.manuaisList || []).map(function(m){ return m.id; });
    var porId = {}; (state.manuaisList || []).forEach(function(m){ porId[m.id] = m; });
    var falhou = false, mudou = 0;
    for (var i = 0; i < ids.length; i++){
      var m = porId[ids[i]];
      if (!m || m.semente) continue;
      if (antes.indexOf(ids[i]) === i && m.ordem === i + 1) continue;
      mudou++;
      var r = await submitResult({ action:'atualizar_manual_config', whatsappAdmin: state.user.whatsapp, senhaAdmin: state.user.password,
        manualId: ids[i], titulo: m.titulo, blurb: m.blurb || '', nivelMinimo: m.nivelMinimo, ordem: i + 1 });
      if (!r || !r.ok){ falhou = true; toast((r && r.erro) || 'Não foi possível salvar a ordem.'); break; }
    }
    await recarregarManuais_();
    if (!falhou && mudou) toast('Ordem salva. É essa que o candidato vê.');
    render();
  };
  var lista_ = document.getElementById('mc-lista');
  if (lista_){
    lista_.querySelectorAll('.mc-sobe, .mc-desce').forEach(function(b){
      b.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        var c = b.closest('details.manual-card');
        var alvo = b.classList.contains('mc-sobe') ? c.previousElementSibling : c.nextElementSibling;
        if (!alvo) return;
        if (b.classList.contains('mc-sobe')) lista_.insertBefore(c, alvo); else lista_.insertBefore(alvo, c);
        salvarOrdem_();
      });
    });
    lista_.querySelectorAll('.mc-alca:not([disabled])').forEach(function(h){
      h.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); });
      h.addEventListener('pointerdown', function(e){
        e.preventDefault();
        var c = h.closest('details.manual-card');
        c.classList.add('mc-arrastando');
        try{ h.setPointerCapture(e.pointerId); }catch(_){}
        var mexeu = false;
        var mover = function(ev){
          mexeu = true;
          var irmaos = Array.prototype.filter.call(lista_.children, function(x){ return x !== c; });
          var alvo = null;
          for (var i = 0; i < irmaos.length; i++){
            var r = irmaos[i].getBoundingClientRect();
            if (ev.clientY < r.top + r.height / 2){ alvo = irmaos[i]; break; }
          }
          if (alvo) lista_.insertBefore(c, alvo); else lista_.appendChild(c);
        };
        var fim = function(){
          h.removeEventListener('pointermove', mover); h.removeEventListener('pointerup', fim); h.removeEventListener('pointercancel', fim);
          c.classList.remove('mc-arrastando');
          if (mexeu) salvarOrdem_();
        };
        h.addEventListener('pointermove', mover); h.addEventListener('pointerup', fim); h.addEventListener('pointercancel', fim);
      });
    });
  }

  var btnCfg = document.getElementById('btn-salvar-config');

      });

function permObj(x){

function acessosEstado(){
  if (!state.acessos) state.acessos = { pessoas: [], perfis: [], permissoes: [], busca: '', ordem: 'nome', fCv: 'todos', filtro: null, contagem: {}, truncado: false, abertos: {}, carregado: false, erro: '', totalClientes: 0, criando: false, log: null, eu: '' };

      return dx === dy ? nome(x, y) : (dx < dy ? dir : -dir);

function renderTabAcessos(){
  var a = acessosEstado();
  var perfOpts = a.perfis.map(function(x){ return '<option value="' + esc(x.nome) + '">' + esc(x.nome) + '</option>'; }).join('');
  var dicas = a.perfis.length ? ('<details class="ac-dicas"><summary>O que cada perfil libera</summary>' + a.perfis.map(function(x){ return '<p><strong>' + esc(x.nome) + '</strong> — ' + esc(x.desc || '') + '</p>'; }).join('') + '</details>') : '';
  return '<div class="admin-panel">' +
    '<details class="ajuda-rh"><summary>Como funciona? (toque para ver)</summary><p class="sub">Escolha um <strong>perfil</strong> para marcar as permissões padrão. Depois, dentro de <em>Permissões</em>, marque ou desmarque o que quiser para aquela pessoa (✱ = diferente do padrão do perfil). Vale na hora, no portal e no catálogo.</p></details>' + dicas +
    '<div class="admin-toolbar">' +
      '<input type="search" id="ac-busca" placeholder="Buscar por nome ou WhatsApp" value="' + esc(a.busca) + '" class="ac-busca">' +
      '<span><button type="button" class="admin-mini-btn" id="ac-nova">+ Nova pessoa</button><button type="button" class="admin-mini-btn" id="ac-log">Histórico</button><button type="button" class="admin-mini-btn" id="ac-recarregar">↻ Atualizar</button></span>' +
    '</div>' +
    '<div class="ac-filtro" id="ac-filtro">' + filtroAcessosHtml() + '</div>' +
    '<div class="ac-ordem"><label>Ordenar: <select id="ac-ordem" class="admin-sel"><option value="nome"' + (a.ordem === 'nome' ? ' selected' : '') + '>Nome (A–Z)</option><option value="novos"' + (a.ordem === 'novos' ? ' selected' : '') + '>Cadastro: mais recentes</option><option value="antigos"' + (a.ordem === 'antigos' ? ' selected' : '') + '>Cadastro: mais antigos</option></select></label> ' +
      '<label>Currículo: <select id="ac-fcv" class="admin-sel"><option value="todos"' + (a.fCv === 'todos' ? ' selected' : '') + '>Todos</option><option value="com"' + (a.fCv === 'com' ? ' selected' : '') + '>Só quem já fez</option><option value="andamento"' + (a.fCv === 'andamento' ? ' selected' : '') + '>Só em andamento</option><option value="sem"' + (a.fCv === 'sem' ? ' selected' : '') + '>Só quem não fez</option></select></label></div>' +
    '<div class="ac-form" id="ac-form-nova"' + (a.criando ? '' : ' hidden') + '>' +
      '<input id="ac-n-nome" placeholder="Nome"><input id="ac-n-whats" placeholder="WhatsApp com DDD" inputmode="tel"><input id="ac-n-senha" placeholder="Senha (mín. 4)">' +
      '<select id="ac-n-perfil" class="admin-sel">' + perfOpts + '</select>' +
      '<button type="button" class="admin-mini-btn" id="ac-n-salvar">Criar</button>' +
    '</div>' +
    '<div id="ac-log-box"></div>' +
    '<div id="acessos-lista">' + acessosListaHtml() + '</div>' +
  '</div>';
}
function wireTabAcessos(){
  var a = acessosEstado();
  if (!a.carregado && !a._carregando){ a._carregando = true; carregarAcessos().then(function(){ a._carregando = false; }); }
  var busca = document.getElementById('ac-busca'), timer = null;
  if (busca) busca.addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(function(){ a.busca = busca.value.trim(); pintarAcessos(); }, 60);
  });
  var ordSel = document.getElementById('ac-ordem'), fcvSel = document.getElementById('ac-fcv');
  if (ordSel) ordSel.addEventListener('change', function(){ a.ordem = ordSel.value; pintarAcessos(); });
  if (fcvSel) fcvSel.addEventListener('change', function(){ a.fCv = fcvSel.value; pintarAcessos(); });
  var fil = document.getElementById('ac-filtro'), timerFiltro = null;
  function recarregarFiltro(){ pintarFiltroAcessos(); pintarAcessos(); }
  if (fil){
    fil.addEventListener('change', function(e){
      var c = e.target; if (!c || !c.getAttribute || c.getAttribute('data-perfil') === null) return;
      a.filtro = a.filtro || {}; a.filtro[c.getAttribute('data-perfil')] = c.checked; recarregarFiltro();
    });
    fil.addEventListener('click', function(e){
      var id = e.target && e.target.id; if (id !== 'ac-todos' && id !== 'ac-nenhum') return;
      a.filtro = a.filtro || {}; a.perfis.forEach(function(x){ a.filtro[x.nome] = (id === 'ac-todos'); });
      recarregarFiltro();
    });
  }
  var nova = document.getElementById('ac-nova');
  if (nova) nova.addEventListener('click', function(){ a.criando = !a.criando; pintarAcessos(); });
  var salvar = document.getElementById('ac-n-salvar');
  if (salvar) salvar.addEventListener('click', async function(){
    var nome = document.getElementById('ac-n-nome').value.trim(), w = normWhats(document.getElementById('ac-n-whats').value),
        senha = document.getElementById('ac-n-senha').value, perfil = document.getElementById('ac-n-perfil').value;
    if (!nome || !w || senha.length < 4){ toast('Preencha nome, WhatsApp e uma senha de pelo menos 4 caracteres.'); return; }
    salvar.disabled = true;
    var r = await acessosReq({ action: 'acessos_criar', nome: nome, whatsappNovo: w, senhaNova: senha, perfil: perfil });
    salvar.disabled = false;
    if (!r || !r.ok){ toast((r && r.erro) || 'Não foi possível criar.'); return; }
    toast('Pessoa criada. Passe a senha para ela.');
    a.criando = false; ['ac-n-nome', 'ac-n-whats', 'ac-n-senha'].forEach(function(i){ document.getElementById(i).value = ''; });
    await carregarAcessos();
  });
  var recarregar = document.getElementById('ac-recarregar');
  if (recarregar) recarregar.addEventListener('click', async function(){ recarregar.disabled = true; await carregarAcessos(); recarregar.disabled = false; toast('Lista atualizada.'); });
  var logBtn = document.getElementById('ac-log');
  if (logBtn) logBtn.addEventListener('click', async function(){
    var box = document.getElementById('ac-log-box');
    if (box.innerHTML){ box.innerHTML = ''; return; }
    box.innerHTML = '<p class="sub">Carregando histórico...</p>';
    var r = await acessosReq({ action: 'acessos_log', limite: 60 });
    if (!r || !r.ok){ box.innerHTML = '<p class="sub">Não foi possível carregar.</p>'; return; }
    box.innerHTML = '<div class="ac-logbox">' + (r.registros.length ? r.registros.map(function(x){
      var d = new Date(x.dataHora); var quando = isNaN(d) ? esc(x.dataHora) : d.toLocaleString('pt-BR');
      return '<div>' + quando + ' — <strong>' + esc(x.quem) + '</strong> · ' + esc(x.acao) + ' · ' + esc(x.alvo) + (x.detalhe ? ' · ' + esc(x.detalhe) : '') + '</div>';
    }).join('') : '<div>Nada registrado ainda.</div>') + '</div>';
  });
  var lista = document.getElementById('acessos-lista');
  if (!lista) return;
  function pessoaDe(el){
    var card = el.closest('.ac-card'); if (!card) return null;
    var w = card.getAttribute('data-whats');
    return a.pessoas.filter(function(p){ return p.whatsapp === w; })[0] || null;
  }
  async function refrescarMinhas(){
    var r = await submitResult({ action: 'sessao', whatsapp: state.user.whatsapp, sessao: state.user.password });
    if (r && r.ok && r.usuario){
      state.user.perms = Array.isArray(r.usuario.permissoes) ? r.usuario.permissoes : state.user.perms;
      state.user.perfil = r.usuario.perfil || state.user.perfil;
      state.user.level = r.usuario.level || state.user.level;
      if (!temGestao()){ goHome(); } else if (state.view === 'admin') { render(); }
    }
  }
  lista.addEventListener('click', async function(e){
    var p = pessoaDe(e.target); if (!p) return;
    var btn = e.target.closest('button'); if (!btn) return;
    if (btn.classList.contains('ac-vercv')){ state.cvAbrir = p.whatsapp; state.cvAbrirAntigo = false; state.adminTab = 'curriculos'; render(); return; }
    if (btn.classList.contains('ac-vercvantigo')){ state.cvAbrir = p.whatsapp; state.cvAbrirAntigo = true; state.adminTab = 'curriculos'; render(); return; }
    if (btn.classList.contains('ac-zerar')){ abrirZerarPessoa(p.whatsapp, p.nome); return; }
    if (btn.classList.contains('ac-corpo')){ abrirFotoGrande(p.fotoCorpoUrl, p.nome + ' — corpo inteiro', p.whatsapp); return; }
    if (btn.classList.contains('ac-excluir')){
      if (!confirm('Excluir definitivamente ' + p.nome + ' (' + p.whatsapp + ')? Isso apaga o cadastro da pessoa e não pode ser desfeito.')) return;
      if (!confirm('Tem certeza mesmo? Não tem como voltar atrás depois disso.')) return;
      btn.disabled = true;
      var rex = await acessosReq({ action: 'acessos_excluir', whatsappAlvo: p.whatsapp });
      if (!rex || !rex.ok){ btn.disabled = false; toast((rex && rex.erro) || 'Não foi possível excluir.'); return; }
      toast('Pessoa excluída.');
      await carregarAcessos();
      return;
    }
    if (btn.classList.contains('ac-abrir')){ a.abertos[p.whatsapp] = !a.abertos[p.whatsapp]; pintarAcessos(); return; }
    if (btn.classList.contains('ac-status')){
      var ativoAgora = btn.getAttribute('data-ativo') === '1';
      if (ativoAgora && !confirm('Desativar ' + p.nome + '? A pessoa perde o acesso a tudo até ser reativada.')) return;
      var r = await acessosReq({ action: 'acessos_status', whatsappAlvo: p.whatsapp, novoStatus: ativoAgora ? 'Inativo' : 'Ativo' });
      if (!r || !r.ok){ toast((r && r.erro) || 'Não foi possível alterar.'); return; }
      toast(ativoAgora ? 'Pessoa desativada.' : 'Pessoa reativada.'); carregarAcessos(); return;
    }
    if (btn.classList.contains('ac-reset')){
      var nova = prompt('Nova senha para ' + p.nome + ' (mínimo 4 caracteres):');
      if (nova === null) return;
      if (nova.length < 4){ toast('A senha precisa ter pelo menos 4 caracteres.'); return; }
      var r2 = await acessosReq({ action: 'resetar_senha_user', whatsappAlvo: p.whatsapp, novaSenha: nova });
      toast(r2 && r2.ok ? 'Senha redefinida.' : ((r2 && r2.erro) || 'Não foi possível resetar.'));
    }
  });
  lista.addEventListener('change', async function(e){
    var p = pessoaDe(e.target); if (!p) return;
    if (e.target.hasAttribute && e.target.hasAttribute('data-perfil-set')){
      var card = e.target.closest('.ac-card');
      var marcados = Array.prototype.slice.call(card.querySelectorAll('input[data-perfil-set]:checked')).map(function(c){ return c.getAttribute('data-perfil-set'); });
      var outros = marcados.filter(function(n){ return String(n).toLowerCase() !== 'cliente'; });
      var perfisNovos = outros.length ? outros : ['Cliente'];
      var meusAgora = perfisDe(p), conhecAgora = a.perfis.filter(function(x){ return meusAgora.indexOf(x.nome) !== -1; });
      var baseAgora = conhecAgora.length ? baseDosPerfis(conhecAgora) : null, mineAgora = permObj(p.permissoes);
      var temAjuste = baseAgora && a.permissoes.some(function(x){ return !!mineAgora[x.chave] !== !!baseAgora[x.chave]; });
      if (temAjuste && !confirm('Mudar os perfis de ' + p.nome + '? As permissões voltam a ser a soma dos perfis marcados (os ajustes individuais serão perdidos).')){ pintarAcessos(); return; }
      var req = { action: 'acessos_perfil', whatsappAlvo: p.whatsapp, perfis: perfisNovos };
      if (perfisNovos.length === 1) req.perfil = perfisNovos[0];   // backend antigo (só um perfil) ainda entende
      var r = await acessosReq(req);
      if (!r || !r.ok){
        var msg = (r && r.erro) || 'Não foi possível trocar os perfis.';
        if (perfisNovos.length > 1 && /desconhecido/i.test(msg)) msg = 'Para dar mais de um perfil, o backend de Funcionários precisa estar na versão 3.2 (cole o arquivo novo no Apps Script).';
        toast(msg); pintarAcessos(); return;
      }
      toast('Perfis atualizados — permissões somadas automaticamente.');
      await carregarAcessos();
      if (p.whatsapp === state.user.whatsapp) refrescarMinhas();
      return;
    }
    if (e.target.matches('input[type=checkbox][data-chave]')){
      var chave = e.target.getAttribute('data-chave'), marcado = e.target.checked;
      if (chave === 'gerir_acessos' && !marcado && p.whatsapp === state.user.whatsapp && !confirm('Você vai tirar de você mesmo o acesso a este painel. Continuar?')){ e.target.checked = true; return; }
      var r3 = await acessosReq({ action: 'acessos_permissao', whatsappAlvo: p.whatsapp, chave: chave, valor: marcado });
      if (!r3 || !r3.ok){ toast((r3 && r3.erro) || 'Não foi possível alterar.'); e.target.checked = !marcado; return; }
      var o = permObj(p.permissoes); o[chave] = marcado; p.permissoes = o;
      pintarAcessos();
      if (p.whatsapp === state.user.whatsapp) refrescarMinhas();
    }
  });
}

/* ---------------- barra inferior (nav.js) ---------------- */
var CHAVES_NAV = ['portal','catalogo_admin','equipe_relatorio','gerir_manuais','gerir_acessos','dados_pessoais'];
function sincNav(){
  if (!window.TenkiterNav) return;
  TenkiterNav.setPerms(state.user ? CHAVES_NAV.filter(temPerm) : []);
  TenkiterNav.ativo(state.view === 'admin' ? 'rh' : 'treinamentos');
}

/* ---------------- root render ---------------- */
function render(){
  sincNav();
  if (state.view === 'login' || !state.user){ renderLogin(); return; }
  if (state.view === 'home'){ goHome(); return; }
  if (!temPerm('portal') && state.view !== 'semacesso'){ renderSemAcesso(); return; }
  var app = document.getElementById('app');
  if (state.view === 'semacesso'){ renderSemAcesso(); return; }
  if (state.view === 'manual'){
    app.innerHTML = renderTopbar() + '<div class="shell">' + renderManual(state.manual) + '</div>';
    wireTopbar();
    wireManual(state.manual);
  } else if (state.view === 'quiz'){
    app.innerHTML = renderTopbar() + '<div class="shell">' + renderQuizIntro(state.manual) + '</div>';
    wireTopbar();
    wireQuizIntro(state.manual);
  } else if (state.view === 'admin'){
    if (!temGestao()){ goHome(); return; }
    app.innerHTML = renderTopbar() + renderAdminPanel();
    wireTopbar();
    wireAdminPanel();
  } else if (state.view === 'perfil'){
    app.innerHTML = renderTopbar() + renderPerfil();
    wireTopbar();
    wirePerfil();
  }
}

/* Servidor lento ou sem internet na abertura: tenta de novo sozinho e, se não der, mostra uma tela com botão — NUNCA joga a pessoa no login por causa disso. */
async function tentarSessaoDeNovo_(){
  for (var i = 0; i < 2; i++){
    var app0 = document.getElementById('app'); if (app0 && i === 0) app0.setAttribute('aria-busy', 'true');
    await new Promise(function(r){ setTimeout(r, 1500 + i * 2500); });
    var r = await restaurarSessaoServidor(null);
    if (r !== 'rede') return r;
  }
  return 'rede';
}
function telaSemConexao_(){
  var app0 = document.getElementById('app'); if (!app0) return; app0.removeAttribute('aria-busy');
  app0.innerHTML = '<div style="max-width:420px;margin:64px auto;padding:0 20px;text-align:center"><h2 style="margin:0 0 8px">O servidor está demorando</h2>'
    + '<p style="color:#555">Sua sessão continua guardada, você <b>não saiu da conta</b>. Pode ser a internet ou o servidor ocupado.</p>'
    + '<button id="tm-retentar" style="margin-top:12px;padding:14px 20px;border-radius:12px;border:0;background:#E67E22;color:#0d0d0d;font-weight:800;font-size:1rem;width:100%">Tentar de novo</button>'
    + '<button id="tm-outra" style="margin-top:10px;padding:12px;border-radius:12px;border:1px solid #bbb;background:#fff;width:100%">Entrar com outra conta</button></div>';
  document.getElementById('tm-retentar').onclick = async function(){
    this.disabled = true; this.textContent = 'Tentando…';
    var r = await restaurarSessaoServidor(null);
    if (r === 'rede') return telaSemConexao_();
    if (r){ if (/[?&]painel=rh\b/.test(location.search) && temGestao()) openAdminPanel(); else goHome(); } else renderLogin();
  };
  document.getElementById('tm-outra').onclick = function(){ renderLogin(); };
}

/* ---------------- boot ---------------- */
(async function boot(){
  // v3.1: tudo que não depende de nada sai ao mesmo tempo; o que já foi visto neste aparelho aparece na hora.
  var temCacheManuais = carregarManuaisDoCache();
  var sess0 = ls_get('tm_session', null);
  var pSessao = (sess0 && sess0.whatsapp && sess0.sessao) ? submitResult({ action:'sessao', whatsapp: sess0.whatsapp, sessao: sess0.sessao }) : null; // junto com a checagem do servidor
  if (sess0 && sess0.whatsapp && sess0.sessao) conteudoAdiantado = submitResult({ action:'treinamento_conteudo', whatsapp: sess0.whatsapp, sessao: sess0.sessao }).catch(function(){ return null; });
  var pManuais = loadManuaisList();
  loadQuizConfig(); // só é preciso na hora da prova: não segura a abertura da página
  await garantirDeteccao();
  await loadRoster(); // só faz algo no servidor antigo
  if (!temCacheManuais) await pManuais; // 1ª visita neste aparelho: precisa da lista para montar a tela
  var restaurou = servidorNovo ? await restaurarSessaoServidor(pSessao) : tryRestoreSession();
  if (restaurou === 'rede') restaurou = await tentarSessaoDeNovo_();
  if (restaurou === 'rede'){ telaSemConexao_(); return; }
  if (restaurou){
    // vindo da barra inferior (RH): abre direto o painel do RH, se a pessoa tiver acesso
    if (/[?&]painel=rh\b/.test(location.search) && temGestao()) openAdminPanel(); else goHome();
  } else { renderLogin(); }
  if (temCacheManuais){ // chegou a lista atualizada: se a pessoa ainda está na tela inicial, redesenha com ela
    pManuais.then(function(ok){ if (ok && state.view === 'home' && state.user) goHome(); });
  }
})();

})();
