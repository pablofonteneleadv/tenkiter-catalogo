<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TENKiTER Modas — Treinamento</title>
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta name="theme-color" content="#0d0d0d">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5F1E8; --surface:#FFFFFF; --surface-2:#F1EEE7; --border:#E3DFD4;
  --text:#1C1B18; --muted:#6B675E;
  --accent:#0d0d0d; --accent-2:#E67E22; --accent-3:#F39C12; --accent-soft:#FFF0E4; --accent-txt:#A85200; --on-accent:#fff;
  --warn-bg:#FFF3CD; --warn-border:#E0A800; --warn-text:#5C4600;
  --tip-bg:#FFF0E4; --tip-border:#ff7a1a; --tip-text:#8a3d00;
  --good-bg:#E6F4EA; --good-border:#2F9E52; --good-text:#1E5631;
  --danger:#B3261E; --danger-bg:#FBEAE9;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161C; --surface:#1C1F27; --surface-2:#242833; --border:#333846;
    --text:#ECEBE7; --muted:#9C998F;
    --accent:#E67E22; --accent-2:#F39C12; --accent-soft:#2E2419; --accent-txt:#F39C12; --on-accent:#0d0d0d;
    --warn-bg:#3A3013; --warn-border:#C99A2E; --warn-text:#F2D888;
    --good-bg:#17301F; --good-border:#3FAE66; --good-text:#A9E0BB;
    --tip-bg:#2E2419; --tip-border:#ff9c4d; --tip-text:#FFCB94;
    --danger:#E5837C; --danger-bg:#3A1F1D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14161C; --surface:#1C1F27; --surface-2:#242833; --border:#333846;
  --text:#ECEBE7; --muted:#9C998F;
  --accent:#E67E22; --accent-2:#F39C12; --accent-soft:#2E2419; --accent-txt:#F39C12; --on-accent:#0d0d0d;
  --warn-bg:#3A3013; --warn-border:#C99A2E; --warn-text:#F2D888;
  --good-bg:#17301F; --good-border:#3FAE66; --good-text:#A9E0BB;
  --tip-bg:#2E2419; --tip-border:#ff9c4d; --tip-text:#FFCB94;
  --danger:#E5837C; --danger-bg:#3A1F1D;
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--text); font-family:"Inter",system-ui,sans-serif; margin:0; -webkit-font-smoothing:antialiased;}
h1,h2,h3,.display{font-family:"Poppins",sans-serif; font-weight:800; text-wrap:balance;}
a{color:var(--accent-txt);}
button{font-family:inherit;}
#app{min-height:calc(100vh - 76px); min-height:calc(100dvh - 76px); display:flex; flex-direction:column;}

/* ---------- v3.1: cabeçalho igual ao do catálogo e da gestão (preto com filete laranja) ---------- */
.topbar{background:#0d0d0d linear-gradient(180deg,#0d0d0d 0%,#14140f 100%) !important; border-bottom:2px solid #E67E22 !important; padding:12px 16px !important;}
.topbar .brand{color:#E67E22;}
.topbar .brand .mark{background:transparent;}
.topbar .topbar-right{color:#ccc;}
.topbar .btn{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.16); color:#E67E22; padding:7px 12px; font-size:.82rem;}
.topbar .btn:hover{border-color:#E67E22;}
.ajuda-rh{margin:0 0 12px; border:1px dashed var(--border); border-radius:10px; padding:8px 12px;}
.ajuda-rh summary{cursor:pointer; font-weight:700; font-size:.85rem; color:var(--muted);}
.ajuda-rh .sub{margin:8px 0 0;}
.boot-skel{padding:0 0 24px;}
.boot-skel .sk-top{height:62px; background:#0d0d0d; border-bottom:2px solid #E67E22;}
.boot-skel .sk-wrap{max-width:760px; margin:0 auto; padding:20px 16px;}
.boot-skel .sk{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%); background-size:200% 100%; animation:bootbrilho 1.2s linear infinite; border-radius:12px;}
@keyframes bootbrilho{to{background-position:-200% 0;}}
@media (prefers-reduced-motion:reduce){.boot-skel .sk{animation:none;}}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px; background:var(--surface); border-bottom:1px solid var(--border);
  gap:12px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:10px; font-family:"Poppins",sans-serif; font-weight:700; font-size:1.15rem; color:var(--accent);}
.brand .mark{width:30px;height:30px;border-radius:8px;background:#0d0d0d;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.mark img{width:76%;height:76%;object-fit:contain;}
.topbar-right{display:flex; align-items:center; gap:14px; font-size:0.9rem; color:var(--muted);}
.btn{
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  padding:9px 16px; border-radius:9px; cursor:pointer; font-size:0.92rem; font-weight:600;
  transition:background .15s, border-color .15s;
}
.btn:hover{border-color:var(--accent-2);}
.btn-primary{background:var(--accent); color:var(--on-accent); border-color:var(--accent);}
.btn-primary:hover{background:var(--accent-2); border-color:var(--accent-2);}
.btn-ghost{background:transparent; border-color:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn:disabled{opacity:.5; cursor:not-allowed;}

/* ---------- shell layout ---------- */
.shell{flex:1; display:flex; max-width:1180px; margin:0 auto; width:100%;}
.sidebar{
  width:270px; flex-shrink:0; padding:22px 14px; border-right:1px solid var(--border);
  position:sticky; top:calc(61px + env(safe-area-inset-top,0px)); align-self:flex-start;
  max-height:calc(100vh - 61px); overflow-y:auto;
}
.main{flex:1; min-width:0; padding:28px 24px 80px;}
.btn-toc-toggle{display:none;}
@media (max-width:860px){
  .shell{flex-direction:column;}
  .btn-toc-toggle{
    display:block; width:100%; text-align:left; margin:0; padding:13px 16px;
    background:var(--surface); border:none; border-bottom:1px solid var(--border);
    color:var(--text); font-weight:700; font-size:0.9rem; cursor:pointer;
  }
  .sidebar{
    width:100%; position:static; border-right:none; border-bottom:1px solid var(--border);
    max-height:0; overflow:hidden; padding:0 14px; transition:max-height .2s ease;
  }
  .sidebar.aberto{max-height:70vh; overflow-y:auto; padding:14px;}
  .main{padding:18px 16px 60px;}
  .manual-title{font-size:1.35rem;}
  .part-heading{font-size:1.1rem; margin:30px 0 14px;}
  .chapter p, .chapter ul{max-width:none;}
  .card{padding:16px;}
}

/* ---------- login ---------- */
.login-wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:24px;}
.login-card{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:36px 32px; width:100%; max-width:380px; box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.login-card .mark{width:46px;height:46px;border-radius:12px;background:#0d0d0d;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:16px;}
.login-card h1{font-size:1.4rem; margin:0 0 4px;}
.login-card p.sub{color:var(--muted); font-size:0.9rem; margin:0 0 22px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:0.82rem; font-weight:600; color:var(--muted); margin-bottom:6px;}
.field input{
  width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:0.95rem;
}
.field input:focus{outline:2px solid var(--accent-2); outline-offset:1px;}
.login-error{color:var(--danger); background:var(--danger-bg); border-radius:8px; padding:9px 12px; font-size:0.85rem; margin-bottom:14px; display:none;}
.login-card .btn-primary{width:100%; padding:12px; font-size:1rem; margin-top:4px;}

/* ---------- home / manual cards ---------- */
.hero{margin-bottom:26px;}
.hero h1{font-size:1.7rem; margin:0 0 6px;}
.hero p{color:var(--muted); margin:0; font-size:0.98rem;}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px;
  display:flex; flex-direction:column; gap:10px; cursor:pointer; transition:border-color .15s, transform .1s;
}
.card:hover{border-color:var(--accent-2);}
.card.locked{cursor:not-allowed; background:var(--surface-2); border-style:dashed;}
.card.locked h3{color:var(--muted);}
.card .level-tag{font-size:0.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-txt,var(--accent-2)); font-weight:700;}
.card h3{margin:0; font-size:1.15rem;}
.card p{margin:0; color:var(--muted); font-size:0.88rem; flex:1;}
.card .progress-bar{height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden;}
.card .progress-bar > div{height:100%; background:var(--accent-2);}
.card .progress-label{font-size:0.78rem; color:var(--muted);}

/* ---------- manual nav ---------- */
.nav-part{font-size:0.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; margin:18px 0 6px; padding:0 10px;}
.nav-part:first-child{margin-top:0;}
.nav-chapter{
  display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:8px; cursor:pointer;
  font-size:0.87rem; color:var(--text); text-decoration:none;
}
.nav-chapter:hover{background:var(--surface-2);}
.nav-chapter.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}
.nav-chapter .dot{width:7px;height:7px;border-radius:50%;background:var(--border); flex-shrink:0;}
.nav-chapter.done .dot{background:var(--good-border);}
.nav-chapter.stale .dot{background:var(--warn-border);}
.nav-quiz-link{display:block; margin-top:16px; padding:10px 12px; border-radius:9px; background:var(--accent-soft); color:var(--accent); font-weight:600; font-size:0.87rem; text-align:center; cursor:pointer;}

/* ---------- manual content ---------- */
.manual-title{font-size:1.6rem; margin:0 0 4px;}
.manual-sub{color:var(--muted); margin:0 0 28px; font-size:0.95rem;}
.sync-status{margin:-18px 0 22px; font-size:0.82rem; font-weight:600; color:var(--muted);}
.sync-status.ok{color:var(--good-text);} .sync-status.erro{color:var(--warn-text);}
.part-heading{font-size:1.25rem; color:var(--accent); margin:40px 0 18px; padding-top:8px; border-top:1px solid var(--border);}
.part-heading:first-of-type{border-top:none; margin-top:0;}
.chapter{margin-bottom:34px; scroll-margin-top:80px;}
.chapter-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px;}
.chapter h3{font-size:1.15rem; margin:0;}
.read-toggle{display:flex; align-items:center; gap:6px; font-size:0.78rem; color:var(--muted); cursor:pointer; white-space:nowrap; user-select:none;}
.read-toggle input{accent-color:var(--good-border);}
.read-toggle-big{
  display:flex; align-items:center; justify-content:center; gap:10px; user-select:none; cursor:pointer;
  margin:20px auto 8px; padding:14px 22px; max-width:440px; text-align:center;
  border:2px solid var(--accent-2); border-radius:12px; background:var(--accent-soft);
  font-weight:700; font-size:0.94rem; color:var(--text); transition:background .15s, border-color .15s, color .15s;
}
.read-toggle-big input{width:19px; height:19px; accent-color:var(--good-border); cursor:pointer; flex-shrink:0;}
.read-toggle-big.done{border-color:var(--good-border); background:var(--good-bg); color:var(--good-text);}
.chapter-stale-alert{border-radius:10px; padding:11px 14px; margin:0 0 14px; font-weight:600; max-width:68ch; border:1px solid var(--warn-border); background:var(--warn-bg); color:var(--warn-text); font-size:0.88rem;}
.quiz-cta{margin:44px 0 10px; padding:26px 20px; text-align:center; border-top:2px dashed var(--border);}
.quiz-cta .btn-lg{font-size:1.05rem; padding:14px 30px; border-radius:11px;}
.quiz-cta-locked .btn-lg{opacity:.42; filter:grayscale(.4); cursor:not-allowed;}
.quiz-cta-msg{display:inline-block; margin:14px auto 0; padding:9px 16px; border-radius:8px; max-width:440px;
  background:var(--danger-bg); color:var(--danger); font-size:0.86rem; font-weight:600;}
.chapter p{line-height:1.6; margin:0 0 12px; max-width:68ch;}
.chapter p.p-bold{font-weight:700;}
.chapter ul{margin:0 0 12px; padding-left:22px; max-width:68ch;}
.chapter li{margin-bottom:7px; line-height:1.55;}
.chapter ul ul{margin-top:7px;}
blockquote.quote{
  margin:14px 0; padding:6px 16px; border-left:3px solid var(--muted); color:var(--muted);
  font-style:italic; max-width:66ch;
}
.callout{border-radius:10px; padding:13px 16px; margin:14px 0; font-weight:600; max-width:68ch; border:1px solid; line-height:1.5;}
.callout-warn{background:var(--warn-bg); border-color:var(--warn-border); color:var(--warn-text);}
.callout-tip{background:var(--tip-bg); border-color:var(--tip-border); color:var(--tip-text);}
.callout-good{background:var(--good-bg); border-color:var(--good-border); color:var(--good-text);}
.table-wrap{overflow-x:auto; margin:16px 0;}
table{border-collapse:collapse; width:100%; font-size:0.88rem;}
th,td{border:1px solid var(--border); padding:8px 10px; text-align:left; vertical-align:top;}
th{background:var(--surface-2); font-weight:700;}

/* ---------- quiz ---------- */
.quiz-q{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:16px;}
.quiz-q.quiz-faltou{border-color:var(--accent-2); box-shadow:0 0 0 3px var(--accent-soft);}
.quiz-aviso{margin:10px 0; padding:12px 14px; border-radius:10px; background:var(--accent-soft); border:2px solid var(--accent-2); font-weight:700; color:var(--text);}
.prova-bloco{margin-top:12px; padding-top:12px; border-top:1px dashed var(--border);}
.prova-t{margin:0 0 8px; font-size:0.95rem;}
.tm-zerar{position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px;}
.tm-zerar-box{background:var(--surface); color:var(--text); border-radius:14px; padding:18px; width:100%; max-width:460px; max-height:90dvh; overflow:auto; border:1px solid var(--border);}
.ds-zerar{margin:8px 0 2px; padding:8px 12px; font-size:0.85rem;}
.quiz-q .qn{font-size:0.78rem; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
.quiz-q .qtext{font-weight:600; margin-bottom:12px; font-size:1rem;}
.opt{display:flex; align-items:flex-start; gap:10px; padding:9px 10px; border-radius:8px; cursor:pointer; margin-bottom:4px;}
.opt:hover{background:var(--surface-2);}
.opt input{margin-top:3px;}
.quiz-q.graded .opt{cursor:default;}
.quiz-q.graded .opt:hover{background:transparent;}
.opt.correct-answer{background:var(--good-bg); color:var(--good-text); border-radius:8px;}
.opt.wrong-answer{background:var(--danger-bg); color:var(--danger); border-radius:8px;}
.explain{margin-top:10px; font-size:0.87rem; color:var(--muted); border-top:1px solid var(--border); padding-top:10px;}
.quiz-result{
  background:var(--accent-soft); border-radius:14px; padding:24px; text-align:center; margin-bottom:22px;
}
.quiz-result .score{font-family:"Poppins",sans-serif; font-size:2.4rem; color:var(--accent); font-weight:800;}
.quiz-result .verdict{font-weight:700; margin-top:4px;}
.quiz-result .qr-nota{margin:10px 0 0; color:var(--text);}
.qr-importante{margin:16px 0 0; padding:14px 16px; text-align:left; background:var(--surface); border-left:4px solid var(--accent); border-radius:10px; font-size:0.93rem; line-height:1.5;}
.qr-importante strong{display:block; margin-bottom:4px; font-size:1rem;}
.qr-importante p{margin:0;}
.qr-passos{margin-top:18px; display:flex; flex-direction:column; gap:10px; text-align:left;}
.qr-titulo{margin:0; font-weight:700; text-align:center;}
.qr-grande{width:100%; padding:14px 16px; font-size:1rem; min-height:48px;}
.qr-extra{margin-top:16px; display:flex; flex-direction:column; gap:10px; align-items:center;}
.qr-extra .btn{width:100%;}
.qr-link{background:none; border:0; color:var(--accent-txt); text-decoration:underline; font-size:0.88rem; cursor:pointer; padding:10px;}
.quiz-actions{display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap;}
.toast{
  position:fixed; bottom:calc(88px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%);
  background:var(--text); color:var(--bg); padding:10px 18px; border-radius:9px; font-size:0.88rem;
  opacity:0; pointer-events:none; transition:opacity .2s; z-index:50;
}
.toast.show{opacity:1;}
.muted-note{color:var(--muted); font-size:0.85rem; margin-top:6px;}
.admin-btn-topbar{background:var(--accent-2); color:#0d0d0d; border-color:var(--accent-2); font-weight:700;}
.admin-shell{max-width:1100px; margin:0 auto; padding:20px; width:100%; min-width:0;}
.admin-tabs{display:flex; gap:8px; border-bottom:1px solid var(--border); margin-bottom:18px; flex-wrap:wrap;}
.admin-tab{padding:10px 16px; border:none; background:transparent; color:var(--muted); font-weight:600; cursor:pointer; border-bottom:2px solid transparent; font-size:0.92rem;}
.admin-tab.active{color:var(--accent); border-bottom-color:var(--accent-2);}
.admin-panel{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px; overflow-x:auto;}
.admin-table{width:100%; border-collapse:collapse; font-size:0.88rem; min-width:560px;}
.admin-table th{text-align:left; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
.admin-table td{padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
.admin-table tr:last-child td{border-bottom:none;}
.badge-ativo{background:var(--good-bg); color:var(--good-text); border-radius:20px; padding:3px 10px; font-size:0.78rem; font-weight:700;}
.badge-inativo{background:var(--danger-bg); color:var(--danger); border-radius:20px; padding:3px 10px; font-size:0.78rem; font-weight:700;}
.badge-aprovado{background:var(--good-bg); color:var(--good-text); border-radius:20px; padding:2px 9px; font-size:0.76rem; font-weight:700;}
.badge-reprovado{background:var(--danger-bg); color:var(--danger); border-radius:20px; padding:2px 9px; font-size:0.76rem; font-weight:700;}
.admin-sel{padding:5px 8px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-weight:600; font-size:0.85rem;}
.admin-mini-btn{padding:5px 10px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; margin-right:4px;}
.admin-mini-btn:hover{border-color:var(--accent-2);}
.ac-card{border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px; background:var(--surface-2);}
.ac-card.ac-off{opacity:.65;}
.ac-head{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center;}
.ac-sub{font-size:.8rem; color:var(--muted); margin-top:2px;}
.ac-ordem{display:flex; gap:14px; flex-wrap:wrap; margin:10px 0; font-size:.85rem; font-weight:600;}
.ac-ordem select{width:auto; display:inline-block;}
.ac-actions{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.ac-you{font-size:.7rem; background:var(--accent-2); color:#0d0d0d; border-radius:10px; padding:1px 7px; margin-left:4px;}
.ac-perms{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; margin-top:12px; padding-top:12px; border-top:1px solid var(--border);}
.ac-grupo-t{font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; margin-bottom:4px;}
.ac-perm{display:block; font-size:.86rem; padding:3px 0; cursor:pointer;}
.ac-perm input{margin-right:6px;}
.ac-diff{color:var(--accent-txt); font-weight:600;}
.ac-busca{flex:1; min-width:180px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text);}
.ac-check{font-size:.85rem; display:flex; align-items:center; gap:6px;}
.ac-head{align-items:flex-start;}
.ac-id{flex:1; min-width:150px;}
.ac-foto-col{flex:0 0 auto;}
.ac-foto{width:54px; height:54px; border-radius:50%; object-fit:cover; display:block; background:var(--surface);}

function normWhats(w){
  var d = String(w||'').replace(/\D/g,'');
  // Aceita com ou sem DDI 55 (ex: 5588999999999 e 88999999999 contam como o mesmo número).
  if (d.length >= 12 && d.slice(0,2) === '55') d = d.slice(2);
  // Sempre 11 dígitos (ddd + 9 + nnnnnnnn): número antigo de 10 dígitos ganha o "9" de volta.
  if (d.length === 10) d = d.slice(0,2) + '9' + d.slice(2);
  return d;
}

  } else {
    // Sessão de antes da atualização (só guardava o WhatsApp): enquanto o script

    try{
      var r0 = await fetch(DATA.appsScriptUrl, { method:'GET' });

    return 'rede'; // servidor lento/sem conexão: a sessão continua guardada, não manda para o login

async function loadRoster(){
  if (!DATA.appsScriptUrl) return;
  if (servidorNovo) return; // servidor novo: não baixa mais a lista de funcionários
  try{
    var res = await fetch(DATA.appsScriptUrl, { method:'GET' });
    if (!res.ok) return;
    var json = await res.json();
    if (json && json.ok && Array.isArray(json.funcionarios)){
      var byWhats = {};
      DATA.roster.forEach(function(r){ byWhats[normWhats(r.whatsapp)] = r; });
      json.funcionarios.forEach(function(row){
        var whatsapp = normWhats(row.whatsapp);
        if (!whatsapp) return;
        var nivelAnterior = byWhats[whatsapp] ? byWhats[whatsapp].level : 0;
        var nivelDessaLinha = parseInt(row.nivel,10) || 1;
        // Se o mesmo WhatsApp aparece em mais de uma linha da planilha (ex: um
        // cadastro duplicado), nunca deixa isso REBAIXAR o nível de acesso --
        // fica sempre o maior nível já visto pra esse WhatsApp.
        var statusAnterior = byWhats[whatsapp] ? byWhats[whatsapp].status : 'ativo';
        var statusDessaLinha = String(row.status||'ativo').trim().toLowerCase() || 'ativo';
        var anterior = byWhats[whatsapp] || {};
        byWhats[whatsapp] = {
          whatsapp: whatsapp,
          name: String(row.nome||'').trim() || whatsapp,
          level: Math.max(nivelAnterior, nivelDessaLinha),
          password: String(row.senha||''),
          // se aparecer duplicado com status diferente, fica ativo se qualquer uma das linhas estiver ativa
          status: (statusAnterior === 'ativo' || statusDessaLinha === 'ativo') ? 'ativo' : 'inativo',
          // dados de perfil -- vêm da planilha (colunas criadas sozinhas quando o
          // funcionário preenche pela primeira vez); mantém o valor anterior se a
          // linha duplicada não tiver esse campo preenchido.
          dataNascimento: String(row.datanascimento || anterior.dataNascimento || ''),
          instagram: String(row.instagram || anterior.instagram || ''),
          cep: String(row.cep || anterior.cep || ''),
          endereco: String(row.endereco || anterior.endereco || ''),
          bairro: String(row.bairro || anterior.bairro || ''),
          cidade: String(row.cidade || anterior.cidade || ''),
          estado: String(row.estado || anterior.estado || ''),
          altura: String(row.altura || anterior.altura || ''),
          peso: String(row.peso || anterior.peso || ''),
          fotoPerfilUrl: String(row.fotoperfilurl || anterior.fotoPerfilUrl || ''),
          fotoCorpoUrl: String(row.fotocorpourl || anterior.fotoCorpoUrl || '')
        };
      });
      DATA.roster = Object.keys(byWhats).map(function(k){ return byWhats[k]; });
    }
  }catch(e){ /* mantém o cadastro-semente -- o site continua funcionando */ }
}

function shuffleArray(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
/**
 * Monta o conjunto de perguntas de UMA tentativa: sorteia X das N perguntas
 * do banco (se configurado) e embaralha as alternativas de cada uma,
 * remapeando qual índice é a correta -- assim ninguém decora a posição.
 */
function buildQuizAttempt(level){
  var quiz = DATA.quizzes[level];
  var cfg = quizConfig[level] || {};
  // o servidor manda a configuração junto da prova (count/modo/opcoes); a planilha pública de config é só reserva
  var count = quiz.count != null ? Number(quiz.count) : (Number(cfg.count) || 0);
  var modo = quiz.modo || cfg.modo || 'tudo';
  var maxOpcoes = quiz.opcoes != null ? Number(quiz.opcoes) : (Number(cfg.opcoes) || 0);
  var embPerguntas = (modo === 'tudo' || modo === 'perguntas');   // 'ordem' e 'opcoes' mantêm a ordem do Docs
  var embOpcoes = (modo === 'tudo' || modo === 'opcoes');         // 'ordem' e 'perguntas' mantêm as alternativas como no Docs
  var total = quiz.questions.length;
  var n = count > 0 ? Math.min(count, total) : total;
  var idx = quiz.questions.map(function(_, i){ return i; });
  var escolhidas = embPerguntas ? shuffleArray(idx).slice(0, n) : idx.slice(0, n);
  var questions = escolhidas.map(function(qi){
    var q = quiz.questions[qi];
    var ordem = q.options.map(function(_, i){ return i; });
    if (maxOpcoes >= 2 && maxOpcoes < ordem.length){
      // mostra só N alternativas: a certa + (N-1) erradas sorteadas, mantendo a ordem original entre elas
      var erradas = shuffleArray(ordem.filter(function(i){ return i !== q.correct; })).slice(0, maxOpcoes - 1);
      ordem = ordem.filter(function(i){ return i === q.correct || erradas.indexOf(i) !== -1; });
    }
    if (embOpcoes) ordem = shuffleArray(ordem);
    var cc = window.TMV ? TMV.critica(q.q) : { texto: q.q, critica: false };
    return { q: cc.texto, critica: cc.critica, explain: q.explain, options: ordem.map(function(i){ return q.options[i]; }), correct: ordem.indexOf(q.correct) };
  });
  return { title: quiz.title, questions: questions, id: novoIdTentativa_() };
}

var ACOES_GRAVAM_ = /^(pratica_validar|certificado_(emitir|revogar)|excluir_|resetar_|salvar_|atualizar_|alterar_|criar_|acessos_(criar|excluir|status|permissao|perfil)|prova_|manual_(sincronizar|marcar)|sincronizar_|resultado$|registrar$|enviar_)/;
var ACOES_LENTAS_ = /^(relatorio_equipe|treinamento_conteudo|manual_sincronizar_lote|sincronizar_manual|prova_sincronizar|prova_criar_doc|curriculos_foto|enviar_foto_perfil)$/;
async function submitResult(payload){
  if (!DATA.appsScriptUrl) return;
  var acao = String((payload && payload.action) || ''), grava = ACOES_GRAVAM_.test(acao) && !/^(sessao|login)$/.test(acao);
  var fimOcupado = (grava && window.TKOcupado) ? window.TKOcupado.inicio() : null;
  var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var limite = ACOES_LENTAS_.test(acao) ? 90000 : 35000, timer = ctl ? setTimeout(function(){ try{ ctl.abort(); }catch(e){} }, limite) : null;
  try{
    var res = await fetch(DATA.appsScriptUrl, {
      method:'POST',
      body: JSON.stringify(Object.assign({ token: DATA.appsScriptToken }, payload)),
      signal: ctl ? ctl.signal : undefined
    });
    return await res.json();
  }catch(e){
    if (e && e.name === 'AbortError') return { ok:false, erro:'O servidor está demorando para responder.', demorou:true };
    return { ok:false, erro:'sem conexão' };
  }finally{
    if (timer) clearTimeout(timer);
    if (fimOcupado) fimOcupado();
  }
}

/* LEGADO (pré-id-estável): progresso guardado por POSIÇÃO (nível-parte-capítulo). Só existe pra
   migrar quem já tinha leitura marcada antes desse recurso -- nunca mais é escrito. Guardar por
   posição tem um defeito sério: se o Pablo reordena ou insere um capítulo no meio do manual, a
   posição de tudo que vem depois muda, e a leitura "grudada" na posição passa a valer pro
   capítulo ERRADO. Por isso a partir de agora o estado real mora em getStableProgress(),
   indexado pelo id estável do capítulo (ch.id, que vem do TÍTULO e sobrevive a reordenar). */
function getProgress(){ return ls_get(progressKey(state.user.whatsapp), {}); }
function setChapterRead(chId, val){
  var p = getProgress(); p[chId] = val; ls_set(progressKey(state.user.whatsapp), p);
}
function getHashMap(){ return ls_get(progressHashKey(state.user.whatsapp), {}); }

/* Fonte da verdade atual: mapa capId(estável) -> {lido, hash}. hash é o hash do capítulo no
   momento em que a leitura foi confirmada -- se o conteúdo mudar depois (hash diferente), o
   capítulo "destrava" sozinho como não lido de novo, sem precisar de nada do servidor. */
function getStableProgress(){ return ls_get(progressStableKey(state.user.whatsapp), {}); }
function setStableChapterRead(capId, hash, lido){
  var m = getStableProgress();
  if (lido) m[capId] = { lido: true, hash: hash };
  else delete m[capId];
  ls_set(progressStableKey(state.user.whatsapp), m);
}

/* Estado efetivo de um capítulo. Usa o mapa estável (por capId) como fonte principal; na
   primeira vez que um capítulo com id estável é visto sem entrada nesse mapa, migra uma única
   vez a partir do progresso-por-posição antigo (e do hash-map antigo), pra não fazer ninguém
   perder leitura já marcada por causa dessa troca de chave. Quando o capítulo não tem id/hash
   (não deveria mais acontecer, mas sem rede de segurança nenhuma trava), cai pro comportamento
   antigo (só posição, sem detecção de "precisa reler"). */
function chapterStatus(level, pi, ci, ch){
  var chId = level + '-' + pi + '-' + ci;
  if (!ch.id || !ch.hash){
    var p = getProgress();
    return { chId: chId, capId: null, done: !!p[chId], stale: false };
  }
  var mapa = getStableProgress();
  if (!(ch.id in mapa)){
    var pLegado = getProgress();
    if (pLegado[chId]){
      var hashLegadoMap = getHashMap();
      var hashLegado = hashLegadoMap[ch.id] || ch.hash;
      setStableChapterRead(ch.id, hashLegado, true); // migra uma vez só
      mapa = getStableProgress();
    }
  }
  var entrada = mapa[ch.id];
  if (!entrada) return { chId: chId, capId: ch.id, done: false, stale: false };
  if (entrada.hash !== ch.hash) return { chId: chId, capId: ch.id, done: false, stale: true }; // mudou depois que leu
  return { chId: chId, capId: ch.id, done: true, stale: false };
}
function manualProgress(level){
  var content = DATA.manuals[level];
  var total = 0, done = 0;
  content.parts.forEach(function(part, pi){
    part.chapters.forEach(function(ch, ci){
      total++;
      if (chapterStatus(level, pi, ci, ch).done) done++;
    });
  });
  return { total: total, done: done, pct: total ? Math.round(done/total*100) : 0 };
}

/* Sincronização em lote: toda vez que o manual é aberto, reenvia pro servidor todos os
   capítulos já confirmados localmente que tenham id estável -- cobre tanto quem já tinha lido
   antes desse recurso existir (acabou de migrar acima) quanto qualquer sincronização individual
   que tenha falhado por falta de rede. Só soma leitura, nunca desmarca; roda em segundo plano,
   sem travar a tela nem avisar em caso de falha. */
/** Diz à pessoa, com palavras, se a leitura dela já está salva no servidor ou só neste aparelho. */
function mostrarSync(estado){
  var el = document.getElementById('sync-status'); if (!el) return;
  el.hidden = false; el.className = 'sync-status' + (estado === 'ok' ? ' ok' : estado === 'erro' ? ' erro' : '');
  el.textContent = estado === 'ok' ? '✓ Seu progresso está salvo no servidor.'
    : estado === 'erro' ? '⏳ Seu progresso está salvo neste aparelho e ainda não chegou ao servidor. Ele tenta de novo quando você abrir o manual com internet.'
    : 'Salvando seu progresso…';
}
function sincronizarProgressoLote(level){
  if (!DATA.appsScriptUrl) return;
  var content = DATA.manuals[level];
  if (!content) return;
  var itens = [];
  content.parts.forEach(function(part, pi){
    part.chapters.forEach(function(ch, ci){
      var st = chapterStatus(level, pi, ci, ch);
      if (st.done && st.capId) itens.push({ capId: st.capId, hash: ch.hash, lido: true });
    });
  });
  if (!itens.length) return;
  mostrarSync('salvando');
  submitResult({ action:'manual_sincronizar_lote', whatsapp: state.user.whatsapp, sessao: state.user.password,
    manualId: level, itens: itens }).then(function(r){ mostrarSync(r && r.ok ? 'ok' : 'erro'); }).catch(function(){ mostrarSync('erro'); });
}

/** texto com formatação por trecho (cor, marca-texto, negrito, links...) -- tm-verificado.js; sem ele, texto simples */
function ricoHtml_(texto, runs){ return (window.TMV && TMV.rico) ? TMV.rico(texto, runs) : esc(texto); }
/** vídeo da lição: só endereços que a gente monta a partir de um id/endereço validado (nunca HTML do Doc) */
function videoHtml_(b){
  var id = String(b.id || ''), src = '', link = '', tag = '';
  if (b.kind === 'yt' && /^[A-Za-z0-9_-]{11}$/.test(id)){ src = 'https://www.youtube-nocookie.com/embed/' + id + '?rel=0&modestbranding=1&playsinline=1'; link = 'https://www.youtube.com/watch?v=' + id; }
  else if (b.kind === 'drive' && /^[A-Za-z0-9_-]{10,}$/.test(id)){ src = 'https://drive.google.com/file/d/' + id + '/preview'; link = 'https://drive.google.com/file/d/' + id + '/view'; }
  else if (b.kind === 'vimeo' && /^\d{6,}$/.test(id)){ src = 'https://player.vimeo.com/video/' + id; link = 'https://vimeo.com/' + id; }
  else if (b.kind === 'mp4' && /^https:\/\/[^\s"'<>]+$/i.test(String(b.src || ''))){ link = String(b.src); tag = 'video'; }
  else return '';
  var quadro = tag === 'video'
    ? '<video controls playsinline preload="metadata" src="' + esc(link) + '"></video>'
    : '<iframe src="' + esc(src) + '" title="Vídeo da lição" loading="lazy" allowfullscreen allow="fullscreen; picture-in-picture; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>';
  return '<div class="manual-video' + (b.vertical ? ' vertical' : '') + '"><div class="vf">' + quadro + '</div>' +
    '<a class="vlink" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">Abrir o vídeo em outra aba</a></div>';
}
function renderBlocks(blocks, chaveCap){
  if (window.TMV) blocks = TMV.preparar(blocks);
  var html = ''; var listStack = []; // stack of {level, el:'ul'}
  function closeLists(toLevel){
    while(listStack.length > (toLevel===null?0:toLevel)){
      html += '</ul>'; listStack.pop();
    }
  }
  blocks.forEach(function(b){
    if (b.type === 'bul'){
      var lvl = b.level || 0;
      while(listStack.length <= lvl){ html += '<ul>'; listStack.push(lvl); }
      while(listStack.length > lvl+1){ html += '</ul>'; listStack.pop(); }
      html += '<li>' + esc(b.text) + '</li>';
    } else {
      closeLists(null);
      if (b.type === 'p'){
        html += '<p class="' + (b.bold ? 'p-bold' : '') + (b.al === 'c' ? ' al-c' : b.al === 'r' ? ' al-r' : '') + '">' + ricoHtml_(b.text, b.runs) + '</p>';
      } else if (b.type === 'quote'){
        html += '<blockquote class="quote">' + ricoHtml_(b.text, b.runs) + '</blockquote>';
      } else if (b.type === 'checagem' || b.type === 'facaagora' || b.type === 'aviso'){
        html += TMV.renderBloco(b, chaveCap || 'x');
      } else if (b.type === 'video'){
        html += videoHtml_(b);
      } else if (b.type === 'callout'){
        html += '<div class="callout callout-' + esc(b.kind) + '">' + esc(b.text) + '</div>';
      } else if (b.type === 'table'){
        html += '<div class="table-wrap"><table>';
        b.rows.forEach(function(row, ri){
          html += '<tr>' + row.map(function(c){ return (ri===0 ? '<th>' : '<td>') + esc(c) + (ri===0?'</th>':'</td>'); }).join('') + '</tr>';
        });
        html += '</table></div>';
      } else if (b.type === 'img'){
        var lado = (b.side === 'left' || b.side === 'right') ? (b.side === 'left' ? ' lado-esq' : ' lado-dir') : '';
        html += '<div class="manual-img-wrap' + lado + '"' + (lado && Number(b.pct) > 0 ? ' style="--pct:' + Math.max(10, Math.min(46, Math.round(Number(b.pct)))) + '"' : '') + '><img src="' + esc(b.src) + '" alt=""' +
          (b.width ? ' width="' + Math.round(b.width) + '"' : '') +
          (b.height ? ' height="' + Math.round(b.height) + '"' : '') +
          ' loading="lazy"></div>';
      }
    }
  });
  closeLists(null);
  return html;
}

/**
 * Mantém o campo de Instagram sempre começando com "@" -- não dá pra validar
 * ao vivo se o perfil existe de verdade (o Instagram bloqueia esse tipo de
 * consulta vinda do navegador), então a validação aqui é só de formato.
 */
function normInstagram(v){
  var s = String(v||'').trim().replace(/^@+/, '').replace(/\s+/g, '');
  return s ? '@' + s : '';
}
function wireInstagramField(input){
  if (!input) return;
  input.addEventListener('focus', function(){
    if (input.value === '@' && input.setSelectionRange) input.setSelectionRange(1,1);
  });
  input.addEventListener('blur', function(){ input.value = normInstagram(input.value) || '@'; });
}

/**
 * Máscara de data (dd/mm/aaaa) num campo de texto comum -- a pessoa só
 * digita os números (19101988) e as barras aparecem sozinhas, sem precisar
 * abrir calendário nenhum.
 */
function maskDataNascimento(v){
  var d = String(v||'').replace(/\D/g,'').slice(0,8);
  if (d.length > 4) return d.slice(0,2) + '/' + d.slice(2,4) + '/' + d.slice(4);
  if (d.length > 2) return d.slice(0,2) + '/' + d.slice(2);
  return d;
}
function wireDataNascimentoField(input){
  if (!input) return;
  input.addEventListener('input', function(){ input.value = maskDataNascimento(input.value); });
}
function dataNascimentoValida(v){
  var m = String(v||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (!m) return false;
  var dia = Number(m[1]), mes = Number(m[2]), ano = Number(m[3]);
  if (mes < 1 || mes > 12 || dia < 1 || dia > 31 || ano < 1900 || ano > new Date().getFullYear()) return false;
  return true;
}

async function doCadastro(){
  var nome = document.getElementById('cad-nome').value.trim();
  var whatsapp = normWhats(document.getElementById('cad-whats').value);
  var senha = document.getElementById('cad-senha').value;
  var dataNascimento = document.getElementById('cad-nascimento').value;
  var instagram = normInstagram(document.getElementById('cad-instagram').value);
  var err = document.getElementById('login-error');
  err.style.display = 'none';
  if(!nome || !whatsapp || !senha){ err.textContent = 'Preencha nome, WhatsApp e senha.'; err.style.display='block'; return; }
  if(senha.length < 4){ err.textContent = 'A senha precisa ter pelo menos 4 caracteres.'; err.style.display='block'; return; }
  if(dataNascimento && !dataNascimentoValida(dataNascimento)){
    err.textContent = 'Data de nascimento inválida. Use o formato dd/mm/aaaa.'; err.style.display='block'; return;
  }
  var cpf = (document.getElementById('cad-cpf').value || '').trim();
  var email = (document.getElementById('cad-email').value || '').trim();
  if(cpf && window.TKConta && !TKConta.cpfValido(cpf)){ err.textContent = 'CPF inválido. Confira os 11 números ou deixe em branco.'; err.style.display='block'; return; }
  if(email && window.TKConta && !TKConta.emailValido(email)){ err.textContent = 'E-mail inválido. Confira ou deixe em branco.'; err.style.display='block'; return; }
  function jaTem(){
    var box = document.querySelector('.login-card');
    if (window.TKConta) TKConta.avisoContaExiste(box, { identificador: whatsapp,
      aoEntrar: function(){ renderLogin(); var l=document.getElementById('login-whats'); if(l) l.value = whatsapp; },
      aoRecuperar: function(){ abrirRecuperarConta(whatsapp); } });
    else { err.textContent = 'Já existe uma conta com esse WhatsApp. Tente entrar.'; err.style.display='block'; }
  }
  if(DATA.roster.some(function(r){ return normWhats(r.whatsapp) === whatsapp; })){ jaTem(); return; }
  if(!DATA.appsScriptUrl){
    err.textContent = 'Cadastro ainda não está disponível (sistema em configuração). Fale com a gestão.'; err.style.display='block'; return;
  }
  var btn = document.getElementById('cad-btn');
  btn.disabled = true; btn.textContent = 'Cadastrando...';
  var resp = await submitResult({
    action:'registrar', nome: nome, whatsapp: whatsapp, senha: senha,
    dataNascimento: dataNascimento, instagram: instagram, cpf: cpf, email: email
  });
  btn.disabled = false; btn.textContent = 'Criar conta';
  if(resp && resp.contaExiste){ jaTem(); return; }
  if(!resp || !resp.ok){
    err.textContent = (resp && resp.erro) || 'Não foi possível cadastrar agora. Tente de novo.'; err.style.display='block'; return;
  }
  var entry = {
    whatsapp: whatsapp, name: nome, level: 1, password: senha, status: 'ativo',
    dataNascimento: dataNascimento, instagram: instagram
  };
  if(resp.sessao && resp.usuario){
    entry = entryFromServerUser(resp.usuario, resp.sessao);
    ls_set('tm_session', { whatsapp: entry.whatsapp, sessao: resp.sessao });
  } else {
    DATA.roster.push(entry);
    ls_set('tm_session', { whatsapp: entry.whatsapp });
  }
  state.user = userFromRosterEntry(entry);
  toast('Conta criada! Bem-vindo(a).');
  goHome();
  loadRoster();
}

async function doLogin(){
  var ident = document.getElementById('login-whats').value.trim();
  var whatsapp = ident.indexOf('@') >= 0 ? '' : normWhats(ident);
  var pass = document.getElementById('login-pass').value;
  var err = document.getElementById('login-error');
  err.style.display = 'none';
  if(!ident || !pass){ err.textContent = 'Preencha e-mail, WhatsApp ou CPF e a senha.'; err.style.display='block'; return; }
  if(!servidorChecado) await detectarServidor();
  if(servidorNovo){
    var btnL = document.getElementById('login-btn');
    if(btnL){ btnL.disabled = true; btnL.textContent = 'Entrando...'; }
    var respL = await submitResult({ action:'login', identificador: ident, whatsapp: whatsapp, senha: pass });
    if(btnL){ btnL.disabled = false; btnL.textContent = 'Entrar'; }
    if(!respL || !respL.ok){
      err.textContent = (respL && respL.erro === 'sem conexão')
        ? 'Sem conexão. Verifique a internet e tente de novo.'
        : ((respL && respL.erro) || 'Dados ou senha incorretos.') + ' Esqueceu a senha? Toque em “Esqueci a senha”.';
      err.style.display = 'block'; return;
    }
    entrarComResposta(respL);
    return;
  }
  var entry = whatsapp ? DATA.roster.find(function(r){ return normWhats(r.whatsapp) === whatsapp; }) : null;
  if(!entry || entry.password !== pass){
    err.textContent = (DATA.roster.length === 0)
      ? 'Não foi possível conferir agora. Verifique a internet e tente de novo.'
      : 'WhatsApp ou senha incorretos.';
    err.style.display = 'block'; return;
  }
  if(String(entry.status||'ativo').toLowerCase() === 'inativo'){
    err.textContent = 'Essa conta está desativada. Fale com a gestão.'; err.style.display = 'block'; return;
  }
  state.user = userFromRosterEntry(entry);
  ls_set('tm_session', { whatsapp: normWhats(entry.whatsapp) });
  goHome();
}

function tryRestoreSession(){
  var sess = ls_get('tm_session', null);
  if(!sess) return false;
  var entry = DATA.roster.find(function(r){ return normWhats(r.whatsapp) === normWhats(sess.whatsapp); });
  if(!entry) return false;
  if(String(entry.status||'ativo').toLowerCase() === 'inativo'){
    try{ localStorage.removeItem('tm_session'); }catch(e){}
    return false;
  }
  state.user = userFromRosterEntry(entry);
  return true;
}

  renderLogin();
}

/**
 * Redimensiona uma imagem escolhida pelo funcionário no navegador antes de
 * enviar -- evita foto de celular de vários MB pesando no upload e na
 * planilha/Drive. Devolve uma data URL JPEG já no tamanho máximo indicado.
 */
function resizeImageFile(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('Não foi possível ler o arquivo.')); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error('Arquivo não é uma imagem válida.')); };
      img.onload = function(){
        var w = img.width, h = img.height;
        if (w > maxDim || h > maxDim){
          if (w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality || 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function wirePerfil(){
  wireInstagramField(document.getElementById('perfil-instagram'));
  wireDataNascimentoField(document.getElementById('perfil-nascimento'));
  if (window.TKConta) TKConta.ligarCpf(document.getElementById('perfil-cpf'));

  var cepInput = document.getElementById('perfil-cep');
  cepInput.addEventListener('blur', async function(){
    var cep = cepInput.value.replace(/\D/g,'');
    if (cep.length !== 8) return;
    try{
      var res = await fetch('https://viacep.com.br/ws/' + cep + '/json/');
      var json = await res.json();
      if (json && !json.erro){
        document.getElementById('perfil-endereco').value = json.logradouro || document.getElementById('perfil-endereco').value;
        document.getElementById('perfil-bairro').value = json.bairro || document.getElementById('perfil-bairro').value;
        document.getElementById('perfil-cidade').value = json.localidade || document.getElementById('perfil-cidade').value;
        document.getElementById('perfil-estado').value = json.uf || document.getElementById('perfil-estado').value;
      }
    }catch(e){ /* sem conexão com o ViaCEP -- funcionário preenche na mão mesmo */ }
  });

  function wireFoto(inputId, previewId, tipo){
    var input = document.getElementById(inputId);
    input.addEventListener('change', async function(e){
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var err = document.getElementById('perfil-error');
      err.style.display = 'none';
      try{
        var dataUrl = await resizeImageFile(file, tipo === 'corpo' ? 1280 : 640, 0.82);
        var preview = document.getElementById(previewId);
        if (preview.tagName === 'IMG'){ preview.src = dataUrl; }
        else {
          var img = document.createElement('img');
          img.id = previewId; img.className = preview.className; img.src = dataUrl;
          preview.replaceWith(img);
        }
        var resp = await submitResult({ action:'enviar_foto_perfil', whatsapp: state.user.whatsapp, senha: state.user.password, tipo: tipo, fotoBase64: dataUrl });
        if (!resp || !resp.ok){
          err.textContent = (resp && resp.erro) || 'Não foi possível enviar a foto agora.'; err.style.display = 'block'; return;
        }
        if (tipo === 'corpo') state.user.fotoCorpoUrl = resp.url; else state.user.fotoPerfilUrl = resp.url;
        var rosterEntry = DATA.roster.find(function(r){ return normWhats(r.whatsapp) === state.user.whatsapp; });
        if (rosterEntry){ if (tipo === 'corpo') rosterEntry.fotoCorpoUrl = resp.url; else rosterEntry.fotoPerfilUrl = resp.url; }
        var btnLabel = document.getElementById('btn-foto-' + tipo + '-label');
        if (btnLabel) btnLabel.textContent = 'Trocar foto';
        toast('Foto enviada!');
      }catch(ex){
        err.textContent = 'Não foi possível processar essa imagem.'; err.style.display = 'block';
      }
    });
  }
  wireFoto('input-foto-perfil', 'preview-foto-perfil', 'perfil');
  wireFoto('input-foto-corpo', 'preview-foto-corpo', 'corpo');

  document.getElementById('perfil-salvar').addEventListener('click', async function(){
    var btn = this;
    var err = document.getElementById('perfil-error');
    err.style.display = 'none';
    var dataNascimento = document.getElementById('perfil-nascimento').value;
    if (dataNascimento && !dataNascimentoValida(dataNascimento)){
      err.textContent = 'Data de nascimento inválida. Use o formato dd/mm/aaaa.'; err.style.display = 'block'; return;
    }
    var instagram = normInstagram(document.getElementById('perfil-instagram').value);
    var cpfP = document.getElementById('perfil-cpf').value.trim();
    var emailP = document.getElementById('perfil-email').value.trim();
    if (cpfP && window.TKConta && !TKConta.cpfValido(cpfP)){ err.textContent = 'CPF inválido. Confira os 11 números.'; err.style.display = 'block'; return; }
    if (emailP && window.TKConta && !TKConta.emailValido(emailP)){ err.textContent = 'E-mail inválido.'; err.style.display = 'block'; return; }
    if (!cpfP && window.TKConta && TKConta.precisaCpf(state.user)){ err.textContent = 'O CPF é obrigatório para a equipe. Preencha o CPF.'; err.style.display = 'block'; return; }
    var campos = {
      cpf: cpfP,
      email: emailP,
      dataNascimento: dataNascimento,
      instagram: instagram,
      altura: document.getElementById('perfil-altura').value,
      peso: document.getElementById('perfil-peso').value,
      cep: document.getElementById('perfil-cep').value,
      endereco: document.getElementById('perfil-endereco').value,
      bairro: document.getElementById('perfil-bairro').value,
      cidade: document.getElementById('perfil-cidade').value,
      estado: document.getElementById('perfil-estado').value
    };
    btn.disabled = true; btn.textContent = 'Salvando...';
    var resp = await submitResult({ action:'atualizar_perfil', whatsapp: state.user.whatsapp, senha: state.user.password, campos: campos });
    btn.disabled = false; btn.textContent = 'Salvar alterações';
    if (!resp || !resp.ok){
      err.textContent = (resp && resp.erro) || 'Não foi possível salvar agora. Tente de novo.'; err.style.display = 'block'; return;
    }
    Object.keys(campos).forEach(function(k){ state.user[k] = campos[k]; });
    var rosterEntry = DATA.roster.find(function(r){ return normWhats(r.whatsapp) === state.user.whatsapp; });
    if (rosterEntry){ Object.keys(campos).forEach(function(k){ rosterEntry[k] = campos[k]; }); }
    toast('Perfil atualizado!');
    render();
  });
}

}

function goHome(){
  state.view = 'home'; state.manual = null;
  sincNav();
  if (servidorProtegido && state.user && conteudoEstado !== 'ok' && conteudoEstado !== 'falhou'){
    if (conteudoEstado !== 'carregando'){ carregarConteudoProtegido().then(function(){ if (state.view === 'home' && state.user) goHome(); }); }
    renderCarregandoConteudo();
    return;
  }
  var app = document.getElementById('app');
  if (!temPerm('portal')){ renderSemAcesso(); return; }
  var manualIds = (state.manuaisList && state.manuaisList.length)
    ? state.manuaisList.map(function(m){ return m.id; })
    : ['1','2','3']; // ninguém migrou pro Google Docs ainda -- usa os 3 manuais-semente embutidos
  var cards = manualIds.map(function(id){
    var nivelMinimo = manualNivelMinimo(id);
    var unlocked = podeManual(id);
    var prog = unlocked ? manualProgress(id) : null;
    var titulo = DATA.titles[id] || ('Manual ' + id);
    var blurb = DATA.blurbs[id] || '';
    return '<div class="card ' + (unlocked?'':'locked') + '" data-manual="' + esc(id) + '">' +
      '<div class="level-tag">' + (nivelMinimo >= 10 ? 'Em teste<span class="tmv-tag-teste">SÓ ADMINISTRADOR</span>' : 'Nível ' + nivelMinimo + (unlocked ? '' : ' · bloqueado')) + '</div>' +
      '<h3>' + esc(titulo) + '</h3>' +
      '<p>' + esc(blurb) + '</p>' +
      (unlocked ? (
        '<div class="progress-bar"><div style="width:' + prog.pct + '%"></div></div>' +
        '<div class="progress-label">' + prog.done + ' de ' + prog.total + ' capítulos lidos</div>'
      ) : '<div class="progress-label">Peça à gestão pra liberar este manual</div>') +
    '</div>';
  }).join('');
  var comp = perfilCompletude(state.user);
  var bannerPerfil = comp.pct < 100
    ? '<div class="perfil-banner" id="perfil-banner">' +
        '<span>📋 Complete seu perfil (' + comp.pct + '% preenchido) — leva menos de um minuto.</span>' +
        '<a href="#" id="link-completar-perfil" class="btn btn-primary btn-sm">Completar perfil</a>' +
      '</div>'
    : '';
  app.innerHTML = renderTopbar() +
    '<div class="shell"><div class="main" style="max-width:900px">' +
      bannerPerfil +
      '<div class="hero"><h1>Oi, ' + esc(state.user.name) + '!</h1><p>' + (state.user.perfil ? ('Seu perfil: ' + esc(state.user.perfil) + '. ') : ('Seu nível de acesso é ' + state.user.level + '. ')) + 'Escolha um manual para continuar.</p></div>' +
      '<div id="cv-slot"></div>' +
      '<div class="cards">' + (cards || '<p class="sub">Nenhum manual disponível ainda.</p>') + '</div>' +
    '</div></div>';
  empurrarHistorico('home', null);
  wireTopbar();
  carregarAvisoCurriculo();
  // Estagiário em diante sem CPF: faixa vermelha grande NESTA tela, sem ir a configurações
  if (window.TKConta && TKConta.precisaCpf(state.user)){
    var mainBox = document.querySelector('#app .main');
    if (mainBox) TKConta.faixaCpf(mainBox, { usuario: state.user,
      salvar: function(cpf){ return submitResult({ action:'salvar_identificadores', whatsapp: state.user.whatsapp, sessao: state.user.password, cpf: cpf }); },
      aoSalvar: function(r){
        var c = (r && r.usuario && r.usuario.cpf) || '';
        state.user.cpf = c;
        var re = DATA.roster.find(function(x){ return normWhats(x.whatsapp) === state.user.whatsapp; }); if (re) re.cpf = c;
        toast('CPF salvo! Obrigado.');
      } });
  }
  var linkPerfil = document.getElementById('link-completar-perfil');
  if (linkPerfil) linkPerfil.addEventListener('click', function(e){ e.preventDefault(); openPerfil(); });
  document.querySelectorAll('.card').forEach(function(el){
    el.addEventListener('click', function(){
      var id = el.getAttribute('data-manual');
      if (podeManual(id)) openManual(id);
    });
  });
}

/* ---------------- currículo na tela inicial (para TODOS os níveis; nunca some) ---------------- */
function cvBannerHtml(r){
  var st = r && r.ok ? r.estado : '';
  if (st === 'incompleto'){
    return '<div class="cv-aviso cv-incompleto"><h2>⚠️ Seu currículo está incompleto</h2><p>Falta pouco! Ainda falta:</p><ul>' + (r.faltando || []).map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul><a class="cv-btn" href="curriculo.html">Completar agora</a></div>';
  }
  if (st === 'completo'){
    return '<p class="cv-ok">✅ Currículo completo · <a href="curriculo.html">ver ou atualizar</a></p>';
  }
  if (st === 'menor'){
    return '<p class="cv-ok">📄 Quando completar 18 anos, será um prazer retomar seu currículo com você.</p>';
  }
  if (st === 'desistiu'){
    return '<div class="cv-aviso cv-desistiu"><h2>👋 Seu currículo ficou pausado</h2><p>Da última vez, seu currículo foi marcado como desistência. Se mudou de ideia, você pode reativar em poucos segundos.</p><a class="cv-btn" href="curriculo.html">Reativar meu currículo</a></div>';
  }
  // 'nenhum', servidor antigo ou sem rede: o cartão continua aparecendo
  return '<div class="cv-aviso"><h2>📄 Faça seu currículo</h2><p>Quer crescer com a gente? Envie seu currículo para a TENKiTER Modas. Leva poucos minutos.</p><a class="cv-btn" href="curriculo.html">Fazer meu currículo</a></div>';
}
async function carregarAvisoCurriculo(){
  if (!state.user) return;
  var slot = document.getElementById('cv-slot');
  if (slot) slot.innerHTML = cvBannerHtml(state.cvStatus && state.cvStatus.r); // já mostra algo na hora
  var st = state.cvStatus;
  if (!st || Date.now() - st.t > 60000){
    var r = await submitResult({ action:'curriculo_status', whatsapp: state.user.whatsapp, sessao: state.user.password });
    st = { t: Date.now(), r: (r && r.ok) ? r : null }; state.cvStatus = st;
  }
  slot = document.getElementById('cv-slot');
  if (!slot || (state.view !== 'home' && state.view !== 'semacesso')) return;
  slot.innerHTML = cvBannerHtml(st.r);
}
