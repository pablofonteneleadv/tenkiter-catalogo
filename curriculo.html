<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0d0d">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<title>Trabalhe na TENKiTER Modas</title>
<style>
  :root { --preto:#0d0d0d; --laranja:#E67E22; --ouro:#F39C12; --cinza:#F5F1E8; --branco:#fff; --verde:#198754; --vermelho:#c62828; --borda:#ddd; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Inter",-apple-system,Roboto,Arial,sans-serif; background:var(--cinza); color:var(--preto); line-height:1.45; }
  header { background:var(--preto); color:var(--laranja); padding:18px 16px; text-align:center; }
  header img { height:34px; vertical-align:middle; margin-right:8px; }
  header h1 { display:inline; font-size:1.05rem; vertical-align:middle; letter-spacing:.3px; }
  main { max-width:620px; margin:0 auto; padding:16px 16px 60px; }
  .card { background:var(--branco); border-radius:14px; padding:18px 16px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  h2 { font-size:1.15rem; margin:0 0 6px; }
  h3 { font-size:.98rem; margin:22px 0 4px; }
  p.sub { color:#555; font-size:.9rem; margin:0 0 14px; }
  label.campo { display:block; font-weight:600; font-size:.9rem; margin:16px 0 6px; }
  .obs { font-weight:400; color:#666; font-size:.82rem; display:block; margin-top:2px; }
  .obs-destaque { background:#fff4e5; border-left:3px solid var(--laranja); padding:8px 10px; border-radius:6px; font-size:.84rem; margin:6px 0 8px; font-weight:500; }
  input[type=text], input[type=email], input[type=password], input[type=tel], input[type=number], input[type=date], textarea {
    width:100%; padding:11px 12px; border:1px solid var(--borda); border-radius:9px; font-size:1rem; font-family:inherit; background:#fff; }
  textarea { min-height:90px; resize:vertical; }
  input:focus, textarea:focus { outline:2px solid var(--laranja); border-color:transparent; }
  .opcao { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--borda); border-radius:9px; margin-bottom:7px; cursor:pointer; background:#fff; font-size:.94rem; }
  .opcao input { margin-top:3px; accent-color:var(--laranja); flex:none; width:18px; height:18px; }
  .opcao:has(input:checked) { border-color:var(--laranja); background:#fff4e5; }
  button { font-family:inherit; font-size:1rem; font-weight:700; border:0; border-radius:10px; padding:13px 16px; cursor:pointer; width:100%; }
  .btn-p { background:var(--laranja); color:var(--preto); margin-top:20px; }
  .btn-s { background:#eee; color:#333; margin-top:10px; }
  .btn-l { background:none; color:#666; text-decoration:underline; font-weight:500; font-size:.85rem; width:auto; padding:6px 0; }
  button:disabled { opacity:.55; cursor:wait; }
  .erro { background:#fde3e3; color:var(--vermelho); padding:10px 12px; border-radius:9px; font-size:.9rem; margin-top:14px; font-weight:600; }
  .secao-situacoes { background:#fff4e5; border:2px solid var(--laranja); border-radius:14px; padding:16px 16px 6px; margin:34px 0 18px; }
  .secao-situacoes h3 { margin:0 0 10px; font-size:1.3rem; color:var(--laranja); }
  .secao-situacoes p { margin:0 0 10px; font-size:.95rem; line-height:1.5; }
  .aviso { background:#eef6ff; color:#1b4b7a; padding:10px 12px; border-radius:9px; font-size:.88rem; margin-bottom:12px; }
  .ref { background:#f6f6f6; border-radius:9px; padding:10px 12px; font-size:.84rem; color:#444; margin:8px 0; white-space:pre-wrap; }
  .ref b { display:block; margin-bottom:3px; color:#222; }
  .prog { height:6px; background:#e7e2d6; border-radius:4px; margin-bottom:14px; overflow:hidden; }
  .prog i { display:block; height:100%; background:var(--laranja); transition:width .3s; }
  .lgpd { font-size:.84rem; }
  .oculto { display:none !important; }
  .grande { text-align:center; padding:26px 18px; }
  .grande .emoji { font-size:2.2rem; }
  .links a { display:block; background:var(--preto); color:var(--laranja); text-decoration:none; padding:12px; border-radius:10px; font-weight:700; margin-top:10px; text-align:center; }
  .linha2 { display:flex; gap:10px; } .linha2 > * { flex:1; }
</style>
</head>
<body>
<header><img src="logo-mark.png" alt="" onerror="this.style.display='none'"><h1>TENKiTER Modas · Trabalhe com a gente</h1></header>
<main><div id="app"></div></main>

<script>
/* ==== configuração ==== */
const API = 'https://script.google.com/macros/s/AKfycbz5TfA0MqmKfc2deigXssPxLii_1yl-GyOokytCtnIqT4Uehja915MsUCvjHY4Z25TJ/exec'; // mesmo backend do treinamento (treinamentos.html)
const TOKEN = 'tenkiter2026';
const SITE_CATALOGO = 'https://tenkitermodas.com.br/';
const SITE_MANUAL = 'https://tenkitermodas.com.br/treinamentos.html';
const LGPD_TEXTO = 'Autorizo a TENKiTER Modas a guardar meus dados por até 2 anos, apenas para o cadastro e processos seletivos. Posso pedir a exclusão a qualquer momento pelo WhatsApp da loja: (88) 99322-3998.';

/* Alternativas: TÊM que ser idênticas às do servidor (CV_OP em Code-treinamento-v4.1.gs.txt) */
const OP = {
  moradia: ['Crateús, na cidade', 'Interior de Crateús, vou e volto todo dia', 'Interior de Crateús, mas tenho onde ficar na cidade', 'Outra cidade, vou e volto todo dia', 'Outra cidade, mas tenho onde ficar em Crateús', 'Nenhuma das anteriores'],
  chegada: ['A pé', 'Moto ou bicicleta', 'Transporte público ou carona', 'Outro'],
  vaga: ['Atendimento e vendas', 'Caixa', 'Reposição e estoque', 'Organização e provador', 'Liderança (sub encarregada ou encarregada)', 'Qualquer vaga'],
  salario: ['Acima de R$ 700', 'Acima de R$ 800', 'Acima de R$ 1.000', 'Acima de R$ 1.200', 'Acima de R$ 1.621,00'],
  inicio: ['Imediatamente', 'Em até 3 dias', 'Em até 15 dias', 'Em até 30 dias', 'Mais de 30 dias'],
  simnao: ['Sim', 'Não'],
  horario: ['Só pela manhã (a partir das 7:30h)', 'Só pela tarde (até 18:00h)', 'Manhã e tarde (com horário de almoço)'],
  fora: ['Somente horário comercial', 'Horário de comércio, inclusive domingos e feriados quando a loja abrir'],
  tipos: ['Loja de roupas ou moda', 'Outro comércio (mercado, farmácia etc.)', 'Restaurante ou lanchonete', 'Vendas por conta própria', 'Escritório ou serviços', 'Nenhum'],
  tarefas: ['Atender e vender', 'Caixa', 'Conferir e repor mercadoria', 'Vitrine', 'Sistema de vendas', 'WhatsApp ou Instagram', 'Nenhuma'],
  referencia: ['Sim, informo o contato', 'Prefiro informar depois', 'Não'],
  escolaridade: ['Fundamental incompleto', 'Fundamental completo', 'Médio incompleto', 'Médio completo', 'Superior ou técnico em andamento', 'Superior ou técnico completo'],
  troca: ['Escuto, explico a regra com calma e ofereço a solução possível', 'Chamo a encarregada', 'Faço a troca para evitar confusão', 'Explico que é a política da loja e encerro'],
  troco: ['Aviso a colega discretamente na hora', 'Converso com ela depois do movimento', 'Aviso a encarregada', 'Não me envolvo'],
  meta: ['Aumento o ritmo e abordo mais clientes', 'Peço ajuda a uma colega mais experiente', 'Aviso a chefia e pergunto o que fazer', 'Espero o movimento melhorar'],
  tres: ['Cumprimento os três e atendo por ordem de chegada', 'Atendo quem parece mais disposto a comprar', 'Peço ajuda a uma colega', 'Atendo um sem falar com os outros'],
  motiva: ['Comissão e meta', 'Crescer na empresa', 'Estabilidade', 'Bom ambiente', 'Atender bem o cliente'],
  origem: ['Instagram', 'Indicação', 'Cliente da loja', 'Cartaz na loja', 'Outro']
};

/* ==== utilidades ==== */
const $app = document.getElementById('app');
function loginLocal() { try { const x = JSON.parse(localStorage.getItem('tm_session') || 'null'); return x && x.whatsapp && x.sessao ? x : null; } catch (e) { return null; } }
const S = { login: loginLocal(), fotoUrl: '', enviado: false, email: '', cvToken: '', prefill: {}, nome: '', whats: '', sessao: '', d: {}, desafio: null, trocou: false, passo: 0, tmp: {} };
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
async function api(action, corpo) {
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ token: TOKEN, action }, corpo || {})) });
    return await r.json();
  } catch (e) { return { ok: false, erro: 'Sem conexão. Verifique a internet e tente de novo.' }; }
}
function tela(html) { $app.innerHTML = html; window.scrollTo(0, 0); }
function erroBox(msg) { const e = document.getElementById('erro'); if (e) { e.textContent = msg || ''; e.classList.toggle('oculto', !msg); if (msg) e.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }
function carregando(btn, on) { if (btn) { btn.disabled = on; btn.dataset.t = btn.dataset.t || btn.textContent; btn.textContent = on ? 'Aguarde…' : btn.dataset.t; } }
const val = n => { const e = document.querySelector('[name="' + n + '"]'); return e ? e.value.trim() : ''; };
const radio = n => { const e = document.querySelector('input[name="' + n + '"]:checked'); return e ? e.value : ''; };
const checks = n => Array.from(document.querySelectorAll('input[name="' + n + '"]:checked')).map(e => e.value);
function radios(n, lista, atual) { return lista.map(o => `<label class="opcao"><input type="radio" name="${n}" value="${esc(o)}" ${o === atual ? 'checked' : ''}><span>${esc(o)}</span></label>`).join(''); }
function caixas(n, lista, atuais, max) { return lista.map(o => `<label class="opcao"><input type="checkbox" name="${n}" value="${esc(o)}" ${(atuais || []).indexOf(o) !== -1 ? 'checked' : ''} ${max ? 'data-max="' + max + '"' : ''}><span>${esc(o)}</span></label>`).join(''); }
function progresso(p) { return `<div class="prog"><i style="width:${p}%"></i></div>`; }
function idade(iso) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); if (!m) return null; const h = new Date(); let i = h.getFullYear() - +m[1]; if (h.getMonth() + 1 < +m[2] || (h.getMonth() + 1 === +m[2] && h.getDate() < +m[3])) i--; return i; }
/* Data de nascimento como texto com máscara (dd/mm/aaaa) em vez de calendário nativo -- mais rápido de preencher no celular. */
function maskNasc(v) {
  const d = String(v || '').replace(/\D/g, '').slice(0, 8);
  if (d.length > 4) return d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4);
  if (d.length > 2) return d.slice(0, 2) + '/' + d.slice(2);
  return d;
}
function nascValida(v) {
  const m = String(v || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (!m) return false;
  const dia = +m[1], mes = +m[2], ano = +m[3];
  return mes >= 1 && mes <= 12 && dia >= 1 && dia <= 31 && ano >= 1900 && ano <= new Date().getFullYear();
}
function nascISO(v) { const m = String(v || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? m[3] + '-' + m[2] + '-' + m[1] : ''; }
function wireNasc(input) { if (input) input.addEventListener('input', () => { input.value = maskNasc(input.value); }); }
/* WhatsApp sempre com 11 dígitos (ddd + 9 + nnnnnnnn). Número antigo de 10 dígitos ganha o "9" de volta. */
function normWhats11(w) {
  let d = String(w || '').replace(/\D/g, '');
  if (d.length >= 12 && d.startsWith('55')) d = d.slice(2);
  if (d.length === 10) d = d.slice(0, 2) + '9' + d.slice(2);
  return d;
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches && t.matches('input[type=checkbox][data-max]')) {
    const max = +t.dataset.max; const marcados = document.querySelectorAll('input[name="' + t.name + '"]:checked');
    if (marcados.length > max) { t.checked = false; alert('Escolha no máximo ' + max + '.'); }
  }
  condicionais();
});
function condicionais() {
  const mostra = (id, ok) => { const el = document.getElementById(id); if (el) el.classList.toggle('oculto', !ok); };
  mostra('bloco-horarios', radio('ritmo') === 'Não');
  mostra('nota-ritmo-sim', radio('ritmo') === 'Sim');
  mostra('bloco-experiencia', radio('jaTrabalhou') === 'Sim');
  mostra('bloco-nao-trabalhou', radio('jaTrabalhou') === 'Não');
  mostra('bloco-lider', radio('liderou') === 'Sim');
  mostra('bloco-ref', radio('referencia') === OP.referencia[0]);
}

/* ==== 1. WhatsApp ==== */
function viewWhats(msg) {
  tela(`${progresso(3)}<div class="card">
    <h2>Envie seu currículo</h2>
    <p class="sub">Leva poucos minutos. Se você já preencheu nosso formulário antes, vamos buscar seus dados para você não digitar tudo de novo.</p>
    <label class="campo" for="whats0">Seu WhatsApp (com DDD)</label>
    <input type="tel" id="whats0" name="whats0" autocomplete="tel" inputmode="tel" placeholder="(88) 9 9999-9999" value="${esc(S.login ? S.login.whatsapp : S.whats)}" ${S.login ? 'disabled' : ''}>
    <div class="erro ${msg ? '' : 'oculto'}" id="erro">${esc(msg || '')}</div>
    <button class="btn-p" id="ok">Continuar</button></div>`);
  const b = document.getElementById('ok');
  b.onclick = async () => {
    const w = normWhats11(S.login ? S.login.whatsapp : val('whats0'));
    if (w.length < 10 || w.length > 11) return erroBox('Digite o WhatsApp com DDD.');
    S.whats = w; carregando(b, true);
    if (S.login) {
      // Já está logada no site (ex: veio pelo botão "Completar agora" do treinamentos.html). Nunca manda
      // de volta pro treinamentos.html aqui -- isso criava um vai-e-volta sem fim, porque quem está
      // logada SEMPRE tem conta, e o treinamentos.html manda de volta pra cá. Em vez disso, continua
      // (ou começa, se ainda não existir) o currículo dela direto.
      const rs = await api('curriculo_retomar', { whatsapp: S.login.whatsapp, sessao: S.login.sessao });
      carregando(b, false);
      if (rs.ok) return entrarRetomada(rs);
      if (rs.sessaoInvalida) { try { localStorage.removeItem('tm_session'); } catch (e) {} S.login = null; return viewWhats('Sua sessão expirou. Digite seu WhatsApp para continuar.'); }
      return viewCadastro(''); // conta existe mas ainda não tem currículo começado
    }
    const r = await api('curriculo_iniciar', { whatsapp: w }); carregando(b, false);
    if (!r.ok) return erroBox(r.erro);
    if (r.modo === 'conta') {
      // já é conta de verdade no site (funcionária, aluna etc.) mas não estava logada aqui: entra
      // pelo portal com a senha de sempre -- lá, se faltar currículo, o próprio portal já mostra
      // o aviso pra completar (e o botão já volta logada, sem cair aqui de novo).
      location.href = SITE_MANUAL; return;
    }
    if (r.modo === 'retomar') return viewRetomar();
    if (r.modo === 'verificar') { S.desafio = r; S.trocou = false; S.mostradas = null; S.passo = 0; return viewVerificar(); }
    viewCadastro(r.esgotado ? 'Não conseguimos confirmar seus dados antigos. Sem problema: preencha de novo, é rapidinho.' : '');
  };
}

/* ==== 2. verificação (3 perguntas) ==== */
function viewVerificar(aviso) {
  const perguntas = S.desafio.perguntas;
  S.mostradas = S.mostradas || perguntas.slice(0, 3).map(p => p.id);
  const lista = S.mostradas.map(id => perguntas.find(p => p.id === id));
  const temExtra = !S.trocou && perguntas.length > 3;
  tela(`${progresso(8)}<div class="card">
    <h2>Só para confirmar que é você</h2>
    <p class="sub">Você já preencheu nosso formulário antes. Responda 3 perguntas rápidas sobre o que você informou naquela vez.</p>
    ${aviso ? `<div class="aviso">${esc(aviso)}</div>` : ''}
    ${lista.map((p, i) => `<h3>${i + 1}. ${esc(p.texto)}</h3>${radios('v_' + p.id, p.opcoes, '')}${temExtra ? `<button class="btn-l" data-troca="${esc(p.id)}">Não tenho certeza — outra pergunta</button>` : ''}`).join('')}
    <div class="erro oculto" id="erro"></div>
    <button class="btn-p" id="ok">Confirmar</button>
    <button class="btn-s" id="novo">Prefiro preencher tudo de novo</button></div>`);
  document.querySelectorAll('[data-troca]').forEach(b => b.onclick = () => {
    const sai = b.dataset.troca; const ent = perguntas.find(p => S.mostradas.indexOf(p.id) === -1);
    S.mostradas = S.mostradas.map(id => id === sai ? ent.id : id); S.trocou = true; viewVerificar();
  });
  document.getElementById('novo').onclick = () => { S.mostradas = null; viewCadastro(''); };
  const ok = document.getElementById('ok');
  ok.onclick = async () => {
    const respostas = {}; for (const id of S.mostradas) { const v = radio('v_' + id); if (!v) return erroBox('Responda as 3 perguntas.'); respostas[id] = v; }
    carregando(ok, true); const r = await api('curriculo_verificar', { desafioId: S.desafio.desafioId, respostas }); carregando(ok, false);
    if (!r.ok) return erroBox(r.erro);
    if (r.verificado) { S.cvToken = r.cvToken; S.prefill = r.prefill || {}; S.mostradas = null; return viewCadastro('Pronto! Preenchemos o que já sabíamos. Confira e corrija se precisar.'); }
    if (r.esgotado) { S.mostradas = null; return viewCadastro('Não conseguimos confirmar seus dados antigos. Sem problema: preencha de novo, é rapidinho.'); }
    viewVerificar('Alguma resposta não bateu. Você tem mais uma tentativa.');
  };
}

/* ==== retomar (quem já começou) ==== */
function viewRetomar(msg) {
  tela(`${progresso(8)}<div class="card">
    <h2>Que bom ver você de novo!</h2>
    <p class="sub">Já existe um cadastro com o WhatsApp <b>${esc(S.whats)}</b>. Digite a senha que você criou para continuar ou atualizar seu currículo.</p>
    <label class="campo" for="senha">Sua senha</label>
    <input type="password" id="senha" name="senha" autocomplete="current-password">
    <div class="erro ${msg ? '' : 'oculto'}" id="erro">${esc(msg || '')}</div>
    <button class="btn-p" id="ok">Entrar</button>
    <button class="btn-s" id="voltar">Voltar</button></div>`);
  document.getElementById('voltar').onclick = () => viewWhats();
  const b = document.getElementById('ok');
  b.onclick = async () => {
    const senha = document.getElementById('senha').value; if (!senha) return erroBox('Digite a senha.');
    carregando(b, true); const r = await api('curriculo_retomar', { whatsapp: S.whats, senha }); carregando(b, false);
    if (!r.ok) return erroBox(r.erro);
    entrarRetomada(r);
  };
}
function entrarRetomada(r) {
  S.nome = r.nome; S.whats = r.whatsapp; S.sessao = r.sessao; S.fotoUrl = r.fotoUrl || ''; S.enviado = !!r.enviado; if (r.email) S.email = r.email;
  S.d = dadosDoServidor(r.dados || {});
  if (r.status === 'Desistiu') return viewDesistiu();
  if (r.menor) return viewMenor();
  if (r.etapa === 'Instagram' || r.etapa === 'Sem Instagram') return viewInstagram(S.d.instagram || '');
  if (r.etapa === 'Foto') return viewFoto();
  S.passo = 0; viewPerfil();
}
/* ==== quem marcou "desistiu" antes: oferece reativar o próprio currículo ==== */
function viewDesistiu() {
  const primeiro = esc((S.nome || '').split(' ')[0] || '');
  tela(`${progresso(8)}<div class="card grande">
    <div class="emoji">👋</div>
    <h2>Que bom ver você de novo${primeiro ? ', ' + primeiro : ''}!</h2>
    <p>Seu currículo ficou marcado como <b>desistência</b> da última vez. Se você mudou de ideia e quer voltar a concorrer à vaga, é só reativar.</p>
    <div class="erro oculto" id="erro"></div>
    <button class="btn-p" id="reativar">Quero reativar meu currículo</button>
    <button class="btn-s" id="sair">Não, deixa como está</button></div>`);
  document.getElementById('sair').onclick = () => { tela('<div class="card grande"><p>Tudo bem! Se mudar de ideia, é só voltar aqui.</p></div>'); };
  const b = document.getElementById('reativar');
  b.onclick = async () => {
    carregando(b, true);
    const r = await api('curriculo_reativar', { whatsapp: S.whats, sessao: S.sessao });
    carregando(b, false);
    if (!r.ok) return erroBox(r.erro || 'Não foi possível reativar agora. Tente de novo em alguns minutos.');
    const rs = await api('curriculo_retomar', { whatsapp: S.whats, sessao: S.sessao });
    if (!rs.ok) return erroBox(rs.erro || 'Reativamos, mas não conseguimos continuar automaticamente. Recarregue a página.');
    entrarRetomada(rs);
  };
}
function dadosDoServidor(x) {
  const lista = t => t ? String(t).split(' | ').filter(Boolean) : [];
  return { instagram: x.Instagram, vaga: lista(x.Vaga), salario: x.Salario, inicio: x.Inicio, ritmo: x.Ritmo, horario: x.Horario, fora: x.ForaHorario, impedimento: x.Impedimento,

/* ==== 4b. foto de perfil (obrigatória) ==== */
function reduzirImagem(arquivo, maxLado, qualidade) {
  return new Promise((ok, falha) => {
    const img = new Image(), url = URL.createObjectURL(arquivo);
    img.onload = () => {
      const k = Math.min(1, maxLado / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', qualidade));
    };
    img.onerror = () => { URL.revokeObjectURL(url); falha(new Error('imagem')); };
    img.src = url;
  });
}

      <input type="file" id="arq" accept="image/*" hidden>

    <label class="campo" for="obs">Alguma observação? <span class="obs">Opcional.</span></label><textarea id="obs" name="obs" maxlength="600">${esc(d.obs || '')}</textarea>`;
  tela(`${progresso(30 + p * 17)}<div class="card">
    <p class="sub" style="margin-bottom:4px">Etapa ${p + 1} de ${PASSOS.length}</p><h2>${PASSOS[p]}</h2>${S.enviado && p === 0 ? '<p class="sub" style="background:#e8f5ec;border-radius:9px;padding:9px 11px;margin:8px 0">✅ Você já enviou seu currículo. Pode rever e atualizar as respostas; ao final, toque em <b>Enviar currículo</b> de novo para salvar.</p>' : ''}
    ${corpo}
    <div class="erro ${msg ? '' : 'oculto'}" id="erro">${esc(msg || '')}</div>
    <button class="btn-p" id="ok">${p === PASSOS.length - 1 ? 'Enviar currículo' : 'Continuar'}</button>
    ${p > 0 ? '<button class="btn-s" id="volta">Voltar</button>' : ''}</div>`);
  condicionais();
  if (p > 0) document.getElementById('volta').onclick = () => { coletar(); S.passo--; viewPerfil(); };
  const b = document.getElementById('ok');
  b.onclick = async () => {
    coletar(); const e = validarPasso(p); if (e) return erroBox(e);
    if (p < PASSOS.length - 1) { S.passo++; return viewPerfil(); }
    if (!S.fotoUrl) return travaFinal('foto');
    carregando(b, true); const r = await api('curriculo_finalizar', { whatsapp: S.whats, sessao: S.sessao, dados: S.d }); carregando(b, false);
    if (!r.ok) { if (/foto de perfil/i.test(r.erro || '')) return travaFinal('foto'); if (/Instagram/i.test(r.erro || '')) return travaFinal('insta'); return erroBox(r.erro); }
    viewFim();
  };
}
/* Sem foto de perfil (ou sem Instagram) o currículo NÃO é salvo: leva a pessoa para completar e volta ao final. */
function travaFinal(o) {
  S.passoSalvo = S.passo;
  const e = document.getElementById('erro'); if (!e) return;
  e.classList.remove('oculto');
  e.innerHTML = o === 'foto' ? 'Seu currículo só pode ser salvo <b>com foto de perfil</b>. <button class="btn-s" id="trava-go" style="margin-top:8px">Enviar minha foto agora</button>'
    : 'Seu currículo só pode ser salvo <b>com Instagram válido</b>. <button class="btn-s" id="trava-go" style="margin-top:8px">Informar meu Instagram agora</button>';
  document.getElementById('trava-go').onclick = () => { coletar(); o === 'foto' ? viewFoto() : viewInstagram(S.d.instagram || ''); };
  e.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function coletar() {
  const d = S.d, t = n => { if (document.querySelector('[name="' + n + '"]')) d[n] = val(n); };
  const rd = n => { if (document.querySelector('input[name="' + n + '"]')) d[n] = radio(n); };
  const ck = n => { if (document.querySelector('input[name="' + n + '"]')) d[n] = checks(n); };
  ['vaga', 'tiposEmpresa', 'tarefas', 'motiva'].forEach(ck);
  ['salario', 'inicio', 'ritmo', 'horario', 'fora', 'jaTrabalhou', 'liderou', 'referencia', 'escolaridade', 'troca', 'troco', 'meta', 'tres', 'origem'].forEach(rd);
  ['impedimento', 'ultEmpresa', 'ultFuncao', 'ultMeses', 'ultMotivo', 'liderQuantos', 'refContato', 'cursos', 'situacao', 'porQue', 'conheceAlguem', 'obs'].forEach(t);
}
function validarPasso(p) {
  const d = S.d, f = x => !x || (Array.isArray(x) && !x.length);
  if (p === 0) {
    if (f(d.vaga)) return 'Escolha a vaga que você procura.';
    if (f(d.salario)) return 'Escolha o salário que você espera.';
    if (f(d.inicio)) return 'Diga quando você poderia começar.';
    if (f(d.ritmo)) return 'Responda se você consegue trabalhar no horário do comércio.';
    if (d.ritmo === 'Não' && f(d.horario)) return 'Escolha seu horário disponível.';
    if (d.ritmo === 'Não' && f(d.fora)) return 'Diga se você trabalha fora do horário comercial.';
  }
  if (p === 1) {
    if (f(d.jaTrabalhou)) return 'Responda se você já trabalhou.';
    if (d.jaTrabalhou === 'Sim') {
      if (f(d.ultEmpresa) || f(d.ultFuncao) || f(d.ultMotivo) || d.ultMeses === '' || d.ultMeses == null) return 'Preencha empresa, função, tempo e motivo da saída.';
      if (f(d.tiposEmpresa)) return 'Escolha os tipos de empresa em que você já trabalhou.';
      if (f(d.tarefas)) return 'Escolha as tarefas que você já fez.';
      if (f(d.liderou)) return 'Responda se você já liderou uma equipe.';
      if (d.liderou === 'Sim' && f(d.liderQuantos)) return 'Diga quantas pessoas e por quanto tempo.';
      if (f(d.referencia)) return 'Responda sobre a referência.';
      if (d.referencia === OP.referencia[0] && f(d.refContato)) return 'Informe nome e telefone da referência.';
    }
  }
  if (p === 2) {
    if (f(d.escolaridade)) return 'Escolha sua escolaridade.';
    if (f(d.troca) || f(d.troco) || f(d.meta) || f(d.tres)) return 'Responda as 4 perguntas de "Como você agiria?".';
    if (f(d.motiva)) return 'Escolha até 2 coisas que mais te motivam.';
    if (!d.situacao || d.situacao.length < 10) return 'Conte uma situação em que você resolveu um problema.';
    if (!d.porQue || d.porQue.length < 5) return 'Conte por que você quer trabalhar na TENKiTER.';
  }
  if (p === 3 && f(d.origem)) return 'Diga como conheceu a vaga.';
  return '';
}

function viewFim() {
  tela(`${progresso(100)}<div class="card grande">
    <div class="emoji">✅</div>
    <h2>Currículo enviado!</h2>
    <p>Obrigado, ${esc((S.nome || '').split(' ')[0])}! Recebemos suas informações. Se houver uma vaga com o seu perfil, entramos em contato pelo WhatsApp.</p>
    <div style="background:#fff3e0;border:2px solid var(--laranja);border-radius:12px;padding:14px;margin:16px 0;text-align:left">
      <p style="margin:0 0 8px"><b>📚 Aproveite enquanto espera</b></p>
      <p style="margin:0 0 8px">Mesmo sem ter entrado na nossa loja, <b>você já tem um manual de treinamento liberado</b> no nosso site de cursos.</p>
      <p style="margin:0 0 12px">Conhecer o conteúdo <b>antes da entrevista soma pontos</b>: mostra interesse e já te deixa por dentro do jeito TENKiTER de atender.</p>
      <a href="${SITE_MANUAL}" style="display:block;text-align:center;background:var(--preto);color:var(--laranja);text-decoration:none;padding:13px;border-radius:10px;font-weight:800">Acessar o site de treinamento</a>
    </div>
    <p class="sub">Seu currículo continua salvo: para rever ou atualizar quando quiser, entre no site de treinamento e toque na sua foto de perfil → <b>Meu currículo</b>. Seus dados ficam guardados por até 2 anos; para pedir a exclusão, fale com a loja: (88) 99322-3998.</p>
    <div class="links"><a href="${SITE_CATALOGO}">Conhecer o catálogo</a></div></div>`);
}

(async () => {
  if (S.login) {
    tela('<div class="card grande">Carregando…</div>');
    const r = await api('curriculo_retomar', { whatsapp: S.login.whatsapp, sessao: S.login.sessao });
    if (r.ok) return entrarRetomada(r);
  }
  viewWhats();
})();
</script>
