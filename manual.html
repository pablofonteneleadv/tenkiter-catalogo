bul","level":0,"text":"Nunca prometer o que não pode garantir (prazo de entrega, disponibilidade não confirmada, desconto não autorizado)."},{"type":"bul","level":0,"text":"Toda venda iniciada pelo WhatsApp deve ser registrada no sistema, com vendedor identificado."}]},{"title":"Catálogo, fotos e Stories no Instagram","blocks":[{"type":"bul","level":0,"text":"Seguir os mesmos cuidados de fotografia usados no catálogo digital."},{"type":"bul","level":0,"text":"Nos Stories: sequência lógica, preço, chamada para ação, disponibilidade e bom horário de postagem."}]},{"title":"Reservas pelo WhatsApp e entregas","blocks":[{"type":"bul","level":0,"text":"Reserva pelo WhatsApp segue a mesma regra da reserva presencial: prazo combinado, registro visível."},{"type":"bul","level":0,"text":"Entregas: definir quem pode sair e quando, nunca deixando uma função crítica descoberta."},{"type":"bul","level":0,"text":"Pagamento na entrega (dinheiro): trazer o comprovante/registro para lançamento no caixa assim que possível."}]}]},{"title":"RESPONSABILIDADES AMPLIADAS","chapters":[{"title":"O papel de quem assume mais responsabilidade na loja","blocks":[{"type":"p","text":"Este manual assume que você já domina todo o conteúdo do manual anterior. A partir daqui, o que muda não são as regras — é o alcance da sua responsabilidade dentro delas.","bold":false},{"type":"bul","level":0,"text":"Você passa a ser a primeira instância de apoio para quem está aprendendo, e o ponto de contato antes de qualquer situação chegar à Karla ou ao Pablo."},{"type":"bul","level":0,"text":"Isso não muda seu vínculo nem seu cargo formal — é uma expectativa de conduta, não um título."}]},{"title":"Avaliando pedidos de exceção (troca, desconto, prazo)","blocks":[{"type":"p","text":"Quando alguém trouxer um pedido fora da regra padrão, use este raciocínio antes de decidir ou encaminhar:","bold":false},{"type":"bul","level":0,"text":"1. A regra existe por um motivo — qual é o motivo aqui, e ele se aplica a este caso?"},{"type":"bul","level":0,"text":"2. Qual é o impacto real de abrir a exceção (financeiro, precedente com outros clientes, risco de reclamação)?"},{"type":"bul","level":0,"text":"3. Existe uma solução intermediária que atende o cliente sem violar a regra por completo?"},{"type":"bul","level":0,"text":"4. Você tem elementos suficientes para decidir, ou a decisão exige informação que só a gestão tem (ex.: histórico financeiro do caso)?"},{"type":"bul","level":0,"text":"Se depois desse raciocínio ainda houver dúvida real, encaminhe para Karla ou Pablo com o raciocínio já feito — isso agiliza a resposta e mostra domínio do processo."},{"type":"bul","level":0,"text":"Nunca prometa a exceção ao cliente antes de decidir — combine primeiro, avise depois."}]},{"title":"Investigando divergência de caixa","blocks":[{"type":"bul","level":0,"text":"Antes de acionar a gestão, faça a checagem básica: reconte o dinheiro físico, confira se todos os PIX e cartões do turno foram lançados, e veja se houve alguma sangria ou suprimento sem registro."},{"type":"bul","level":0,"text":"Converse individualmente com quem operou o caixa no turno — sem acusar, apenas reconstruindo a sequência dos fatos."},{"type":"bul","level":0,"text":"Documente o que encontrou (valores, horários, quem esteve no caixa) antes de reportar — isso evita que o mesmo problema tenha que ser investigado duas vezes."},{"type":"bul","level":0,"text":"Divergência pequena e explicável (troco arredondado, por exemplo) pode ser resolvida e registrada por você. Divergência sem explicação clara, ou de valor relevante, é sempre reportada à gestão, com o que você já apurou."}]},{"title":"Mediando conflitos entre colegas","blocks":[{"type":"p","text":"Este é o mesmo protocolo de conflitos que todos seguem — aqui, o papel de recolher os relatos e propor um encaminhamento é seu, antes de escalar.","bold":false},{"type":"bul","level":0,"text":"Ouça cada pessoa envolvida separadamente, sem interromper, antes de formar uma opinião."},{"type":"bul","level":0,"text":"Não tome partido publicamente, mesmo que a razão pareça óbvia — isso preserva sua capacidade de mediar o próximo conflito."},{"type":"bul","level":0,"text":"Diferencie um desentendimento pontual (que você pode resolver com uma conversa) de um padrão de comportamento (que precisa ser reportado, porque pode indicar algo maior)."},{"type":"bul","level":0,"text":"Registre o que foi combinado ao final, mesmo que informalmente, para poder acompanhar se a situação realmente se resolveu."}]},{"title":"Dando feedback e conduzindo conversas difíceis","blocks":[{"type":"bul","level":0,"text":"Feedback deve ser direto, objetivo e dado em particular — nunca na frente de clientes ou de outros colegas."},{"type":"bul","level":0,"text":"Comece pelo fato observável (\"a peça foi lançada com o vendedor errado três vezes esta semana\"), não pela suposição de intenção (\"você não presta atenção\")."},{"type":"bul","level":0,"text":"Elogio também é feedback: reconhecer o que foi bem feito, de forma específica, ajuda tanto quanto corrigir o que saiu errado."},{"type":"bul","level":0,"text":"Faltas leves geram conversa e orientação registrada; reincidência ou faltas graves seguem o processo formal definido pela gestão — você prepara o relato, a gestão decide a medida."}]},{"title":"Treinando e avaliando quem está chegando","blocks":[{"type":"bul","level":0,"text":"Você é responsável por acompanhar o plano de integração de sete dias de quem está começando, e por aplicar o checklist de aptidão ao final da primeira semana."},{"type":"bul","level":0,"text":"Ensine mostrando o \"porquê\" da regra, não só o \"o quê\" — quem entende o motivo erra menos e questiona menos."},{"type":"bul","level":0,"text":"Corrija no momento, com calma, longe do cliente. Corrigir depois de horas perde o efeito; corrigir na frente do cliente humilha e não ensina."},{"type":"bul","level":0,"text":"Reporte à gestão quem está indo bem e quem está com dificuldade real — isso é insumo direto para decisões de continuidade e crescimento."}]},{"title":"Segurando a loja em uma emergência","blocks":[{"type":"bul","level":0,"text":"Até a gestão chegar ou ser contatada, você é quem toma as decisões imediatas: priorizar a segurança de clientes e colegas, isolar a área se necessário, e decidir se a loja continua ou pausa o atendimento."},{"type":"bul","level":0,"text":"Documente o que aconteceu assim que a situação estiver controlada — hora, o que foi feito, quem esteve envolvido — enquanto está fresco na memória."},{"type":"bul","level":0,"text":"Nunca assuma sozinho(a) uma decisão irreversível (chamar a polícia, fechar a loja, demitir alguém em público) sem tentar contato com a gestão primeiro, salvo risco imediato à segurança."}]}]},{"title":"SEGURANÇA E SITUAÇÕES-PROBLEMA","chapters":[{"title":"Suspeita de furto e prevenção de perdas","blocks":[{"type":"bul","level":0,"text":"Em caso de comportamento suspeito, não confrontar fisicamente o suspeito em nenhuma hipótese."},{"type":"bul","level":0,"text":"Comunicar discretamente ao responsável presente."}]},{"title":"Cliente difícil ou agressivo","blocks":[{"type":"bul","level":0,"text":"Manter a calma e não entrar em discussão na frente de outros clientes."},{"type":"bul","level":0,"text":"Se não conseguir resolver, chamar o responsável imediatamente."}]},{"title":"Sistema fora do ar, acidentes e emergências","blocks":[{"type":"bul","level":0,"text":"Sistema fora do ar: interromper vendas que dependem dele e informar o responsável imediatamente."},{"type":"bul","level":0,"text":"Emergências: priorizar a segurança das pessoas antes de qualquer produto ou venda."}]}]}],"glossary":[["Termo","Significado"],["PDV","Sistema de ponto de venda usado na loja para registrar vendas, caixa e estoque."],["AUT","Código de autorização gerado pela maquininha de cartão."],["LINK","Link de pagamento enviado ao cliente — mercadoria só é entregue após confirmação do Pablo."],["PIX","Pagamento instantâneo — só é considerado confirmado após validação de Karla ou Pablo."],["Fiado / Crediário","Venda a prazo, permitida somente com autorização prévia."],["Troca","Substituição de peça já comprada, dentro do prazo e das condições da política de troca."],["Reserva","Peça separada temporariamente para uma cliente, por prazo combinado."],["Vendedor","Colaborador responsável pelo atendimento que gera a comissão da venda."],["Encarregado(a)","Colaborador com responsabilidade ampliada de apoio e orientação no dia a dia."],["Gestão","Karla e/ou Pablo — decisão final em exceções e casos não previstos."]],"termo":{"title":"TERMO DE CIÊNCIA","blocks":[{"type":"p","text":"Declaro que li e compreendi o Manual TM Funcionário Avançado, incluindo todo o conteúdo do manual operacional e as responsabilidades ampliadas de apoio, mediação e coordenação do dia a dia nele descritas, comprometendo-me a exercê-las com responsabilidade.","bold":false},{"type":"p","text":"Nome: ____________________________________________","bold":false},{"type":"p","text":"Data: ____/____/______        Assinatura: ____________________________________________","bold":false}]},"closing":null}},"titles":{"1":"TM Funcionário Iniciando","2":"TM Funcionário Estágio","3":"TM Funcionário Avançado"},"blurbs":{"1":"Leitura rápida para quem vai ser entrevistado.","2":"O manual completo de operação do dia a dia.","3":"Responsabilidades ampliadas de apoio e coordenação."},"quizzes":{"1":{"title":"Avaliação — TM Funcionário Iniciando","pass":0.7,"questions":[{"q":"Uma cliente entra na loja. O que você faz?","options":["Espera ela chegar perto do caixa","Cumprimenta na hora — bom dia, boa tarde ou boa noite","Termina a tarefa que estava fazendo primeiro","Só cumprimenta se ela olhar pra você"],"correct":1,"explain":"Cumprimentar sempre, na hora, é regra — nunca esperar a cliente tomar a iniciativa."},{"q":"Você precisa faltar um dia de trabalho. O que é certo fazer?","options":["Avisar um colega e pronto","Só não aparecer e explicar depois","Pedir autorização direta à gestão da loja, com antecedência","Avisar pelo status do WhatsApp"],"correct":2,"explain":"Ausência sem autorização direta da gestão é proibida — antecedência é o combinado."},{"q":"Você errou durante um atendimento (por exemplo, passou o preço errado). A atitude certa é:","options":["Corrigir sozinho(a), sem falar com ninguém","Esperar alguém perceber","Avisar na hora, sem tentar esconder","Só contar se perguntarem"],"correct":2,"explain":"Erro avisado na hora é só um problema pequeno. Erro escondido é que vira prejuízo."},{"q":"Tem cliente entrando e você está dobrando roupa. O que vem primeiro?","options":["Terminar de dobrar a peça","Atender o cliente na hora","Chamar outro colega e continuar dobrando","Depende do dia"],"correct":1,"explain":"Cliente sempre em primeiro lugar — tarefa secundária espera."},{"q":"Sobre o visual, qual dessas é uma regra do manual?","options":["Chinelo tipo havaiana é permitido se estiver limpo","Roupa de baixo sempre em cor escura e sem rasgos","Estampas grandes são incentivadas","Não existe regra de vestimenta"],"correct":1,"explain":"Calça/legging sempre em cor escura e sem rasgos — chinelo tipo havaiana não é permitido."},{"q":"Você não sabe como fazer uma tarefa nova. O que fazer?","options":["Tentar sozinho(a) e ver no que dá","Fingir que sabe","Perguntar — não saber não é problema","Esperar alguém perceber que você não sabe"],"correct":2,"explain":"Problema é fazer errado por vergonha de perguntar, não o fato de não saber."}]},"2":{"title":"Avaliação — TM Funcionário Estágio","pass":0.7,"questions":[{"q":"Qual o prazo padrão para troca de uma peça?","options":["3 dias corridos","7 dias corridos","15 dias corridos","30 dias corridos"],"correct":1,"explain":"Prazo padrão: 7 dias corridos a partir da compra."},{"q":"Uma peça sem etiqueta pode ser trocada?","options":["Sim, com autorização","Sim, se for defeito de fábrica","Não, em hipótese nenhuma","Sim, dentro do prazo de 7 dias"],"correct":2,"explain":"Regra absoluta: não trocamos peça sem etiqueta, sem exceção."},{"q":"Uma cliente manda o print do PIX como comprovante. Isso já libera a entrega da mercadoria?","options":["Sim, print de PIX confirma o pagamento","Não — só entrega após confirmação de Karla ou Pablo","Sim, se o valor for pequeno","Depende do horário"],"correct":1,"explain":"Print de PIX não é confirmação de pagamento. Só Karla ou Pablo confirmam."},{"q":"No pagamento por cartão, quando a venda pode ser finalizada?","options":["Assim que o cliente diz que pagou","Só depois que a máquina aprovar e o comprovante sair","Antes de passar o cartão, pra agilizar","Não precisa esperar aprovação"],"correct":1,"explain":"Só finaliza depois da aprovação da máquina e do comprovante."},{"q":"Uma cliente quer comprar fiado (a prazo). O que fazer?","options":["Só com autorização prévia — nunca por conta própria","Pode liberar se a cliente for conhecida","Fiado não existe na loja, recusar sempre","Vendedor decide sozinho"],"correct":0,"explain":"Fiado/crediário só com autorização prévia, nunca decisão própria do vendedor."},{"q":"O que faz parte do checklist de abertura da loja?","options":["Só abrir a porta e ligar a luz","Conferir limpeza, provador e abrir/conferir o caixa","Esperar o primeiro cliente pra organizar","Checklist só é feito no fechamento"],"correct":1,"explain":"Abertura inclui limpeza geral, provador e conferência do caixa, entre outros itens."},{"q":"\"O cliente pertence à loja, não ao vendedor\" quer dizer:","options":["Só quem vendeu antes pode atender de novo","Qualquer vendedor deve atender bem, mesmo sem ter sido quem atendeu antes","Comissão não existe na loja","Cliente deve sempre esperar o mesmo vendedor"],"correct":1,"explain":"O atendimento é da loja como um todo — ninguém \"trava\" um cliente para si."},{"q":"Você percebe um comportamento suspeito de possível furto. O que fazer?","options":["Confrontar o suspeito na hora","Ignorar para não constranger","Nunca confrontar fisicamente — avisar discretamente ao responsável","Chamar a polícia sozinho(a) imediatamente"],"correct":2,"explain":"Nunca confronto físico — o procedimento é avisar discretamente quem está responsável."}]},"3":{"title":"Avaliação — TM Funcionário Avançado","pass":0.7,"questions":[{"q":"Ao mediar um conflito entre colegas, o primeiro passo é:","options":["Decidir na hora quem tem razão","Ouvir cada pessoa separadamente, sem interromper","Chamar as duas juntas e deixar discutirem","Ignorar até esfriar"],"correct":1,"explain":"Ouça cada envolvido separadamente antes de formar opinião — e nunca tome partido publicamente."},{"q":"Numa emergência, antes da gestão chegar ou responder, você:","options":["Espera a gestão responder pra fazer qualquer coisa","Toma as decisões imediatas de segurança, mas nunca uma decisão irreversível sozinho(a)","Decide tudo sozinho(a) e não precisa informar depois","Fecha a loja por conta própria sempre que há qualquer imprevisto"],"correct":1,"explain":"Você prioriza segurança na hora, mas decisões irreversíveis (polícia, fechar loja, demitir) nunca são tomadas sozinho(a)."},{"q":"Encontrou uma divergência no caixa. Qual o primeiro passo?","options":["Acusar publicamente quem estava no caixa","Reconferir o dinheiro físico e os lançamentos antes de acionar a gestão","Reportar direto à gestão sem checar nada","Ignorar se o valor for pequeno"],"correct":1,"explain":"Checagem básica primeiro (recontar, conferir lançamentos), documentar, e só depois reportar se necessário."},{"q":"Um cliente pede uma exceção fora da regra padrão (ex.: troca fora do prazo). Antes de decidir, você deve:","options":["Prometer a exceção na hora pra não perder a venda","Entender o motivo da regra e o impacto real da exceção antes de decidir ou encaminhar","Negar automaticamente, sem analisar","Deixar a cliente decidir sozinha"],"correct":1,"explain":"Avalie o motivo da regra, o impacto e se há solução intermediária — nunca prometa antes de decidir."},{"q":"Ao treinar uma pessoa nova, corrigir um erro deve ser feito:","options":["Na frente do cliente, pra ela aprender rápido","Só no fim do dia, todos de uma vez","Na hora, com calma, longe do cliente","Corrigir não é necessário, ela aprende sozinha"],"correct":2,"explain":"Corrigir na hora, com calma e longe do cliente — na frente do cliente humilha, e depois de horas perde o efeito."},{"q":"Dar feedback sobre um problema de conduta deve:","options":["Ser feito na frente dos colegas, como exemplo","Ser direto, objetivo e em particular, começando pelo fato observável","Ser evitado para não criar climão","Ser feito por mensagem de texto sempre"],"correct":1,"explain":"Feedback direto, objetivo, em particular, começando pelo fato (não pela suposição de intenção)."},{"q":"Um pagamento por PIX só é considerado confirmado quando:","options":["O cliente mostra o print","Validado por Karla ou Pablo","O valor cai na conta em até 1 hora","O caixa aceita de boa fé"],"correct":1,"explain":"Mesma regra do time operacional: PIX só confirma com validação de Karla ou Pablo."},{"q":"Uma divergência de caixa pequena e explicável (ex.: troco arredondado) pode ser:","options":["Sempre escalada para a gestão, mesmo sendo simples","Resolvida e registrada por você mesmo(a)","Ignorada, não precisa registrar","Motivo para suspender quem operou o caixa"],"correct":1,"explain":"Divergência pequena e explicável você resolve e registra; sem explicação clara, aí sim escala."}]}},"roster":[{"whatsapp":"5588993223998","name":"Pablo","level":3,"password":"trocar123"}],"appsScriptUrl":"https://script.google.com/macros/s/AKfycbz5TfA0MqmKfc2deigXssPxLii_1yl-GyOokytCtnIqT4Uehja915MsUCvjHY4Z25TJ/exec","appsScriptToken":"tenkiter2026"}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('app-data').textContent);
var PABLO_WHATSAPP = ""; // e.g. "5588999999999" -- set this to enable the WhatsApp button

var state = { user:null, view:'login', manual:null };

function ls_get(key, fallback){
  try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function ls_set(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}
function esc(s){
  var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML;
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}
function normWhats(w){
  var d = String(w||'').replace(/\D/g,'');
  // Aceita com ou sem DDI 55 (ex: 5588999999999 e 88999999999 contam como o mesmo número).
  if (d.length >= 12 && d.slice(0,2) === '55') d = d.slice(2);
  return d;
}

async function loadRoster(){
  if (!DATA.appsScriptUrl) return;
  try{
    var res = await fetch(DATA.appsScriptUrl, { method:'GET' });
    if (!res.ok) return;
    var json = await res.json();
    if (json && json.ok && Array.isArray(json.funcionarios)){
      var byWhats = {};
      DATA.roster.forEach(function(r){ byWhats[normWhats(r.whatsapp)] = r; });
      json.funcionarios.forEach(function(row){
        var whatsapp = normWhats(row.whatsapp);
        if (!whatsapp) return;
        var nivelAnterior = byWhats[whatsapp] ? byWhats[whatsapp].level : 0;
        var nivelDessaLinha = parseInt(row.nivel,10) || 1;
        // Se o mesmo WhatsApp aparece em mais de uma linha da planilha (ex: um
        // cadastro duplicado), nunca deixa isso REBAIXAR o nível de acesso --
        // fica sempre o maior nível já visto pra esse WhatsApp.
        var statusAnterior = byWhats[whatsapp] ? byWhats[whatsapp].status : 'ativo';
        var statusDessaLinha = String(row.status||'ativo').trim().toLowerCase() || 'ativo';
        byWhats[whatsapp] = {
          whatsapp: whatsapp,
          name: String(row.nome||'').trim() || whatsapp,
          level: Math.max(nivelAnterior, nivelDessaLinha),
          password: String(row.senha||''),
          // se aparecer duplicado com status diferente, fica ativo se qualquer uma das linhas estiver ativa
          status: (statusAnterior === 'ativo' || statusDessaLinha === 'ativo') ? 'ativo' : 'inativo'
        };
      });
      DATA.roster = Object.keys(byWhats).map(function(k){ return byWhats[k]; });
    }
  }catch(e){ /* mantém o cadastro-semente -- o site continua funcionando */ }
}

var quizConfig = {}; // { '1': {pass:0.7, count:0}, ... } -- vem do Code.gs (ConfigQuiz), 'count'=0 significa "todas as perguntas"
async function loadQuizConfig(){
  if (!DATA.appsScriptUrl) return;
  try{
    var res = await fetch(DATA.appsScriptUrl + '?action=config_quiz', { method:'GET' });
    if (!res.ok) return;
    var json = await res.json();
    if (json && json.ok && Array.isArray(json.configs)){
      json.configs.forEach(function(c){
        quizConfig[String(c.nivel)] = {
          pass: (Number(c.notaaprovacaopct) || 70) / 100,
          count: Number(c.perguntasportentativa) || 0
        };
      });
    }
  }catch(e){ /* usa a nota de aprovação padrão embutida no manual */ }
}
function quizPassFor(level){
  return (quizConfig[level] && quizConfig[level].pass) || DATA.quizzes[level].pass;
}

/* ---- conversao texto simples <-> blocos do manual (usado pelo editor de conteudo do RH) ---- */
function blocksToText(blocks){
  return (blocks||[]).map(function(b){
    if (b.type === 'quote') return '> ' + b.text;
    if (b.type === 'bul') return '  '.repeat(b.level||0) + '- ' + b.text;
    return b.bold ? ('**' + b.text + '**') : b.text;
  }).join('\n');
}
function textToBlocks(text){
  return String(text||'').split('\n').filter(function(l){ return l.trim() !== ''; }).map(function(line){
    var mQuote = line.match(/^\s*>\s?(.*)$/);
    if (mQuote) return { type:'quote', text: mQuote[1] };
    var mBul = line.match(/^(\s*)-\s?(.*)$/);
    if (mBul) return { type:'bul', level: Math.floor(mBul[1].length/2), text: mBul[2] };
    var mBold = line.match(/^\*\*(.*)\*\*$/);
    if (mBold) return { type:'p', text: mBold[1], bold:true };
    return { type:'p', text: line, bold:false };
  });
}

var manualContentLoaded = {}; // niveis que ja tem conteudo salvo pelo RH (sobrescreve o embutido)
async function loadManualContent(){
  if (!DATA.appsScriptUrl) return;
  try{
    var res = await fetch(DATA.appsScriptUrl + '?action=conteudo_manual', { method:'GET' });
    if (!res.ok) return;
    var json = await res.json();
    if (json && json.ok && json.conteudo){
      Object.keys(json.conteudo).forEach(function(nivel){
        var parts = json.conteudo[nivel];

          DATA.manuals[nivel].parts = parts;
          manualContentLoaded[nivel] = true;
        }
      });
    }
  }catch(e){ /* mantem o conteudo padrao embutido no arquivo */ }
}
function shuffleArray(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
/**
 * Monta o conjunto de perguntas de UMA tentativa: sorteia X das N perguntas
 * do banco (se configurado) e embaralha as alternativas de cada uma,
 * remapeando qual índice é a correta -- assim ninguém decora a posição.
 */
function buildQuizAttempt(level){
  var quiz = DATA.quizzes[level];
  var cfg = quizConfig[level];
  var count = cfg && cfg.count > 0 ? Math.min(cfg.count, quiz.questions.length) : quiz.questions.length;
  var chosen = shuffleArray(quiz.questions).slice(0, count);
  var questions = chosen.map(function(q){
    var order = shuffleArray(q.options.map(function(_, i){ return i; }));
    var newCorrect = order.indexOf(q.correct);
    return {
      q: q.q,
      explain: q.explain,
      options: order.map(function(i){ return q.options[i]; }),
      correct: newCorrect
    };
  });
  return { title: quiz.title, questions: questions };
}

async function submitResult(payload){
  if (!DATA.appsScriptUrl) return;
  try{
    var res = await fetch(DATA.appsScriptUrl, {
      method:'POST',
      body: JSON.stringify(Object.assign({ token: DATA.appsScriptToken }, payload))
    });
    return await res.json();
  }catch(e){ return { ok:false, erro:'sem conexão' }; }
}

function progressKey(whatsapp){ return 'tm_progress_' + whatsapp; }
function quizKey(whatsapp, level){ return 'tm_quiz_' + whatsapp + '_' + level; }

function getProgress(){ return ls_get(progressKey(state.user.whatsapp), {}); }
function setChapterRead(chId, val){
  var p = getProgress(); p[chId] = val; ls_set(progressKey(state.user.whatsapp), p);
}
function manualProgress(level){
  var content = DATA.manuals[level];
  var total = 0, done = 0;
  var p = getProgress();
  content.parts.forEach(function(part, pi){
    part.chapters.forEach(function(ch, ci){
      total++;
      if (p[level+'-'+pi+'-'+ci]) done++;
    });
  });
  return { total: total, done: done, pct: total ? Math.round(done/total*100) : 0 };
}

/* ---------------- render: blocks ---------------- */
function renderBlocks(blocks){
  var html = ''; var listStack = []; // stack of {level, el:'ul'}
  function closeLists(toLevel){
    while(listStack.length > (toLevel===null?0:toLevel)){
      html += '</ul>'; listStack.pop();
    }
  }
  blocks.forEach(function(b){
    if (b.type === 'bul'){
      var lvl = b.level || 0;
      while(listStack.length <= lvl){ html += '<ul>'; listStack.push(lvl); }
      while(listStack.length > lvl+1){ html += '</ul>'; listStack.pop(); }
      html += '<li>' + esc(b.text) + '</li>';
    } else {
      closeLists(null);
      if (b.type === 'p'){
        html += '<p class="' + (b.bold ? 'p-bold' : '') + '">' + esc(b.text) + '</p>';
      } else if (b.type === 'quote'){
        html += '<blockquote class="quote">' + esc(b.text) + '</blockquote>';
      } else if (b.type === 'callout'){
        html += '<div class="callout callout-' + esc(b.kind) + '">' + esc(b.text) + '</div>';
      } else if (b.type === 'table'){
        html += '<div class="table-wrap"><table>';
        b.rows.forEach(function(row, ri){
          html += '<tr>' + row.map(function(c){ return (ri===0 ? '<th>' : '<td>') + esc(c) + (ri===0?'</th>':'</td>'); }).join('') + '</tr>';
        });
        html += '</table></div>';
      }
    }
  });
  closeLists(null);
  return html;
}

async function doCadastro(){
  var nome = document.getElementById('cad-nome').value.trim();
  var whatsapp = normWhats(document.getElementById('cad-whats').value);
  var senha = document.getElementById('cad-senha').value;
  var err = document.getElementById('login-error');
  err.style.display = 'none';
  if(!nome || !whatsapp || !senha){ err.textContent = 'Preencha nome, WhatsApp e senha.'; err.style.display='block'; return; }
  if(senha.length < 4){ err.textContent = 'A senha precisa ter pelo menos 4 caracteres.'; err.style.display='block'; return; }
  if(DATA.roster.some(function(r){ return normWhats(r.whatsapp) === whatsapp; })){
    err.textContent = 'Já existe uma conta com esse WhatsApp. Tente entrar.'; err.style.display='block'; return;
  }
  if(!DATA.appsScriptUrl){
    err.textContent = 'Cadastro ainda não está disponível (sistema em configuração). Fale com a gestão.'; err.style.display='block'; return;
  }
  var btn = document.getElementById('cad-btn');

  btn.disabled = false; btn.textContent = 'Criar conta';

  }
  var entry = { whatsapp: whatsapp, name: nome, level: 1, password: senha, status: 'ativo' };

  state.user = { whatsapp: entry.whatsapp, name: entry.name, level: entry.level, password: entry.password };
  ls_set('tm_session', { whatsapp: entry.whatsapp });
  toast('Conta criada! Bem-vindo(a).');

}

async function doLogin(){
  var whatsapp = normWhats(document.getElementById('login-whats').value);
  var pass = document.getElementById('login-pass').value;

  err.style.display = 'none';
  if(!whatsapp || !pass){ err.textContent = 'Preencha WhatsApp e senha.'; err.style.display='block'; return; }
  var entry = DATA.roster.find(function(r){ return normWhats(r.whatsapp) === whatsapp; });
  if(!entry || entry.password !== pass){
    err.textContent = 'WhatsApp ou senha incorretos.'; err.style.display = 'block'; return;

    err.textContent = 'Essa conta está desativada. Fale com a gestão.'; err.style.display = 'block'; return;
  }
  state.user = { whatsapp: normWhats(entry.whatsapp), name: entry.name, level: entry.level, password: entry.password };
  ls_set('tm_session', { whatsapp: normWhats(entry.whatsapp) });
  goHome();
}

function tryRestoreSession(){
  var sess = ls_get('tm_session', null);
  if(!sess) return false;
  var entry = DATA.roster.find(function(r){ return normWhats(r.whatsapp) === normWhats(sess.whatsapp); });

  }
  state.user = { whatsapp: normWhats(entry.whatsapp), name: entry.name, level: entry.level, password: entry.password };

}

function gradeQuiz(level){
  var quiz = state.quizAttempt || buildQuizAttempt(level);
  var score = 0;
  var erros = [];
  quiz.questions.forEach(function(q, qi){
    var qEl = document.querySelector('.quiz-q[data-qi="'+qi+'"]');
    var picked = qEl.querySelector('input[name="q'+qi+'"]:checked');
    var pickedVal = picked ? parseInt(picked.value,10) : -1;
    qEl.classList.add('graded');
    qEl.querySelectorAll('.opt').forEach(function(optEl, oi){
      optEl.querySelectorAll('input').forEach(function(inp){ inp.disabled = true; });
      if (oi === q.correct) optEl.classList.add('correct-answer');
      else if (oi === pickedVal) optEl.classList.add('wrong-answer');
    });
    if (pickedVal === q.correct){ score++; }
    else { erros.push({ pergunta: q.q, resposta: pickedVal >= 0 ? q.options[pickedVal] : '(em branco)', correta: q.options[q.correct] }); }
    var ex = document.createElement('div');
    ex.className = 'explain';
    ex.textContent = q.explain;
    qEl.appendChild(ex);
  });
  var total = quiz.questions.length;
  var pct = score/total;
  var passed = pct >= quizPassFor(level);
  var date = new Date().toLocaleDateString('pt-BR');
  state.quizAttempt = null;
  ls_set(quizKey(state.user.whatsapp, level), { score: score, total: total, date: date });
  submitResult({ action:'resultado', nome: state.user.name, whatsapp: state.user.whatsapp, nivel: state.user.level, manual: DATA.titles[level], nota: score, total: total, data: date, errosDetalhados: JSON.stringify(erros) });

  var waText = encodeURIComponent(state.user.name + ' concluiu a avaliação do ' + DATA.titles[level] + ': ' + score + '/' + total + ' (' + Math.round(pct*100) + '%) em ' + date + '.');
  var waHtml = '';
  if (PABLO_WHATSAPP){
    waHtml = '<a class="btn btn-primary" target="_blank" href="https://wa.me/' + PABLO_WHATSAPP + '?text=' + waText + '">Enviar resultado no WhatsApp</a>';
  }

  document.getElementById('quiz-result').innerHTML =
    '<div class="quiz-result">' +
      '<div class="score">' + score + '/' + total + '</div>' +
      '<div class="verdict" style="color:' + (passed ? 'var(--good-text)' : 'var(--danger)') + '">' + (passed ? 'Aprovado(a)!' : 'Ainda não foi dessa vez') + '</div>' +
      '<div class="quiz-actions">' +
        waHtml +
        '<button class="btn" id="copy-result">Copiar resultado</button>' +
        '<button class="btn" id="retry-quiz">Tentar de novo</button>' +
      '</div>' +
    '</div>';
  document.getElementById('quiz-result').scrollIntoView({behavior:'smooth', block:'start'});
  document.getElementById('retry-quiz').addEventListener('click', function(){ render(); });
  document.getElementById('copy-result').addEventListener('click', function(){
    var text = decodeURIComponent(waText);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('Resultado copiado!'); }).catch(function(){ toast('Não foi possível copiar.'); });
    } else { toast('Copie manualmente: ' + text); }
  });
}

    { id:'desempenho', label:'Raio-X de Desempenho' },
    { id:'conteudo', label:'Conteúdo & Provas' }
  ];
  var tabsHtml = tabs.map(function(t){
    return '<button class="admin-tab' + (state.adminTab===t.id?' active':'') + '" data-tab="' + t.id + '">' + t.label + '</button>';
  }).join('');
  var body;
  if (!state.adminData){
    body = '<div class="admin-panel">Carregando dados da equipe...</div>';
  } else if (state.adminTab === 'desempenho'){
    body = renderTabDesempenho();
  } else if (state.adminTab === 'conteudo'){
    body = renderTabConteudo();
  } else {
    body = renderTabEquipe();
  }
  return '<div class="admin-shell">' +
    '<div class="hero"><h1>Painel do RH / Admin</h1><p>Gestão da equipe, acompanhamento das avaliações e configuração dos manuais.</p></div>' +
    '<div class="admin-tabs">' + tabsHtml + '</div>' +
    body +
  '</div>';
}

function wireAdminPanel(){
  document.querySelectorAll('.admin-tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      state.adminTab = btn.getAttribute('data-tab');
      render();
    });
  });
  if (!state.adminData) return;
  if (state.adminTab === 'desempenho') wireTabDesempenho();
  else if (state.adminTab === 'conteudo') wireTabConteudo();
  else wireTabEquipe();
}

/* ---- Aba 1: Equipe & Permissões ---- */
function renderTabEquipe(){
  var rows = state.adminData.funcionarios.map(function(f){
    var whats = normWhats(f.whatsapp);
    var nivel = parseInt(f.nivel, 10) || 1;
    var status = String(f.status || 'ativo').toLowerCase();
    var ativo = status !== 'inativo';
    return '<tr data-whats="' + esc(whats) + '">' +
      '<td>' + esc(f.nome || '') + '</td>' +
      '<td>' + esc(whats) + '</td>' +
      '<td><select class="admin-sel admin-level-sel">' +
        [1,2,3,10].map(function(n){ return '<option value="'+n+'"' + (n===nivel?' selected':'') + '>' + (n===10?'10 · Admin':n) + '</option>'; }).join('') +
      '</select></td>' +
      '<td><span class="' + (ativo?'badge-ativo':'badge-inativo') + '">' + (ativo?'Ativo':'Inativo') + '</span></td>' +
      '<td>' +
        '<button type="button" class="admin-mini-btn admin-toggle-status" data-ativo="' + (ativo?'1':'0') + '">' + (ativo?'Desativar':'Reativar') + '</button>' +
        '<button type="button" class="admin-mini-btn admin-reset-pass">Resetar senha</button>' +
      '</td>' +
    '</tr>';
  }).join('');
  return '<div class="admin-panel">' +
    '<table class="admin-table"><thead><tr><th>Nome</th><th>WhatsApp</th><th>Nível</th><th>Status</th><th>Ações</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>' +
  '</div>';
}

function wireTabEquipe(){
  document.querySelectorAll('#app .admin-level-sel').forEach(function(sel){
    sel.addEventListener('change', async function(){
      var whats = sel.closest('tr').getAttribute('data-whats');
      var resp = await submitResult({
        action:'atualizar_nivel_user', whatsappAdmin: state.user.whatsapp, senhaAdmin: state.user.password,
        whatsappAlvo: whats, novoNivel: parseInt(sel.value, 10)
      });
      if (!resp || !resp.ok){ toast((resp && resp.erro) || 'Não foi possível atualizar o nível.'); return; }
      toast('Nível atualizado.');
      if (whats === state.user.whatsapp){ state.user.level = parseInt(sel.value, 10); }
      await loadRoster();
      fetchAdminData();
    });
  });
  document.querySelectorAll('#app .admin-toggle-status').forEach(function(btn){
    btn.addEventListener('click', async function(){
      var whats = btn.closest('tr').getAttribute('data-whats');
      var ativoAgora = btn.getAttribute('data-ativo') === '1';
      var novoStatus = ativoAgora ? 'Inativo' : 'Ativo';
      if (whats === state.user.whatsapp && novoStatus === 'Inativo'){
        toast('Você não pode desativar a própria conta por aqui.'); return;
      }
      var resp = await submitResult({
        action:'alterar_status_user', whatsappAdmin: state.user.whatsapp, senhaAdmin: state.user.password,
        whatsappAlvo: whats, novoStatus: novoStatus
      });
      if (!resp || !resp.ok){ toast((resp && resp.erro) || 'Não foi possível alterar o status.'); return; }
      toast(novoStatus === 'Ativo' ? 'Funcionário reativado.' : 'Funcionário desativado.');
      await loadRoster();
      fetchAdminData();
    });
  });
  document.querySelectorAll('#app .admin-reset-pass').forEach(function(btn){
    btn.addEventListener('click', async function(){
      var whats = btn.closest('tr').getAttribute('data-whats');
      var nova = prompt('Nova senha para ' + whats + ' (mínimo 4 caracteres):');
      if (nova === null) return;
      if (nova.length < 4){ toast('A senha precisa ter pelo menos 4 caracteres.'); return; }
      var resp = await submitResult({
        action:'resetar_senha_user', whatsappAdmin: state.user.whatsapp, senhaAdmin: state.user.password,
        whatsappAlvo: whats, novaSenha: nova
      });
      if (!resp || !resp.ok){ toast((resp && resp.erro) || 'Não foi possível resetar a senha.'); return; }
      toast('Senha redefinida.');
    });
  });
}

/* ---- Aba 2: Raio-X de Desempenho ---- */
function renderTabDesempenho(){
  var resultados = state.adminData.resultados.slice().sort(function(a,b){ return (b.dataHora||'').localeCompare(a.dataHora||''); });
  var rows = resultados.map(function(r){
    var pct = Number(r.percentual) || 0;
    var passou = pct >= 70; // referência simples pra visão geral do RH
    var dataFmt = r.dataHora ? new Date(r.dataHora).toLocaleString('pt-BR') : '';
    return '<tr>' +
      '<td>' + esc(dataFmt) + '</td>' +
      '<td>' + esc(r.nome || '') + '</td>' +
      '<td>' + esc(r.manual || '') + '</td>' +
      '<td>' + esc(r.nota) + '/' + esc(r.total) + '</td>' +
      '<td>' + pct + '%</td>' +
      '<td><span class="' + (passou?'badge-aprovado':'badge-reprovado') + '">' + (passou?'Aprovado':'Reprovado') + '</span></td>' +
    '</tr>';
  }).join('');

  var contagemErros = {};
  resultados.forEach(function(r){
    var erros = [];
    try{ erros = JSON.parse(r.errosDetalhados || '[]'); }catch(e){}
    erros.forEach(function(er){
      var chave = er.pergunta || '';
      if (!chave) return;
      contagemErros[chave] = (contagemErros[chave] || 0) + 1;
    });
  });
  var gaps = Object.keys(contagemErros).map(function(k){ return { pergunta: k, n: contagemErros[k] }; })
    .sort(function(a,b){ return b.n - a.n; }).slice(0, 8);
  var gapsHtml = gaps.length ? gaps.map(function(g){
    return '<div class="gap-row"><span>' + esc(g.pergunta) + '</span><span class="gap-count">' + g.n + ' erro' + (g.n>1?'s':'') + '</span></div>';
  }).join('') : '<p class="sub">Ainda não há erros suficientes registrados pra apontar um padrão.</p>';

  return '<div class="admin-panel">' +
    '<div class="admin-toolbar"><span class="sub">' + resultados.length + ' avaliações registradas</span>' +
      '<button type="button" class="btn" id="btn-export-csv">⬇️ Exportar relatório em CSV</button>' +
    '</div>' +
    '<table class="admin-table"><thead><tr><th>Data/Hora</th><th>Nome</th><th>Manual</th><th>Nota</th><th>%</th><th>Status</th></tr></thead>' +
    '<tbody>' + (rows || '<tr><td colspan="6">Nenhuma avaliação registrada ainda.</td></tr>') + '</tbody></table>' +
    '<div class="admin-gaps"><h4>📊 Análise de gaps de conhecimento</h4>' +
      '<p class="sub">Perguntas em que a equipe mais erra -- use como pauta de reforço presencial.</p>' +
      gapsHtml +
    '</div>' +
  '</div>';
}

function wireTabDesempenho(){
  var btn = document.getElementById('btn-export-csv');
  if (!btn) return;
  btn.addEventListener('click', function(){
    var resultados = state.adminData.resultados;
    var linhas = ['DataHora;WhatsApp;Nome;Nivel;Manual;Nota;Total;Percentual'];
    resultados.forEach(function(r){
      linhas.push([r.dataHora, r.whatsapp, r.nome, r.nivel, r.manual, r.nota, r.total, r.percentual]
        .map(function(v){ return String(v==null?'':v).replace(/;/g, ','); }).join(';'));
    });
    var blob = new Blob([linhas.join('\n')], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'relatorio-treinamento-tenkiter.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  });
}

/* ---- Aba 3: Conteúdo & Provas (config de nota e randomização) ---- */
function renderTabConteudo(){
  var cards = ['1','2','3'].map(function(level){
    var totalPerguntas = DATA.quizzes[level] ? DATA.quizzes[level].questions.length : 0;
    var cfg = quizConfig[level] || { pass: DATA.quizzes[level] ? DATA.quizzes[level].pass : 0.7, count: 0 };
    return '<div class="cms-card" data-nivel="' + level + '">' +
      '<h4>' + esc(DATA.titles[level]) + ' <span class="sub">(banco com ' + totalPerguntas + ' perguntas)</span></h4>' +
      '<div class="cms-row">' +
        '<label class="cms-field">Nota de aprovação (%)<input type="number" class="cms-pass" min="1" max="100" value="' + Math.round(cfg.pass*100) + '"></label>' +
        '<label class="cms-field">Perguntas por tentativa<input type="number" class="cms-count" min="0" max="' + totalPerguntas + '" value="' + cfg.count + '" title="0 = usa todas as perguntas do banco"></label>' +
      '</div>' +
    '</div>';
  }).join('');

  state.cmsEditLevel = state.cmsEditLevel || '1';
  var editLevel = state.cmsEditLevel;
  var parts = DATA.manuals[editLevel].parts;
  var partsHtml = parts.map(function(part, pi){
    var chapterRows = part.chapters.map(function(ch, ci){
      var isOpen = !!(state.cmsOpenChapter && state.cmsOpenChapter.pi === pi && state.cmsOpenChapter.ci === ci);
      return '<div class="cms-chapter-row">' +
        '<div class="cms-chapter-head">' +
          '<span>' + esc(ch.title) + '</span>' +
          '<span>' +
            '<button type="button" class="admin-mini-btn cms-edit-btn" data-pi="' + pi + '" data-ci="' + ci + '">' + (isOpen ? 'Fechar' : 'Editar') + '</button>' +
            '<button type="button" class="admin-mini-btn cms-del-btn" data-pi="' + pi + '" data-ci="' + ci + '">Remover</button>' +
          '</span>' +
        '</div>' +
        (isOpen ?
          '<div class="cms-chapter-editor">' +
            '<label><span>Título do capítulo</span><input type="text" class="cms-cap-title" value="' + esc(ch.title) + '"></label>' +
            '<label><span>Texto (uma linha = parágrafo · "- " = tópico · "&gt; " = citação · **negrito**)</span>' +
              '<textarea class="cms-cap-body" rows="10">' + esc(blocksToText(ch.blocks)) + '</textarea></label>' +
            '<button type="button" class="btn btn-primary cms-save-chapter" data-pi="' + pi + '" data-ci="' + ci + '">Salvar capítulo</button>' +
          '</div>'
        : '') +
      '</div>';
    }).join('');
    return '<div class="cms-part">' +
      '<div class="cms-part-head"><h4>' + esc(part.title) + '</h4>' +
        '<button type="button" class="admin-mini-btn cms-add-chapter-btn" data-pi="' + pi + '">+ Capítulo</button>' +
      '</div>' +
      (chapterRows || '<p class="sub">Nenhum capítulo nesta parte ainda.</p>') +
    '</div>';
  }).join('');

  return '<div class="admin-panel">' +
    '<p class="sub">Ajuste a nota mínima de aprovação e quantas perguntas do banco sorteiam por tentativa (0 = usa todas). As alternativas são sempre embaralhadas.</p>' +
    cards +
    '<button type="button" class="btn btn-primary" id="btn-salvar-config">Salvar configuração</button>' +
    '<div class="cms-editor">' +
      '<div class="admin-toolbar"><h4 style="margin:0">✏️ Editor de conteúdo do manual</h4>' +
        '<select class="admin-sel" id="cms-editor-level">' +
          ['1','2','3'].map(function(l){ return '<option value="' + l + '"' + (l === editLevel ? ' selected' : '') + '>' + esc(DATA.titles[l]) + '</option>'; }).join('') +
        '</select>' +
      '</div>' +
      '<p class="sub">Clique em "Editar" pra mudar o texto de um capítulo, ou use os botões pra adicionar capítulos e partes novas. Cada capítulo salvo já fica disponível pra equipe na hora.</p>' +
      partsHtml +
      '<button type="button" class="admin-mini-btn" id="cms-add-part-btn" style="margin-top:10px;">+ Nova parte</button>' +
    '</div>' +
  '</div>';
}

async function salvarConteudoNivel_(level){
  return submitResult({
    action: 'salvar_conteudo_manual',
    whatsappAdmin: state.user.whatsapp, senhaAdmin: state.user.password,
    nivel: level, parts: DATA.manuals[level].parts
  });
}

function wireTabConteudo(){
  var btn = document.getElementById('btn-salvar-config');
  btn.addEventListener('click', async function(){
    var configs = Array.prototype.map.call(document.querySelectorAll('.cms-card'), function(card){
      return {
        nivel: card.getAttribute('data-nivel'),
        notaAprovacaoPct: parseInt(card.querySelector('.cms-pass').value, 10) || 70,
        perguntasPorTentativa: parseInt(card.querySelector('.cms-count').value, 10) || 0
      };
    });
    btn.disabled = true; btn.textContent = 'Salvando...';
    var resp = await submitResult({
      action:'salvar_config_quiz', whatsappAdmin: state.user.whatsapp, senhaAdmin: state.user.password, configs: configs
    });
    btn.disabled = false; btn.textContent = 'Salvar configuração';
    if (!resp || !resp.ok){ toast((resp && resp.erro) || 'Não foi possível salvar.'); return; }
    await loadQuizConfig();
    toast('Configuração salva!');
  });

  var levelSel = document.getElementById('cms-editor-level');
  if (levelSel) levelSel.addEventListener('change', function(){
    state.cmsEditLevel = levelSel.value;
    state.cmsOpenChapter = null;
    render();
  });

  document.querySelectorAll('.cms-edit-btn').forEach(function(btnEl){
    btnEl.addEventListener('click', function(){
      var pi = parseInt(btnEl.getAttribute('data-pi'), 10), ci = parseInt(btnEl.getAttribute('data-ci'), 10);
      var isOpen = state.cmsOpenChapter && state.cmsOpenChapter.pi === pi && state.cmsOpenChapter.ci === ci;
      state.cmsOpenChapter = isOpen ? null : { pi: pi, ci: ci };
      render();
    });
  });

  document.querySelectorAll('.cms-save-chapter').forEach(function(btnEl){
    btnEl.addEventListener('click', async function(){
      var pi = parseInt(btnEl.getAttribute('data-pi'), 10), ci = parseInt(btnEl.getAttribute('data-ci'), 10);
      var level = state.cmsEditLevel;
      var editorEl = btnEl.closest('.cms-chapter-editor');
      var title = editorEl.querySelector('.cms-cap-title').value.trim() || 'Sem título';
      var body = editorEl.querySelector('.cms-cap-body').value;
      DATA.manuals[level].parts[pi].chapters[ci] = { title: title, blocks: textToBlocks(body) };
      btnEl.disabled = true; btnEl.textContent = 'Salvando...';
      var resp = await salvarConteudoNivel_(level);
      btnEl.disabled = false; btnEl.textContent = 'Salvar capítulo';
      if (!resp || !resp.ok){ toast((resp && resp.erro) || 'Não foi possível salvar o capítulo.'); return; }
      toast('Capítulo salvo!');
      state.cmsOpenChapter = null;
      render();
    });
  });

  document.querySelectorAll('.cms-del-btn').forEach(function(btnEl){
    btnEl.addEventListener('click', async function(){
      var pi = parseInt(btnEl.getAttribute('data-pi'), 10), ci = parseInt(btnEl.getAttribute('data-ci'), 10);
      if (!confirm('Remover este capítulo? Essa ação não pode ser desfeita.')) return;
      var level = state.cmsEditLevel;
      DATA.manuals[level].parts[pi].chapters.splice(ci, 1);
      var resp = await salvarConteudoNivel_(level);
      if (!resp || !resp.ok){ toast((resp && resp.erro) || 'Não foi possível remover.'); return; }
      toast('Capítulo removido.');
      state.cmsOpenChapter = null;
      render();
    });
  });

  document.querySelectorAll('.cms-add-chapter-btn').forEach(function(btnEl){
    btnEl.addEventListener('click', function(){
      var pi = parseInt(btnEl.getAttribute('data-pi'), 10);
      var level = state.cmsEditLevel;
      var novoTitulo = prompt('Título do novo capítulo:');
      if (!novoTitulo) return;
      DATA.manuals[level].parts[pi].chapters.push({ title: novoTitulo, blocks: [{ type:'p', text:'', bold:false }] });
      state.cmsOpenChapter = { pi: pi, ci: DATA.manuals[level].parts[pi].chapters.length - 1 };
      render();
    });
  });

  var addPartBtn = document.getElementById('cms-add-part-btn');
  if (addPartBtn) addPartBtn.addEventListener('click', function(){
    var level = state.cmsEditLevel;
    var novoTitulo = prompt('Título da nova parte:');
    if (!novoTitulo) return;
    DATA.manuals[level].parts.push({ title: novoTitulo, chapters: [] });
    render();
  });
}

/* ---------------- root render ---------------- */
function render(){
  if (state.view === 'login' || !state.user){ renderLogin(); return; }
  if (state.view === 'home'){ goHome(); return; }
  var app = document.getElementById('app');
  if (state.view === 'manual'){
    app.innerHTML = renderTopbar() + '<div class="shell">' + renderManual(state.manual) + '</div>';
    wireTopbar();
    wireManual(state.manual);
  } else if (state.view === 'quiz'){
    app.innerHTML = renderTopbar() + '<div class="shell">' + renderQuizIntro(state.manual) + '</div>';
    wireTopbar();
    wireQuizIntro(state.manual);
  } else if (state.view === 'admin'){
    if (state.user.level < 10){ goHome(); return; }
    app.innerHTML = renderTopbar() + renderAdminPanel();
    wireTopbar();
    wireAdminPanel();
  }
}

/* ---------------- boot ---------------- */
(async function boot(){
  await Promise.all([loadRoster(), loadQuizConfig(), loadManualContent()]);
  if (tryRestoreSession()){ goHome(); } else { renderLogin(); }
})();

})();
</script>
