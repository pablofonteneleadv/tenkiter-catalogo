<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TENKiTER Modas — Treinamento</title>
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="theme-color" content="#0d0d0d">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5F1E8; --surface:#FFFFFF; --surface-2:#F1EEE7; --border:#E3DFD4;
  --text:#1C1B18; --muted:#6B675E;
  --accent:#0d0d0d; --accent-2:#E67E22; --accent-3:#F39C12; --accent-soft:#FFF0E4;
  --warn-bg:#FFF3CD; --warn-border:#E0A800; --warn-text:#5C4600;
  --tip-bg:#FFF0E4; --tip-border:#ff7a1a; --tip-text:#8a3d00;
  --good-bg:#E6F4EA; --good-border:#2F9E52; --good-text:#1E5631;
  --danger:#B3261E; --danger-bg:#FBEAE9;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161C; --surface:#1C1F27; --surface-2:#242833; --border:#333846;
    --text:#ECEBE7; --muted:#9C998F;
    --accent:#E67E22; --accent-2:#F39C12; --accent-soft:#2E2419;
    --warn-bg:#3A3013; --warn-border:#C99A2E; --warn-text:#F2D888;
    --good-bg:#17301F; --good-border:#3FAE66; --good-text:#A9E0BB;
    --tip-bg:#2E2419; --tip-border:#ff9c4d; --tip-text:#FFCB94;
    --danger:#E5837C; --danger-bg:#3A1F1D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14161C; --surface:#1C1F27; --surface-2:#242833; --border:#333846;
  --text:#ECEBE7; --muted:#9C998F;
  --accent:#E67E22; --accent-2:#F39C12; --accent-soft:#2E2419;
  --warn-bg:#3A3013; --warn-border:#C99A2E; --warn-text:#F2D888;
  --good-bg:#17301F; --good-border:#3FAE66; --good-text:#A9E0BB;
  --tip-bg:#2E2419; --tip-border:#ff9c4d; --tip-text:#FFCB94;
  --danger:#E5837C; --danger-bg:#3A1F1D;
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--text); font-family:"Inter",system-ui,sans-serif; margin:0; -webkit-font-smoothing:antialiased;}
h1,h2,h3,.display{font-family:"Poppins",sans-serif; font-weight:800; text-wrap:balance;}
a{color:var(--accent-2);}
button{font-family:inherit;}
#app{min-height:100%; display:flex; flex-direction:column;}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px; background:var(--surface); border-bottom:1px solid var(--border);
  gap:12px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:10px; font-family:"Poppins",sans-serif; font-weight:700; font-size:1.15rem; color:var(--accent);}
.brand .mark{width:30px;height:30px;border-radius:8px;background:#0d0d0d;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.mark img{width:76%;height:76%;object-fit:contain;}
.topbar-right{display:flex; align-items:center; gap:14px; font-size:0.9rem; color:var(--muted);}
.btn{
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  padding:9px 16px; border-radius:9px; cursor:pointer; font-size:0.92rem; font-weight:600;
  transition:background .15s, border-color .15s;
}
.btn:hover{border-color:var(--accent-2);}
.btn-primary{background:var(--accent); color:#fff; border-color:var(--accent);}
.btn-primary:hover{background:var(--accent-2); border-color:var(--accent-2);}
.btn-ghost{background:transparent; border-color:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn:disabled{opacity:.5; cursor:not-allowed;}

/* ---------- shell layout ---------- */
.shell{flex:1; display:flex; max-width:1180px; margin:0 auto; width:100%;}
.sidebar{
  width:270px; flex-shrink:0; padding:22px 14px; border-right:1px solid var(--border);
  position:sticky; top:calc(61px + env(safe-area-inset-top,0px)); align-self:flex-start;
  max-height:calc(100vh - 61px); overflow-y:auto;
}
.main{flex:1; min-width:0; padding:28px 24px 80px;}
.btn-toc-toggle{display:none;}
@media (max-width:860px){
  .shell{flex-direction:column;}
  .btn-toc-toggle{
    display:block; width:100%; text-align:left; margin:0; padding:13px 16px;
    background:var(--surface); border:none; border-bottom:1px solid var(--border);
    color:var(--text); font-weight:700; font-size:0.9rem; cursor:pointer;
  }
  .sidebar{
    width:100%; position:static; border-right:none; border-bottom:1px solid var(--border);
    max-height:0; overflow:hidden; padding:0 14px; transition:max-height .2s ease;
  }
  .sidebar.aberto{max-height:70vh; overflow-y:auto; padding:14px;}
  .main{padding:18px 16px 60px;}
  .manual-title{font-size:1.35rem;}
  .part-heading{font-size:1.1rem; margin:30px 0 14px;}
  .chapter p, .chapter ul{max-width:none;}
  .card{padding:16px;}
}

/* ---------- login ---------- */
.login-wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:24px;}
.login-card{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:36px 32px; width:100%; max-width:380px; box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.login-card .mark{width:46px;height:46px;border-radius:12px;background:#0d0d0d;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:16px;}
.login-card h1{font-size:1.4rem; margin:0 0 4px;}
.login-card p.sub{color:var(--muted); font-size:0.9rem; margin:0 0 22px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:0.82rem; font-weight:600; color:var(--muted); margin-bottom:6px;}
.field input{
  width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:0.95rem;
}
.field input:focus{outline:2px solid var(--accent-2); outline-offset:1px;}
.login-error{color:var(--danger); background:var(--danger-bg); border-radius:8px; padding:9px 12px; font-size:0.85rem; margin-bottom:14px; display:none;}
.login-card .btn-primary{width:100%; padding:12px; font-size:1rem; margin-top:4px;}

/* ---------- home / manual cards ---------- */
.hero{margin-bottom:26px;}
.hero h1{font-size:1.7rem; margin:0 0 6px;}
.hero p{color:var(--muted); margin:0; font-size:0.98rem;}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px;
  display:flex; flex-direction:column; gap:10px; cursor:pointer; transition:border-color .15s, transform .1s;
}
.card:hover{border-color:var(--accent-2);}
.card.locked{opacity:.5; cursor:not-allowed;}
.card .level-tag{font-size:0.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-2); font-weight:700;}
.card h3{margin:0; font-size:1.15rem;}
.card p{margin:0; color:var(--muted); font-size:0.88rem; flex:1;}
.card .progress-bar{height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden;}
.card .progress-bar > div{height:100%; background:var(--accent-2);}
.card .progress-label{font-size:0.78rem; color:var(--muted);}

/* ---------- manual nav ---------- */
.nav-part{font-size:0.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; margin:18px 0 6px; padding:0 10px;}
.nav-part:first-child{margin-top:0;}
.nav-chapter{
  display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:8px; cursor:pointer;
  font-size:0.87rem; color:var(--text); text-decoration:none;
}
.nav-chapter:hover{background:var(--surface-2);}
.nav-chapter.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}
.nav-chapter .dot{width:7px;height:7px;border-radius:50%;background:var(--border); flex-shrink:0;}
.nav-chapter.done .dot{background:var(--good-border);}
.nav-quiz-link{display:block; margin-top:16px; padding:10px 12px; border-radius:9px; background:var(--accent-soft); color:var(--accent); font-weight:600; font-size:0.87rem; text-align:center; cursor:pointer;}

/* ---------- manual content ---------- */
.manual-title{font-size:1.6rem; margin:0 0 4px;}
.manual-sub{color:var(--muted); margin:0 0 28px; font-size:0.95rem;}
.part-heading{font-size:1.25rem; color:var(--accent); margin:40px 0 18px; padding-top:8px; border-top:1px solid var(--border);}
.part-heading:first-of-type{border-top:none; margin-top:0;}
.chapter{margin-bottom:34px; scroll-margin-top:80px;}
.chapter-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px;}
.chapter h3{font-size:1.15rem; margin:0;}
.read-toggle{display:flex; align-items:center; gap:6px; font-size:0.78rem; color:var(--muted); cursor:pointer; white-space:nowrap; user-select:none;}
.read-toggle input{accent-color:var(--good-border);}
.chapter p{line-height:1.6; margin:0 0 12px; max-width:68ch;}
.chapter p.p-bold{font-weight:700;}
.chapter ul{margin:0 0 12px; padding-left:22px; max-width:68ch;}
.chapter li{margin-bottom:7px; line-height:1.55;}
.chapter ul ul{margin-top:7px;}
blockquote.quote{
  margin:14px 0; padding:6px 16px; border-left:3px solid var(--muted); color:var(--muted);
  font-style:italic; max-width:66ch;
}
.callout{border-radius:10px; padding:13px 16px; margin:14px 0; font-weight:600; max-width:68ch; border:1px solid; line-height:1.5;}
.callout-warn{background:var(--warn-bg); border-color:var(--warn-border); color:var(--warn-text);}
.callout-tip{background:var(--tip-bg); border-color:var(--tip-border); color:var(--tip-text);}
.callout-good{background:var(--good-bg); border-color:var(--good-border); color:var(--good-text);}
.table-wrap{overflow-x:auto; margin:16px 0;}
table{border-collapse:collapse; width:100%; font-size:0.88rem;}
th,td{border:1px solid var(--border); padding:8px 10px; text-align:left; vertical-align:top;}
th{background:var(--surface-2); font-weight:700;}

/* ---------- quiz ---------- */
.quiz-q{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:16px;}
.quiz-q .qn{font-size:0.78rem; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
.quiz-q .qtext{font-weight:600; margin-bottom:12px; font-size:1rem;}
.opt{display:flex; align-items:flex-start; gap:10px; padding:9px 10px; border-radius:8px; cursor:pointer; margin-bottom:4px;}
.opt:hover{background:var(--surface-2);}
.opt input{margin-top:3px;}
.quiz-q.graded .opt{cursor:default;}
.quiz-q.graded .opt:hover{background:transparent;}
.opt.correct-answer{background:var(--good-bg); color:var(--good-text); border-radius:8px;}
.opt.wrong-answer{background:var(--danger-bg); color:var(--danger); border-radius:8px;}
.explain{margin-top:10px; font-size:0.87rem; color:var(--muted); border-top:1px solid var(--border); padding-top:10px;}
.quiz-result{
  background:var(--accent-soft); border-radius:14px; padding:24px; text-align:center; margin-bottom:22px;
}
.quiz-result .score{font-family:"Poppins",sans-serif; font-size:2.4rem; color:var(--accent); font-weight:800;}
.quiz-result .verdict{font-weight:700; margin-top:4px;}
.quiz-actions{display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap;}
.toast{
  position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%);
  background:var(--text); color:var(--bg); padding:10px 18px; border-radius:9px; font-size:0.88rem;
  opacity:0; pointer-events:none; transition:opacity .2s; z-index:50;
}
.toast.show{opacity:1;}
.muted-note{color:var(--muted); font-size:0.85rem; margin-top:6px;}
.admin-btn-topbar{background:var(--accent-2); color:#fff; border-color:var(--accent-2); font-weight:700;}
.admin-shell{max-width:1100px; margin:0 auto; padding:20px; width:100%; min-width:0;}
.admin-tabs{display:flex; gap:8px; border-bottom:1px solid var(--border); margin-bottom:18px; flex-wrap:wrap;}
.admin-tab{padding:10px 16px; border:none; background:transparent; color:var(--muted); font-weight:600; cursor:pointer; border-bottom:2px solid transparent; font-size:0.92rem;}
.admin-tab.active{color:var(--accent); border-bottom-color:var(--accent-2);}
.admin-panel{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px; overflow-x:auto;}
.admin-table{width:100%; border-collapse:collapse; font-size:0.88rem; min-width:560px;}
.admin-table th{text-align:left; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
.admin-table td{padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
.admin-table tr:last-child td{border-bottom:none;}
.badge-ativo{background:var(--good-bg); color:var(--good-text); border-radius:20px; padding:3px 10px; font-size:0.78rem; font-weight:700;}
.badge-inativo{background:var(--danger-bg); color:var(--danger); border-radius:20px; padding:3px 10px; font-size:0.78rem; font-weight:700;}
.badge-aprovado{background:var(--good-bg); color:var(--good-text); border-radius:20px; padding:2px 9px; font-size:0.76rem; font-weight:700;}
.badge-reprovado{background:var(--danger-bg); color:var(--danger); border-radius:20px; padding:2px 9px; font-size:0.76rem; font-weight:700;}
.admin-sel{padding:5px 8px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-weight:600; font-size:0.85rem;}
.admin-mini-btn{padding:5px 10px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:0.8rem; font-weight:600; cursor:pointer; margin-right:4px;}
.admin-mini-btn:hover{border-color:var(--accent-2);}
.admin-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
.admin-gaps{margin-top:22px;}
.admin-gaps h4{margin:0 0 10px;}
.gap-row{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:0.86rem;}
.gap-row:last-child{border-bottom:none;}
.gap-count{color:var(--danger); font-weight:700; white-space:nowrap;}
.cms-card{border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:12px; background:var(--surface-2);}
.cms-card h4{margin:0 0 10px;}
.cms-row{display:flex; gap:14px; flex-wrap:wrap; align-items:center;}
.cms-field{display:flex; flex-direction:column; gap:4px; font-size:0.82rem; color:var(--muted); font-weight:600;}
.cms-field input{padding:7px 10px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--text); width:120px;}
.cms-editor{margin-top:24px; border-top:1px solid var(--border); padding-top:18px;}
.cms-part{margin-top:16px;}
.cms-part-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:10px;}
.cms-part-head h4{margin:0;}
.cms-chapter-row{border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:8px; background:var(--surface);}
.cms-chapter-head{display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:0.88rem; font-weight:600; flex-wrap:wrap;}
.cms-chapter-editor{margin-top:10px; display:flex; flex-direction:column; gap:10px;}
.cms-chapter-editor label{display:flex; flex-direction:column; gap:4px; font-size:0.82rem; color:var(--muted); font-weight:600;}
.cms-chapter-editor input, .cms-chapter-editor textarea{padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; font-size:0.9rem; width:100%;}
.cms-chapter-editor textarea{resize:vertical;}

@media (max-width:680px){
  .admin-shell{padding:14px;}
  .admin-toolbar{flex-direction:column; align-items:stretch;}
}
</style>

<script id="app-data" type="application/json">{"manuals":{"1":{"parts":[{"title":"BEM-VINDO À TENKiTER","chapters":[{"title":"Mensagem da gestão","blocks":[{"type":"p","text":"Antes das regras, uma conversa direta com quem está chegando ou já está aqui há tempo.","bold":false},{"type":"quote","text":"\"Não somos bestas, mas também não somos chatos. Ninguém tem coroinha nem benefícios que outros não têm. Quem quiser crescer aqui, ganha mais dinheiro, aprende e cresce junto com a loja.\""},{"type":"p","text":"Esse é o espírito da TENKiTER. As páginas seguintes traduzem esse espírito em regras objetivas, exemplos práticos e procedimentos claros.","bold":false}]},{"title":"Quem somos e como a gente trabalha","blocks":[{"type":"bul","level":0,"text":"A TENKiTER Modas é uma loja de roupas em Crateús (CE), com quase dez anos de história. A gente vende moda feminina e masculina, atende na loja física e também pelo WhatsApp e Instagram (@tenkitermodasceara)."},{"type":"bul","level":0,"text":"O que faz cliente voltar aqui não é só a roupa — é o atendimento. Cliente bem tratado volta e indica; cliente ignorado não volta, e ainda comenta por aí."},{"type":"bul","level":0,"text":"Por isso a regra de ouro é simples: cliente em primeiro lugar, sempre. Isso não quer dizer \"vender de qualquer jeito\" — quer dizer atender bem, com honestidade e dentro das regras."},{"type":"bul","level":0,"text":"A gente trabalha com bom senso e proatividade em todos os níveis: ninguém aqui precisa ser mandado pra fazer o óbvio."}]},{"title":"O que a gente espera de quem vem trabalhar com a gente","blocks":[{"type":"bul","level":0,"text":"Proatividade: perceber o que precisa ser feito e agir, sem ficar esperando ordem pra tudo."},{"type":"bul","level":0,"text":"Bom senso: saber ler a situação (loja cheia, chovendo, cliente esperando) e agir do jeito certo pra cada momento."},{"type":"bul","level":0,"text":"Responsabilidade: todo mundo na equipe depende do trabalho bem-feito de quem vem antes. Fazer sua parte direito já ajuda todo mundo."},{"type":"bul","level":0,"text":"Honestidade acima de tudo — com o caixa, com o estoque, com os colegas."},{"type":"bul","level":0,"text":"Respeito mútuo: sem fofoca, sem panelinha, sem climão entre colegas."},{"type":"callout","kind":"tip","text":"💡  Relaxa: não saber uma coisa nunca é problema. Problema é fazer errado por vergonha de perguntar. Se você for contratado(a), vai aprender exatamente com quem falar em cada situação — ninguém fica perdido(a) aqui."}]}]},{"title":"O QUE VOCÊ VAI FAZER NO DIA A DIA","chapters":[{"title":"Como é o seu dia a dia aqui","blocks":[{"type":"p","text":"Se você for contratado(a), é basicamente isso que você vai fazer (o treinamento de cada tarefa vem na primeira semana — ninguém aprende sozinho(a)):","bold":false},{"type":"bul","level":0,"text":"Atender quem entra na loja — entender o que a pessoa procura, mostrar produtos e ajudar na escolha."},{"type":"bul","level":0,"text":"Manter a loja bonita e organizada — repor peças nas araras, cuidar da vitrine e dos provadores."},{"type":"bul","level":0,"text":"Ajudar a trazer produtos do estoque pro salão de vendas."},{"type":"bul","level":0,"text":"Ajudar a fazer fotos e conteúdo pra Instagram e WhatsApp — foto de produto, tamanho, preço."},{"type":"bul","level":0,"text":"Dependendo da função, mexer no caixa: registrar venda no sistema e conferir a forma de pagamento."},{"type":"bul","level":0,"text":"Ajudar a responder cliente pelo WhatsApp, quando precisar."},{"type":"p","text":"E o ritmo de um dia normal é mais ou menos assim:","bold":true},{"type":"bul","level":0,"text":"Abertura: uma conferência rápida antes do primeiro cliente entrar — loja, provador e caixa em ordem."},{"type":"bul","level":0,"text":"Durante o expediente: cliente sempre em primeiro lugar. Se você está fazendo outra coisa (foto, organização, reposição) e alguém entra, essa tarefa espera."},{"type":"bul","level":0,"text":"Fechamento: organizar tudo de novo pro dia seguinte — peças no lugar, provador conferido, caixa fechado."}]}]},{"title":"PAPO RETO: AS REGRAS DO JOGO","chapters":[{"title":"Regras básicas: roupa e horário","blocks":[{"type":"p","text":"O visual pede um pouco de padrão — nada complicado:","bold":true},{"type":"bul","level":0,"text":"Pés: não é permitido chinelo tipo havaiana. Recomenda-se tênis pelo conforto, mas outras opções fechadas são aceitas."},{"type":"bul","level":0,"text":"Parte de baixo: jeans, calça social ou legging (esta última apenas no caso feminino), sempre em cor escura e sem rasgos."},{"type":"bul","level":0,"text":"Parte de cima: blusa gola careca, sem ser curta e sem decote, sempre em cor escura (preto, azul, cinza etc.), sem estampas ou com pouco detalhe."},{"type":"p","text":"Sobre horário:","bold":true},{"type":"bul","level":0,"text":"Chegar no horário combinado é obrigação básica — não é favor que se faz à loja."},{"type":"callout","kind":"warn","text":"⚠  A ausência durante o horário de trabalho é terminantemente proibida, salvo autorização direta da gestão da loja."}]},{"title":"Como tratar quem entra na loja","blocks":[{"type":"bul","level":0,"text":"Cumprimentar SEMPRE, para todo mundo que entra ou se aproxima: bom dia, boa tarde ou boa noite, conforme o horário — nunca um \"oi\" seco ou silêncio."},{"type":"bul","level":0,"text":"Falar em tom de voz claro e alto o suficiente para ser ouvido de primeira, sem precisar repetir — murmurar ou falar baixo demais passa a impressão de descaso."},{"type":"bul","level":0,"text":"Nunca ignorar quem entra na loja, mesmo em dia cheio: sinalizar que a pessoa foi vista e que já vai ser atendida evita que ela se sinta desprezada."},{"type":"bul","level":0,"text":"Paciência sempre — mesmo se o cliente estiver impaciente, confuso ou de mau humor, o seu tom não acompanha o tom dele."},{"type":"bul","level":0,"text":"Mercadoria só é entregue ao cliente depois que o caixa confirmar o pagamento — no máximo você ajuda a embalar, se pedirem."},{"type":"callout","kind":"tip","text":"💬  \"Bom dia! Posso te ajudar a encontrar alguma coisa?\" — é basicamente essa a ideia: simpatia e vontade de ajudar, sempre."}]},{"title":"Bom senso e prioridades","blocks":[{"type":"bul","level":0,"text":"Bom senso é perceber o momento certo de agir, sem esperar alguém mandar. Alguns exemplos:"},{"type":"bul","level":1,"text":"Choveu → já vai verificando o fundo da loja e os manequins."},{"type":"bul","level":1,"text":"Está arrumando cabide e entra cliente → para tudo e cumprimenta."},{"type":"bul","level":1,"text":"Loja cheia e todo mundo no fundo → alguém assume a porta por conta própria."},{"type":"p","text":"Se tiver mais de uma coisa pra fazer ao mesmo tempo, a ordem é essa:","bold":true},{"type":"quote","text":"CLIENTE > SEGURANÇA > VENDA > CAIXA > ORGANIZAÇÃO > TAREFAS SECUNDÁRIAS"},{"type":"bul","level":0,"text":"Isso já resolve sozinho boa parte das dúvidas do dia a dia: tarefa secundária (foto, dobra, limpeza) para na hora que aparece cliente."},{"type":"bul","level":0,"text":"Rasteira, intriga ou briga entre colegas é terminantemente proibido, dentro ou fora da loja."}]},{"title":"Se você errar, é assim que funciona","blocks":[{"type":"p","text":"Vai errar — todo mundo erra, principalmente no começo. O que importa é o que você faz depois.","bold":false},{"type":"callout","kind":"warn","text":"⚠  Erro comunicado imediatamente é problema. Erro escondido vira prejuízo."},{"type":"bul","level":0,"text":"Errou? Avisa na hora. Não tenta esconder, não tenta consertar sozinho(a) por conta própria — só avisa."}]}]}],"glossary":null,"termo":null,"closing":{"title":"PARA ENCERRAR","blocks":[{"type":"p","text":"Resumo relâmpago, se você só tiver 30 segundos:","bold":true},{"type":"bul","level":0,"text":"Bom dia, boa tarde ou boa noite pra todo mundo que entra — sempre."},{"type":"bul","level":0,"text":"Roupa dentro do padrão, no horário combinado, sem faltar sem avisar."},{"type":"bul","level":0,"text":"Cliente sempre em primeiro lugar — mas dentro das regras."},{"type":"bul","level":0,"text":"Errou? Avisa na hora. Escondido é que vira problema."},{"type":"bul","level":0,"text":"Não sabe? Pergunta. Ninguém nasceu sabendo."},{"type":"p","text":"Se você chegou até aqui, já sabe mais sobre a TENKiTER do que a maioria de quem chega pra uma entrevista — isso já é um baita sinal de interesse real.","bold":false},{"type":"p","text":"Na entrevista, pergunta à vontade sobre qualquer coisa que leu aqui. Se for contratado(a), você recebe o manual completo, com todos os procedimentos de trabalho, treinamento passo a passo e acompanhamento na primeira semana.","bold":false}]}},"2":{"parts":[{"title":"BEM-VINDO À TENKiTER","chapters":[{"title":"Mensagem da gestão","blocks":[{"type":"p","text":"Antes das regras, uma conversa direta com quem está chegando ou já está aqui há tempo.","bold":false},{"type":"quote","text":"\"Não somos bestas, mas também não somos chatos. Ninguém tem coroinha nem benefícios que outros não têm. Quem quiser crescer aqui, ganha mais dinheiro, aprende e cresce junto com a loja.\""},{"type":"p","text":"Esse é o espírito da TENKiTER. As páginas seguintes traduzem esse espírito em regras objetivas, exemplos práticos e procedimentos claros.","bold":false}]},{"title":"Quem somos","blocks":[{"type":"bul","level":0,"text":"A TENKiTER Modas é uma loja de roupas em Crateús (CE), em atividade há nove anos."},{"type":"bul","level":0,"text":"Vendemos moda feminina e masculina, com atendimento presencial na loja física e também pelo WhatsApp e Instagram (@tenkitermodasceara)."},{"type":"bul","level":0,"text":"Nosso público busca peças na moda, com preço justo e atendimento rápido e atencioso — a maioria são clientes da cidade e da região que voltam com frequência quando são bem tratados."},{"type":"bul","level":0,"text":"Nosso diferencial não é só o produto — é o atendimento. Uma cliente bem tratada volta e indica; uma cliente ignorada não volta e ainda comenta."}]},{"title":"Nossa forma de trabalhar","blocks":[{"type":"bul","level":0,"text":"Regra de ouro: cliente em primeiro lugar, sempre — mas isso não significa fazer qualquer coisa para vender. Significa atender bem, com honestidade e dentro das regras."},{"type":"bul","level":0,"text":"Trabalhamos com bom senso e proatividade em todos os níveis. Ninguém espera ser mandado para fazer o óbvio."},{"type":"bul","level":0,"text":"Erro comunicado imediatamente é problema. Erro escondido vira prejuízo."}]},{"title":"O que esperamos de cada pessoa","blocks":[{"type":"bul","level":0,"text":"Proatividade: perceber o que precisa ser feito e agir, sem esperar ordem para tudo."},{"type":"bul","level":0,"text":"Bom senso: saber ler a situação (loja cheia, chuva, cliente esperando) e agir de forma adequada a cada momento."},{"type":"bul","level":0,"text":"Responsabilidade com o próprio trabalho: todo mundo depende do trabalho bem-feito de quem vem antes na cadeia. Fazer sua parte bem já ajuda todo mundo."},{"type":"bul","level":0,"text":"Honestidade acima de tudo: com o caixa, com o estoque, com os colegas e com quem administra a loja."},{"type":"bul","level":0,"text":"Respeito mútuo: sem fofoca, sem panelinha, sem humilhação entre colegas."}]},{"title":"Hierarquia e responsabilidades — quem decide o quê","blocks":[{"type":"p","text":"Antes de agir por conta própria, veja quem é responsável por cada tipo de decisão. Isso evita o clássico \"eu achei que podia\".","bold":false},{"type":"table","rows":[["Situação","Quem resolve"],["Cliente procurando um produto","Vendedor de plantão"],["Organização geral da loja","Todos os colaboradores"],["Dúvida sobre um procedimento","Encarregado(a) / gestão"],["Troca dentro da regra","Caixa"],["Exceção de troca (fora da regra)","Encarregado(a) / gestão"],["Cancelamento de venda / estorno","Responsável autorizado"],["PIX não identificado ou não confirmado","Karla ou Pablo"],["Reclamação ou problema com cliente","Caixa/encarregado(a) → se não resolver, gestão"],["Desconto fora da política padrão","Encarregado(a) / gestão"],["Problema de conduta entre funcionários","Encarregado(a) → gestão"],["Uso de veículo da loja","Somente com autorização prévia"],["Sistema travado / dúvida técnica","Responsável definido para TI/sistema"]]},{"type":"quote","text":"\"Eu achei que podia\" deixa de existir a partir desta tabela. Na dúvida, consulte-a antes de agir."},{"type":"bul","level":0,"text":"O sistema da loja também reforça essa hierarquia na prática: cada login tem um nível de acesso, então algumas ações desta tabela ficam tecnicamente disponíveis só para quem tem permissão — não é só combinado, é configurado."}]},{"title":"O que fazer quando não sei o que fazer","blocks":[{"type":"bul","level":0,"text":"Não existe problema em não saber alguma coisa. Existe problema em fazer errado sabendo que não sabia."},{"type":"bul","level":0,"text":"Siga esta ordem sempre que tiver dúvida:"},{"type":"bul","level":1,"text":"1. Consulte este manual (use o sumário para achar o assunto)."},{"type":"bul","level":1,"text":"2. Procure o procedimento correspondente na tabela de responsabilidades."},{"type":"bul","level":1,"text":"3. Pergunte ao responsável indicado."},{"type":"bul","level":1,"text":"4. Só execute depois de entender — nunca \"tente e veja no que dá\" em procedimento de caixa, troca ou pagamento."}]}]},{"title":"O QUE ESPERAMOS DE VOCÊ NO DIA A DIA","chapters":[{"title":"Vestimenta","blocks":[{"type":"bul","level":0,"text":"Pés: não é permitido chinelo tipo havaiana. Recomenda-se tênis pelo conforto, mas outras opções fechadas são aceitas."},{"type":"bul","level":0,"text":"Parte de baixo: jeans, calça social ou legging (esta última apenas no caso feminino), sempre em cor escura e sem rasgos."},{"type":"bul","level":0,"text":"Parte de cima: blusa gola careca, sem ser curta e sem decote, sempre em cor escura (preto, azul, cinza etc.), sem estampas ou com pouco detalhe."}]},{"title":"Pontualidade e horários","blocks":[{"type":"bul","level":0,"text":"Chegar no horário combinado é obrigação básica — não é favor que se faz à loja."},{"type":"quote","text":"Está terminantemente proibida a ausência do colaborador durante o horário de trabalho, salvo com autorização direta da Karla ou do Pablo. Nenhum outro funcionário tem essa autorização."}]},{"title":"Postura e forma de falar com o cliente","blocks":[{"type":"bul","level":0,"text":"Cumprimentar SEMPRE, para todo mundo que entra ou se aproxima: bom dia, boa tarde ou boa noite, conforme o horário — nunca um \"oi\" seco ou silêncio."},{"type":"bul","level":0,"text":"Falar em tom de voz claro e alto o suficiente para ser ouvido de primeira, sem precisar repetir — murmurar ou falar baixo demais passa a impressão de descaso."},{"type":"bul","level":0,"text":"Nunca ignorar quem entra na loja, mesmo em dia cheio: sinalizar que a pessoa foi vista e que já vai ser atendida evita que ela se sinta desprezada."},{"type":"bul","level":0,"text":"Manter educação e paciência mesmo quando o cliente está impaciente, confuso ou de mau humor — o tom de quem atende não deve nunca acompanhar o tom ríspido do cliente."},{"type":"bul","level":0,"text":"Nunca entregar mercadoria diretamente ao cliente antes da confirmação de pagamento pelo caixa — no máximo, ajudar a embalar se o caixa solicitar."}]},{"title":"Convivência e bom senso","blocks":[{"type":"bul","level":0,"text":"Bom senso é a capacidade de identificar o momento certo para agir de determinada forma. Exemplos práticos:"},{"type":"bul","level":1,"text":"Está chovendo → verificar imediatamente fundo da loja e manequins, sem esperar pedido."},{"type":"bul","level":1,"text":"Está organizando cabides e entra cliente → parar, deixar tudo fora da passagem e cumprimentar."},{"type":"bul","level":1,"text":"Está fotografando produto e entra cliente → interromper a foto e liberar passagem/atender."},{"type":"bul","level":1,"text":"Loja lotada e todos os vendedores estão no fundo → alguém assume a porta/entrada por conta própria."},{"type":"bul","level":0,"text":"Rasteiras, picuinhas ou brigas entre colaboradores são terminantemente proibidas dentro e fora da loja em contexto de trabalho."}]},{"title":"Proatividade em ação: a regra de prioridade","blocks":[{"type":"bul","level":0,"text":"Proatividade é perceber a necessidade do momento e agir sem esperar ordem."},{"type":"bul","level":0,"text":"Regra prática de prioridade durante o expediente:"},{"type":"quote","text":"CLIENTE > SEGURANÇA > VENDA > CAIXA > ORGANIZAÇÃO > TAREFAS SECUNDÁRIAS"},{"type":"bul","level":0,"text":"Isso resolve, sozinho, boa parte das dúvidas do dia a dia: qualquer tarefa secundária (foto, dobra, limpeza) é interrompida na hora em que aparece um cliente."}]},{"title":"Celular e uso pessoal das ferramentas da loja","blocks":[{"type":"bul","level":0,"text":"Uso de celular na loja segue a regra do bom senso: guardado durante o atendimento e em momentos de movimento; pode ser usado com moderação em horários tranquilos, inclusive para postar conteúdo da loja."},{"type":"bul","level":0,"text":"Qualquer colega pode pedir, educadamente, que outro guarde o celular — não é preciso esperar a gestão chamar atenção."},{"type":"bul","level":0,"text":"Computador, moto e demais equipamentos da loja são ferramentas de trabalho, não de uso particular: nada de e-mail pessoal, redes sociais próprias no computador da loja, ou moto como meio de transporte pessoal fora de entregas e compras autorizadas."},{"type":"bul","level":0,"text":"Exceção pontual (ex.: chuva, hora tarde) pode ser autorizada caso a caso — nunca deve ser tratada como direito adquirido."}]},{"title":"Redes sociais — obrigação profissional x colaboração pessoal","blocks":[{"type":"bul","level":0,"text":"Ninguém é obrigado a postar conteúdo da loja em suas redes sociais pessoais (WhatsApp, Instagram, Facebook particulares)."},{"type":"bul","level":0,"text":"Dito isso: a loja investe em divulgação para atrair clientes, e colaboradores que ajudam divulgando espontaneamente demonstram o tipo de proatividade que é valorizada para oportunidades de crescimento."},{"type":"bul","level":0,"text":"Divulgar em rede pessoal é colaboração voluntária, nunca uma tarefa do cargo."}]},{"title":"Uso de equipamentos e veículo","blocks":[{"type":"bul","level":0,"text":"Moto da loja: uso restrito a entregas e compras autorizadas. Não é meio de transporte pessoal."},{"type":"bul","level":0,"text":"Qualquer saída com o veículo deve ser comunicada e, sempre que possível, autorizada previamente."},{"type":"bul","level":0,"text":"Nunca deixar a loja sem cobertura de uma função crítica (caixa ou atendimento) para sair em entrega."}]},{"title":"Comunicação interna","blocks":[{"type":"bul","level":0,"text":"Avisos importantes devem ser lidos e, quando solicitado, confirmados no grupo de WhatsApp da equipe."},{"type":"bul","level":0,"text":"Mensagens no grupo durante o expediente devem ser objetivas — evitar conversa paralela que atrapalhe o atendimento."},{"type":"bul","level":0,"text":"Como pedir ajuda: chame o colega mais próximo disponível; se a situação envolver decisão fora da sua alçada, acione o responsável direto."},{"type":"bul","level":0,"text":"Atrasos, faltas e problemas pessoais que afetem o trabalho devem ser comunicados diretamente ao responsável, com antecedência sempre que possível."}]},{"title":"Conflitos entre funcionários","blocks":[{"type":"bul","level":0,"text":"É permitido: chamar atenção com educação, apontar um erro, pedir colaboração, comunicar um problema ao responsável."},{"type":"bul","level":0,"text":"Não é permitido: gritar, humilhar, ironizar, ameaçar, discutir na frente de cliente, fazer fofoca, formar grupos contra um colega, retaliar ou ignorar colega deliberadamente."},{"type":"bul","level":0,"text":"Havendo conflito, siga esta sequência:"},{"type":"bul","level":1,"text":"1. Pare a discussão imediatamente."},{"type":"bul","level":1,"text":"2. Nunca envolva o cliente na disputa."},{"type":"bul","level":1,"text":"3. Não transforme o colega em inimigo."},{"type":"bul","level":1,"text":"4. Comunique ao responsável."},{"type":"bul","level":1,"text":"5. Cada pessoa relata sua versão separadamente."},{"type":"bul","level":1,"text":"6. A decisão final não cabe aos envolvidos."}]},{"title":"Liderança pelo exemplo","blocks":[{"type":"bul","level":0,"text":"A loja funciona como um círculo: quem vende depende de quem organiza; quem organiza depende de quem etiqueta. Cada elo bem-feito sustenta o seguinte."},{"type":"bul","level":0,"text":"Fazer sua parte com excelência e ensinar/orientar um colega novo com paciência já é uma forma de liderar — isso é o que diferencia quem cresce dentro da TENKiTER."}]},{"title":"\"Errei. O que faço?\" — procedimento completo","blocks":[{"type":"p","text":"Este é um dos capítulos mais importantes do manual — porque todo funcionário novo vai errar em algum momento.","bold":false},{"type":"quote","text":"Erro comunicado imediatamente é problema. Erro escondido vira prejuízo."},{"type":"bul","level":0,"text":"Exemplos de erro que devem ser comunicados na hora: passar produto errado, dar desconto errado, registrar pagamento errado, perder etiqueta, quebrar produto, entregar produto errado ao cliente, entregar sem confirmar pagamento, mexer no sistema por engano, caixa não bater."},{"type":"bul","level":0,"text":"Procedimento único para qualquer erro:"},{"type":"quote","text":"PARAR → NÃO TENTAR ESCONDER → COMUNICAR → PRESERVAR AS INFORMAÇÕES → AGUARDAR ORIENTAÇÃO."}]}]},{"title":"ROTINA DA LOJA","chapters":[{"title":"Abertura da loja — checklist","blocks":[{"type":"bul","level":0,"text":"Chegar no horário e guardar objetos pessoais."},{"type":"bul","level":0,"text":"Vestir uniforme/vestimenta adequada."},{"type":"bul","level":0,"text":"Conferir limpeza geral, fachada, manequins e araras."},{"type":"bul","level":0,"text":"Conferir provador (organizado, sem peças esquecidas)."},{"type":"bul","level":0,"text":"Abrir e conferir o caixa."},{"type":"bul","level":0,"text":"Conferir estoque/áreas designadas para reposição."},{"type":"bul","level":0,"text":"Verificar orientações pendentes, promoções vigentes e produtos precisando reposição."}]},{"title":"Organização das mercadorias","blocks":[{"type":"bul","level":0,"text":"Cada categoria de produto tem um lugar definido — você será apresentado(a) ao mapa da loja."},{"type":"bul","level":0,"text":"Regra fundamental:"},{"type":"quote","text":"Quem pega, devolve. Se não sabe onde guardar, não inventa: pergunta."},{"type":"bul","level":0,"text":"Ao retirar peça da arara para mostrar ao cliente, devolvê-la ao lugar correto assim que possível."},{"type":"bul","level":0,"text":"Separar por tamanho e cor conforme o padrão já estabelecido em cada seção da loja."}]},{"title":"Reposição e estoque","blocks":[{"type":"bul","level":0,"text":"Produto que sai do estoque para a loja deve ser conferido (código/etiqueta) antes de ser exposto."},{"type":"bul","level":0,"text":"Áreas com produto em falta na loja devem ser repostas assim que identificadas — não esperar a cliente perguntar."},{"type":"bul","level":0,"text":"Entrada de mercadoria: conferir quantidade e itens recebidos contra a nota/lista antes de guardar, e registrar no sistema conforme orientação do responsável."},{"type":"bul","level":0,"text":"Ao encontrar produto sem etiqueta, com etiqueta errada, danificado, fora do lugar, sem código, ou divergente do sistema: pare, separe a peça e comunique ao responsável."},{"type":"bul","level":0,"text":"Regra absoluta:"},{"type":"quote","text":"NUNCA ALTERAR O SISTEMA POR CONTA PRÓPRIA. Qualquer divergência é comunicada, nunca corrigida sozinho(a)."}]},{"title":"Provador","blocks":[{"type":"bul","level":0,"text":"Controlar a quantidade de peças que entram no provador com a cliente (ex.: até 5 peças por vez)."},{"type":"bul","level":0,"text":"Contar as peças antes da cliente entrar e conferir ao sair."},{"type":"bul","level":0,"text":"Se a cliente deixar peças no provador, recolher, conferir e devolver ao lugar."},{"type":"bul","level":0,"text":"Peça danificada encontrada no provador: separar, não repor à venda, e comunicar ao responsável."},{"type":"bul","level":0,"text":"Respeitar a privacidade: bater/avisar antes de entrar."}]},{"title":"Etiquetagem","blocks":[{"type":"bul","level":0,"text":"Fluxo padrão: produto → etiqueta → código → descrição → preço → sistema."},{"type":"bul","level":0,"text":"A etiqueta é uma das principais barreiras de conferência da loja — um erro aqui se propaga até o caixa."},{"type":"bul","level":0,"text":"Ao identificar erro (ex.: etiqueta diz \"short\", produto é \"saia\"): não corrigir por conta própria."},{"type":"bul","level":0,"text":"Procedimento: parar → separar a peça → comunicar ao responsável → corrigir somente conforme autorização."}]},{"title":"Fotos e divulgação — produção de conteúdo","blocks":[{"type":"bul","level":0,"text":"Cuidados na foto do produto: boa iluminação, enquadramento mostrando a peça inteira, sem deformar o produto, conferindo que é a peça correta antes de fotografar."},{"type":"bul","level":0,"text":"Identificar o produto (código/nome) e enviar para onde for determinado."},{"type":"bul","level":0,"text":"Nos Stories: manter sequência lógica, incluir preço e forma de contato, evitar postar a mesma peça repetidamente no mesmo dia."}]},{"title":"Fechamento da loja — checklist","blocks":[{"type":"bul","level":0,"text":"Loja organizada, produtos recolocados e cabides organizados."},{"type":"bul","level":0,"text":"Provador conferido e estoque organizado."},{"type":"bul","level":0,"text":"Lixo recolhido e equipamentos desligados/guardados."},{"type":"bul","level":0,"text":"Caixa fechado e conferido."},{"type":"bul","level":0,"text":"Portas, ar-condicionado e luzes conferidos."},{"type":"bul","level":0,"text":"Pendências do dia comunicadas ao responsável antes de sair."}]}]},{"title":"VENDAS","chapters":[{"title":"Abordagem e descoberta da necessidade","blocks":[{"type":"bul","level":0,"text":"Cumprimentar sempre, com simpatia, em tom audível."},{"type":"bul","level":0,"text":"Cliente disse \"só estou olhando\": responder de forma leve, sem insistir: \"Fico por aqui se precisar de alguma coisa, viu?\""},{"type":"bul","level":0,"text":"Perguntas úteis para direcionar o atendimento:"},{"type":"bul","level":1,"text":"O que está procurando? É para você ou para presente?"},{"type":"bul","level":1,"text":"Qual tamanho costuma usar? Prefere algum estilo específico?"},{"type":"bul","level":1,"text":"Tem uma faixa de preço em mente? Gostaria de experimentar?"}]},{"title":"Apresentação, venda complementar e experimentação","blocks":[{"type":"bul","level":0,"text":"Apresentar a primeira opção, uma segunda opção, uma alternativa mais em conta e uma alternativa superior, quando fizer sentido."},{"type":"bul","level":0,"text":"Sugerir combinações de peças como serviço, não como pressão: \"Quer que eu te mostre uma calça/short que combina com essa blusa?\""},{"type":"bul","level":0,"text":"Incentivar a experimentação sempre que possível — reduz troca posterior e aumenta confiança na compra."}]},{"title":"Cliente disse \"não\" — lidando com objeções","blocks":[{"type":"table","rows":[["Objeção da cliente","Como responder"],["\"Está caro\"","Reforçar qualidade/diferencial da peça e apresentar alternativa dentro da faixa de preço dela, sem depreciar o produto."],["\"Vou pensar\"","Aceitar com simpatia, oferecer reservar por um tempo e reforçar canal de contato (WhatsApp/Instagram)."],["\"Só estou olhando\"","Não insistir; deixar claro que está à disposição."],["\"Não gostei\"","Perguntar o que não agradou e oferecer alternativa nesse ponto específico."],["\"Tem desconto?\"","Seguir a política de descontos — nunca prometer sem autorização."],["\"Na outra loja é mais barato\"","Focar no diferencial da TENKiTER, sem falar mal do concorrente."],["\"Vou perguntar ao meu marido/família\"","Oferecer reservar a peça por um prazo curto."]]}]},{"title":"Finalização da venda e comissão","blocks":[{"type":"bul","level":0,"text":"Confirmar todas as peças, forma de pagamento e o nome do vendedor responsável."},{"type":"bul","level":0,"text":"A comissão é do vendedor que efetivamente atendeu e concluiu a venda."},{"type":"bul","level":0,"text":"Colocar nome de vendedor por associação, conveniência ou interesse pessoal para aumentar comissão de alguém é falta gravíssima: gera demissão por justa causa e configura crime penal."},{"type":"bul","level":0,"text":"Venda iniciada por um vendedor e concluída por outro: a comissão segue o critério da gestão — em caso de dúvida, perguntar antes de registrar."}]},{"title":"Reserva de produtos e política de descontos","blocks":[{"type":"bul","level":0,"text":"Qualquer vendedor pode reservar uma peça por um prazo curto combinado. Registrar de forma visível para que outro colega não venda a mesma peça."},{"type":"bul","level":0,"text":"Se a cliente não buscar dentro do prazo, a peça volta ao estoque disponível."},{"type":"bul","level":0,"text":"Pode fazer: aplicar promoções já divulgadas e vigentes na loja."},{"type":"bul","level":0,"text":"Não pode, sem autorização: alterar preço no sistema, inventar desconto, negociar abaixo do permitido, ou prometer condição futura ao cliente."}]},{"title":"O cliente pertence à loja, não ao vendedor","blocks":[{"type":"quote","text":"\"O cliente não pertence ao vendedor. O cliente pertence à TENKiTER.\""},{"type":"bul","level":0,"text":"Se um cliente já tem um vendedor de referência e esse vendedor está ausente, qualquer outro colaborador deve atendê-lo normalmente — a comissão é resolvida depois, e não deve virar disputa entre colegas."}]}]},{"title":"CAIXA E PAGAMENTOS (VISÃO GERAL)","chapters":[{"title":"Postura de quem está no caixa e como funciona uma venda","blocks":[{"type":"bul","level":0,"text":"Cumprimentar SEMPRE, para todo mundo que entra ou se aproxima: bom dia, boa tarde ou boa noite, conforme o horário — nunca um \"oi\" seco ou silêncio."},{"type":"bul","level":0,"text":"Perguntar com gentileza se algum vendedor já atendeu o cliente. Se a pessoa não souber, não insistir."},{"type":"bul","level":0,"text":"Lançar os produtos conferindo se a etiqueta corresponde à peça — o caixa é a última barreira de conferência."},{"type":"bul","level":0,"text":"Regra inegociável:"},{"type":"quote","text":"Só finalizar a venda e emitir o comprovante depois que o pagamento estiver de fato confirmado — nunca antes."}]},{"title":"Formas de pagamento — regras de liberação","blocks":[{"type":"bul","level":0,"text":"Dinheiro: conferir o valor recebido antes de dar o troco."},{"type":"bul","level":0,"text":"Cartão (débito ou crédito): só finalizar depois que a máquina aprovar o pagamento e o comprovante sair."},{"type":"bul","level":0,"text":"PIX: a venda só é finalizada depois que o pagamento for confirmado por Karla ou Pablo — nunca apenas pelo print."},{"type":"quote","text":"PRINT DE PIX NÃO É CONFIRMAÇÃO DE PAGAMENTO."},{"type":"bul","level":0,"text":"Link de pagamento: mercadoria só é entregue após a confirmação do Pablo, da mesma forma que o PIX."},{"type":"bul","level":0,"text":"Fiado / crediário: só é permitido com autorização prévia — nunca por conta própria."}]},{"title":"Movimentações, conferência e fechamento de caixa","blocks":[{"type":"bul","level":0,"text":"Reforços de troco ou retiradas de dinheiro são feitos no sistema e sempre precisam ficar registrados com um motivo claro (nome de quem autorizou + motivo)."},{"type":"bul","level":0,"text":"O caixa deve ser conferido periodicamente ao longo do dia, contando o dinheiro físico e comparando com o que o sistema indica."},{"type":"bul","level":0,"text":"Havendo divergência, verificar o procedimento com outro colaborador antes de qualquer ajuste — nunca ajustar por conta própria."}]}]},{"title":"TROCAS E PÓS-VENDA","chapters":[{"title":"Política geral de troca","blocks":[{"type":"bul","level":0,"text":"Prazo padrão: 7 dias corridos a partir da compra."},{"type":"bul","level":0,"text":"Regra absoluta: não trocamos, em hipótese nenhuma, peça sem etiqueta."},{"type":"bul","level":0,"text":"Peças que não trocam por padrão: itens de uso íntimo (por higiene) e peças frágeis como tricô, renda e paetê (se danificam com facilidade) — o vendedor deve avisar isso no momento da venda."}]},{"title":"Árvore de decisão de troca","blocks":[{"type":"bul","level":0,"text":"Tem cupom de compra? Não → encaminhar ao responsável. Sim → continuar."},{"type":"bul","level":0,"text":"Tem etiqueta na peça? Não → não realizar a troca. Sim → continuar."},{"type":"bul","level":0,"text":"O produto está na lista de itens que podem ser trocados? Não → explicar a regra com educação. Sim → continuar."},{"type":"bul","level":0,"text":"O produto está íntegro? Não → chamar o responsável. Sim → continuar."},{"type":"bul","level":0,"text":"Está dentro do prazo de 7 dias? Sim → seguir o procedimento normal. Não → chamar o responsável para avaliar exceção."}]},{"title":"Troca com diferença de valor","blocks":[{"type":"bul","level":0,"text":"Regra da diferença de valor:"},{"type":"quote","text":"A diferença é sempre calculada pela forma de pagamento usada NESTA troca — nunca pela forma usada na compra original."},{"type":"p","text":"Isso porque, na venda no cartão, a diferença entre o valor à vista e o valor no cartão fica com a operadora do cartão, não com a loja. Se não entender de primeira, pergunte antes que o problema aconteça na frente do cliente.","bold":false}]},{"title":"Cancelamento e erros de caixa","blocks":[{"type":"bul","level":0,"text":"Erro identificado ANTES de finalizar a venda: pode ser corrigido diretamente por quem está no caixa."},{"type":"bul","level":0,"text":"Venda JÁ finalizada: o cancelamento só pode ser feito por quem tem permissão de administrador no sistema — nunca por conta própria."},{"type":"bul","level":0,"text":"Produto passado duas vezes, preço errado, PIX duplicado, cartão recusado: comunicar imediatamente ao responsável. Não tente \"dar um jeito\" sozinho."},{"type":"quote","text":"PARAR → NÃO TENTAR ESCONDER → COMUNICAR → PRESERVAR AS INFORMAÇÕES → AGUARDAR ORIENTAÇÃO."}]}]},{"title":"WHATSAPP, INSTAGRAM E ATENDIMENTO DIGITAL","chapters":[{"title":"Atendimento pelo WhatsApp","blocks":[{"type":"bul","level":0,"text":"Responder o cliente dentro de um tempo curto — resposta demorada é venda perdida."},{"type":"bul","level":0,"text":"Ao enviar fotos, informar preço e tamanho, e verificar disponibilidade real antes de confirmar."},{"type":"bul","level":0,"text":"Confirmação de pagamento pelo WhatsApp segue exatamente a mesma regra de PIX/cartão do caixa — nunca considerar pago apenas pelo print."},{"type":"bul","level":0,"text":"Nunca prometer o que não pode garantir (prazo de entrega, disponibilidade não confirmada, desconto não autorizado)."},{"type":"bul","level":0,"text":"Toda venda iniciada pelo WhatsApp deve ser registrada no sistema, com vendedor identificado."}]},{"title":"Catálogo, fotos e Stories no Instagram","blocks":[{"type":"bul","level":0,"text":"Seguir os mesmos cuidados de fotografia usados no catálogo digital."},{"type":"bul","level":0,"text":"Nos Stories: sequência lógica, preço, chamada para ação, disponibilidade e bom horário de postagem."}]},{"title":"Reservas pelo WhatsApp e entregas","blocks":[{"type":"bul","level":0,"text":"Reserva pelo WhatsApp segue a mesma regra da reserva presencial: prazo combinado, registro visível."},{"type":"bul","level":0,"text":"Entregas: definir quem pode sair e quando, nunca deixando uma função crítica descoberta."},{"type":"bul","level":0,"text":"Pagamento na entrega (dinheiro): trazer o comprovante/registro para lançamento no caixa assim que possível."}]}]},{"title":"SEGURANÇA E SITUAÇÕES-PROBLEMA","chapters":[{"title":"Suspeita de furto e prevenção de perdas","blocks":[{"type":"bul","level":0,"text":"Em caso de comportamento suspeito, não confrontar fisicamente o suspeito em nenhuma hipótese."},{"type":"bul","level":0,"text":"Comunicar discretamente ao responsável presente."}]},{"title":"Cliente difícil ou agressivo","blocks":[{"type":"bul","level":0,"text":"Manter a calma e não entrar em discussão na frente de outros clientes."},{"type":"bul","level":0,"text":"Se não conseguir resolver, chamar o responsável imediatamente."}]},{"title":"Sistema fora do ar, acidentes e emergências","blocks":[{"type":"bul","level":0,"text":"Sistema fora do ar: interromper vendas que dependem dele e informar o responsável imediatamente."},{"type":"bul","level":0,"text":"Emergências: priorizar a segurança das pessoas antes de qualquer produto ou venda."}]}]}],"glossary":[["Termo","Significado"],["PDV","Sistema de ponto de venda usado na loja para registrar vendas, caixa e estoque."],["AUT","Código de autorização gerado pela maquininha de cartão."],["LINK","Link de pagamento enviado ao cliente — mercadoria só é entregue após confirmação do Pablo."],["PIX","Pagamento instantâneo — só é considerado confirmado após validação de Karla ou Pablo."],["Fiado / Crediário","Venda a prazo, permitida somente com autorização prévia."],["Troca","Substituição de peça já comprada, dentro do prazo e das condições da política de troca."],["Reserva","Peça separada temporariamente para uma cliente, por prazo combinado."],["Vendedor","Colaborador responsável pelo atendimento que gera a comissão da venda."],["Encarregado(a)","Colaborador com responsabilidade ampliada de apoio e orientação no dia a dia."],["Gestão","Karla e/ou Pablo — decisão final em exceções e casos não previstos."]],"termo":{"title":"TERMO DE CIÊNCIA","blocks":[{"type":"p","text":"Declaro que li e compreendi o Manual TM Funcionário Estágio, incluindo as regras de conduta, a rotina da loja, o processo de vendas, as regras gerais de caixa e pagamento e a política de trocas nele descritas, comprometendo-me a segui-lo integralmente.","bold":false},{"type":"p","text":"Nome: ____________________________________________","bold":false},{"type":"p","text":"Data: ____/____/______        Assinatura: ____________________________________________","bold":false}]},"closing":null},"3":{"parts":[{"title":"BEM-VINDO À TENKiTER","chapters":[{"title":"Mensagem da gestão","blocks":[{"type":"p","text":"Antes das regras, uma conversa direta com quem está chegando ou já está aqui há tempo.","bold":false},{"type":"quote","text":"\"Não somos bestas, mas também não somos chatos. Ninguém tem coroinha nem benefícios que outros não têm. Quem quiser crescer aqui, ganha mais dinheiro, aprende e cresce junto com a loja.\""},{"type":"p","text":"Esse é o espírito da TENKiTER. As páginas seguintes traduzem esse espírito em regras objetivas, exemplos práticos e procedimentos claros.","bold":false}]},{"title":"Quem somos","blocks":[{"type":"bul","level":0,"text":"A TENKiTER Modas é uma loja de roupas em Crateús (CE), em atividade há nove anos."},{"type":"bul","level":0,"text":"Vendemos moda feminina e masculina, com atendimento presencial na loja física e também pelo WhatsApp e Instagram (@tenkitermodasceara)."},{"type":"bul","level":0,"text":"Nosso público busca peças na moda, com preço justo e atendimento rápido e atencioso — a maioria são clientes da cidade e da região que voltam com frequência quando são bem tratados."},{"type":"bul","level":0,"text":"Nosso diferencial não é só o produto — é o atendimento. Uma cliente bem tratada volta e indica; uma cliente ignorada não volta e ainda comenta."}]},{"title":"Nossa forma de trabalhar","blocks":[{"type":"bul","level":0,"text":"Regra de ouro: cliente em primeiro lugar, sempre — mas isso não significa fazer qualquer coisa para vender. Significa atender bem, com honestidade e dentro das regras."},{"type":"bul","level":0,"text":"Trabalhamos com bom senso e proatividade em todos os níveis. Ninguém espera ser mandado para fazer o óbvio."},{"type":"bul","level":0,"text":"Erro comunicado imediatamente é problema. Erro escondido vira prejuízo."}]},{"title":"O que esperamos de cada pessoa","blocks":[{"type":"bul","level":0,"text":"Proatividade: perceber o que precisa ser feito e agir, sem esperar ordem para tudo."},{"type":"bul","level":0,"text":"Bom senso: saber ler a situação (loja cheia, chuva, cliente esperando) e agir de forma adequada a cada momento."},{"type":"bul","level":0,"text":"Responsabilidade com o próprio trabalho: todo mundo depende do trabalho bem-feito de quem vem antes na cadeia. Fazer sua parte bem já ajuda todo mundo."},{"type":"bul","level":0,"text":"Honestidade acima de tudo: com o caixa, com o estoque, com os colegas e com quem administra a loja."},{"type":"bul","level":0,"text":"Respeito mútuo: sem fofoca, sem panelinha, sem humilhação entre colegas."}]},{"title":"Hierarquia e responsabilidades — quem decide o quê","blocks":[{"type":"p","text":"Antes de agir por conta própria, veja quem é responsável por cada tipo de decisão. Isso evita o clássico \"eu achei que podia\".","bold":false},{"type":"table","rows":[["Situação","Quem resolve"],["Cliente procurando um produto","Vendedor de plantão"],["Organização geral da loja","Todos os colaboradores"],["Dúvida sobre um procedimento","Encarregado(a) / gestão"],["Troca dentro da regra","Caixa"],["Exceção de troca (fora da regra)","Encarregado(a) / gestão"],["Cancelamento de venda / estorno","Responsável autorizado"],["PIX não identificado ou não confirmado","Karla ou Pablo"],["Reclamação ou problema com cliente","Caixa/encarregado(a) → se não resolver, gestão"],["Desconto fora da política padrão","Encarregado(a) / gestão"],["Problema de conduta entre funcionários","Encarregado(a) → gestão"],["Uso de veículo da loja","Somente com autorização prévia"],["Sistema travado / dúvida técnica","Responsável definido para TI/sistema"]]},{"type":"quote","text":"\"Eu achei que podia\" deixa de existir a partir desta tabela. Na dúvida, consulte-a antes de agir."},{"type":"bul","level":0,"text":"O sistema da loja também reforça essa hierarquia na prática: cada login tem um nível de acesso, então algumas ações desta tabela ficam tecnicamente disponíveis só para quem tem permissão — não é só combinado, é configurado."}]},{"title":"O que fazer quando não sei o que fazer","blocks":[{"type":"bul","level":0,"text":"Não existe problema em não saber alguma coisa. Existe problema em fazer errado sabendo que não sabia."},{"type":"bul","level":0,"text":"Siga esta ordem sempre que tiver dúvida:"},{"type":"bul","level":1,"text":"1. Consulte este manual (use o sumário para achar o assunto)."},{"type":"bul","level":1,"text":"2. Procure o procedimento correspondente na tabela de responsabilidades."},{"type":"bul","level":1,"text":"3. Pergunte ao responsável indicado."},{"type":"bul","level":1,"text":"4. Só execute depois de entender — nunca \"tente e veja no que dá\" em procedimento de caixa, troca ou pagamento."}]}]},{"title":"O QUE ESPERAMOS DE VOCÊ NO DIA A DIA","chapters":[{"title":"Vestimenta","blocks":[{"type":"bul","level":0,"text":"Pés: não é permitido chinelo tipo havaiana. Recomenda-se tênis pelo conforto, mas outras opções fechadas são aceitas."},{"type":"bul","level":0,"text":"Parte de baixo: jeans, calça social ou legging (esta última apenas no caso feminino), sempre em cor escura e sem rasgos."},{"type":"bul","level":0,"text":"Parte de cima: blusa gola careca, sem ser curta e sem decote, sempre em cor escura (preto, azul, cinza etc.), sem estampas ou com pouco detalhe."}]},{"title":"Pontualidade e horários","blocks":[{"type":"bul","level":0,"text":"Chegar no horário combinado é obrigação básica — não é favor que se faz à loja."},{"type":"quote","text":"Está terminantemente proibida a ausência do colaborador durante o horário de trabalho, salvo com autorização direta da Karla ou do Pablo. Nenhum outro funcionário tem essa autorização."}]},{"title":"Postura e forma de falar com o cliente","blocks":[{"type":"bul","level":0,"text":"Cumprimentar SEMPRE, para todo mundo que entra ou se aproxima: bom dia, boa tarde ou boa noite, conforme o horário — nunca um \"oi\" seco ou silêncio."},{"type":"bul","level":0,"text":"Falar em tom de voz claro e alto o suficiente para ser ouvido de primeira, sem precisar repetir — murmurar ou falar baixo demais passa a impressão de descaso."},{"type":"bul","level":0,"text":"Nunca ignorar quem entra na loja, mesmo em dia cheio: sinalizar que a pessoa foi vista e que já vai ser atendida evita que ela se sinta desprezada."},{"type":"bul","level":0,"text":"Manter educação e paciência mesmo quando o cliente está impaciente, confuso ou de mau humor — o tom de quem atende não deve nunca acompanhar o tom ríspido do cliente."},{"type":"bul","level":0,"text":"Nunca entregar mercadoria diretamente ao cliente antes da confirmação de pagamento pelo caixa — no máximo, ajudar a embalar se o caixa solicitar."}]},{"title":"Convivência e bom senso","blocks":[{"type":"bul","level":0,"text":"Bom senso é a capacidade de identificar o momento certo para agir de determinada forma. Exemplos práticos:"},{"type":"bul","level":1,"text":"Está chovendo → verificar imediatamente fundo da loja e manequins, sem esperar pedido."},{"type":"bul","level":1,"text":"Está organizando cabides e entra cliente → parar, deixar tudo fora da passagem e cumprimentar."},{"type":"bul","level":1,"text":"Está fotografando produto e entra cliente → interromper a foto e liberar passagem/atender."},{"type":"bul","level":1,"text":"Loja lotada e todos os vendedores estão no fundo → alguém assume a porta/entrada por conta própria."},{"type":"bul","level":0,"text":"Rasteiras, picuinhas ou brigas entre colaboradores são terminantemente proibidas dentro e fora da loja em contexto de trabalho."}]},{"title":"Proatividade em ação: a regra de prioridade","blocks":[{"type":"bul","level":0,"text":"Proatividade é perceber a necessidade do momento e agir sem esperar ordem."},{"type":"bul","level":0,"text":"Regra prática de prioridade durante o expediente:"},{"type":"quote","text":"CLIENTE > SEGURANÇA > VENDA > CAIXA > ORGANIZAÇÃO > TAREFAS SECUNDÁRIAS"},{"type":"bul","level":0,"text":"Isso resolve, sozinho, boa parte das dúvidas do dia a dia: qualquer tarefa secundária (foto, dobra, limpeza) é interrompida na hora em que aparece um cliente."}]},{"title":"Celular e uso pessoal das ferramentas da loja","blocks":[{"type":"bul","level":0,"text":"Uso de celular na loja segue a regra do bom senso: guardado durante o atendimento e em momentos de movimento; pode ser usado com moderação em horários tranquilos, inclusive para postar conteúdo da loja."},{"type":"bul","level":0,"text":"Qualquer colega pode pedir, educadamente, que outro guarde o celular — não é preciso esperar a gestão chamar atenção."},{"type":"bul","level":0,"text":"Computador, moto e demais equipamentos da loja são ferramentas de trabalho, não de uso particular: nada de e-mail pessoal, redes sociais próprias no computador da loja, ou moto como meio de transporte pessoal fora de entregas e compras autorizadas."},{"type":"bul","level":0,"text":"Exceção pontual (ex.: chuva, hora tarde) pode ser autorizada caso a caso — nunca deve ser tratada como direito adquirido."}]},{"title":"Redes sociais — obrigação profissional x colaboração pessoal","blocks":[{"type":"bul","level":0,"text":"Ninguém é obrigado a postar conteúdo da loja em suas redes sociais pessoais (WhatsApp, Instagram, Facebook particulares)."},{"type":"bul","level":0,"text":"Dito isso: a loja investe em divulgação para atrair clientes, e colaboradores que ajudam divulgando espontaneamente demonstram o tipo de proatividade que é valorizada para oportunidades de crescimento."},{"type":"bul","level":0,"text":"Divulgar em rede pessoal é colaboração voluntária, nunca uma tarefa do cargo."}]},{"title":"Uso de equipamentos e veículo","blocks":[{"type":"bul","level":0,"text":"Moto da loja: uso restrito a entregas e compras autorizadas. Não é meio de transporte pessoal."},{"type":"bul","level":0,"text":"Qualquer saída com o veículo deve ser comunicada e, sempre que possível, autorizada previamente."},{"type":"bul","level":0,"text":"Nunca deixar a loja sem cobertura de uma função crítica (caixa ou atendimento) para sair em entrega."}]},{"title":"Comunicação interna","blocks":[{"type":"bul","level":0,"text":"Avisos importantes devem ser lidos e, quando solicitado, confirmados no grupo de WhatsApp da equipe."},{"type":"bul","level":0,"text":"Mensagens no grupo durante o expediente devem ser objetivas — evitar conversa paralela que atrapalhe o atendimento."},{"type":"bul","level":0,"text":"Como pedir ajuda: chame o colega mais próximo disponível; se a situação envolver decisão fora da sua alçada, acione o responsável direto."},{"type":"bul","level":0,"text":"Atrasos, faltas e problemas pessoais que afetem o trabalho devem ser comunicados diretamente ao responsável, com antecedência sempre que possível."}]},{"title":"Conflitos entre funcionários","blocks":[{"type":"bul","level":0,"text":"É permitido: chamar atenção com educação, apontar um erro, pedir colaboração, comunicar um problema ao responsável."},{"type":"bul","level":0,"text":"Não é permitido: gritar, humilhar, ironizar, ameaçar, discutir na frente de cliente, fazer fofoca, formar grupos contra um colega, retaliar ou ignorar colega deliberadamente."},{"type":"bul","level":0,"text":"Havendo conflito, siga esta sequência:"},{"type":"bul","level":1,"text":"1. Pare a discussão imediatamente."},{"type":"bul","level":1,"text":"2. Nunca envolva o cliente na disputa."},{"type":"bul","level":1,"text":"3. Não transforme o colega em inimigo."},{"type":"bul","level":1,"text":"4. Comunique ao responsável."},{"type":"bul","level":1,"text":"5. Cada pessoa relata sua versão separadamente."},{"type":"bul","level":1,"text":"6. A decisão final não cabe aos envolvidos."}]},{"title":"Liderança pelo exemplo","blocks":[{"type":"bul","level":0,"text":"A loja funciona como um círculo: quem vende depende de quem organiza; quem organiza depende de quem etiqueta. Cada elo bem-feito sustenta o seguinte."},{"type":"bul","level":0,"text":"Fazer sua parte com excelência e ensinar/orientar um colega novo com paciência já é uma forma de liderar — isso é o que diferencia quem cresce dentro da TENKiTER."}]},{"title":"\"Errei. O que faço?\" — procedimento completo","blocks":[{"type":"p","text":"Este é um dos capítulos mais importantes do manual — porque todo funcionário novo vai errar em algum momento.","bold":false},{"type":"quote","text":"Erro comunicado imediatamente é problema. Erro escondido vira prejuízo."},{"type":"bul","level":0,"text":"Exemplos de erro que devem ser comunicados na hora: passar produto errado, dar desconto errado, registrar pagamento errado, perder etiqueta, quebrar produto, entregar produto errado ao cliente, entregar sem confirmar pagamento, mexer no sistema por engano, caixa não bater."},{"type":"bul","level":0,"text":"Procedimento único para qualquer erro:"},{"type":"quote","text":"PARAR → NÃO TENTAR ESCONDER → COMUNICAR → PRESERVAR AS INFORMAÇÕES → AGUARDAR ORIENTAÇÃO."}]}]},{"title":"ROTINA DA LOJA","chapters":[{"title":"Abertura da loja — checklist","blocks":[{"type":"bul","level":0,"text":"Chegar no horário e guardar objetos pessoais."},{"type":"bul","level":0,"text":"Vestir uniforme/vestimenta adequada."},{"type":"bul","level":0,"text":"Conferir limpeza geral, fachada, manequins e araras."},{"type":"bul","level":0,"text":"Conferir provador (organizado, sem peças esquecidas)."},{"type":"bul","level":0,"text":"Abrir e conferir o caixa."},{"type":"bul","level":0,"text":"Conferir estoque/áreas designadas para reposição."},{"type":"bul","level":0,"text":"Verificar orientações pendentes, promoções vigentes e produtos precisando reposição."}]},{"title":"Organização das mercadorias","blocks":[{"type":"bul","level":0,"text":"Cada categoria de produto tem um lugar definido — você será apresentado(a) ao mapa da loja."},{"type":"bul","level":0,"text":"Regra fundamental:"},{"type":"quote","text":"Quem pega, devolve. Se não sabe onde guardar, não inventa: pergunta."},{"type":"bul","level":0,"text":"Ao retirar peça da arara para mostrar ao cliente, devolvê-la ao lugar correto assim que possível."},{"type":"bul","level":0,"text":"Separar por tamanho e cor conforme o padrão já estabelecido em cada seção da loja."}]},{"title":"Reposição e estoque","blocks":[{"type":"bul","level":0,"text":"Produto que sai do estoque para a loja deve ser conferido (código/etiqueta) antes de ser exposto."},{"type":"bul","level":0,"text":"Áreas com produto em falta na loja devem ser repostas assim que identificadas — não esperar a cliente perguntar."},{"type":"bul","level":0,"text":"Entrada de mercadoria: conferir quantidade e itens recebidos contra a nota/lista antes de guardar, e registrar no sistema conforme orientação do responsável."},{"type":"bul","level":0,"text":"Ao encontrar produto sem etiqueta, com etiqueta errada, danificado, fora do lugar, sem código, ou divergente do sistema: pare, separe a peça e comunique ao responsável."},{"type":"bul","level":0,"text":"Regra absoluta:"},{"type":"quote","text":"NUNCA ALTERAR O SISTEMA POR CONTA PRÓPRIA. Qualquer divergência é comunicada, nunca corrigida sozinho(a)."}]},{"title":"Provador","blocks":[{"type":"bul","level":0,"text":"Controlar a quantidade de peças que entram no provador com a cliente (ex.: até 5 peças por vez)."},{"type":"bul","level":0,"text":"Contar as peças antes da cliente entrar e conferir ao sair."},{"type":"bul","level":0,"text":"Se a cliente deixar peças no provador, recolher, conferir e devolver ao lugar."},{"type":"bul","level":0,"text":"Peça danificada encontrada no provador: separar, não repor à venda, e comunicar ao responsável."},{"type":"bul","level":0,"text":"Respeitar a privacidade: bater/avisar antes de entrar."}]},{"title":"Etiquetagem","blocks":[{"type":"bul","level":0,"text":"Fluxo padrão: produto → etiqueta → código → descrição → preço → sistema."},{"type":"bul","level":0,"text":"A etiqueta é uma das principais barreiras de conferência da loja — um erro aqui se propaga até o caixa."},{"type":"bul","level":0,"text":"Ao identificar erro (ex.: etiqueta diz \"short\", produto é \"saia\"): não corrigir por conta própria."},{"type":"bul","level":0,"text":"Procedimento: parar → separar a peça → comunicar ao responsável → corrigir somente conforme autorização."}]},{"title":"Fotos e divulgação — produção de conteúdo","blocks":[{"type":"bul","level":0,"text":"Cuidados na foto do produto: boa iluminação, enquadramento mostrando a peça inteira, sem deformar o produto, conferindo que é a peça correta antes de fotografar."},{"type":"bul","level":0,"text":"Identificar o produto (código/nome) e enviar para onde for determinado."},{"type":"bul","level":0,"text":"Nos Stories: manter sequência lógica, incluir preço e forma de contato, evitar postar a mesma peça repetidamente no mesmo dia."}]},{"title":"Fechamento da loja — checklist","blocks":[{"type":"bul","level":0,"text":"Loja organizada, produtos recolocados e cabides organizados."},{"type":"bul","level":0,"text":"Provador conferido e estoque organizado."},{"type":"bul","level":0,"text":"Lixo recolhido e equipamentos desligados/guardados."},{"type":"bul","level":0,"text":"Caixa fechado e conferido."},{"type":"bul","level":0,"text":"Portas, ar-condicionado e luzes conferidos."},{"type":"bul","level":0,"text":"Pendências do dia comunicadas ao responsável antes de sair."}]}]},{"title":"VENDAS","chapters":[{"title":"Abordagem e descoberta da necessidade","blocks":[{"type":"bul","level":0,"text":"Cumprimentar sempre, com simpatia, em tom audível."},{"type":"bul","level":0,"text":"Cliente disse \"só estou olhando\": responder de forma leve, sem insistir: \"Fico por aqui se precisar de alguma coisa, viu?\""},{"type":"bul","level":0,"text":"Perguntas úteis para direcionar o atendimento:"},{"type":"bul","level":1,"text":"O que está procurando? É para você ou para presente?"},{"type":"bul","level":1,"text":"Qual tamanho costuma usar? Prefere algum estilo específico?"},{"type":"bul","level":1,"text":"Tem uma faixa de preço em mente? Gostaria de experimentar?"}]},{"title":"Apresentação, venda complementar e experimentação","blocks":[{"type":"bul","level":0,"text":"Apresentar a primeira opção, uma segunda opção, uma alternativa mais em conta e uma alternativa superior, quando fizer sentido."},{"type":"bul","level":0,"text":"Sugerir combinações de peças como serviço, não como pressão: \"Quer que eu te mostre uma calça/short que combina com essa blusa?\""},{"type":"bul","level":0,"text":"Incentivar a experimentação sempre que possível — reduz troca posterior e aumenta confiança na compra."}]},{"title":"Cliente disse \"não\" — lidando com objeções","blocks":[{"type":"table","rows":[["Objeção da cliente","Como responder"],["\"Está caro\"","Reforçar qualidade/diferencial da peça e apresentar alternativa dentro da faixa de preço dela, sem depreciar o produto."],["\"Vou pensar\"","Aceitar com simpatia, oferecer reservar por um tempo e reforçar canal de contato (WhatsApp/Instagram)."],["\"Só estou olhando\"","Não insistir; deixar claro que está à disposição."],["\"Não gostei\"","Perguntar o que não agradou e oferecer alternativa nesse ponto específico."],["\"Tem desconto?\"","Seguir a política de descontos — nunca prometer sem autorização."],["\"Na outra loja é mais barato\"","Focar no diferencial da TENKiTER, sem falar mal do concorrente."],["\"Vou perguntar ao meu marido/família\"","Oferecer reservar a peça por um prazo curto."]]}]},{"title":"Finalização da venda e comissão","blocks":[{"type":"bul","level":0,"text":"Confirmar todas as peças, forma de pagamento e o nome do vendedor responsável."},{"type":"bul","level":0,"text":"A comissão é do vendedor que efetivamente atendeu e concluiu a venda."},{"type":"bul","level":0,"text":"Colocar nome de vendedor por associação, conveniência ou interesse pessoal para aumentar comissão de alguém é falta gravíssima: gera demissão por justa causa e configura crime penal."},{"type":"bul","level":0,"text":"Venda iniciada por um vendedor e concluída por outro: a comissão segue o critério da gestão — em caso de dúvida, perguntar antes de registrar."}]},{"title":"Reserva de produtos e política de descontos","blocks":[{"type":"bul","level":0,"text":"Qualquer vendedor pode reservar uma peça por um prazo curto combinado. Registrar de forma visível para que outro colega não venda a mesma peça."},{"type":"bul","level":0,"text":"Se a cliente não buscar dentro do prazo, a peça volta ao estoque disponível."},{"type":"bul","level":0,"text":"Pode fazer: aplicar promoções já divulgadas e vigentes na loja."},{"type":"bul","level":0,"text":"Não pode, sem autorização: alterar preço no sistema, inventar desconto, negociar abaixo do permitido, ou prometer condição futura ao cliente."}]},{"title":"O cliente pertence à loja, não ao vendedor","blocks":[{"type":"quote","text":"\"O cliente não pertence ao vendedor. O cliente pertence à TENKiTER.\""},{"type":"bul","level":0,"text":"Se um cliente já tem um vendedor de referência e esse vendedor está ausente, qualquer outro colaborador deve atendê-lo normalmente — a comissão é resolvida depois, e não deve virar disputa entre colegas."}]}]},{"title":"CAIXA E PAGAMENTOS (VISÃO GERAL)","chapters":[{"title":"Postura de quem está no caixa e como funciona uma venda","blocks":[{"type":"bul","level":0,"text":"Cumprimentar SEMPRE, para todo mundo que entra ou se aproxima: bom dia, boa tarde ou boa noite, conforme o horário — nunca um \"oi\" seco ou silêncio."},{"type":"bul","level":0,"text":"Perguntar com gentileza se algum vendedor já atendeu o cliente. Se a pessoa não souber, não insistir."},{"type":"bul","level":0,"text":"Lançar os produtos conferindo se a etiqueta corresponde à peça — o caixa é a última barreira de conferência."},{"type":"bul","level":0,"text":"Regra inegociável:"},{"type":"quote","text":"Só finalizar a venda e emitir o comprovante depois que o pagamento estiver de fato confirmado — nunca antes."}]},{"title":"Formas de pagamento — regras de liberação","blocks":[{"type":"bul","level":0,"text":"Dinheiro: conferir o valor recebido antes de dar o troco."},{"type":"bul","level":0,"text":"Cartão (débito ou crédito): só finalizar depois que a máquina aprovar o pagamento e o comprovante sair."},{"type":"bul","level":0,"text":"PIX: a venda só é finalizada depois que o pagamento for confirmado por Karla ou Pablo — nunca apenas pelo print."},{"type":"quote","text":"PRINT DE PIX NÃO É CONFIRMAÇÃO DE PAGAMENTO."},{"type":"bul","level":0,"text":"Link de pagamento: mercadoria só é entregue após a confirmação do Pablo, da mesma forma que o PIX."},{"type":"bul","level":0,"text":"Fiado / crediário: só é permitido com autorização prévia — nunca por conta própria."}]},{"title":"Movimentações, conferência e fechamento de caixa","blocks":[{"type":"bul","level":0,"text":"Reforços de troco ou retiradas de dinheiro são feitos no sistema e sempre precisam ficar registrados com um motivo claro (nome de quem autorizou + motivo)."},{"type":"bul","level":0,"text":"O caixa deve ser conferido periodicamente ao longo do dia, contando o dinheiro físico e comparando com o que o sistema indica."},{"type":"bul","level":0,"text":"Havendo divergência, verificar o procedimento com outro colaborador antes de qualquer ajuste — nunca ajustar por conta própria."}]}]},{"title":"TROCAS E PÓS-VENDA","chapters":[{"title":"Política geral de troca","blocks":[{"type":"bul","level":0,"text":"Prazo padrão: 7 dias corridos a partir da compra."},{"type":"bul","level":0,"text":"Regra absoluta: não trocamos, em hipótese nenhuma, peça sem etiqueta."},{"type":"bul","level":0,"text":"Peças que não trocam por padrão: itens de uso íntimo (por higiene) e peças frágeis como tricô, renda e paetê (se danificam com facilidade) — o vendedor deve avisar isso no momento da venda."}]},{"title":"Árvore de decisão de troca","blocks":[{"type":"bul","level":0,"text":"Tem cupom de compra? Não → encaminhar ao responsável. Sim → continuar."},{"type":"bul","level":0,"text":"Tem etiqueta na peça? Não → não realizar a troca. Sim → continuar."},{"type":"bul","level":0,"text":"O produto está na lista de itens que podem ser trocados? Não → explicar a regra com educação. Sim → continuar."},{"type":"bul","level":0,"text":"O produto está íntegro? Não → chamar o responsável. Sim → continuar."},{"type":"bul","level":0,"text":"Está dentro do prazo de 7 dias? Sim → seguir o procedimento normal. Não → chamar o responsável para avaliar exceção."}]},{"title":"Troca com diferença de valor","blocks":[{"type":"bul","level":0,"text":"Regra da diferença de valor:"},{"type":"quote","text":"A diferença é sempre calculada pela forma de pagamento usada NESTA troca — nunca pela forma usada na compra original."},{"type":"p","text":"Isso porque, na venda no cartão, a diferença entre o valor à vista e o valor no cartão fica com a operadora do cartão, não com a loja. Se não entender de primeira, pergunte antes que o problema aconteça na frente do cliente.","bold":false}]},{"title":"Cancelamento e erros de caixa","blocks":[{"type":"bul","level":0,"text":"Erro identificado ANTES de finalizar a venda: pode ser corrigido diretamente por quem está no caixa."},{"type":"bul","level":0,"text":"Venda JÁ finalizada: o cancelamento só pode ser feito por quem tem permissão de administrador no sistema — nunca por conta própria."},{"type":"bul","level":0,"text":"Produto passado duas vezes, preço errado, PIX duplicado, cartão recusado: comunicar imediatamente ao responsável. Não tente \"dar um jeito\" sozinho."},{"type":"quote","text":"PARAR → NÃO TENTAR ESCONDER → COMUNICAR → PRESERVAR AS INFORMAÇÕES → AGUARDAR ORIENTAÇÃO."}]}]},{"title":"WHATSAPP, INSTAGRAM E ATENDIMENTO DIGITAL","chapters":[{"title":"Atendimento pelo WhatsApp","blocks":[{"type":"bul","level":0,"text":"Responder o cliente dentro de um tempo curto — resposta demorada é venda perdida."},{"type":"bul","level":0,"text":"Ao enviar fotos, informar preço e tamanho, e verificar disponibilidade real antes de confirmar."},{"type":"bul","level":0,"text":"Confirmação de pagamento pelo WhatsApp segue exatamente a mesma regra de PIX/cartão do caixa — nunca considerar pago apenas pelo print."},{"type":"
