<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TENKiTER — Treinamento de postagens</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f3ee;color:#24211c;font:16px/1.5 system-ui}header{background:#191919;color:#fff;padding:20px;border-bottom:4px solid #e7832d}main{max-width:640px;margin:auto;padding:16px}section{background:white;padding:20px;border-radius:16px;margin:14px 0;box-shadow:0 2px 12px #0001}button{min-height:48px;border-radius:10px;border:1px solid #c9c5be;background:#fff;padding:12px;cursor:pointer;font:inherit}button.primary{background:#e7832d;color:#16110a;font-weight:700;border:0}button:disabled{opacity:.4}button.choice{display:block;width:100%;margin:10px 0;text-align:left}button.choice[aria-pressed=true]{border:2px solid #286842;background:#e9f6ee}#msg{min-height:50px}small{color:#666}progress{width:100%;accent-color:#e7832d}label{display:block;margin:12px 0}</style></head><body><header><b>TENKiTER MODAS</b><div>Treinamento 2 • Postagens</div></header><main><section><strong>🔒 Simulação isolada</strong><p>Este treinamento não acessa contas, catálogo, fila ou servidores reais. Nenhuma postagem será publicada. Use apenas os exemplos fictícios.</p></section><section id="app" aria-live="polite"></section></main><script>const tasks=[["Abrir Postagens","Escolher uma foto publica automaticamente?","Não, só após concluir e confirmar","Sim, imediatamente"],["Selecionar peça","Duas peças com nomes iguais: como escolher?","Conferir código, foto e preço","Escolher a primeira"],["Escolher formato","No carrossel, o que deve ser conferido?","Quantidade e ordem das mídias","Somente a primeira foto"],["Revisar montagem","Mudou a foto depois de gerar a arte?","Gerar novamente e revisar","Usar arte anterior"],["Revisar legenda","Sem preço cadastrado, qual texto usar?","Consulte valor","Inventar um preço"],["Selecionar destino","O canal Ambos pode produzir quantas publicações?","Mais de uma","Sempre uma"],["Organizar fila","WhatsApp aguardando confirmação: o que fazer?","Consultar resultado existente","Reenviar imediatamente"],["Encerrar","Percebeu um erro na preparação?","Corrigir e avisar quando necessário","Esconder para evitar problema"]];let step=0,errors=0,selected=-1,checked=false;const el=document.getElementById('app');function render(){if(step===tasks.length){el.innerHTML='<h2>Treinamento concluído</h2><p>Você respondeu às oito situações. Erros corrigidos: '+errors+'.</p><p>Agora peça à gestão uma prática acompanhada, com peças e contas de teste. Esta simulação não concede autorização para publicar.</p><button class="primary" id="restart">Refazer</button>';document.getElementById('restart').onclick=()=>{step=0;errors=0;selected=-1;checked=false;render()};return}const t=tasks[step];el.innerHTML='<small>Etapa '+(step+1)+' de '+tasks.length+'</small><progress max="'+tasks.length+'" value="'+step+'"></progress><h2>'+t[0]+'</h2><p>Faça a ação correspondente na simulação e responda:</p><h3>'+t[1]+'</h3><button class="choice" id="a" aria-pressed="'+(selected===0)+'">'+t[2]+'</button><button class="choice" id="b" aria-pressed="'+(selected===1)+'">'+t[3]+'</button><p id="msg" role="status">'+(checked?'Correto! Confira a explicação com a gestão e avance.':'Escolha uma resposta e toque em Conferir.')+'</p><button id="check" class="primary">'+(checked?'Continuar':'Conferir')+'</button>';document.getElementById('a').onclick=()=>{selected=0;checked=false;render()};document.getElementById('b').onclick=()=>{selected=1;checked=false;render()};document.getElementById('check').onclick=()=>{if(checked){step++;selected=-1;checked=false;render()}else if(selected===0){checked=true;render()}else{errors++;document.getElementById('msg').textContent='Ainda não. A opção correta é: '+t[2]+'. Tente novamente; não há punição.'}}}render();</script></body></html>
