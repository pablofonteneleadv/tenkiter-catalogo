plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'br.com.tenkitermodas.mensagens'
    compileSdk 35
    defaultConfig { applicationId 'br.com.tenkitermodas.mensagens'; minSdk 26; targetSdk 35; versionCode 21; versionName '2.4.14' }
    buildFeatures { buildConfig true }
    def shared = new File(rootDir.parentFile, 'common.js').text
    def loginApi = (shared =~ /API_URL_PADRAO="([^"]+)"/)[0][1]
    def workerApi = (shared =~ /INSTAGRAM_URL="([^"]+)"/)[0][1]
    defaultConfig {
        buildConfigField 'double', 'CASH_DISCOUNT', (shared =~ /DESCONTO_AVISTA=([.0-9]+)/)[0][1]
        buildConfigField 'String', 'SITE_URL', '"' + (shared =~ /const SITE_URL="([^"]+)"/)[0][1] + '"'
        buildConfigField 'String', 'LOGIN_URL', '"' + loginApi + '"'
        buildConfigField 'String', 'WORKER_URL', '"' + workerApi + '"'
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            ['https.proxyHost','https.proxyPort','http.proxyHost','http.proxyPort','javax.net.ssl.trustStore','javax.net.ssl.trustStorePassword'].each { key -> if(System.getProperty(key)) systemProperty key,System.getProperty(key) }
            systemProperty 'robolectric.dependency.repo.url','https://repo.maven.apache.org/maven2'
        }
    }
    signingConfigs {
        release {
            if (System.getenv('TK_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('TK_ANDROID_KEYSTORE'))
                storePassword System.getenv('TK_ANDROID_STORE_PASSWORD')
                keyAlias 'tenkiter'
                keyPassword System.getenv('TK_ANDROID_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false; vcsInfo.include = false; manifestPlaceholders = [appLabel: 'TENKiTER Mensagens'] }
        // Versão de teste: instala ao lado do app oficial, sem substituir nem apagar nada.
        debug { applicationIdSuffix '.teste'; versionNameSuffix '-teste'; manifestPlaceholders = [appLabel: 'Mensagens TESTE'] }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'com.onesignal:OneSignal:5.10.2'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
