name: Aplicar 7.40.34
# workflow_dispatch so existe para workflows presentes na branch padrao, por isso
# o gatilho aqui e o push que toca _d00 (arquivo de transporte).
# Guarda de idempotencia: se VERSION ja e 7.40.34, nao faz nada.
on:
  push:
    branches: [retomada/305-74033]
    paths:
      - _d00

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: retomada/305-74033
          fetch-depth: 0

      - name: Pular se ja aplicado
        id: guarda
        run: |
          v="$(cat VERSION 2>/dev/null | tr -d '[:space:]')"
          echo "VERSION no branch: $v"
          if [ "$v" = "7.40.34" ]; then
            echo "ja=true" >> "$GITHUB_OUTPUT"
            echo "Ja esta na 7.40.34: nada a aplicar."
          else
            echo "ja=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Montar e conferir a base 7.40.33
        if: steps.guarda.outputs.ja != 'true'
        run: |
          set -euo pipefail
          cd patches/retomada-305-74033
          cat s00 s01 s02 s03 s04 s05 s06 s07 s08 s09 s10 s11 s12 s13 s14 s15 \
            | tr -d ' \n\r\t' | base64 -d > /tmp/base.gz
          cd "$GITHUB_WORKSPACE"
          gunzip -c /tmp/base.gz > /tmp/base.patch
          got=$(sha256sum /tmp/base.patch | cut -d' ' -f1)
          echo "base sha256: $got"
          test "$got" = "09ec93fff39609be2e96a51463553b2f7f4c0c002fa03c0978c20b3a58ca87c2"
          echo "arquivos na base: $(grep -c '^diff --git' /tmp/base.patch)"

      - name: Montar e conferir o delta 7.40.34
        if: steps.guarda.outputs.ja != 'true'
        run: |
          set -euo pipefail
          cat _d00 _d01 _d02 _d03 _d04 | tr -d ' \n\r\t' | base64 -d > /tmp/delta.gz
          gunzip -c /tmp/delta.gz > /tmp/delta.patch
          got=$(sha256sum /tmp/delta.patch | cut -d' ' -f1)
          echo "delta sha256: $got"
          test "$got" = "baa9d292152f9cb1a9dbbcdddb50ec8123ceac5d96cacbb4784bb5207321e301"
          echo "arquivos no delta: $(grep -c '^diff --git' /tmp/delta.patch)"

      - name: Aplicar base e delta
        if: steps.guarda.outputs.ja != 'true'
        run: |
          set -euo pipefail
          git apply -p1 --verbose /tmp/base.patch
          git apply -p1 --verbose /tmp/delta.patch

      - name: Conferir o resultado
        if: steps.guarda.outputs.ja != 'true'
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "7.40.34"
          grep -q '"versao": "7.40.34"' version.json
          node --check admin-mensagens.js
          node --check instagram-worker/worker.js
          python3 scripts/ci/check_ux_skill.py
          echo "--- hashes resultantes ---"
          for f in instagram-worker/worker.js admin-mensagens.js admin.html version.json VERSION CHANGELOG.md tests/worker_equipe_inicio.js tests/mensagens_equipe_inicio_ui.py tests/mock_msg.py documentacao/continuidade/RETOMADA-305-7.40.33.md; do
            echo "$(sha256sum "$f" | cut -d' ' -f1)  $f"
          done

      - name: Commitar
        if: steps.guarda.outputs.ja != 'true'
        run: |
          set -euo pipefail
          git config user.name "Frontend Developer"
          git config user.email "frontend-developer@tenkiter.local"
          printf '%s\n' \
            'feat(mensagens): primeira mensagem pelo WhatsApp na Nova conversa (7.40.34)' \
            '' \
            'No WhatsApp a loja escreve primeiro: /msg/iniciar passa a enviar pela integracao' \
            'Wafly ja cadastrada em Conexoes (credencial so no backend), com reserva' \
            'idempotente, bolha gravada, recibo e assinatura de equipe.' \
            '' \
            'Instagram segue apenas abrindo conversa que o cliente iniciou: o campo de' \
            'mensagem nem aparece, porque a API oficial nao permite envio iniciado pela loja.' \
            '' \
            'Retoma os pendentes do #305: presenca da equipe, atividade por pessoa e trilha' \
            'das acoes confirmadas, com testes de Worker (D1 real) e de interface.' \
            > /tmp/msg.txt
          git add -A -- . ':(exclude)_d00' ':(exclude)_d01' ':(exclude)_d02' ':(exclude)_d03' ':(exclude)_d04'
          git commit -F /tmp/msg.txt
          git push origin HEAD:retomada/305-74033
