name: CI

# Portão de qualidade: roda em todo push e em todo pull request.
# Nada chega na main sem passar por aqui (ver docs/CI-CD.md, proteção de branch).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Permite que o workflow de Deploy reaproveite este portão (needs: ci).
  workflow_call:

permissions:
  contents: read

concurrency:
  # Quando o Deploy chama este workflow (workflow_call), o grupo é diferente do
  # grupo do push — senão o CI do push e o CI do deploy se cancelariam mutuamente.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 1. Segredos
  segredos:
    name: Scan de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Procurar credenciais em texto plano
        run: bash scripts/ci/check_secrets.sh

  # ------------------------------------------------------- 2. Sintaxe e estrutura
  estatico:
    name: Sintaxe JS + estrutura HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxe de todos os .js
        run: bash scripts/ci/check_js.sh
      - name: Estrutura das páginas HTML
        run: python3 scripts/ci/check_html.py
      - name: Variaveis dos Workers declaradas (wrangler.toml)
        run: python3 scripts/ci/check_workers.py

      # Os scripts de deploy rodam so na hora de publicar — um erro de sintaxe neles
      # so apareceria com o deploy ja em andamento. Aqui ele aparece no PR.
      - name: Sintaxe dos scripts de deploy e CI
        run: |
          for f in scripts/deploy/*.sh scripts/ci/*.sh; do
            bash -n "$f" || { echo "::error::$f tem erro de sintaxe."; exit 1; }
          done
          echo "scripts de shell: sintaxe OK"

  # ------------------------------------------------------------- 3. Testes reais
  testes:
    name: Bateria de testes (tests/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Testes de backend/worker rodam sem navegador e sem tocar em nada real.
      - name: Backend do Apps Script (simulado)
        run: node tests/backend_gs.js
        continue-on-error: true   # depende do .gs.txt, que não é versionado (ver docs/CI-CD.md)

      - name: Bloco de contas compartilhado
        run: node tests/backend_contas.js
        continue-on-error: true

      - name: Backend de Funcionários/Acessos
        run: node tests/backend_func.js
        continue-on-error: true

      - name: Worker de mídia (R2)
        run: node tests/worker_midia.js

      - name: Worker de OG/SEO
        run: node tests/worker_og.js
        continue-on-error: true

      - name: Worker do Instagram (fila e canal WhatsApp/Instagram)
        run: |
          node tests/worker_ig.js
          node tests/worker_canal.js

      # Testes de navegador: instalam o Chromium e rodam contra o site local.
      - name: Instalar Playwright + Chromium
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Jornadas e acessibilidade (site local)
        run: python3 tests/rodar_tudo.py
        continue-on-error: true   # bateria longa; nao bloqueia o portao (ver job `portao`)

  # --------------------------------------------------------- 4. Resumo do portão
  #
  # ATENCAO: este job e o STATUS CHECK OBRIGATORIO da protecao de branch da main
  # (ver docs/CI-CD.md). Ele precisa listar em `needs` TODOS os jobs que devem
  # bloquear o merge. Qualquer job fora do `needs` NAO influencia este check.
  #
  # Defeito corrigido em 15/10/2026: `needs` era [segredos, estatico] e `testes`
  # ficou de fora. Como os dois primeiros terminam em ~30 s e `testes` leva alguns
  # minutos (Playwright), o portao reportava SUCESSO antes do CI acabar. Medido no
  # run 38800756430 (commit 15f4ef7a):
  #     20:17:46  Scan de segredos ................ sucesso
  #     20:17:53  Sintaxe JS + estrutura HTML ..... sucesso
  #     20:18:02  Portao de qualidade ............. SUCESSO  <- aprovava aqui
  #     20:18:21  Bateria de testes ............... comecava DEPOIS
  # Ou seja: a protecao de branch aprovava o merge com metade do CI ainda por
  # rodar. Com `testes` no `needs`, o portao so fica verde quando o workflow
  # INTEIRO terminou — que e o que um status check obrigatorio deve significar.
  portao:
    name: Portão de qualidade
    runs-on: ubuntu-latest
    needs: [segredos, estatico, testes]
    if: always()
    steps:
      - name: Conferir resultado
        run: |
          falhou=0
          if [ "${{ needs.segredos.result }}" != "success" ]; then
            echo "::error::Scan de segredos falhou."
            falhou=1
          fi
          if [ "${{ needs.estatico.result }}" != "success" ]; then
            echo "::error::Validação estática falhou."
            falhou=1
          fi
          # A bateria de testes marca continue-on-error nos passos que dependem de
          # arquivos nao versionados (.gs.txt). Aqui interessa que o job tenha
          # TERMINADO bem, para o portao nao aprovar com o CI ainda em andamento.
          if [ "${{ needs.testes.result }}" != "success" ]; then
            echo "::error::Bateria de testes falhou (ou foi cancelada)."
            falhou=1
          fi
          if [ "$falhou" != "0" ]; then
            exit 1
          fi
          echo "Portão de qualidade aprovado (segredos, estatico e testes)."
