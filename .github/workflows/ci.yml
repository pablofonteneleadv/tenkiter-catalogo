name: CI

# runs-on fixado em ubuntu-24.04: o GitHub migra `ubuntu-latest` para o Ubuntu 26 a partir de 19/10/2026
# (aviso nos logs de 18/10/2026). Trocar de volta só depois de validar Chromium/Playwright e Python no runner novo.

# CI rápido para PRs e deploys; bateria completa fica agendada ou manual.
# O deploy reutiliza este workflow em modo rápido, sem disparar um segundo CI por push na main.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Bateria de testes'
        required: true
        default: rapido
        type: choice
        options:
          - rapido
          - completo
  schedule:
    - cron: '0 3 * * *' # 00:00 no horário de Fortaleza
  workflow_call:
    inputs:
      suite:
        description: 'rapido no deploy; completo apenas quando explicitamente solicitado'
        required: false
        type: string
        default: rapido

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  escopo:
    name: Escopo do PR
    runs-on: ubuntu-24.04
    outputs:
      so_docs: ${{ steps.calc.outputs.so_docs }}
      suite_completa: ${{ steps.calc.outputs.suite_completa }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: calc
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
            if [ -n "$files" ] && ! echo "$files" | grep -qv '\\.md$'; then
              echo "so_docs=true" >> "$GITHUB_OUTPUT"
              echo "PR só com Markdown: testes de código dispensados."
            else
              echo "so_docs=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "so_docs=false" >> "$GITHUB_OUTPUT"
          fi

          suite="rapido"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            suite="completo"
          elif [ "${{ inputs.suite }}" = "completo" ]; then
            suite="completo"
          fi
          echo "suite_completa=$([ "$suite" = "completo" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Modo de testes: $suite"

  segredos:
    name: Scan de segredos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Procurar credenciais em texto plano
        run: bash scripts/ci/check_secrets.sh

  estatico:
    name: Sintaxe JS + estrutura HTML
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxe de todos os .js
        run: bash scripts/ci/check_js.sh
      - name: Estrutura das páginas HTML
        run: python3 scripts/ci/check_html.py
      - name: Skill obrigatória de estética humana
        run: python3 scripts/ci/check_ux_skill.py
      - name: Variáveis dos Workers declaradas (wrangler.toml)
        run: python3 scripts/ci/check_workers.py
      - name: Sintaxe dos scripts de deploy e CI
        run: |
          for f in scripts/deploy/*.sh scripts/ci/*.sh; do
            bash -n "$f" || { echo "::error::$f tem erro de sintaxe."; exit 1; }
          done
          echo "scripts de shell: sintaxe OK"

  testes:
    name: Testes rápidos ou bateria completa
    runs-on: ubuntu-24.04
    needs: escopo
    if: needs.escopo.outputs.so_docs != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resumo de tamanhos no mensageiro
        run: node tests/mensagens_tamanhos.js

      - name: Cadastro de públicos e tamanhos vinculados
        run: node tests/cadastro_vinculos.js

      - name: Registro e fila de avisos Android
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/worker_mobile_push.js

      - name: Worker de mídia (R2)
        if: needs.escopo.outputs.suite_completa != 'true'
        run: node tests/worker_midia.js

      - name: Worker do Instagram e canal
        if: needs.escopo.outputs.suite_completa != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testes do Worker do Instagram e canal WhatsApp
        if: needs.escopo.outputs.suite_completa != 'true'
        run: |
          node tests/worker_ig.js
          node tests/worker_canal.js
          node tests/worker_grupo.js
          node tests/worker_wame.js
          node tests/worker_wafly.js
          node tests/worker_mensagens.js
          node tests/worker_mensagens_conversa.js
          node tests/worker_mobile_push.js

      # O teste do Worker do Instagram usa node:sqlite, disponível no Node 22+.
      - name: Node 22 para bateria completa
        if: needs.escopo.outputs.suite_completa == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A mudança no seletor de peças é visual; testar a tarefa inteira em
      # Chromium sem tocar nos serviços reais.
      - name: Preparar Chromium para edição rápida no PR
        if: github.event_name == 'pull_request'
        run: |
          python3 -m pip install playwright
          python3 -m playwright install chromium

      - name: Jornada de edição de tamanhos no atendimento
        if: github.event_name == 'pull_request'
        run: python3 tests/mensagens_edicao_rapida.py

      - name: Screenshots da edição rápida
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-edicao-rapida
          path: tests/evidencias_edicao/
          if-no-files-found: ignore

      # Modo completo: só em execução agendada ou disparada manualmente.
      # O executor já inclui os testes de Workers; não os roda de novo em passos separados.
      - name: Preparar navegador para bateria completa
        if: needs.escopo.outputs.suite_completa == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl -fsSL https://cdn.jsdelivr.net/npm/axe-core@4.10.2/axe.min.js -o tests/axe.min.js

      - name: Bateria completa de jornadas, acessibilidade e integrações
        if: needs.escopo.outputs.suite_completa == 'true'
        run: python3 tests/rodar_tudo.py

  portao:
    name: Portão de qualidade
    runs-on: ubuntu-24.04
    needs: [escopo, segredos, estatico, testes]
    if: always()
    steps:
      - name: Conferir resultado
        shell: bash
        run: |
          falhou=0
          if [ "${{ needs.segredos.result }}" != "success" ]; then
            echo "::error::Scan de segredos falhou."
            falhou=1
          fi
          if [ "${{ needs.estatico.result }}" != "success" ]; then
            echo "::error::Validação estática falhou."
            falhou=1
          fi
          if [ "${{ needs.escopo.outputs.so_docs }}" = "true" ] && [ "${{ needs.testes.result }}" = "skipped" ]; then
            echo "PR só com Markdown: testes de código dispensados."
          elif [ "${{ needs.testes.result }}" != "success" ]; then
            echo "::error::Testes rápidos/completos falharam ou foram cancelados."
            falhou=1
          fi
          if [ "$falhou" != "0" ]; then exit 1; fi
          echo "Portão aprovado: segredos, validação estática e suíte aplicável."
