name: CI

# runs-on fixado em ubuntu-24.04: o GitHub migra `ubuntu-latest` para o Ubuntu 26 a partir de 19/10/2026
# (aviso nos logs de 18/10/2026). Trocar de volta só depois de validar Chromium/Playwright e Python no runner novo.

# CI rápido para PRs e deploys; bateria completa fica agendada ou manual.
# O deploy reutiliza este workflow em modo rápido, sem disparar um segundo CI por push na main.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
    paths:
      - '**'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Bateria de testes'
        required: true
        default: rapido
        type: choice
        options:
          - rapido
          - completo
  schedule:
    - cron: '0 3 * * *' # 00:00 no horário de Fortaleza
  workflow_call:
    inputs:
      suite:
        description: 'rapido no deploy; completo apenas quando explicitamente solicitado'
        required: false
        type: string
        default: rapido

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  escopo:
    name: Escopo do PR
    runs-on: ubuntu-24.04
    outputs:
      graphify_alterado: ${{ steps.calc.outputs.graphify_alterado }}
      so_docs: ${{ steps.calc.outputs.so_docs }}
      suite_completa: ${{ steps.calc.outputs.suite_completa }}
      modulos: ${{ steps.calc.outputs.modulos }}
      shards: ${{ steps.calc.outputs.shards }}
      shard_count: ${{ steps.calc.outputs.shard_count }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: calc
        name: Detectar impacto e explicar os testes escolhidos
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SUITE_PEDIDA: ${{ inputs.suite }}
          ROTULOS_PR: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DESCRICAO_PR: ${{ github.event.pull_request.body }}
        run: |
          python3 scripts/ci/testes_impacto.py planejar \
            --evento "$EVENTO" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --suite "$SUITE_PEDIDA" --rotulos "$ROTULOS_PR" --descricao "$DESCRICAO_PR" \
            --saida "$GITHUB_OUTPUT" --resumo "$GITHUB_STEP_SUMMARY"

  segredos:
    name: Scan de segredos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Procurar credenciais em texto plano
        run: bash scripts/ci/check_secrets.sh

  estatico:
    name: Sintaxe JS + estrutura HTML
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Sintaxe de todos os .js
        run: bash scripts/ci/check_js.sh
      - name: Estrutura das páginas HTML
        run: python3 scripts/ci/check_html.py
      - name: CSS/JS alterado exige ?v= novo nas páginas
        run: python3 scripts/ci/check_versao_assets.py origin/main
      - name: Skill obrigatória de estética humana
        run: python3 scripts/ci/check_ux_skill.py
      - name: Padrões obrigatórios do site (catraca; docs/ia/padroes-site.md)
        run: python3 scripts/ci/check_padroes.py
      - name: Contrato de onboarding Graphify
        run: python3 scripts/ci/check_graphify.py
      - name: Variáveis dos Workers declaradas (wrangler.toml)
        run: python3 scripts/ci/check_workers.py
      - name: Regressões internas de distribuição e contratos
        run: |
          python3 tests/testes_impacto_seletor.py
          python3 tests/padroes_check_teste.py
          python3 tests/auditoria_interna.py
          # QA: nao perder indicador de agendamento nos cards.
          python3 tests/indicador_agenda_card.py
          python3 tests/worker_credenciais.py
          node tests/estoque_opcional.js
          # Observabilidade 500/503 sem PII: testes do Worker real sem rede.
          node tests/worker_5xx_diagnostico.js
          node tests/manual_fidelidade.js
          python3 tests/saude_publica.py
          python3 tests/distribuicao_cache.py
          node tests/pedido_idempotencia.js
          python3 tests/inventario_cobertura_teste.py
          python3 scripts/ci/inventario_testes.py --json-report tests/saida/inventario-testes.json --fail-on-regression
      - name: Contrato público em produção (somente leitura agendada)
        if: github.event_name == 'schedule'
        run: python3 scripts/ci/contrato_catalogo.py --live
      - name: Sintaxe dos scripts de deploy e CI
        run: |
          for f in scripts/deploy/*.sh scripts/ci/*.sh; do
            bash -n "$f" || { echo "::error::$f tem erro de sintaxe."; exit 1; }
          done
          echo "scripts de shell: sintaxe OK"

  testes:
    name: Testes rápidos ou bateria completa (parte ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    needs: escopo
    if: needs.escopo.outputs.so_docs != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.escopo.outputs.shards) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Alguns runners vêm sem ffmpeg (reparos_integrados_ui gera vídeo de teste): garante antes de rodar.
      - name: Garantir ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      # Uma PR de RH não executa 53 scripts de atendimento/postagens/Esteira.
      # O planejador é fail-safe: arquivos desconhecidos e compartilhados => cobertura ampla.
      # No full/noturno roda a bateria integral separada abaixo.
      - name: Testes dirigidos por impacto (com cobertura adicional se houver dúvida)
        if: needs.escopo.outputs.suite_completa != 'true'
        env:
          MODULOS: ${{ needs.escopo.outputs.modulos }}
          SHARDS: ${{ needs.escopo.outputs.shard_count }}
          SHARD_ID: ${{ matrix.shard }}
        run: python3 scripts/ci/testes_impacto.py executar --modulos "$MODULOS" --shard "$SHARD_ID" --shards "$SHARDS"

      - name: Evidências dos reparos integrados
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: evidencias-reparos-integrados-${{ matrix.shard }}
          path: |
            tests/saida/rh-permissoes/
            tests/saida/aparencia-aprovada/
            tests/saida/reparos/
            tests/saida/fotoia-catalogo/
            tests/saida/pedir-fotos-lote/
            tests/saida/janelas-padrao/
          if-no-files-found: ignore

      - name: Screenshots de fidelidade dos manuais
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: evidencias-fidelidade-manual-${{ matrix.shard }}
          path: tests/saida/manual-fidelidade/
          if-no-files-found: ignore

      - name: Screenshots da edição rápida
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: evidencias-edicao-rapida-${{ matrix.shard }}
          path: tests/evidencias_edicao/
          if-no-files-found: ignore

      # Modo completo: agendado ou manual; preserva a bateria global e os testes especializados.
      # O executor já inclui os testes de Workers; não os roda de novo em passos separados.
      - name: Preparar navegador para bateria completa
        if: needs.escopo.outputs.suite_completa == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl -fsSL https://cdn.jsdelivr.net/npm/axe-core@4.10.2/axe.min.js -o tests/axe.min.js

      - name: Regressões de todos os módulos no horário completo
        if: needs.escopo.outputs.suite_completa == 'true'
        run: python3 scripts/ci/testes_impacto.py executar --modulos todos

      - name: Bateria completa de jornadas, acessibilidade e integrações
        if: needs.escopo.outputs.suite_completa == 'true'
        run: python3 tests/rodar_tudo.py


  graphify:
    name: Graphify local e onboarding das IAs
    needs: escopo
    if: needs.escopo.outputs.graphify_alterado == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Conferir instruções e preservar segurança
        run: python3 scripts/ci/check_graphify.py
      - name: Testar cache, atualização e privacidade com Graphify real
        run: python3 tests/graphify_automatico.py
      - name: Preparar e consultar o mapa do projeto sem LLM
        run: |
          python3 scripts/graphify/manage.py start
          python3 scripts/graphify/manage.py query "common.js" --budget 600

  portao:
    name: Portão de qualidade
    runs-on: ubuntu-24.04
    needs: [escopo, segredos, estatico, testes, graphify]
    if: always()
    steps:
      - name: Conferir resultado
        shell: bash
        run: |
          falhou=0
          if [ "${{ needs.segredos.result }}" != "success" ]; then
            echo "::error::Scan de segredos falhou."
            falhou=1
          fi
          if [ "${{ needs.estatico.result }}" != "success" ]; then
            echo "::error::Validação estática falhou."
            falhou=1
          fi
          if [ "${{ needs.escopo.result }}" != "success" ]; then
            echo "::error::Cálculo de escopo falhou."
            falhou=1
          fi
          if [ "${{ needs.escopo.outputs.graphify_alterado }}" = "false" ] && [ "${{ needs.graphify.result }}" = "skipped" ]; then
            echo "Indexador sem mudanças: teste dinâmico dispensado; contrato estático conferido."
          elif [ "${{ needs.graphify.result }}" != "success" ]; then
            echo "::error::Graphify/onboarding falhou."
            falhou=1
          fi
          if [ "${{ needs.escopo.outputs.so_docs }}" = "true" ] && [ "${{ needs.testes.result }}" = "skipped" ]; then
            echo "PR só com Markdown: testes de código dispensados."
          elif [ "${{ needs.testes.result }}" != "success" ]; then
            echo "::error::Testes rápidos/completos falharam ou foram cancelados."
            falhou=1
          fi
          if [ "$falhou" != "0" ]; then exit 1; fi
          echo "Portão aprovado: segredos, validação estática, Graphify e suíte aplicável."
