name: aplicar patch citacao 7.40.36

# Workflow de uso unico: aplica o patch de responder-mensagem (7.40.36) numa branch
# e confire o sha256 ANTES de gravar. Depois de cumprir a funcao, este arquivo e
# removido no mesmo push.
on:
  push:
    branches:
      - ia/mensagens-citacao-20261030

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ia/mensagens-citacao-20261030

      - name: Baixar e conferir o patch (sha256 obrigatorio)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://paste.c-net.org/MarkedProwl -o /tmp/q.gz
          echo "c091f2aa503dafca46b94abe0e8bedb25fcaa5e90c1d637e7113ca2c38d2e76f  /tmp/q.gz" | sha256sum -c -
          gunzip -c /tmp/q.gz > /tmp/q.diff
          echo "diff bytes: $(wc -c < /tmp/q.diff)"

      - name: Aplicar
        run: |
          set -euo pipefail
          git apply --binary --whitespace=nowarn /tmp/q.diff

      - name: Conferir os hashes esperados
        run: |
          set -euo pipefail
          for par in "7622b32a4450bad5ad265c25474ae7eecf43904d admin-mensagens.js" \
                     "ab24e22f1f7d773bf32c853f1f7402aff8c220df instagram-worker/worker.js" \
                     "50b49c43598a0080906888cc72846f52ae5faf2e tests/mensagens_citacao_ui.py" \
                     "5ca8d6c6ee13cf1114529eca7713b48367a5ec23 tests/worker_citar_mensagem.js"; do
            set -- $par
            atual=$(git hash-object "$2")
            if [ "$atual" != "$1" ]; then echo "DIVERGIU: $2 -> $atual"; exit 1; fi
            echo "OK $2"
          done
          node --check admin-mensagens.js
          node --check instagram-worker/worker.js
          echo "HASHES OK"

      - name: Commitar e empurrar
        run: |
          set -euo pipefail
          git config user.name "TK Automacao"
          git config user.email "automacao@tenkitermodas.com.br"
          git add -A
          # NAO removemos o workflow neste commit: um commit que toca .github/workflows/
          # e recusado pelo token do proprio workflow. A remocao vai depois, pela API.
          git commit -m "Responder mensagem especifica (citacao) no painel de Mensagens v7.40.36"
          git push origin HEAD:ia/mensagens-citacao-20261030
