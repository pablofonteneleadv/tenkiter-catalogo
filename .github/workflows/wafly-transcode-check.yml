name: Verificar preparação de vídeo (sem envio)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ffmpeg:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validar encoder e contratos com vídeo real sintético
        run: |
          python3 -m py_compile scripts/wafly/process_queue.py scripts/wafly/transcode.py
          bash -n scripts/wafly/transcode.sh
          python3 tests/transcode_profiles.py
