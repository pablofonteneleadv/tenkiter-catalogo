name: Android APK automático
on:
  push:
    branches: ['ia/**']
    paths: ['android/**', 'common.js', 'scripts/android/**', '.github/workflows/android-auto-release.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verificar chave de assinatura original
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_B64" || { echo "::error::Chave de assinatura ausente"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Senha da chave ausente"; exit 1; }
          umask 077
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/tenkiter.jks"
          echo "TK_ANDROID_KEYSTORE=$RUNNER_TEMP/tenkiter.jks" >> "$GITHUB_ENV"
          echo "TK_ANDROID_STORE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Compilar ou recuperar release assinada da mesma fonte
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/android/release.py
      - name: Apagar chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/tenkiter.jks"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TENKiTER-Android-APK
          path: dist/
          if-no-files-found: ignore
          retention-days: 90
