name: bump cache buster 7.40.36

# Uso unico: avanca o cache-buster do admin-mensagens.js para 7.40.36.
on:
  push:
    branches:
      - ia/cachebuster-74036

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ia/cachebuster-74036

      - name: Baixar e conferir o patch
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://paste.c-net.org/RiddenMarjorie -o /tmp/ah.gz
          echo "b0020552351e53c9cb5d0edd8da191d15c47d2ab038dd9b51d6189c59eb27351  /tmp/ah.gz" | sha256sum -c -
          gunzip -c /tmp/ah.gz > /tmp/ah.diff

      - name: Aplicar e conferir
        run: |
          set -euo pipefail
          git apply --whitespace=nowarn /tmp/ah.diff
          test "$(git hash-object admin.html)" = "383bbcd57d15feb6be9bf0d6651082036168c8d1" || { echo "admin.html DIVERGIU"; exit 1; }
          grep -c 'admin-mensagens.js?v=7.40.36' admin.html
          python3 scripts/ci/check_html.py

      - name: Commitar e empurrar
        run: |
          set -euo pipefail
          git config user.name "TK Automacao"
          git config user.email "automacao@tenkitermodas.com.br"
          git add -A
          git commit -m "fix(painel): avancar o cache-buster do admin-mensagens.js para 7.40.36"
          git push origin HEAD:ia/cachebuster-74036
