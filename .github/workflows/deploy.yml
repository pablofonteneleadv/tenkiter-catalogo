name: Deploy

# Deploy confiável: só depois do CI verde, com trigger explícito na API do Render,
# acompanhamento até "live", limpeza de cache no Cloudflare, publicação dos Workers
# e verificação no ar.
#
# Por que não usar o autoDeploy do Render: ele depende de webhook e falha em silêncio
# (o próprio projeto documenta isso). Aqui o deploy é um passo do CI, com código de
# saída — se falhar, o workflow fica vermelho e ninguém acha que publicou.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Motivo do deploy manual'
        required: false
        default: 'deploy manual'

permissions:
  contents: read

concurrency:
  group: deploy-producao
  cancel-in-progress: false   # nunca cancelar um deploy em andamento

jobs:
  # Reaproveita o portão de qualidade antes de tocar em produção.
  ci:
    name: Portão de qualidade
    uses: ./.github/workflows/ci.yml

  # ------------------------------------------------------------- Site (Render)
  deploy:
    name: Publicar no Render + Cloudflare
    runs-on: ubuntu-latest
    needs: ci
    environment: producao
    steps:
      - uses: actions/checkout@v4

      # Sem o buildCommand certo, o Render publica o version.json do repositorio
      # (commit vazio) e a etapa 4/4 nunca consegue confirmar o commit no ar.
      # Roda ANTES do deploy; se a API recusar, avisa e o deploy segue.
      - name: Garantir o buildCommand do Render (gera o version.json)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: bash scripts/deploy/render_garantir_build.sh

      - name: Disparar e acompanhar o deploy no Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          SITE_URL: https://tenkitermodas.com.br/
          COMMIT_ESPERADO: ${{ github.sha }}
        run: bash scripts/deploy/render_deploy.sh

      - name: Limpar o cache do Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: bash scripts/deploy/cloudflare_purge.sh

      # Roda SEMPRE, mesmo que o purge acima tenha falhado. Antes ele era pulado
      # em cascata (o purge saia com exit 1 e o job marcava o resto como skipped),
      # entao uma falha secundaria escondia o estado real de producao — nos runs
      # 38833465713, 38837548442 e 38840046234 ninguem chegou a conferir o ar.
      - name: Verificação final no ar
        if: always()
        env:
          COMMIT_ESPERADO: ${{ github.sha }}
        run: |
          falhou=0

          echo "==> 1) Site"
          codigo="$(curl -sS -o /dev/null -w '%{http_code}' -m 30 https://tenkitermodas.com.br/)"
          echo "    https://tenkitermodas.com.br/ -> HTTP $codigo"
          [ "$codigo" = "200" ] || falhou=1

          echo ""
          echo "==> 2) Commit publicado (/version.json)"
          publicado="$(curl -sS -m 20 -H 'Cache-Control: no-cache' \
            "https://tenkitermodas.com.br/version.json?cb=$(date +%s)" || true)"
          echo "    $publicado"
          no_ar="$(printf '%s' "$publicado" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || echo "")"
          echo "    no ar:  '${no_ar}'"
          echo "    esperado: '$COMMIT_ESPERADO'"
          if [ "$no_ar" = "$COMMIT_ESPERADO" ]; then
            echo "    OK — o ar esta servindo exatamente este commit."
          else
            echo "::error::/version.json no ar ('$no_ar') nao confere com o commit deste deploy ('$COMMIT_ESPERADO')."
            falhou=1
          fi

          echo ""
          echo "==> 3) CORS do Worker do Instagram"
          ig_headers="$(curl -sS -D - -o /dev/null -m 25 \
            -H 'Origin: https://tenkitermodas.com.br' \
            https://tenkiter-ig.distkrpconfeccoes.workers.dev/status || true)"
          echo "$ig_headers" | grep -iE '^HTTP|access-control-allow-origin|access-control-allow-methods|access-control-allow-headers' || true
          cors="$(printf '%s' "$ig_headers" | grep -i '^access-control-allow-origin' | head -1 | tr -d '\r')"
          codigo_ig="$(printf '%s' "$ig_headers" | grep -iE '^HTTP' | head -1 | tr -d '\r')"
          if [ -n "$cors" ]; then
            echo "    OK — $cors"
          else
            echo "::error::O Worker do Instagram nao devolveu cabecalho CORS para a origem do painel."
            falhou=1
          fi

          {
            echo "### Verificacao em producao"
            echo ""
            echo "| Checagem | Resultado |"
            echo "|---|---|"
            echo "| Site | HTTP $codigo |"
            echo "| Commit no ar | \`$no_ar\` (esperado \`$COMMIT_ESPERADO\`) |"
            echo "| Instagram | ${codigo_ig:-sem resposta} / ${cors:-sem CORS} |"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$falhou"

      - name: Resumo do deploy
        if: always()
        run: |
          {
            echo "### Deploy ${{ job.status }}"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Autor: ${{ github.actor }}"
            echo "- Site: https://tenkitermodas.com.br/"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------- Workers (Cloudflare)
  # Delega para o workers.yml (workflow_call) em vez de repetir o deploy aqui.
  #
  # POR QUE: antes este arquivo tinha a sua PRÓPRIA matriz de wrangler deploy, e o
  # workers.yml tinha outra. Num push que mexia em Worker, os dois rodavam e
  # publicavam os MESMOS Workers duas vezes, por dois caminhos com regras
  # diferentes. Pior: a cópia daqui não tinha o porteiro de credenciais — foi ela
  # que falhou no run 38795395138 (15/10/2026) com o CLOUDFLARE_API_TOKEN vazio.
  # Agora existe UM caminho para publicar Worker, com o porteiro e as verificações.
  workers:
    name: Workers (Cloudflare)
    needs: ci
    uses: ./.github/workflows/workers.yml
    # SEM esta linha os secrets NAO atravessam a chamada de workflow reutilizavel.
    #
    # Regressao de 16/10/2026 (run 38833465713): o job `credenciais` do workers.yml
    # recebeu CLOUDFLARE_API_TOKEN / ACCOUNT_ID / ZONE_ID VAZIOS e abortou em 1s.
    # Nao era o secret que faltava (existiam desde 15/10, 19:46-19:48): e que
    # `uses: ./.github/workflows/workers.yml` NAO herda os secrets do chamador.
    # Só o workers.yml disparado direto por `push`/`workflow_dispatch` os recebia —
    # por isso o deploy automatico nunca publicava os Workers, e o Instagram ficava
    # sem receber postagens ate alguem rodar `wrangler deploy` a mao.
    #
    # `inherit` passa todos os secrets do repositorio para o workflow chamado.
    secrets: inherit
