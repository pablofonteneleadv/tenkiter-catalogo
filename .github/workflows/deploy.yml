name: Deploy

# Deploy confiável: só depois do CI verde. O site (arquivos estáticos) é publicado na Cloudflare
# (Worker de assets tenkiter-site, domínio tenkitermodas.com.br), junto com os Workers e o instalador
# Android, e depois conferido no ar. Se algo falhar, o workflow fica vermelho e ninguém acha que publicou.
# O Render foi retirado em 26/11/2026 (pedido do Pablo; sem minutos de montagem e sem uso).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Motivo do deploy manual'
        required: false
        default: 'deploy manual'

permissions:
  contents: read

concurrency:
  group: deploy-producao
  cancel-in-progress: false   # nunca cancelar um deploy em andamento

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch' || inputs.motivo != 'diagnostico-distribuicao'
    name: Portão de qualidade
    uses: ./.github/workflows/ci.yml

  # O site só expõe o manifesto depois de o instalador estar disponível e conferido.
  android_release:
    name: Publicar instalador Android
    needs: ci
    permissions:
      contents: write
    uses: ./.github/workflows/android-auto-release.yml
    secrets:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

  # ------------------------------------------------------------- Site (Cloudflare)
  # 25/11/2026 (pedido do Pablo): o site também é publicado na Cloudflare (sem limite de montagem). Enquanto o domínio
  # é o único caminho do site; o endereço direto é tenkiter-site.distkrpconfeccoes.workers.dev.
  site_cloudflare:
    name: Publicar site na Cloudflare
    runs-on: ubuntu-24.04
    needs: [ci, android_release]
    environment: producao
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Montar o site (lista explícita de arquivos e cabeçalhos)
        env:
          RENDER_GIT_COMMIT: ${{ github.sha }}
          RENDER_GIT_BRANCH: main
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/deploy/build_version.sh
          TK_BUILD_ROOT=.public-site python3 scripts/deploy/cf_site_headers.py
      - name: Publicar tenkiter-site (wrangler deploy)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site-worker
          command: deploy
          wranglerVersion: '4.50.0'   # o wrangler 3 publica o _headers como arquivo em vez de aplicar as regras
      - name: Conferir o site na Cloudflare (commit no ar e cabeçalhos)
        env:
          COMMIT_ESPERADO: ${{ github.sha }}
        run: |
          base=https://tenkiter-site.distkrpconfeccoes.workers.dev
          v=''
          for i in $(seq 1 18); do
            v=$(curl -s "$base/version.json?t=$i" | python3 -c "import json,sys;print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || true)
            if [ "$v" = "$COMMIT_ESPERADO" ]; then echo "Site na Cloudflare com o commit $v"; break; fi
            sleep 10
          done
          [ "$v" = "$COMMIT_ESPERADO" ] || { echo "::error::O site na Cloudflare não confirmou o commit (no ar: '$v')."; exit 1; }
          curl -sI "$base/version.json" | grep -qi "cache-control: no-store" || { echo "::error::version.json sem no-store"; exit 1; }
          curl -sI "$base/" | grep -qi "x-content-type-options: nosniff" || { echo "::error::cabeçalho nosniff ausente"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/tests/mock.py"); [ "$code" = "404" ] || { echo "::error::arquivo interno respondeu $code"; exit 1; }
          echo "Cabeçalhos e arquivos internos conferidos."

  # 26/11/2026 (pedido do Pablo): o Render foi retirado. O site sai do job site_cloudflare; aqui ficam as provas públicas.
  deploy:
    name: Conferir site publicado (Cloudflare)
    runs-on: ubuntu-24.04
    needs: [site_cloudflare, workers]
    environment: producao
    steps:
      - uses: actions/checkout@v6

      # 26/11/2026: links de peça, mapa e feeds são servidos pelo tenkiter-og por rotas do domínio (antes, Rewrites do Render).
      # Quebraram uma vez na troca de hospedagem sem ninguém ver: agora é conferido em todo deploy.
      - name: Conferir links de peça, mapa do site e feeds no domínio
        run: |
          set -e
          base=https://tenkitermodas.com.br
          for u in feed.csv feed.xml sitemap.xml; do
            c=$(curl -s -o /dev/null -w "%{http_code}" "$base/$u?t=$(date +%s)")
            [ "$c" = "200" ] || { echo "::error::$u respondeu $c (deveria vir do tenkiter-og)"; exit 1; }
          done
          peca=$(curl -s "$base/sitemap.xml" | grep -o "$base/p/[^<]*" | head -1)
          [ -n "$peca" ] || { echo "::error::o sitemap não lista nenhuma peça"; exit 1; }
          curl -s "$peca" | grep -q 'og:title' || { echo "::error::$peca sem miniatura (og:title)"; exit 1; }
          echo "Links de peça, mapa e feeds OK ($peca)."

      - name: Conferir site publicado e impedir exposição de artefatos antigos
        if: always() && !cancelled()
        env:
          COMMIT_ESPERADO: ${{ github.sha }}
        run: |
          python3 scripts/monitoramento/saude_publica.py --expected-commit "$COMMIT_ESPERADO"
          python3 scripts/deploy/verificar_arquivos_internos.py

      - name: Conferir a versão oferecida pelo atualizador Android
        id: android_manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: python3 scripts/deploy/verificar_android_manifesto.py --attempts 6 --delay 5

      # Se a borda ainda oferecer uma versão antiga, confere novamente com prazo
      # limitado. Falha real continua bloqueando; não depende de purge de zona alheia.
      - name: Recuperar publicação do manifesto Android na borda
        if: steps.android_manifesto.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/deploy/verificar_android_manifesto.py --attempts 12 --delay 5

      - name: Verificação final no ar
        if: always()
        env:
          COMMIT_ESPERADO: ${{ github.sha }}
        run: |
          falhou=0

          echo "==> 1) Site"
          codigo="$(curl -sS -o /dev/null -w '%{http_code}' -m 30 https://tenkitermodas.com.br/)"
          echo "    https://tenkitermodas.com.br/ -> HTTP $codigo"
          [ "$codigo" = "200" ] || falhou=1

          echo ""
          echo "==> 2) Commit publicado (/version.json)"
          publicado="$(curl -sS -m 20 -H 'Cache-Control: no-cache' \
            "https://tenkitermodas.com.br/version.json?cb=$(date +%s)" || true)"
          echo "    $publicado"
          no_ar="$(printf '%s' "$publicado" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || echo "")"
          echo "    no ar:  '${no_ar}'"
          echo "    esperado: '$COMMIT_ESPERADO'"
          if [ "$no_ar" = "$COMMIT_ESPERADO" ]; then
            echo "    OK — o ar esta servindo exatamente este commit."
          else
            echo "::error::/version.json no ar ('$no_ar') nao confere com o commit deste deploy ('$COMMIT_ESPERADO')."
            falhou=1
          fi

          echo ""
          echo "==> 3) CORS do Worker do Instagram"
          ig_headers="$(curl -sS -D - -o /dev/null -m 25 \
            -H 'Origin: https://tenkitermodas.com.br' \
            https://tenkiter-ig.distkrpconfeccoes.workers.dev/status || true)"
          echo "$ig_headers" | grep -iE '^HTTP|access-control-allow-origin|access-control-allow-methods|access-control-allow-headers' || true
          cors="$(printf '%s' "$ig_headers" | grep -i '^access-control-allow-origin' | head -1 | tr -d '\r')"
          codigo_ig="$(printf '%s' "$ig_headers" | grep -iE '^HTTP' | head -1 | tr -d '\r')"
          if [ -n "$cors" ]; then
            echo "    OK — $cors"
          else
            echo "::error::O Worker do Instagram nao devolveu cabecalho CORS para a origem do painel."
            falhou=1
          fi

          {
            echo "### Verificacao em producao"
            echo ""
            echo "| Checagem | Resultado |"
            echo "|---|---|"
            echo "| Site | HTTP $codigo |"
            echo "| Commit no ar | \`$no_ar\` (esperado \`$COMMIT_ESPERADO\`) |"
            echo "| Instagram | ${codigo_ig:-sem resposta} / ${cors:-sem CORS} |"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$falhou"

      - name: Resumo do deploy
        if: always()
        run: |
          {
            echo "### Deploy ${{ job.status }}"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Autor: ${{ github.actor }}"
            echo "- Site: https://tenkitermodas.com.br/"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------- Workers (Cloudflare)
  # Delega para o workers.yml (workflow_call) em vez de repetir o deploy aqui.
  #
  # POR QUE: antes este arquivo tinha a sua PRÓPRIA matriz de wrangler deploy, e o
  # workers.yml tinha outra. Num push que mexia em Worker, os dois rodavam e
  # publicavam os MESMOS Workers duas vezes, por dois caminhos com regras
  # diferentes. Pior: a cópia daqui não tinha o porteiro de credenciais — foi ela
  # que falhou no run 38795395138 (15/10/2026) com o CLOUDFLARE_API_TOKEN vazio.
  # Agora existe UM caminho para publicar Worker, com o porteiro e as verificações.
  workers:
    name: Workers (Cloudflare)
    needs: ci
    uses: ./.github/workflows/workers.yml
    with:
      skip_ci: true
    # SEM esta linha os secrets NAO atravessam a chamada de workflow reutilizavel.
    #
    # Regressao de 16/10/2026 (run 38833465713): o job `credenciais` do workers.yml
    # recebeu CLOUDFLARE_API_TOKEN / ACCOUNT_ID / ZONE_ID VAZIOS e abortou em 1s.
    # Nao era o secret que faltava (existiam desde 15/10, 19:46-19:48): e que
    # `uses: ./.github/workflows/workers.yml` NAO herda os secrets do chamador.
    # Só o workers.yml disparado direto por `push`/`workflow_dispatch` os recebia —
    # por isso o deploy automatico nunca publicava os Workers, e o Instagram ficava
    # sem receber postagens ate alguem rodar `wrangler deploy` a mao.
    #
    # Repassa somente os dois valores utilizados pelos Workers.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  resumo_publicacao:
    name: Resumo dos componentes publicados
    runs-on: ubuntu-24.04
    needs: [deploy, workers, android_release]
    if: always()
    env:
      SITE_RESULTADO: ${{ needs.deploy.result }}
      WORKERS_RESULTADO: ${{ needs.workers.result }}
      ANDROID_RESULTADO: ${{ needs.android_release.result }}
    steps:
      - name: Registrar resultados sem confundir deploy com purge
        run: |
          {
            echo "### Componentes da publicação"
            echo "| Componente | Resultado do job |"
            echo "|---|---|"
            echo "| Site (Cloudflare) e verificações públicas | $SITE_RESULTADO |"
            echo "| Três Workers e suas verificações | $WORKERS_RESULTADO |"
            echo "| Distribuição Android | $ANDROID_RESULTADO |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
