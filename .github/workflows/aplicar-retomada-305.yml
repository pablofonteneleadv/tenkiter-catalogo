name: Aplicar retomada #305 (7.40.33)

# Aplicador de uso unico. Roda no PR desta branch, junta as partes do patch
# (blocos de gzip), confere o sha256, aplica, confere cada arquivo resultante e
# commita o resultado de volta na propria branch. Depois apaga a si mesmo e as
# partes: a condicao de existencia impede qualquer segunda execucao.
#
# Por que patch: instagram-worker/worker.js (525 KB), admin.html (454 KB) e
# admin-mensagens.js (329 KB) nao sobrevivem a reescrita manual de conteudo sem
# corromper. O patch e pequeno e falha alto (nunca em silencio) se um byte vier
# diferente.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  aplicar:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Ver se as partes ainda estao aqui
        id: estado
        run: |
          if [ -f patches/retomada-305-74033/s00 ]; then
            echo "pendente=true" >> "$GITHUB_OUTPUT"
          else
            echo "pendente=false" >> "$GITHUB_OUTPUT"
            echo "Patch ja aplicado nesta branch; nada a fazer."
          fi
      - name: Juntar e conferir o patch
        if: steps.estado.outputs.pendente == 'true'
        run: |
          set -euo pipefail
          cat patches/retomada-305-74033/s00 patches/retomada-305-74033/s01 \
              patches/retomada-305-74033/s02 patches/retomada-305-74033/s03 \
              patches/retomada-305-74033/s04 patches/retomada-305-74033/s05 \
              patches/retomada-305-74033/s06 patches/retomada-305-74033/s07 \
              patches/retomada-305-74033/s08 patches/retomada-305-74033/s09 \
              patches/retomada-305-74033/s10 patches/retomada-305-74033/s11 \
              patches/retomada-305-74033/s12 patches/retomada-305-74033/s13 \
              patches/retomada-305-74033/s14 patches/retomada-305-74033/s15 \
            | tr -d ' \n\r\t' | base64 -d > /tmp/p.gz
          echo "784a5d24cbeba82443653169656f767dddcf92465dae90fe892e9ac511938d88  /tmp/p.gz" | sha256sum -c -
          gunzip -c /tmp/p.gz > /tmp/retomada.patch
          echo "09ec93fff39609be2e96a51463553b2f7f4c0c002fa03c0978c20b3a58ca87c2  /tmp/retomada.patch" | sha256sum -c -
      - name: Aplicar
        if: steps.estado.outputs.pendente == 'true'
        run: |
          set -euo pipefail
          git apply --check -p1 /tmp/retomada.patch
          git apply -p1 /tmp/retomada.patch
      - name: Conferir arquivo por arquivo
        if: steps.estado.outputs.pendente == 'true'
        run: |
          set -euo pipefail
          cat > /tmp/esperado.md5 <<'HASHES'
          af6b693dbfdeffdfbcadeae07547f38f  instagram-worker/worker.js
          09138da3fc3a4c6f8cc1b557cba6d7ff  admin-mensagens.js
          781afd638fdda93c176afa55fdfd24ba  admin.html
          3028b383b26a364acac567c549a709ef  version.json
          8ad5abc8f9afe7cdffa4fcced1d50978  VERSION
          0b1c0618c3d2ffea400a671534e91fbd  CHANGELOG.md
          5e7b44182e41b9f637a2ef2477d56ba1  .github/workflows/ci.yml
          14c546860fb7165958b49b4023195780  tests/mock_msg.py
          cda25ea2c8696b8cc3f1ad3bdc504a22  tests/worker_equipe_inicio.js
          80c51d1cf454662c9ed40b1af16c2ee8  tests/mensagens_equipe_inicio_ui.py
          1c109b60bc7340c808048b94e4c55a71  documentacao/continuidade/RETOMADA-305-7.40.33.md
          HASHES
          sed -i 's/^ *//' /tmp/esperado.md5
          md5sum -c /tmp/esperado.md5
      - name: Sintaxe e portao de estetica
        if: steps.estado.outputs.pendente == 'true'
        run: |
          set -euo pipefail
          node --check instagram-worker/worker.js
          node --check admin-mensagens.js
          python3 scripts/ci/check_ux_skill.py
      - name: Commitar o resultado e remover esta janela
        if: steps.estado.outputs.pendente == 'true'
        run: |
          set -euo pipefail
          cp patches/retomada-305-74033/mensagem.txt /tmp/mensagem.txt
          git rm -q -r patches/retomada-305-74033
          git rm -q .github/workflows/aplicar-retomada-305.yml
          git config user.name "Tenkitermodas"
          git config user.email "distkrpconfeccoes@gmail.com"
          git add -A
          git commit -q -F /tmp/mensagem.txt
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
