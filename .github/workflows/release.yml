name: Release

# Publica uma tag semver + GitHub Release a partir do CHANGELOG.
# Antes: "main · 0 tags · sem releases" — voltar atrás era adivinhação.
# Agora: cada release tem tag, changelog e um ponto exato para rollback.
on:
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Tipo de incremento'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]
      descricao:
        description: 'O que mudou nesta versão'
        required: true
        default: 'Melhorias de infraestrutura e CI/CD'

permissions:
  contents: write

jobs:
  release:
    name: Tag + GitHub Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar o git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Subir a versão (VERSION + version.json + CHANGELOG)
        env:
          TK_RELEASE_KIND: ${{ inputs.tipo }}
          TK_RELEASE_DESCRIPTION: ${{ inputs.descricao }}
        run: bash scripts/release/bump_version.sh "$TK_RELEASE_KIND" "$TK_RELEASE_DESCRIPTION"

      - name: Ler a versão nova
        id: versao
        run: echo "valor=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Commitar e criar a tag
        run: |
          git add VERSION version.json CHANGELOG.md
          git commit -m "chore(release): v${{ steps.versao.outputs.valor }}"
          git tag -a "v${{ steps.versao.outputs.valor }}" -m "v${{ steps.versao.outputs.valor }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.versao.outputs.valor }}"

      - name: Publicar o GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TK_RELEASE_DESCRIPTION: ${{ inputs.descricao }}
        run: |
          printf '%s\n' "$TK_RELEASE_DESCRIPTION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "v${{ steps.versao.outputs.valor }}" \
            --title "v${{ steps.versao.outputs.valor }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "${{ github.ref_name }}"
